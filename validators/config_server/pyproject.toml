[project]
name = "validators-config-server"
version = "0.1.0"
description = "Validator for config-server interface (MongoDB sharding)"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.0.0",
    "validators-base",
]

[project.entry-points."endpoint_validators"]
config-server = "validators.config_server:ConfigServerValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.config_server"]

[tool.setuptools.package-dir]
"validators.config_server" = "."
