[project]
name = "validators-cassandra-client"
version = "0.1.0"
description = "Validator for the cassandra interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "cassandra-driver>=3.25.0",
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_persistence_validators"]
cassandra = "validators.cassandra_client:CassandraClientPersistenceValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.cassandra_client"]

[tool.setuptools.package-dir]
"validators.cassandra_client" = "."
