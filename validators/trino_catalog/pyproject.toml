[project]
name = "validators-trino-catalog"
version = "0.1.0"
description = "Validator for the trino_catalog interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]
requires-python = ">=3.10"
dependencies = [
    "trino>=0.320.0",
    "validators-base",
]

[project.entry-points."endpoint_validators"]
trino_catalog = "validators.trino_catalog:TrinoCatalogValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.trino_catalog"]

[tool.setuptools.package-dir]
"validators.trino_catalog" = "."
