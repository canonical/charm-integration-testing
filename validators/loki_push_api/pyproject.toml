[project]
name = "validators-loki-push-api"
version = "0.1.0"
description = "Validator for loki_push_api interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
]

[project.entry-points."endpoint_validators"]
loki_push_api = "validators.loki_push_api:LokiPushApiValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.loki_push_api"]

[tool.setuptools.package-dir]
"validators.loki_push_api" = "."
