[project]
name = "validators-certificate-transfer"
version = "0.1.0"
description = "Validator for certificate_transfer interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
certificate_transfer = "validators.certificate_transfer:CertificateTransferValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.certificate_transfer"]

[tool.setuptools.package-dir]
"validators.certificate_transfer" = "."
