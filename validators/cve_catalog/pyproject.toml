[project]
name = "validators-cve-catalog"
version = "0.1.0"
description = "Validator for cve-catalog interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
]

[project.entry-points."endpoint_validators"]
cve-catalog = "validators.cve_catalog:CveCatalogValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.cve_catalog"]

[tool.setuptools.package-dir]
"validators.cve_catalog" = "."
