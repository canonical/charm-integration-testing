[project]
name = "validators-tracing"
version = "0.1.0"
description = "Validator for tracing interface (v2)"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
]

[project.optional-dependencies]
deep = [
    "opentelemetry-exporter-otlp-proto-http>=1.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.0.0",
]

[project.entry-points."endpoint_validators"]
tracing = "validators.tracing:TracingValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.tracing"]

[tool.setuptools.package-dir]
"validators.tracing" = "."
