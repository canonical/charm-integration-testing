[project]
name = "validators-ingress-auth"
version = "0.1.0"
description = "Validator for ingress-auth interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
    # pyyaml is required to decode the serialized-data-interface (SDI) "data" wire format
    # used by ingress-auth providers/requirers (e.g. istio-pilot, oidc-gatekeeper).
    "pyyaml>=6.0,<7.0",
]

[project.entry-points."endpoint_validators"]
ingress-auth = "validators.ingress_auth:IngressAuthValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.ingress_auth"]

[tool.setuptools.package-dir]
"validators.ingress_auth" = "."
