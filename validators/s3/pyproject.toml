[project]
name = "validators-s3"
version = "0.1.0"
description = "Validator for s3 interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "boto3>=1.26.0",
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
s3 = "validators.s3:S3Validator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.s3"]

[tool.setuptools.package-dir]
"validators.s3" = "."
