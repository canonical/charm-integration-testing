[project]
name = "validators-postgresql-client"
version = "0.1.0"
description = "Validator for postgresql_client interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.0",
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "types-psycopg2>=2.9.21.20260422,<3"
]

[project.entry-points."endpoint_validators"]
postgresql_client = "validators.postgresql_client:PostgreSQLClientValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.postgresql_client"]

[tool.setuptools.package-dir]
"validators.postgresql_client" = "."
