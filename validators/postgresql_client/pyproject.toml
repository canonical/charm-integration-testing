[project]
name = "charmlibs-validators-postgresql-client"
version = "0.1.0"
description = "Validator for postgresql_client interface - Interface Validators Framework (SQ096)"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.8"
dependencies = [
    "psycopg2-binary>=2.9.0",
    "pydantic>=1.10,<3.0",
    # Phase 2: Replace with PyPI versions:
    # "charmlibs-interfaces-postgresql-client>=1.0",
    # "charmlibs-validators-base>=1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
