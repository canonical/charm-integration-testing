[project]
name = "validators-alertmanager-dispatch"
version = "0.1.0"
description = "Validator for alertmanager_dispatch interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
alertmanager_dispatch = "validators.alertmanager_dispatch:AlertmanagerDispatchValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.alertmanager_dispatch"]

[tool.setuptools.package-dir]
"validators.alertmanager_dispatch" = "."
