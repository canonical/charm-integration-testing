[project]
name = "validators-ingress-per-unit"
version = "0.1.0"
description = "Validator for the ingress_per_unit interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
    # pyyaml decodes the provider's unit->URL mapping, which the interface
    # publishes as a YAML-encoded string in the application databag.
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
ingress_per_unit = "validators.ingress_per_unit:IngressPerUnitValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.ingress_per_unit"]

[tool.setuptools.package-dir]
"validators.ingress_per_unit" = "."
