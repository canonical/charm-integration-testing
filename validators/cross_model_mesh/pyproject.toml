[project]
name = "validators-cross-model-mesh"
version = "0.1.0"
description = "Validator for the cross_model_mesh interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
cross_model_mesh = "validators.cross_model_mesh:CrossModelMeshValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.cross_model_mesh"]

[tool.setuptools.package-dir]
"validators.cross_model_mesh" = "."
