[project]
name = "validators-grafana-datasource"
version = "0.1.0"
description = "Validator for grafana_datasource interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
grafana_datasource = "validators.grafana_datasource:GrafanaDatasourceValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.grafana_datasource"]

[tool.setuptools.package-dir]
"validators.grafana_datasource" = "."
