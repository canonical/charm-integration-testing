[project]
name = "validators-mongodb-client"
version = "0.1.0"
description = "Validator for mongodb_client interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.0.0",
    "validators-base",
]

[project.entry-points."endpoint_validators"]
mongodb_client = "validators.mongodb_client:MongoDBClientValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.mongodb_client"]

[tool.setuptools.package-dir]
"validators.mongodb_client" = "."
