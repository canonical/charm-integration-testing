[project]
name = "validators-trino-client"
version = "0.1.0"
description = "Validator for trino_client interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "trino>=0.320.0",
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
trino_client = "validators.trino_client:TrinoClientValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.trino_client"]

[tool.setuptools.package-dir]
"validators.trino_client" = "."
