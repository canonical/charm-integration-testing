[project]
name = "validators-engine"
version = "0.1.0"
description = "Shared validator-discovery and relation-running engine for the Interface Validators Framework"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "ops>=2.0.0",
    "pydantic>=2.0.0",
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.engine"]

[tool.setuptools.package-dir]
"validators.engine" = "."
