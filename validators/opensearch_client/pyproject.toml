[project]
name = "validators-opensearch-client"
version = "0.1.0"
description = "Validator for opensearch_client interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "opensearch-py>=2.0.0",
    "validators-base",
]

[project.entry-points."endpoint_validators"]
opensearch_client = "validators.opensearch_client:OpenSearchClientValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.opensearch_client"]

[tool.setuptools.package-dir]
"validators.opensearch_client" = "."
