[project]
name = "validators-base"
version = "0.1.0"
description = "Base validator class for Interface Validators Framework (SQ096)"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "ops>=2.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.base"]

[tool.setuptools.package-dir]
"validators.base" = "."
