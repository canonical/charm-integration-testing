[project]
name = "validators-catalogue"
version = "0.1.0"
description = "Validator for catalogue interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
catalogue = "validators.catalogue:CatalogueValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.catalogue"]

[tool.setuptools.package-dir]
"validators.catalogue" = "."
