[project]
name = "validators-test-utils"
version = "0.1.0"
description = "Test utilities and stubs for Interface Validators Framework (SQ096)"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "validators-base",
    "ops>=2.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.test_utils"]

[tool.setuptools.package-dir]
"validators.test_utils" = "."
