[project]
name = "validators-etcd-client"
version = "0.1.0"
description = "Validator for etcd_client interface"
authors = [
    {name = "SQA Team", email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "grpcio>=1.60.0",
    "validators-base",
]

[project.optional-dependencies]
dev = [
    "validators-test-utils",
]

[project.entry-points."endpoint_validators"]
etcd_client = "validators.etcd_client:EtcdClientValidator"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["validators.etcd_client"]

[tool.setuptools.package-dir]
"validators.etcd_client" = "."
