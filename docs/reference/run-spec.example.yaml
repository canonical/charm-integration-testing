# DRAFT proposal for SQT-1464. Environment, placement, architecture, Juju
# version, S3 setup, and credentials are supplied outside this file.

version: 1

# The target charm and endpoint under test.
target:
  charm: postgresql-k8s
  application: postgresql
  endpoint: database
  channel: 14/stable
  revision: 468
  series: "22.04"
  downgrade_revision: 450

# The charm and endpoint integrated with the target.
neighbor:
  charm: data-integrator
  application: data-integrator
  endpoint: postgresql

# Optional pre-built bundle-builder output. The target bundle contains both
# applications for a single-model run; a cross-model run also needs a neighbor
# bundle. Block scalars preserve multi-document bundles and their overlays.
#
# bundles:
#   target: |
#     bundle: kubernetes
#     applications:
#       postgresql:
#         charm: postgresql-k8s
#         channel: 14/stable
#         revision: 468
#         base: ubuntu@22.04
#         scale: 1
#       data-integrator:
#         charm: data-integrator
#         scale: 1
#     relations:
#       - ["postgresql:database", "data-integrator:postgresql"]
#
# Without bundles, the suite builds them. With all required bundles, it starts
# at --current-state no_controller and skips test_build_bundle. Partial bundles
# and conflicts with target or neighbor are rejected. test_deploy determines
# run-specific offer references using all bundles.
