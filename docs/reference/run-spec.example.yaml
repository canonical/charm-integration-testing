# DRAFT proposal for SQT-1464. Environment, architecture, Juju version, S3
# setup, and credentials are supplied outside this file.

version: 1

# single-model: both applications share a model.
# cross-model: separate models share a controller.
# cross-controller: separate models use separate controllers.
model_topology: single-model

# The target charm and endpoint under test.
target:
  charm: postgresql-k8s
  application: postgresql
  endpoint: database
  channel: 14/stable
  revision: 468
  series: "22.04"
  downgrade_revision: 450
  # Optional pre-built bundle-builder output, shown for a single-model run.
  # Block scalars preserve multi-document bundles and their overlays.
  # bundle: |
  #   bundle: kubernetes
  #   applications:
  #     postgresql:
  #       charm: postgresql-k8s
  #       channel: 14/stable
  #       revision: 468
  #       base: ubuntu@22.04
  #       scale: 1
  #     data-integrator:
  #       charm: data-integrator
  #       scale: 1
  #   relations:
  #     - ["postgresql:database", "data-integrator:postgresql"]

# The charm and endpoint integrated with the target.
neighbor:
  charm: data-integrator
  application: data-integrator
  endpoint: postgresql
  # For a cross-model run, provide separate target and neighbor model bundles
  # instead of the single-model target example above.
  # bundle: |
  #   applications:
  #     data-integrator:
  #       charm: data-integrator

# With no bundles and current state no_bundle, the suite builds them. With all
# required bundles, the default starting state is no_controller; a compatible
# later state can be supplied when resuming. Partial bundles, bundle conflicts,
# and an explicit no_bundle state with supplied bundles are rejected.
# test_deploy determines run-specific offer references using all bundles.
