[project]
name = "bundle-builder-x"
version = "10.0.0"
description = "Framework to generate Juju compatible bundles from charmhub."
authors = [
    {name = "SQA Team",email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "z3-solver (>=4.15.4.0,<5.0.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]

[project.optional-dependencies]
dev = [
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.scripts]
bundle-builder-x = "bundle_builder_x.entrypoint:main"
