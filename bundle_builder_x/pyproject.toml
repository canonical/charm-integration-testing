[project]
name = "bundle-builder-x"
version = "10.0.0"
description = "Framework to generate Juju compatible bundles from charmhub."
authors = [
    {name = "SQA Team",email = "solutionsqa@canonical.com"}
]

requires-python = ">=3.10"
dependencies = [
    "z3-solver (>=4.15.4.0,<5.0.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
]

[tool.poetry]
packages = [
    { include = "bundle_builder_x" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
bundle-builder-x = "bundle_builder_x.entrypoint:main"
