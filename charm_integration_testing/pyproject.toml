[project]
name = "charm-integration-testing"
version = "0.0.0"
description = "A collection of Pytest-based tests for Charm Integration Testing, focusing on validating the deployment and interoperability of charms."
authors = [
    {name = "Ryan Britton",email = "ryan.britton@canonical.com"}
]
requires-python = ">=3.10"

dependencies = [
    "boto3 (>=1.40.0,<2.0.0)",
    "pytest==9.0.3",
    "pydantic (>=2.11.3,<3.0.0)",
    "pyyaml==6.0.2",
    "pytest-timeout==2.3.1",
    "requests (>=2.32.3,<2.35.0)",
    "tenacity (>=9.0.0,<10.0.0)",
    "jubilant (>=1.9.0,<2.0.0)",
    "bundle-builder-x",
    "validators-base",
    "validators-runner",
    "kubernetes (>=32.0.0, < 33.0.0)",
]

[project.optional-dependencies]
dev = [
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "chaos_client",
    "extensions",
    "juju",
    "juju_cmd",
    "juju_jubilant",
    "kubernetes_client",
    "resource_registry",
    "resource_tracking",
    "s3_storage",
    "serializeable_dataclass",
    "test_suite",
    "utils",
    "test_observer_client",
]
