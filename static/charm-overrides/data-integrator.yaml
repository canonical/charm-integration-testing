---
# At least one database/service endpoint must be integrated.
# Remove after: https://github.com/canonical/data-integrator/issues/243
listed: true
platforms: [kubernetes, machine]
priority: 2.0
overrides:
  - requires:
      cassandra:
        optional: true
      etcd:
        optional: true
      kafka:
        optional: true
      kyuubi:
        optional: true
      mongodb:
        optional: true
      mysql:
        optional: true
      opensearch:
        optional: true
      postgresql:
        optional: true
      valkey:
        optional: true
      zookeeper:
        optional: true
    provides:
      mongos:
        optional: true
    configs:
      database-name: [mydb, null]
      index-name: [my-index, null]
      keyspace-name: [mykeyspace, null]
      prefix-name: [myprefix, null]
      topic-name: [my-topic, null]
    constraints:
      # At least one database/service endpoint must be integrated
      - 'bool(endpoint[mysql]) or bool(endpoint[postgresql]) or bool(endpoint[mongodb])
        or bool(endpoint[kafka]) or bool(endpoint[zookeeper]) or bool(endpoint[opensearch])
        or bool(endpoint[kyuubi]) or bool(endpoint[etcd]) or bool(endpoint[mongos])
        or bool(endpoint[cassandra]) or bool(endpoint[valkey])'
      # Config values must be set when the corresponding endpoint is integrated
      - 'bool(endpoint[mysql]) or bool(endpoint[postgresql]) or bool(endpoint[mongodb])
        or bool(endpoint[zookeeper]) or bool(endpoint[kyuubi]) or bool(endpoint[mongos])
        => set(config[database-name])'
      - 'bool(endpoint[kafka]) => set(config[topic-name])'
      - 'bool(endpoint[opensearch]) => set(config[index-name])'
      - 'bool(endpoint[etcd]) or bool(endpoint[valkey]) => set(config[prefix-name])'
      - 'bool(endpoint[cassandra]) => set(config[keyspace-name])'
