---
# Katib DB Manager - manages database schema and migrations
overrides:
    # Tracks 0.15 and 0.16 do not have k8s-service-info in provides metadata;
    # it was added in track 0.17.
  - criteria:
      - any_of:
          - track: '0.15'
          - track: '0.16'
    # Track 0.17 and later have k8s-service-info in provides.
  - provides:
      k8s-service-info:
        features: [katib-service]
    constraints:
      - '"katib-service" in features(endpoint[k8s-service-info])'
