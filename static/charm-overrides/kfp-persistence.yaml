---
# kfp-api requirement relies on the "kfp-api" feature tag for correct pairing; track/risk pinning is redundant.
# Removing track/risk pinning avoids masking the IntegrationFeatureMismatch diagnostic behind PEER_CHANNEL_MISMATCH expansion (see #600).
overrides:
  - requires:
      kfp-api:
        features: [kfp-api]
    constraints:
      - '"kfp-api" in features(endpoint[kfp-api])'
