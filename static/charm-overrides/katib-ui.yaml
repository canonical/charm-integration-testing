---
# katib-ui is the Katib hyperparameter tuning UI for Charmed Kubeflow.
# Primary purpose: serves the Katib UI via ingress.
#
# Endpoint evolution:
#   0.15/*: requires ingress; provides sidebar (sidebar integration for
#     kubeflow-dashboard). 0.15/beta also provides katib-ui (a second sidebar
#     hook, not discoverable via Charmhub search API).
#   0.16-0.18: requires dashboard-links, ingress (and logging on 0.17+).
#     Solver naturally adds kubeflow-dashboard (provides dashboard-links) and
#     kubeflow-profiles (required by kubeflow-dashboard). No override needed.
#   0.19+: requires dashboard-links, ingress, istio-ingress-route, logging,
#     require-cmr-mesh, service-mesh; provides provide-cmr-mesh.
#     istio-ingress-route, require-cmr-mesh, service-mesh are Istio-specific
#     alternatives (ambient mesh). The `ingress` endpoint is NOT
#     traefik-compatible: it's driven by legacy serialized_data_interface
#     (SDI), so it's tagged sdi-legacy below to prevent the solver pairing it
#     with a modern v2-only ingress provider like traefik-k8s, which would
#     deadlock at deploy time.
#     See: https://github.com/canonical/charm-integration-testing/issues/976
#
# 0.15/* provides sidebar/katib-ui: Meaning 1 optional - kubeflow-dashboard
#   sidebar integration is additive, not primary purpose. No discoverable
#   consumer via Charmhub search for 0.15/beta's katib-ui interface.
overrides:
  # 0.15/beta: provides both katib-ui and sidebar
  - criteria:
      - track: '0.15'
        risk: 'beta'
    provides:
      katib-ui:
        optional: true
      sidebar:
        optional: true
    requires:
      ingress:
        features: [sdi-legacy]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
  # 0.15/* (excluding beta, which is handled above): provides sidebar only
  - criteria:
      - track: '0.15'
    provides:
      sidebar:
        optional: true
    requires:
      ingress:
        features: [sdi-legacy]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
  # 0.16-0.18: no other overrides needed
  - criteria:
      - any_of:
          - track: '0.16'
          - track: '0.17'
          - track: '0.18'
          - track: 'latest'
    requires:
      ingress:
        features: [sdi-legacy]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
  # 0.19+ (default block): istio-ingress-route, service-mesh, require-cmr-mesh
  # are Istio-specific endpoints added in 0.19. In non-Istio deployments the
  # charm uses ingress (SDI, tagged sdi-legacy), so the Istio endpoints are
  # optional. Excludes pre-0.19 tracks explicitly so future tracks (0.20,
  # etc.) are covered without enumeration.
  - requires:
      istio-ingress-route:
        optional: true
      require-cmr-mesh:
        optional: true
      service-mesh:
        optional: true
      ingress:
        features: [sdi-legacy]
    provides:
      provide-cmr-mesh:
        optional: true
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
