---
# katib-ui is the Katib hyperparameter tuning UI for Charmed Kubeflow.
# Primary purpose: serves the Katib UI via ingress.
#
# Endpoint evolution:
#   0.15/*: requires ingress; provides sidebar (sidebar integration for
#     kubeflow-dashboard). 0.15/beta also provides katib-ui (a second sidebar
#     hook, not discoverable via Charmhub search API).
#   0.16-0.18: requires dashboard-links, ingress (and logging on 0.17+).
#     Solver naturally adds kubeflow-dashboard (provides dashboard-links) and
#     kubeflow-profiles (required by kubeflow-dashboard). No override needed.
#   0.19+: requires dashboard-links, ingress, istio-ingress-route, logging,
#     require-cmr-mesh, service-mesh; provides provide-cmr-mesh.
#     istio-ingress-route, require-cmr-mesh, service-mesh are Istio-specific
#     alternatives; the charm also has ingress (traefik) so these are optional
#     in non-Istio deployments. Meaning 1: charm reaches active via ingress.
#
# 0.15/* provides sidebar/katib-ui: Meaning 1 optional - kubeflow-dashboard
#   sidebar integration is additive, not primary purpose. No discoverable
#   consumer via Charmhub search for 0.15/beta's katib-ui interface.
overrides:
  # 0.15/beta: provides both katib-ui and sidebar
  - criteria:
      - track: '0.15'
        risk: 'beta'
    provides:
      katib-ui:
        optional: true
      sidebar:
        optional: true
  # 0.15/* (excluding beta, which is handled above): provides sidebar only
  - criteria:
      - track: '0.15'
    provides:
      sidebar:
        optional: true
  # 0.19+: istio-ingress-route, service-mesh, require-cmr-mesh are Istio-
  # specific endpoints. In non-Istio deployments the charm uses ingress
  # (traefik-k8s) as the primary routing, so the Istio endpoints are optional.
  - criteria:
      - track: '0.19'
    requires:
      istio-ingress-route:
        optional: true
      require-cmr-mesh:
        optional: true
      service-mesh:
        optional: true
    provides:
      provide-cmr-mesh:
        optional: true
