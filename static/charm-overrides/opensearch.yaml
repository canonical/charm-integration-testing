---
# All channels are on the 2/ track with identical endpoint sets.
#
# Cloud backup integrations (azure-credentials, gcs-credentials, s3-credentials)
# and smtp are Meaning 1 optional: the charm reaches active without them; they
# are additive storage-backend and notification integrations only used when the
# operator explicitly configures a backup target or SMTP relay.
# These are not indexed in the Charmhub search API so the solver cannot auto-
# discover their providers.
#
# cos-agent (provides, interface cos_agent): COS observability subordinate hook.
# The grafana-agent machine charm is not reliably discoverable via search API
# for machine-platform bundles, so this is marked optional to prevent solver
# sprawl.
#
# jwt-configuration, oauth, peer-cluster, peer-cluster-orchestrator are already
# optional=True in upstream metadata and need no override.
#
# All channels (2/stable through 2/edge) have identical endpoint sets.
overrides:
  - requires:
      azure-credentials:
        optional: true
      gcs-credentials:
        optional: true
      s3-credentials:
        optional: true
      smtp:
        optional: true
    provides:
      cos-agent:
        optional: true
    constraints:
      # Minimum 3 units for HA, but allow more for larger clusters.
      - len(units({self})) >= 3
      # Production profile (default) enforces 8 GB minimum RAM per unit:
      #   ProductionProfile.memory_requirements.memory_size = 8 * _1GB_IN_KB
      #   Source: opensearch-charms-single-kernel/opensearch_single_kernel/core/models.py
      # JVM heap = 50% of RAM → effective floor is 8 GB to give the JVM 4 GB.
      - juju_constraint[mem] >= 8192
      # OpenSearch is CPU-intensive; 4 cores recommended for production workloads.
      # The charm does not enforce a cores minimum, but below 4 cores indexing
      # and query throughput degrade significantly.
      - juju_constraint[cores] >= 4
      # OpenSearch needs disk for segment storage + JVM heap dumps.
      # 20 GB is a practical floor for a small QA index.
      - juju_constraint[root-disk] >= 20480
