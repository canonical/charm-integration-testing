---
# hacluster: Source: https://github.com/openstack/charm-hacluster
#
# ha (provides, scope: container): REQUIRED - primary purpose.
# nrpe-external-master (provides), pacemaker-remote (requires): optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - provides:
      nrpe-external-master:
        optional: true
    requires:
      pacemaker-remote:
        optional: true
    assumes:
      - unsupported-openstack
