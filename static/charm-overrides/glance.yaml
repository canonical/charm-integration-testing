---
# glance: Source: https://github.com/openstack/charm-glance
#
# image-service (provides): REQUIRED - primary purpose.
# shared-db, identity-service (requires): REQUIRED (see REQUIRED_INTERFACES in glance_utils.py).
# All other requires/provides: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - provides:
      nrpe-external-master:
        optional: true
    requires:
      ceph:
        optional: true
      certificates:
        optional: true
      cinder-volume-service:
        optional: true
      ha:
        optional: true
      object-store:
        optional: true
      storage-backend:
        optional: true
    constraints:
      # Connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
      - 'tracks(charms(endpoint[image-service])) == tracks({self})'
      - 'risks(charms(endpoint[image-service])) == risks({self})'
    assumes: [unsupported-openstack]
