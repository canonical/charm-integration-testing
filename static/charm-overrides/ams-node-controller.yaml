---
# Source: https://github.com/canonical/anbox-cloud-charms (charms/ams-node-controller)
#
# nrpe-external-master (provides): optional - legacy NRPE monitoring hook,
#   purely additive. Dropped from metadata in 1.25+, so this block is scoped
#   to the tracks that still declare it.
overrides:
  - criteria:
      - any_of:
          - track: 'latest'
          - track: '1.14'
          - track: '1.15'
          - track: '1.16'
          - track: '1.17'
          - track: '1.18'
          - track: '1.19'
          - track: '1.20'
          - track: '1.21'
          - track: '1.22'
          - track: '1.23'
          - track: '1.24'
    provides:
      nrpe-external-master:
        optional: true
