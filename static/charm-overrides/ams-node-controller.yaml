---
# Charmhub-published charm; no public source repository found (checked
# canonical/anbox-cloud-charms, canonical/ams-old, canonical/ams-operator -
# none of which host this subordinate charm's actual source).
#
# `ams-node-controller` (subordinate; requires only `lxd`) published
# nrpe-external-master in `provides` through track 1.24 and 'latest', but
# Charmhub `refresh` confirms it is entirely absent from `provides` (empty)
# from track 1.25 onward (verified across tracks 1.25-1.28, bases
# 22.04/24.04) - applying the override unconditionally raised
# UnparsableCharmException for 1.25+ channels.
#
# nrpe-external-master (provides): optional - standard Juju NRPE subordinate
#   monitoring hook, purely additive, never blocking. Only present pre-1.25.
overrides:
  - criteria:
      - any_of:
          - track: '1.14'
          - track: '1.15'
          - track: '1.16'
          - track: '1.17'
          - track: '1.18'
          - track: '1.19'
          - track: '1.20'
          - track: '1.21'
          - track: '1.22'
          - track: '1.23'
          - track: '1.24'
          - track: 'latest'
    provides:
      nrpe-external-master:
        optional: true
