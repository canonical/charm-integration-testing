---
listed: true
overrides:
  # istio-beacon-k8s needs a reconciling istio-k8s control plane to reach "active";
  # no Juju relation exists between them, so the Z3 solver can't see this dependency.
  # Root cause: 404 on the gateways.gateway.networking.k8s.io CRD on config-changed
  # (reproduced rev 74, 1/stable; cross-validated against test_execution 656938).
  # Supersedes GH-455's RBAC/--trust diagnosis: trust is already set unconditionally
  # by bundle_builder_x, and the real failure is the missing CRD + control plane.
  #
  # cluster_addons must apply to every track (including provide-cmr-mesh's track
  # 2/dev entry below), but override entries are non-merging (first match wins, in
  # full) -- so it's declared via a YAML anchor and repeated rather than left on a
  # single catch-all entry, which would otherwise short-circuit the entry below it.
  - criteria:
      - any_of:
          - track: '2'
          - track: dev
    # provide-cmr-mesh only exists from track 2 onwards.
    provides:
      provide-cmr-mesh:
        optional: true
    cluster_addons: &istio-k8s-cluster-addon
      - charm: istio-k8s
        channel: 1/stable

  # Catch-all for every other track/risk.
  - cluster_addons: *istio-k8s-cluster-addon
