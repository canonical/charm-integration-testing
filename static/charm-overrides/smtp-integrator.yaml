---
# Source: https://github.com/canonical/smtp-integrator-operator
#
# The charm blocks with "invalid configuration: host" when the host config is
# unset (the default).  The unit cannot reach ActiveStatus without it, so the
# solver must be given a placeholder value.
#
# host (config): provide a dummy SMTP relay host so the unit reaches
# ActiveStatus during integration testing.  The address does not need to be
# reachable; the charm only validates that it is set, not connectivity.
# Applies to all published tracks (latest/stable rev 121, latest/edge rev 131),
# which share the same host config key and default-empty behaviour.
# See: https://github.com/canonical/charm-integration-testing/issues/685
overrides:
  - configs:
      host: ['smtp.example.com']
