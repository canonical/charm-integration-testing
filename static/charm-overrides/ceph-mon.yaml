---
# ceph-mon: Source: https://github.com/canonical/ceph-charms/tree/main/ceph-mon
#
# bootstrap-source (requires): optional - only for "no-bootstrap" (join existing
#   cluster); no charm on Charmhub provides ceph-bootstrap.
# osd (provides): REQUIRED - ceph-osd connects here for bootstrap/auth.
# All other provides: optional - no BlockedStatus when absent.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:

  # octopus, pacific and earlier: no cos-agent/metrics-endpoint.
  - assumes: &unsupported [unsupported-openstack]
    criteria:
      - any_of:
          - track: 'luminous'
          - track: 'mimic'
          - track: 'nautilus'
          - track: 'octopus'
          - track: 'pacific'
    requires:
      bootstrap-source:
        optional: true
    provides:
      admin:
        optional: true
      client:
        optional: true
      dashboard:
        optional: true
      mds:
        optional: true
      nrpe-external-master:
        optional: true
      prometheus:
        optional: true
      radosgw:
        optional: true
      rbd-mirror:
        optional: true

  # reef, quincy, squid and newer (default): adds cos-agent, metrics-endpoint.
  - assumes: *unsupported
    requires:
      bootstrap-source:
        optional: true
    provides:
      admin:
        optional: true
      client:
        optional: true
      cos-agent:
        optional: true
      dashboard:
        optional: true
      mds:
        optional: true
      metrics-endpoint:
        optional: true
      nrpe-external-master:
        optional: true
      prometheus:
        optional: true
      radosgw:
        optional: true
      rbd-mirror:
        optional: true
