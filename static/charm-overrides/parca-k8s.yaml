---
# Source: https://github.com/canonical/parca-k8s-operator
#
# require-cmr-mesh, service-mesh (requires) and provide-cmr-mesh (provides) are only defined on
# track 0.27 today (tracks 1/2 do not yet have cross_model_mesh/service_mesh endpoints); they are
# already optional: true upstream in charmcraft.yaml.
#
# provide-cmr-mesh must be integrated cross-model with exactly the same charms as the
# mesh-managed provides endpoints (per the charm's ServiceMeshConsumer policies in src/charm.py:
# grafana-source, parca-store-endpoint, self-profiling-endpoint) are cross-model with;
# see issue GH-980.
overrides:
  - criteria:
      - track: '0.27'
    constraints:
      - 'charms(cross_model(endpoint[grafana-source] | endpoint[parca-store-endpoint]
        | endpoint[self-profiling-endpoint])) == charms(cross_model(endpoint[provide-cmr-mesh]))'
      # charms() can't identify external-CMR peers (no in-domain charm id), so the equality
      # above is vacuous when both sides are external; also check counts match.
      - 'len(cross_model(endpoint[grafana-source] | endpoint[parca-store-endpoint]
        | endpoint[self-profiling-endpoint])) == len(cross_model(endpoint[provide-cmr-mesh]))'
      # cross_model_mesh only makes sense to describe a genuine CMR; without this, a purely
      # local provide-cmr-mesh relation would vacuously satisfy the equality above (both sides
      # empty). See GH-980.
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
