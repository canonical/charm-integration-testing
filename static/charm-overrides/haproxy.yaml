---
# Override for haproxy
# Source: https://github.com/canonical/haproxy-operator
# Upstream PR: https://github.com/canonical/haproxy-operator/pull/536
#
# latest/stable is the classic reactive charm with a minimal endpoint set:
#   provides: local-monitors, munin, nrpe-external-master, statistics, website
#   requires: reverseproxy
# Only website (provides) is fulfillable on Charmhub.
#
# 2.8+ is the ops rewrite (PR#536) which adds:
# ingress, ingress-per-unit, haproxy-route, haproxy-route-tcp (provides) - at-least-one proxy modes
# ha (requires) - OPTIONAL locally: HA recommended but not forced by solver
# certificates (requires) - OPTIONAL locally: TLS recommended but charm reaches active without it
# receive-ca-certs, spoe-auth, ddos-protection, haproxy-route-policy (requires) - OPTIONAL: additive features
# cos-agent, website (provides) - OPTIONAL: secondary/additive
overrides:
  # latest/stable: classic reactive charm - only reverseproxy (requires) and website (provides) matter
  - requires:
      reverseproxy:
        optional: true
    provides:
      local-monitors:
        optional: true
      munin:
        optional: true
      nrpe-external-master:
        optional: true
      statistics:
        optional: true
        
  # 2.8+: additional endpoints added by upstream PR#536
  - criteria:
      - track: '2.8'
    requires:
      certificates:
        optional: true
      reverseproxy:
        optional: true
      ha:
        optional: true
      receive-ca-certs:
        optional: true  # Remove after: PR#536 merged and published
      spoe-auth:
        optional: true  # Remove after: PR#536 merged and published
      ddos-protection:
        optional: true  # Remove after: PR#536 merged and published
      haproxy-route-policy:
        optional: true  # Remove after: PR#536 merged and published
    provides:
      ingress:
        optional: true
      ingress-per-unit:
        optional: true
      cos-agent:
        optional: true  # Remove after: PR#536 merged and published
      website:
        optional: true  # Remove after: PR#536 merged and published
      haproxy-route:
        optional: true
      haproxy-route-tcp:
        optional: true
    constraints:
      - 'bool(endpoint[ingress]) or bool(endpoint[ingress-per-unit]) or bool(endpoint[reverseproxy])
        or bool(endpoint[haproxy-route]) or bool(endpoint[haproxy-route-tcp])'
