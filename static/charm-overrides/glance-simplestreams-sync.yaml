---
# glance-simplestreams-sync: syncs Simplestreams image metadata into Glance.
# image-modifier, nrpe-external-master, simplestreams-image-service (provides):
#   all optional - charm operates standalone without consumers.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - provides:
      image-modifier:
        optional: true
      nrpe-external-master:
        optional: true
      simplestreams-image-service:
        optional: true
    assumes: [unsupported-openstack]
