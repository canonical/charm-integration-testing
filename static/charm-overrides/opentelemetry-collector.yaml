---
# Source: https://github.com/canonical/opentelemetry-collector-operator
#
# Two endpoint generations:
#   track 2: base endpoint set (no external-config or send-otlp)
#   dev: adds external-config (optional upstream) and send-otlp (optional upstream)
#
# grafana-dashboards-consumer (requires): optional - _get_missing_mandatory_relations() only
#   blocks when this IS connected but unpaired; absent relation causes no BlockedStatus.
# grafana-dashboards-provider (provides): optional - dashboard forwarding is secondary purpose;
#   upstream Grafana machine charm is not discoverable by the solver for machine bundles.
# juju-info (requires): REQUIRED - subordinate principal attachment point (scope: container).
# At-least-one outgoing: _get_missing_mandatory_relations() (line 592) sets BlockedStatus when
#   juju-info is connected (always) without cloud-config/send-remote-write/send-loki-logs/send-otlp.
overrides:
  # dev/edge: adds send-otlp as an additional valid outgoing telemetry backend
  - criteria:
      - track: dev
    requires:
      grafana-dashboards-consumer:
        optional: true
    provides:
      grafana-dashboards-provider:
        optional: true
    constraints:
      # juju-info is always connected (required subordinate); at least one outgoing backend must follow
      - 'bool(endpoint[cloud-config]) or bool(endpoint[send-remote-write]) or bool(endpoint[send-loki-logs])
        or bool(endpoint[send-otlp])'
  # track 2 fallback (stable, candidate, beta, edge): send-otlp absent on this track
  - requires:
      grafana-dashboards-consumer:
        optional: true
    provides:
      grafana-dashboards-provider:
        optional: true
    constraints:
      # juju-info is always connected (required subordinate); at least one outgoing backend must follow
      - 'bool(endpoint[cloud-config]) or bool(endpoint[send-remote-write]) or bool(endpoint[send-loki-logs])'
