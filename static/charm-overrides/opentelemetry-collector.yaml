---
# Source: https://github.com/canonical/opentelemetry-collector-operator
#
# All published tracks (2/stable through dev/edge) share the same NOT-optional endpoints.
# dev adds external-config and send-otlp (both optional upstream) - no override entries needed.
#
# grafana-dashboards-consumer (requires): optional - charm reaches active without it;
#   _get_missing_mandatory_relations() does not check this endpoint (only cos-agent/juju-info checked).
# grafana-dashboards-provider (provides): optional - dashboard forwarding is secondary purpose;
#   upstream Grafana machine charm is not discoverable by the solver for machine bundles.
# juju-info (requires): REQUIRED - subordinate principal attachment point (scope: container).
# Note: when juju-info is connected (always), _get_missing_mandatory_relations() also requires an
#   outgoing telemetry backend, but those backends live in a COS K8s model via CMR - not
#   discoverable by the solver for machine bundles; no at-least-one constraint is encoded here.
overrides:
  - requires:
      grafana-dashboards-consumer:
        optional: true
    provides:
      grafana-dashboards-provider:
        optional: true
    constraints:
      # If collecting dashboards from upstream charms, must have somewhere to forward them
      - 'bool(endpoint[grafana-dashboards-consumer]) => bool(endpoint[grafana-dashboards-provider])
        or bool(endpoint[cloud-config])'
      # _get_missing_mandatory_relations() (line 149): cos-agent needs an outgoing backend
      - 'bool(endpoint[cos-agent]) => bool(endpoint[cloud-config]) or bool(endpoint[send-remote-write])
        or bool(endpoint[send-loki-logs]) or bool(endpoint[grafana-dashboards-provider])'
