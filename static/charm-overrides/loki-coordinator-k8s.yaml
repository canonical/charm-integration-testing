---
# Source: https://github.com/canonical/loki-coordinator-k8s-operator (uses
# coordinated_workers.Coordinator from https://github.com/canonical/cos-coordinated-workers)
#
# Endpoint set is stable across tracks 1, 2, 3.7, dev, except that require-cmr-mesh,
# service-mesh (requires) and provide-cmr-mesh (provides) are only present on track 3.7 and dev
# (not track 1 or plain track 2); older tracks predate the service_mesh integration. They are
# already optional: true upstream.
#
# provide-cmr-mesh must track logging/grafana-source's cross-model status; see GH-980.
overrides:
  - criteria:
      - any_of:
          - track: '1'
          - track: '2'
    provides:
      loki-cluster:
        optional: false  # coordinator.py::_on_collect_unit_status blocks without any worker
    requires:
      s3:
        optional: false  # same handler blocks with "[s3] Missing S3 integration."
  - criteria:
      - any_of:
          - track: '3.7'
          - track: dev
    provides:
      loki-cluster:
        optional: false  # coordinator.py::_on_collect_unit_status blocks without any worker
    requires:
      s3:
        optional: false  # same handler blocks with "[s3] Missing S3 integration."
    constraints:
      - 'charms(cross_model(endpoint[logging] | endpoint[grafana-source])) == charms(cross_model(endpoint[provide-cmr-mesh]))'
      # charms/bool/len equality together confirm the same real CMR; see GH-980 and CrossModelExpr's docstring.
      - 'bool(cross_model(endpoint[logging] | endpoint[grafana-source])) == bool(cross_model(endpoint[provide-cmr-mesh]))'
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
