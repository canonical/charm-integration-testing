---
# Source: https://github.com/canonical/loki-operators (coordinator)
# Shared logic: https://github.com/canonical/cos-coordinated-workers
# Tracks 3.7/dev add optional service mesh and CMR companion constraints; see GH-980.
overrides:
  - criteria:
      - any_of:
          - track: '1'
          - track: '2'
    provides:
      loki-cluster:
        optional: false  # coordinator.py::_on_collect_unit_status blocks without any worker
    requires:
      s3:
        optional: false  # same handler blocks with "[s3] Missing S3 integration."
  - criteria:
      - any_of:
          - track: '3.7'
          - track: dev
          - track: latest
            ubuntu_version: '26.04'
    provides:
      loki-cluster:
        optional: false  # coordinator.py::_on_collect_unit_status blocks without any worker
    requires:
      s3:
        optional: false  # same handler blocks with "[s3] Missing S3 integration."
      require-cmr-mesh:
        optional: true  # coordinator.py::_on_collect_unit_status only requires workers and S3.
      service-mesh:
        optional: true  # coordinator.py::_on_collect_unit_status only requires workers and S3.
    constraints:
      - 'charms(cross_model(endpoint[logging] | endpoint[grafana-source])) == charms(cross_model(endpoint[provide-cmr-mesh]))'
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
