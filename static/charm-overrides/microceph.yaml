---
# microceph: Source: https://github.com/canonical/charm-microceph
#
# ceph (provides): REQUIRED - primary purpose, though not blocking in code.
# All other provides/requires: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:

  # latest, reef: only ceph, radosgw, mds provided.
  - assumes: &unsupported
      - unsupported-openstack
    criteria:
      - any_of:
          - track: 'latest'
          - track: 'reef'
    provides:
      mds:
        optional: true
      radosgw:
        optional: true

  # squid and newer (default): adds cos-agent, ceph-nfs, remote-provider, ceph-rgw-ready.
  - assumes: *unsupported
    provides:
      ceph-nfs:
        optional: true
      ceph-rgw-ready:
        optional: true
      cos-agent:
        optional: true
      mds:
        optional: true
      radosgw:
        optional: true
      remote-provider:
        optional: true
