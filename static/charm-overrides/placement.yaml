---
# placement: Source: https://github.com/openstack/charm-placement
#
# placement (provides): REQUIRED - nova-cloud-controller connects here.
# shared-db, identity-service (requires): REQUIRED (see required_relations in placement.py).
# amqp, ha, certificates (requires): optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - requires:
      amqp:
        optional: true
      ha:
        optional: true
      certificates:
        optional: true
    constraints:
      # Connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
      - 'tracks(charms(endpoint[placement])) == tracks({self})'
      - 'risks(charms(endpoint[placement])) == risks({self})'
    assumes: [unsupported-openstack]
