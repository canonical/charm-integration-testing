---
# cinder: Source: https://github.com/openstack/charm-cinder
#
# cinder-volume-service (provides): REQUIRED - primary purpose.
# shared-db, amqp (requires): REQUIRED (see REQUIRED_INTERFACES in hooks/cinder_utils.py).
# All other requires/provides: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  # queens, rocky, stein, train: identity-credentials not present until ussuri.
  - assumes: &unsupported [unsupported-openstack]
    criteria:
      - any_of:
          - track: 'queens'
          - track: 'rocky'
          - track: 'stein'
          - track: 'train'
    provides:
      nrpe-external-master:
        optional: true
    requires:
      ceph:
        optional: true
      image-service:
        optional: true
      ha:
        optional: true
      storage-backend:
        optional: true
      backup-backend:
        optional: true
      certificates:
        optional: true
    constraints:
      # Connected OpenStack service charms must be on the same release track.
      - 'bool(endpoint[identity-service]) => tracks(charms(endpoint[identity-service]))
        == tracks({self})'
      - 'bool(endpoint[identity-service]) => risks(charms(endpoint[identity-service]))
        == risks({self})'
      - 'bool(endpoint[image-service]) => tracks(charms(endpoint[image-service]))
        == tracks({self})'
      - 'bool(endpoint[image-service]) => risks(charms(endpoint[image-service])) ==
        risks({self})'
      - 'tracks(charms(endpoint[cinder-volume-service])) == tracks({self})'
      - 'risks(charms(endpoint[cinder-volume-service])) == risks({self})'

  # ussuri and later: identity-credentials added.
  - assumes: *unsupported
    criteria:
      - any_of:
          - track: 'ussuri'
          - track: 'victoria'
          - track: 'wallaby'
          - track: 'xena'
          - track: 'yoga'
          - track: 'zed'
          - track: '2023.1'
          - track: '2023.2'
          - track: '2024.1'
          - track: 'latest'
    provides:
      nrpe-external-master:
        optional: true
    requires:
      ceph:
        optional: true
      image-service:
        optional: true
      ha:
        optional: true
      storage-backend:
        optional: true
      backup-backend:
        optional: true
      certificates:
        optional: true
      identity-credentials:
        optional: true
    constraints:
      # Connected OpenStack service charms must be on the same release track.
      - 'bool(endpoint[identity-service]) => tracks(charms(endpoint[identity-service]))
        == tracks({self})'
      - 'bool(endpoint[identity-service]) => risks(charms(endpoint[identity-service]))
        == risks({self})'
      - 'bool(endpoint[image-service]) => tracks(charms(endpoint[image-service]))
        == tracks({self})'
      - 'bool(endpoint[image-service]) => risks(charms(endpoint[image-service])) ==
        risks({self})'
      - 'bool(endpoint[identity-credentials]) => tracks(charms(endpoint[identity-credentials]))
        == tracks({self})'
      - 'bool(endpoint[identity-credentials]) => risks(charms(endpoint[identity-credentials]))
        == risks({self})'
      - 'tracks(charms(endpoint[cinder-volume-service])) == tracks({self})'
      - 'risks(charms(endpoint[cinder-volume-service])) == risks({self})'
