---
# ceph-radosgw: endpoints vary by track (quincy adds secondary/primary; reef+ adds s3).
# mon (requires): REQUIRED - primary connection to ceph-mon.
# Other requires/provides: optional - HA, TLS, keystone, multisite and monitoring
#   integrations are all optional; charm serves its API standalone. See
#   REQUIRED_INTERFACES in hooks.py for the mon-only requirement.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  # luminous, mimic, nautilus, octopus, pacific: no secondary, no primary, no s3
  - assumes: &unsupported
      - unsupported-openstack
    criteria:
      - any_of:
          - track: 'luminous'
          - track: 'mimic'
          - track: 'nautilus'
          - track: 'octopus'
          - track: 'pacific'
    requires: &common_req
      certificates:
        optional: true
      ha:
        optional: true
      identity-service:
        optional: true
      slave:
        optional: true
    provides: &pre_quincy_prov
      gateway:
        optional: true
      master:
        optional: true
      nrpe-external-master:
        optional: true
      object-store:
        optional: true
      radosgw-user:
        optional: true

  # quincy: secondary added to requires; primary added to provides
  - assumes: *unsupported
    criteria:
      - any_of:
          - track: 'quincy'
    requires:
      <<: *common_req
      secondary:
        optional: true
    provides:
      <<: *pre_quincy_prov
      primary:
        optional: true

  # Fallback (reef+): s3 added to provides
  - assumes: *unsupported
    requires:
      <<: *common_req
      secondary:
        optional: true
    provides:
      <<: *pre_quincy_prov
      primary:
        optional: true
      s3:
        optional: true
