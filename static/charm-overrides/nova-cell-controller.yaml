---
# nova-cell-controller: Source: https://github.com/openstack/charm-nova-cell-controller
#
# shared-db, amqp (requires): REQUIRED (see required_relations in nova_cell_controller.py).
# identity-credentials (requires): REQUIRED for Train+; optional on Rocky/Stein.
# All other requires/provides: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  # Rocky, Stein: identity-credentials not yet in required_relations.
  - assumes: &unsupported [unsupported-openstack]
    criteria:
      - any_of:
          - track: 'rocky'
          - track: 'stein'
    provides:
      cloud-controller:
        optional: true
      nrpe-external-master:
        optional: true
    requires:
      cloud-compute:
        optional: true
      ha:
        optional: true
      certificates:
        optional: true
      identity-credentials:
        optional: true
      nova-cell-compute:
        optional: true
    constraints:
      # Connected OpenStack service charms must be on the same release track.
      - 'bool(endpoint[identity-credentials]) => tracks(charms(endpoint[identity-credentials]))
        == tracks({self})'
      - 'bool(endpoint[identity-credentials]) => risks(charms(endpoint[identity-credentials]))
        == risks({self})'
      - 'bool(endpoint[cloud-compute]) => tracks(charms(endpoint[cloud-compute]))
        == tracks({self})'
      - 'bool(endpoint[cloud-compute]) => risks(charms(endpoint[cloud-compute])) ==
        risks({self})'
  # Default (Train+): identity-credentials is in required_relations; not optional.
  - assumes: *unsupported
    provides:
      cloud-controller:
        optional: true
      nrpe-external-master:
        optional: true
    requires:
      cloud-compute:
        optional: true
      ha:
        optional: true
      certificates:
        optional: true
      nova-cell-compute:
        optional: true
    constraints:
      # Connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-credentials])) == tracks({self})'
      - 'risks(charms(endpoint[identity-credentials])) == risks({self})'
      - 'bool(endpoint[cloud-compute]) => tracks(charms(endpoint[cloud-compute]))
        == tracks({self})'
      - 'bool(endpoint[cloud-compute]) => risks(charms(endpoint[cloud-compute])) ==
        risks({self})'
