---
# Source: https://github.com/canonical/lego-operator
# `plugin-config-secret-id` (also required to reach active) needs a live Juju secret URI
# only available post-deploy, so it's set at runtime by LegoExtension instead of here.
overrides:
  - requires:
      ingress:
        optional: true  # unconditional: plugin is pinned to httpreq below, never http-01/http
      receive-ca-cert:
        optional: true  # never checked in _on_collect_status
    configs:
      email: [test@example.com]  # required; charm blocks without it
      plugin: [httpreq]  # LegoExtension always configures the httpreq DNS plugin
