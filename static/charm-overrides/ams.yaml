---
# Source: https://github.com/canonical/anbox-cloud-charms (charms/ams)
#
# provides.prometheus (all non-ops tracks): optional - legacy scrape endpoint;
#   src/charm.py's _on_prometheus_changed/_on_prometheus_broken only re-emit
#   config_changed / close a port, no Blocked/WaitingStatus tied to it. AMS
#   reaches active with no prometheus relation; cos-agent is the current
#   observability path (see tests/integration/test_lma.py: LMA integration is
#   a separate opt-in test, not part of the base deployment).
overrides:
  # -ops tracks lack grafana endpoint
  - criteria:
      - any_of:
          - track: '1.22-ops'
          - track: '1.24-ops'
          - track: '1.25-ops'
    requires:
      lxd-cluster:  # reached out to ams team, this should be a peer relation.
        optional: true
  # 1.14-1.26 non-ops, latest: no send-remote-write or openfga yet
  - criteria:
      - any_of:
          - track: '1.14'
          - track: '1.15'
          - track: '1.16'
          - track: '1.17'
          - track: '1.18'
          - track: '1.19'
          - track: '1.20'
          - track: '1.21'
          - track: '1.22'
          - track: '1.23'
          - track: '1.24'
          - track: '1.25'
          - track: '1.26'
          - track: 'latest'
    requires:
      lxd-cluster:
        optional: true
    provides:
      grafana:
        optional: true
      prometheus:
        optional: true
  # 1.27-1.28: send-remote-write added, openfga not yet
  - criteria:
      - any_of:
          - track: '1.27'
          - track: '1.28'
    requires:
      lxd-cluster:
        optional: true
      send-remote-write:
        optional: true
    provides:
      grafana:
        optional: true
      prometheus:
        optional: true
  # default (1.29+): all four endpoints
  - requires:
      lxd-cluster:
        optional: true
      openfga:
        optional: true
      send-remote-write:
        optional: true
    provides:
      grafana:
        optional: true
      prometheus:
        optional: true
