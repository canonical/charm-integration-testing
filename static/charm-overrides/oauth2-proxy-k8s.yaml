---
# Source: https://github.com/canonical/oauth2-proxy-k8s-operator
#
# oauth (requires): the charm always talks to its OIDC provider over HTTPS.
# src/configs.py sets OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY from the `dev`
# config, and src/integrations.py:OAuthIntegrationData consumes the provider's
# issuer_url verbatim. Hydra publishes that issuer_url from its public route
# (src/charm.py:_update_oauth_provider_info -> PublicRouteData.url), which is
# always https:// in the test environment. Declaring the `tls` feature here
# lets the solver pair this endpoint with hydra's `oauth` endpoint, which
# already declares `features: [tls]`; without it the build fails with
# "Charm endpoints oauth2-proxy-k8s:oauth and hydra:oauth have incompatible
# feature 'tls'".
# See: https://github.com/canonical/charm-integration-testing/issues/599
overrides:
  - requires:
      oauth:
        features: [tls]
