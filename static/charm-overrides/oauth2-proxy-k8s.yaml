---
# Source: https://github.com/canonical/oauth2-proxy-k8s-operator
#
# Track 0.1 is an older generation: nginx-route ingress only, no oauth integration.
# Tracks latest+ are a complete rewrite: traefik ingress, hydra oauth integration, cert transfer.
#
# Track 0.1 configs (all REQUIRED to avoid BlockedStatus in _validate(), src/charm.py):
#   upstream: default "" → BlockedStatus("missing `upstream` config")
#   cookie-secret: default "" → BlockedStatus("missing `cookie-secret` config")
#   client-id/secret: required when provider defaults to "google"
#
# Track latest provides:
#   auth-proxy (provides): optional - charm reaches ActiveStatus without consumers
#     (_holistic_handler ends with unit.status = ActiveStatus(), src/charm.py)
#   forward-auth (provides): optional - same, ActiveStatus without forward-auth consumers
#
# Track latest dev config:
#   Must be true when oauth endpoint carries "tls" feature (e.g. hydra in test environments
#   where Traefik's external IP is used as the OIDC issuer URL, and self-signed-certificates
#   issues a cert with no IP SAN). Without dev=true, oauth2-proxy exits with:
#   "x509: cannot validate certificate for <IP> because it doesn't contain any IP SANs"
#   See: issue 599
overrides:
  # Track 0.1: nginx-route ingress, no oauth/ingress/receive-ca-cert endpoints
  - criteria:
      - track: '0.1'
    configs:
      # REQUIRED: BlockedStatus("missing `upstream` config") in _validate() if empty (src/charm.py)
      upstream: ['http://placeholder:8080']
      # REQUIRED: BlockedStatus("missing `cookie-secret` config") in _validate() if empty (src/charm.py)
      # Must be 16, 24, or 32 bytes for AES cipher; AAAAAAAAAAAAAAAA is exactly 16 bytes
      cookie-secret: ['AAAAAAAAAAAAAAAA']
      # REQUIRED: BlockedStatus if provider=google (default) and client-id/secret empty (src/charm.py)
      client-id: ['placeholder-client-id']
      client-secret: ['placeholder-client-secret']

  # Track latest+: traefik ingress, hydra oauth integration, certificate transfer
  - provides:
      # optional - charm reaches ActiveStatus in _holistic_handler without consumers (src/charm.py)
      auth-proxy:
        optional: true
      # optional - charm reaches ActiveStatus in _holistic_handler without consumers (src/charm.py)
      forward-auth:
        optional: true
    configs:
      # dev=true skips TLS cert validation; needed when oauth provider uses self-signed certs
      # without a proper hostname (e.g. IP-only cert from self-signed-certificates in CI)
      dev: [true, null]
    constraints:
      # When connecting to a TLS oauth provider (e.g. hydra with features: [tls]), dev must
      # be enabled to bypass x509 IP SAN validation in test environments (issue 599).
      # Contrapositive: if dev is off, oauth must not carry the tls feature.
      - 'not config[dev] => not ("tls" in features(endpoint[oauth]))'
