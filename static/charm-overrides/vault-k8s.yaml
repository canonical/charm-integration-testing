---
# Remove after: https://github.com/canonical/vault-k8s-operator/pull/659
overrides:
  # Tracks 1.18+ renamed common_name to pki_ca_common_name; 2.0 follows same schema
  - criteria:
      - any_of:
          - track: '1.18'
          - track: '1.19'
          - track: '2.0'
    provides: &vault_provides
      vault-autounseal-provides:
        optional: true
      vault-kv:
        optional: true
      vault-pki:
        optional: true
      metrics-endpoint:
        optional: true
      send-ca-cert:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      ingress:
        optional: true
      ingress-per-unit:
        optional: true
      tls-certificates-pki:
        optional: true
      tls-certificates-acme:
        optional: true  # additive endpoint, not primary purpose; only 1.18+ (k8s/src/charm.py::_on_collect_status)
    configs:
      pki_ca_common_name: [charmqa, null]
      acme_ca_common_name: [charmqa, null]
    constraints:
      - 'bool(endpoint[vault-pki]) => bool(endpoint[tls-certificates-pki])'
      - 'bool(endpoint[vault-pki]) or bool(endpoint[tls-certificates-pki]) => set(config[pki_ca_common_name])'
      - 'bool(endpoint[tls-certificates-acme]) => set(config[acme_ca_common_name])'  # REQUIRED once connected - k8s/src/charm.py::_on_collect_status BlockedStatus
  # 1.15 track: no ingress-per-unit endpoint
  - criteria:
      - track: '1.15'
    provides: *vault_provides
    requires:
      ingress:
        optional: true
      tls-certificates-pki:
        optional: true
    configs:
      common_name: [charmqa, null]
    constraints:
      - 'bool(endpoint[vault-pki]) => bool(endpoint[tls-certificates-pki])'
      - 'bool(endpoint[vault-pki]) or bool(endpoint[tls-certificates-pki]) => set(config[common_name])'
  # latest track: old vault-k8s; vault-autounseal-provides, vault-pki, and grafana-dashboard absent
  - criteria:
      - track: 'latest'
    provides:
      vault-kv:
        optional: true
      metrics-endpoint:
        optional: true
      send-ca-cert:
        optional: true
    requires:
      ingress:
        optional: true
  # Fallback (1.16, 1.17, ...)
  - provides: *vault_provides
    requires:
      ingress:
        optional: true
      ingress-per-unit:
        optional: true
      tls-certificates-pki:
        optional: true
    configs:
      common_name: [charmqa, null]
    constraints:
      - 'bool(endpoint[vault-pki]) => bool(endpoint[tls-certificates-pki])'
      - 'bool(endpoint[vault-pki]) or bool(endpoint[tls-certificates-pki]) => set(config[common_name])'
