---
# containers-kubeapi-load-balancer: legacy Charmhub slug for the same charm
# published today as kubeapi-load-balancer (source:
# https://github.com/charmed-kubernetes/charm-kubeapi-load-balancer). Only a
# single "latest" track is published here (last released 2021-12-16); its
# endpoint metadata matches kubeapi-load-balancer's legacy generation (pre-1.28),
# so the same endpoint-optionality overrides apply. The dead `public-address`
# interface is documented elsewhere in this repo (openstack-integrator.yaml).
#
# loadbalancer (provides): optional - legacy reactive-era endpoint (interface
# public-address). No charm in the ecosystem requires public-address.
# nrpe-external-master (provides): optional - legacy NRPE monitoring hook,
# additive observability, not the charm's primary purpose.
# ha (requires): optional - hacluster is globally delisted (SQT-1081); the
# charm functions as a single-unit load balancer without HA clustering.
overrides:
  - provides:
      loadbalancer:
        optional: true
      nrpe-external-master:
        optional: true
    requires:
      ha:
        optional: true
