---
resource_tracking:
  # postgresql-k8s (via Juju/Kubernetes) retains its `pgdata` PersistentVolumeClaims
  # across application removal and scale-in events, so a leftover or re-created PVC
  # is expected behaviour rather than a defect. Skip PVC tracking for this charm;
  # other resource kinds remain tracked.
  skip:
    - pvc
overrides:
    # postgresql-k8s does not officially support juju 4
    # https://github.com/canonical/postgresql-k8s-operator/issues/1464
  - assumes: &assumes
      - k8s-api
      - any-of:
          - all-of:
              - juju >= 2.9.49
              - juju < 3
          - all-of:
              - juju >= 3.4.3
              - juju < 3.5
          - all-of:
              - juju >= 3.5.1
              - juju < 4
          - all-of:
              - juju >= 4
    criteria:
      - track: '16'
    provides:
      database:
        limit: 1
        optional: true
        features: [tls]
    constraints:
      # If database endpoint uses tls mode, client-certificates is required
      - '"tls" in features(endpoint[database]) => bool(endpoint[client-certificates])'
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'
  - assumes: *assumes
    criteria:
      - track: '14'
    provides:
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      database:
        limit: 1
        optional: true
        features: [tls]
      db:
        limit: 1
        optional: true
        features: [tls]
      db-admin:
        limit: 1
        optional: true
        features: [tls]
    constraints:
      # database, db, and db-admin are mutually exclusive (at most one can be used at a time)
      - len(endpoint[database]) + len(endpoint[db]) + len(endpoint[db-admin]) <= 1
      # If database endpoint uses tls mode, certificates is required
      - '"tls" in features(endpoint[database]) => bool(endpoint[certificates])'
      # If db endpoint uses tls mode, certificates is required
      - '"tls" in features(endpoint[db]) => bool(endpoint[certificates])'
      # If db-admin endpoint uses tls mode, certificates is required
      - '"tls" in features(endpoint[db-admin]) => bool(endpoint[certificates])'
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'
  # latest/stable is the old postgresql-k8s (ubuntu/20.04) - only has db and db-admin provides,
  # no requires endpoints. database/grafana-dashboard/metrics-endpoint are absent in this track.
  - assumes: *assumes
    criteria:
      - track: 'latest'
    provides:
      db:
        limit: 1
        optional: true
      db-admin:
        limit: 1
        optional: true
    constraints:
      # db and db-admin are mutually exclusive
      - len(endpoint[db]) + len(endpoint[db-admin]) <= 1
