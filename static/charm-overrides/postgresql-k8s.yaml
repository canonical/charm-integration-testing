      - '"intarray" in features(endpoint[database]) => set(config[plugin-intarray-enable])'
      - '"ip4r" in features(endpoint[database]) => set(config[plugin-ip4r-enable])'
      - '"isn" in features(endpoint[database]) => set(config[plugin-isn-enable])'
      - '"jsonb_plperl" in features(endpoint[database]) => set(config[plugin-jsonb-plperl-enable])'
      - '"lo" in features(endpoint[database]) => set(config[plugin-lo-enable])'
      - '"ltree" in features(endpoint[database]) => set(config[plugin-ltree-enable])'
      - '"old_snapshot" in features(endpoint[database]) => set(config[plugin-old-snapshot-enable])'
      - '"orafce" in features(endpoint[database]) => set(config[plugin-orafce-enable])'
      - '"pg_freespacemap" in features(endpoint[database]) => set(config[plugin-pg-freespacemap-enable])'
      - '"pg_similarity" in features(endpoint[database]) => set(config[plugin-pg-similarity-enable])'
      - '"pg_stat_statements" in features(endpoint[database]) => set(config[plugin-pg-stat-statements-enable])'
      - '"pg_trgm" in features(endpoint[database]) => set(config[plugin-pg-trgm-enable])'
      - '"pg_visibility" in features(endpoint[database]) => set(config[plugin-pg-visibility-enable])'
      - '"pgrowlocks" in features(endpoint[database]) => set(config[plugin-pgrowlocks-enable])'
      - '"pgstattuple" in features(endpoint[database]) => set(config[plugin-pgstattuple-enable])'
      - '"plperl" in features(endpoint[database]) => set(config[plugin-plperl-enable])'
      - '"plpython3u" in features(endpoint[database]) => set(config[plugin-plpython3u-enable])'
      - '"pltcl" in features(endpoint[database]) => set(config[plugin-pltcl-enable])'
      - '"postgis" in features(endpoint[database]) => set(config[plugin-postgis-enable])'
      - '"postgis_raster" in features(endpoint[database]) => set(config[plugin-postgis-raster-enable])'
      - '"postgis_tiger_geocoder" in features(endpoint[database]) => set(config[plugin-postgis-tiger-geocoder-enable])'
      - '"postgis_topology" in features(endpoint[database]) => set(config[plugin-postgis-topology-enable])'
      - '"prefix" in features(endpoint[database]) => set(config[plugin-prefix-enable])'
      - '"rdkit" in features(endpoint[database]) => set(config[plugin-rdkit-enable])'
      - '"seg" in features(endpoint[database]) => set(config[plugin-seg-enable])'
      - '"spi" in features(endpoint[database]) => set(config[plugin-spi-enable])'
      - '"tablefunc" in features(endpoint[database]) => set(config[plugin-tablefunc-enable])'
      - '"tcn" in features(endpoint[database]) => set(config[plugin-tcn-enable])'
      - '"tds_fdw" in features(endpoint[database]) => set(config[plugin-tds-fdw-enable])'
      - '"timescaledb" in features(endpoint[database]) => set(config[plugin-timescaledb-enable])'
      - '"tsm_system_rows" in features(endpoint[database]) => set(config[plugin-tsm-system-rows-enable])'
      - '"tsm_system_time" in features(endpoint[database]) => set(config[plugin-tsm-system-time-enable])'
      - '"unaccent" in features(endpoint[database]) => set(config[plugin-unaccent-enable])'
      - '"uuid-ossp" in features(endpoint[database]) => set(config[plugin-uuid-ossp-enable])'
      - '"vector" in features(endpoint[database]) => set(config[plugin-vector-enable])'
      # Prerequisites from REQUIRED_PLUGINS and PostgreSQL extension control files.
      - 'set(config[plugin-address-standardizer-enable]) => set(config[plugin-postgis-enable])'
      - 'set(config[plugin-address-standardizer-data-us-enable]) => set(config[plugin-postgis-enable])'
      - 'set(config[plugin-bool-plperl-enable]) => set(config[plugin-plperl-enable])'
      - 'set(config[plugin-earthdistance-enable]) => set(config[plugin-cube-enable])'
      - 'set(config[plugin-jsonb-plperl-enable]) => set(config[plugin-plperl-enable])'
      - 'set(config[plugin-postgis-raster-enable]) => set(config[plugin-postgis-enable])'
      - 'set(config[plugin-postgis-tiger-geocoder-enable]) => set(config[plugin-postgis-enable])'
      - 'set(config[plugin-postgis-tiger-geocoder-enable]) => set(config[plugin-fuzzystrmatch-enable])'
      - 'set(config[plugin-postgis-topology-enable]) => set(config[plugin-postgis-enable])'
      # If database endpoint uses tls mode, client-certificates is required
      - '"tls" in features(endpoint[database]) => bool(endpoint[client-certificates])'
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'
  - assumes: *assumes
