---
# Source: https://github.com/canonical/postgresql-k8s-operator
# Ubuntu bases distinguish endpoint generations when risk-only channels use the default track.
overrides:
    # postgresql-k8s does not officially support juju 4
    # https://github.com/canonical/postgresql-k8s-operator/issues/1464
  - assumes: &assumes
      - k8s-api
      - any-of:
          - all-of:
              - juju >= 2.9.49
              - juju < 3
          - all-of:
              - juju >= 3.4.3
              - juju < 3.5
          - all-of:
              - juju >= 3.5.1
              - juju < 4
          - all-of:
              - juju >= 4
    criteria:
      - any_of:
          - track: '16'
          - track: latest
            ubuntu_version: '24.04'
    # postgresql-k8s (via Juju/Kubernetes) retains its `pgdata` PersistentVolumeClaims
    # across application removal and scale-in events, so a leftover or re-created PVC
    # is expected behaviour rather than a defect. Skip PVC tracking; other kinds remain tracked.
    resource_tracking: &resource_tracking
      skip:
        - pvc
    # pg_cron is omitted: config.yaml limits it to the postgres database.
    configs:
      plugin-address-standardizer-enable: [true, null]
      plugin-address-standardizer-data-us-enable: [true, null]
      plugin-audit-enable: [true, null]
      plugin-bloom-enable: [true, null]
      plugin-bool-plperl-enable: [true, null]
      plugin-btree-gin-enable: [true, null]
      plugin-btree-gist-enable: [true, null]
      plugin-citext-enable: [true, null]
      plugin-cube-enable: [true, null]
      plugin-debversion-enable: [true, null]
      plugin-dict-int-enable: [true, null]
      plugin-dict-xsyn-enable: [true, null]
      plugin-earthdistance-enable: [true, null]
      plugin-fuzzystrmatch-enable: [true, null]
      plugin-hll-enable: [true, null]
      plugin-hstore-enable: [true, null]
      plugin-hypopg-enable: [true, null]
      plugin-icu-ext-enable: [true, null]
      plugin-intarray-enable: [true, null]
      plugin-ip4r-enable: [true, null]
      plugin-isn-enable: [true, null]
      plugin-jsonb-plperl-enable: [true, null]
      plugin-lo-enable: [true, null]
      plugin-ltree-enable: [true, null]
      plugin-old-snapshot-enable: [true, null]
      plugin-orafce-enable: [true, null]
      plugin-pg-freespacemap-enable: [true, null]
      plugin-pg-similarity-enable: [true, null]
      plugin-pg-stat-statements-enable: [true, null]
      plugin-pg-trgm-enable: [true, null]
      plugin-pg-visibility-enable: [true, null]
      plugin-pgrowlocks-enable: [true, null]
      plugin-pgstattuple-enable: [true, null]
      plugin-plperl-enable: [true, null]
      plugin-plpython3u-enable: [true, null]
      plugin-pltcl-enable: [true, null]
      plugin-postgis-enable: [true, null]
      plugin-postgis-raster-enable: [true, null]
      plugin-postgis-tiger-geocoder-enable: [true, null]
      plugin-postgis-topology-enable: [true, null]
      plugin-prefix-enable: [true, null]
      plugin-rdkit-enable: [true, null]
      plugin-seg-enable: [true, null]
      plugin-spi-enable: [true, null]
      plugin-tablefunc-enable: [true, null]
      plugin-tcn-enable: [true, null]
      plugin-tds-fdw-enable: [true, null]
      plugin-timescaledb-enable: [true, null]
      plugin-tsm-system-rows-enable: [true, null]
      plugin-tsm-system-time-enable: [true, null]
      plugin-unaccent-enable: [true, null]
      plugin-uuid-ossp-enable: [true, null]
      plugin-vector-enable: [true, null]
    provides:
      database:
        limit: 1
        optional: true
        features: [tls, address_standardizer, address_standardizer_data_us, pgaudit,
          bloom, bool_plperl, btree_gin, btree_gist, citext, cube, debversion, dict_int,
          dict_xsyn, earthdistance, fuzzystrmatch, hll, hstore, hypopg, icu_ext, intarray,
          ip4r, isn, jsonb_plperl, lo, ltree, old_snapshot, orafce, pg_freespacemap,
          pg_similarity, pg_stat_statements, pg_trgm, pg_visibility, pgrowlocks, pgstattuple,
          plperl, plpython3u, pltcl, postgis, postgis_raster, postgis_tiger_geocoder,
          postgis_topology, prefix, rdkit, seg, spi, tablefunc, tcn, tds_fdw, timescaledb,
          tsm_system_rows, tsm_system_time, unaccent, uuid-ossp, vector]
    constraints:
      - '"address_standardizer" in features(endpoint[database]) => set(config[plugin-address-standardizer-enable])'
      - '"address_standardizer_data_us" in features(endpoint[database]) => set(config[plugin-address-standardizer-data-us-enable])'
      - '"pgaudit" in features(endpoint[database]) => set(config[plugin-audit-enable])'
      - '"bloom" in features(endpoint[database]) => set(config[plugin-bloom-enable])'
