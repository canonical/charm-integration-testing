      plugin_plpython3u_enable: [true, null]
      plugin_pltcl_enable: [true, null]
      plugin_postgis_enable: [true, null]
      plugin_postgis_raster_enable: [true, null]
      plugin_postgis_tiger_geocoder_enable: [true, null]
      plugin_postgis_topology_enable: [true, null]
      plugin_prefix_enable: [true, null]
      plugin_rdkit_enable: [true, null]
      plugin_seg_enable: [true, null]
