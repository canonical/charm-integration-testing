---
# Source: https://github.com/canonical/discourse-k8s-operator
overrides:
  # The latest 22.04 channels support either Redis or Valkey.
  - criteria:
      - track: 'latest'
      - ubuntu_version: '22.04'
    configs: &configs
      external_hostname: ['discourse.example.com', null]
      force_https: [true, null]
    provides:
      grafana-dashboard:
        optional: true  # src/charm.py: GrafanaDashboardProvider is an optional integration.
      metrics-endpoint:
        optional: true  # src/charm.py: MetricsEndpointProvider is an optional integration.
    requires:
      # Discourse migrations create the vector extension.
      database:
        features: [plugin_vector]
      logging:
        optional: true  # src/charm.py: LogProxyConsumer is an optional integration.
      nginx-route:
        optional: true  # src/charm.py::_are_relations_ready does not require ingress.
      oauth:
        optional: true  # src/oauth_observer.py::_generate_client_config handles no relation.
        features: [tls]
    constraints:
      # src/charm.py::_are_relations_ready requires exactly one cache relation.
      - 'bool(endpoint[redis]) != bool(endpoint[valkey])'
      - 'bool(endpoint[database]) => "plugin_vector" in features(endpoint[database])'
      - 'bool(endpoint[saml]) => set(config[external_hostname])'
      - 'bool(endpoint[saml]) => set(config[force_https])'
      - 'bool(endpoint[oauth]) => set(config[force_https])'
  # The latest 20.04 channels require Redis and have no Valkey endpoint.
  - criteria:
      - track: 'latest'
      - ubuntu_version: '20.04'
    configs: *configs
    provides:
      grafana-dashboard:
        optional: true  # src/charm.py: GrafanaDashboardProvider is an optional integration.
      metrics-endpoint:
        optional: true  # src/charm.py: MetricsEndpointProvider is an optional integration.
    requires:
      logging:
        optional: true  # src/charm.py: LogProxyConsumer is an optional integration.
      nginx-route:
        optional: true  # src/charm.py::_are_relations_ready does not require ingress.
      oauth:
        optional: true  # src/oauth_observer.py::_generate_client_config handles no relation.
        features: [tls]
    constraints:
      - 'bool(endpoint[saml]) => set(config[external_hostname])'
      - 'bool(endpoint[saml]) => set(config[force_https])'
      - 'bool(endpoint[oauth]) => set(config[force_https])'
