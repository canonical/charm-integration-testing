---
# Source: https://github.com/canonical/postgresql-operator
#
# 16 has only the modern database endpoint; 14 also carries db/db-admin; latest/stable is the legacy charm with only db/db-admin.
#
# database (provides, track 16): REQUIRED - metadata.yaml leaves it non-optional and the charm's primary purpose is serving PostgreSQL clients.
# database/db/db-admin (provides, track 14): optional - src/charm.py aggregates all three client relation names in client_relations; endpoints are mutually exclusive and the solver may omit all (standalone deployment allowed).
# db/db-admin (provides, latest): optional - legacy track exposes both client endpoints; they are mutually exclusive; standalone deployment is allowed.
overrides:
  - criteria:
      - track: '16'
    # pg_cron is omitted: config.yaml limits it to the postgres database.
    configs:
      <<: &plugins
        plugin_address_standardizer_enable: [true, null]
        plugin_address_standardizer_data_us_enable: [true, null]
        plugin_audit_enable: [true, null]
        plugin_bloom_enable: [true, null]
        plugin_bool_plperl_enable: [true, null]
        plugin_btree_gin_enable: [true, null]
        plugin_btree_gist_enable: [true, null]
        plugin_citext_enable: [true, null]
        plugin_cube_enable: [true, null]
        plugin_debversion_enable: [true, null]
        plugin_dict_int_enable: [true, null]
        plugin_dict_xsyn_enable: [true, null]
        plugin_earthdistance_enable: [true, null]
        plugin_fuzzystrmatch_enable: [true, null]
        plugin_hll_enable: [true, null]
        plugin_hstore_enable: [true, null]
        plugin_hypopg_enable: [true, null]
        plugin_icu_ext_enable: [true, null]
        plugin_intarray_enable: [true, null]
        plugin_ip4r_enable: [true, null]
        plugin_isn_enable: [true, null]
        plugin_jsonb_plperl_enable: [true, null]
        plugin_lo_enable: [true, null]
        plugin_ltree_enable: [true, null]
        plugin_old_snapshot_enable: [true, null]
        plugin_orafce_enable: [true, null]
        plugin_pg_freespacemap_enable: [true, null]
        plugin_pg_similarity_enable: [true, null]
        plugin_pg_trgm_enable: [true, null]
        plugin_pg_visibility_enable: [true, null]
        plugin_pgrowlocks_enable: [true, null]
        plugin_pgstattuple_enable: [true, null]
        plugin_plperl_enable: [true, null]
        plugin_plpython3u_enable: [true, null]
        plugin_pltcl_enable: [true, null]
        plugin_postgis_enable: [true, null]
        plugin_postgis_raster_enable: [true, null]
        plugin_postgis_tiger_geocoder_enable: [true, null]
        plugin_postgis_topology_enable: [true, null]
        plugin_prefix_enable: [true, null]
        plugin_rdkit_enable: [true, null]
        plugin_seg_enable: [true, null]
        plugin_spi_enable: [true, null]
        plugin_tablefunc_enable: [true, null]
        plugin_tcn_enable: [true, null]
        plugin_tds_fdw_enable: [true, null]
        plugin_timescaledb_enable: [true, null]
        plugin_tsm_system_rows_enable: [true, null]
        plugin_tsm_system_time_enable: [true, null]
        plugin_unaccent_enable: [true, null]
        plugin_uuid_ossp_enable: [true, null]
        plugin_vector_enable: [true, null]
      plugin-pg-stat-statements-enable: [true, null]
    provides:
      database:
        features: &database_features [tls, plugin_address_standardizer, plugin_address_standardizer_data_us,
          plugin_pgaudit, plugin_bloom, plugin_bool_plperl, plugin_btree_gin, plugin_btree_gist,
          plugin_citext, plugin_cube, plugin_debversion, plugin_dict_int, plugin_dict_xsyn,
          plugin_earthdistance, plugin_fuzzystrmatch, plugin_hll, plugin_hstore, plugin_hypopg,
          plugin_icu_ext, plugin_intarray, plugin_ip4r, plugin_isn, plugin_jsonb_plperl,
          plugin_lo, plugin_ltree, plugin_old_snapshot, plugin_orafce, plugin_pg_freespacemap,
          plugin_pg_similarity, plugin_pg_stat_statements, plugin_pg_trgm, plugin_pg_visibility,
          plugin_pgrowlocks, plugin_pgstattuple, plugin_plperl, plugin_plpython3u,
          plugin_pltcl, plugin_postgis, plugin_postgis_raster, plugin_postgis_tiger_geocoder,
          plugin_postgis_topology, plugin_prefix, plugin_rdkit, plugin_seg, plugin_spi,
          plugin_tablefunc, plugin_tcn, plugin_tds_fdw, plugin_timescaledb, plugin_tsm_system_rows,
          plugin_tsm_system_time, plugin_unaccent, plugin_uuid-ossp, plugin_vector]
    constraints:
      - &plugin_address_standardizer '"plugin_address_standardizer" in features(endpoint[database])
        => set(config[plugin_address_standardizer_enable])'
      - &plugin_address_standardizer_data_us '"plugin_address_standardizer_data_us"
        in features(endpoint[database]) => set(config[plugin_address_standardizer_data_us_enable])'
      - &plugin_pgaudit '"plugin_pgaudit" in features(endpoint[database]) => set(config[plugin_audit_enable])'
      - &plugin_bloom '"plugin_bloom" in features(endpoint[database]) => set(config[plugin_bloom_enable])'
      - &plugin_bool_plperl '"plugin_bool_plperl" in features(endpoint[database])
        => set(config[plugin_bool_plperl_enable])'
      - &plugin_btree_gin '"plugin_btree_gin" in features(endpoint[database]) => set(config[plugin_btree_gin_enable])'
      - &plugin_btree_gist '"plugin_btree_gist" in features(endpoint[database]) =>
        set(config[plugin_btree_gist_enable])'
      - &plugin_citext '"plugin_citext" in features(endpoint[database]) => set(config[plugin_citext_enable])'
      - &plugin_cube '"plugin_cube" in features(endpoint[database]) => set(config[plugin_cube_enable])'
      - &plugin_debversion '"plugin_debversion" in features(endpoint[database]) =>
        set(config[plugin_debversion_enable])'
      - &plugin_dict_int '"plugin_dict_int" in features(endpoint[database]) => set(config[plugin_dict_int_enable])'
      - &plugin_dict_xsyn '"plugin_dict_xsyn" in features(endpoint[database]) => set(config[plugin_dict_xsyn_enable])'
      - &plugin_earthdistance '"plugin_earthdistance" in features(endpoint[database])
        => set(config[plugin_earthdistance_enable])'
      - &plugin_fuzzystrmatch '"plugin_fuzzystrmatch" in features(endpoint[database])
        => set(config[plugin_fuzzystrmatch_enable])'
      - &plugin_hll '"plugin_hll" in features(endpoint[database]) => set(config[plugin_hll_enable])'
      - &plugin_hstore '"plugin_hstore" in features(endpoint[database]) => set(config[plugin_hstore_enable])'
      - &plugin_hypopg '"plugin_hypopg" in features(endpoint[database]) => set(config[plugin_hypopg_enable])'
      - &plugin_icu_ext '"plugin_icu_ext" in features(endpoint[database]) => set(config[plugin_icu_ext_enable])'
      - &plugin_intarray '"plugin_intarray" in features(endpoint[database]) => set(config[plugin_intarray_enable])'
      - &plugin_ip4r '"plugin_ip4r" in features(endpoint[database]) => set(config[plugin_ip4r_enable])'
      - &plugin_isn '"plugin_isn" in features(endpoint[database]) => set(config[plugin_isn_enable])'
      - &plugin_jsonb_plperl '"plugin_jsonb_plperl" in features(endpoint[database])
        => set(config[plugin_jsonb_plperl_enable])'
      - &plugin_lo '"plugin_lo" in features(endpoint[database]) => set(config[plugin_lo_enable])'
      - &plugin_ltree '"plugin_ltree" in features(endpoint[database]) => set(config[plugin_ltree_enable])'
      - &plugin_old_snapshot '"plugin_old_snapshot" in features(endpoint[database])
        => set(config[plugin_old_snapshot_enable])'
      - &plugin_orafce '"plugin_orafce" in features(endpoint[database]) => set(config[plugin_orafce_enable])'
      - &plugin_pg_freespacemap '"plugin_pg_freespacemap" in features(endpoint[database])
        => set(config[plugin_pg_freespacemap_enable])'
      - &plugin_pg_similarity '"plugin_pg_similarity" in features(endpoint[database])
        => set(config[plugin_pg_similarity_enable])'
      - '"plugin_pg_stat_statements" in features(endpoint[database]) => set(config[plugin-pg-stat-statements-enable])'
      - &plugin_pg_trgm '"plugin_pg_trgm" in features(endpoint[database]) => set(config[plugin_pg_trgm_enable])'
      - &plugin_pg_visibility '"plugin_pg_visibility" in features(endpoint[database])
        => set(config[plugin_pg_visibility_enable])'
      - &plugin_pgrowlocks '"plugin_pgrowlocks" in features(endpoint[database]) =>
        set(config[plugin_pgrowlocks_enable])'
      - &plugin_pgstattuple '"plugin_pgstattuple" in features(endpoint[database])
        => set(config[plugin_pgstattuple_enable])'
      - &plugin_plperl '"plugin_plperl" in features(endpoint[database]) => set(config[plugin_plperl_enable])'
      - &plugin_plpython3u '"plugin_plpython3u" in features(endpoint[database]) =>
        set(config[plugin_plpython3u_enable])'
      - &plugin_pltcl '"plugin_pltcl" in features(endpoint[database]) => set(config[plugin_pltcl_enable])'
      - &plugin_postgis '"plugin_postgis" in features(endpoint[database]) => set(config[plugin_postgis_enable])'
      - &plugin_postgis_raster '"plugin_postgis_raster" in features(endpoint[database])
        => set(config[plugin_postgis_raster_enable])'
      - &plugin_postgis_tiger_geocoder '"plugin_postgis_tiger_geocoder" in features(endpoint[database])
        => set(config[plugin_postgis_tiger_geocoder_enable])'
      - &plugin_postgis_topology '"plugin_postgis_topology" in features(endpoint[database])
        => set(config[plugin_postgis_topology_enable])'
      - &plugin_prefix '"plugin_prefix" in features(endpoint[database]) => set(config[plugin_prefix_enable])'
      - &plugin_rdkit '"plugin_rdkit" in features(endpoint[database]) => set(config[plugin_rdkit_enable])'
      - &plugin_seg '"plugin_seg" in features(endpoint[database]) => set(config[plugin_seg_enable])'
      - &plugin_spi '"plugin_spi" in features(endpoint[database]) => set(config[plugin_spi_enable])'
      - &plugin_tablefunc '"plugin_tablefunc" in features(endpoint[database]) => set(config[plugin_tablefunc_enable])'
      - &plugin_tcn '"plugin_tcn" in features(endpoint[database]) => set(config[plugin_tcn_enable])'
      - &plugin_tds_fdw '"plugin_tds_fdw" in features(endpoint[database]) => set(config[plugin_tds_fdw_enable])'
      - &plugin_timescaledb '"plugin_timescaledb" in features(endpoint[database])
        => set(config[plugin_timescaledb_enable])'
      - &plugin_tsm_system_rows '"plugin_tsm_system_rows" in features(endpoint[database])
        => set(config[plugin_tsm_system_rows_enable])'
      - &plugin_tsm_system_time '"plugin_tsm_system_time" in features(endpoint[database])
        => set(config[plugin_tsm_system_time_enable])'
      - &plugin_unaccent '"plugin_unaccent" in features(endpoint[database]) => set(config[plugin_unaccent_enable])'
      - &plugin_uuid-ossp '"plugin_uuid-ossp" in features(endpoint[database]) => set(config[plugin_uuid_ossp_enable])'
      - &plugin_vector '"plugin_vector" in features(endpoint[database]) => set(config[plugin_vector_enable])'
      # Prerequisites from REQUIRED_PLUGINS and PostgreSQL extension control files.
      - &requires_address_standardizer_postgis 'set(config[plugin_address_standardizer_enable])
        => set(config[plugin_postgis_enable])'
      - &requires_address_standardizer_data_us_postgis 'set(config[plugin_address_standardizer_data_us_enable])
        => set(config[plugin_postgis_enable])'
      - &requires_bool_plperl_plperl 'set(config[plugin_bool_plperl_enable]) => set(config[plugin_plperl_enable])'
      - &requires_earthdistance_cube 'set(config[plugin_earthdistance_enable]) =>
        set(config[plugin_cube_enable])'
      - &requires_jsonb_plperl_plperl 'set(config[plugin_jsonb_plperl_enable]) =>
        set(config[plugin_plperl_enable])'
      - &requires_postgis_raster_postgis 'set(config[plugin_postgis_raster_enable])
        => set(config[plugin_postgis_enable])'
      - &requires_postgis_tiger_geocoder_postgis 'set(config[plugin_postgis_tiger_geocoder_enable])
        => set(config[plugin_postgis_enable])'
      - &requires_postgis_tiger_geocoder_fuzzystrmatch 'set(config[plugin_postgis_tiger_geocoder_enable])
        => set(config[plugin_fuzzystrmatch_enable])'
      - &requires_postgis_topology_postgis 'set(config[plugin_postgis_topology_enable])
        => set(config[plugin_postgis_enable])'
      # If database endpoint uses tls mode, client-certificates is required
      - '"tls" in features(endpoint[database]) => bool(endpoint[client-certificates])'
  - criteria:
      - track: '14'
    configs:
      <<: *plugins
      plugin_pg_stat_statements_enable: [true, null]
    provides:
      database:
        limit: 1
        optional: true
        features: *database_features
      db:
        limit: 1
        optional: true
        features: [tls]
      db-admin:
        limit: 1
        optional: true
        features: [tls]
    constraints:
      - *plugin_address_standardizer
      - *plugin_address_standardizer_data_us
      - *plugin_pgaudit
      - *plugin_bloom
      - *plugin_bool_plperl
      - *plugin_btree_gin
      - *plugin_btree_gist
      - *plugin_citext
      - *plugin_cube
      - *plugin_debversion
      - *plugin_dict_int
      - *plugin_dict_xsyn
      - *plugin_earthdistance
      - *plugin_fuzzystrmatch
      - *plugin_hll
      - *plugin_hstore
      - *plugin_hypopg
      - *plugin_icu_ext
      - *plugin_intarray
      - *plugin_ip4r
      - *plugin_isn
      - *plugin_jsonb_plperl
      - *plugin_lo
      - *plugin_ltree
      - *plugin_old_snapshot
      - *plugin_orafce
      - *plugin_pg_freespacemap
      - *plugin_pg_similarity
      - '"plugin_pg_stat_statements" in features(endpoint[database]) => set(config[plugin_pg_stat_statements_enable])'
      - *plugin_pg_trgm
      - *plugin_pg_visibility
      - *plugin_pgrowlocks
      - *plugin_pgstattuple
      - *plugin_plperl
      - *plugin_plpython3u
      - *plugin_pltcl
      - *plugin_postgis
      - *plugin_postgis_raster
      - *plugin_postgis_tiger_geocoder
      - *plugin_postgis_topology
      - *plugin_prefix
      - *plugin_rdkit
      - *plugin_seg
      - *plugin_spi
      - *plugin_tablefunc
      - *plugin_tcn
      - *plugin_tds_fdw
      - *plugin_timescaledb
      - *plugin_tsm_system_rows
      - *plugin_tsm_system_time
      - *plugin_unaccent
      - *plugin_uuid-ossp
      - *plugin_vector
      - *requires_address_standardizer_postgis
      - *requires_address_standardizer_data_us_postgis
      - *requires_bool_plperl_plperl
      - *requires_earthdistance_cube
      - *requires_jsonb_plperl_plperl
      - *requires_postgis_raster_postgis
      - *requires_postgis_tiger_geocoder_postgis
      - *requires_postgis_tiger_geocoder_fuzzystrmatch
      - *requires_postgis_topology_postgis
      # database, db, and db-admin are mutually exclusive (at most one can be used at a time)
      - len(endpoint[database]) + len(endpoint[db]) + len(endpoint[db-admin]) <= 1
      # If a client endpoint uses tls mode, certificates is required.
      - '"tls" in features(endpoint[database]) => bool(endpoint[certificates])'
      - '"tls" in features(endpoint[db]) => bool(endpoint[certificates])'
      - '"tls" in features(endpoint[db-admin]) => bool(endpoint[certificates])'
  - criteria:
      - track: 'latest'
    provides:
      db:
        limit: 1
        optional: true
      db-admin:
        limit: 1
        optional: true
    constraints:
      # db and db-admin are mutually exclusive (at most one can be used at a time)
      - len(endpoint[db]) + len(endpoint[db-admin]) <= 1
