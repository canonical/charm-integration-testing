---
priority: 2.0
# pgbouncer needs at least one of these to exit blocked state
# (db and db-admin are legacy endpoints)
# https://github.com/canonical/pgbouncer-operator/pull/548
overrides:
  - provides:
      database:
        optional: true
        # Extension provisioning through PgBouncer is blocked by https://github.com/canonical/pgbouncer-k8s-operator/issues/877
        features: [tls, address_standardizer, address_standardizer_data_us, pgaudit,
          bloom, bool_plperl, btree_gin, btree_gist, citext, cube, debversion, dict_int,
          dict_xsyn, earthdistance, fuzzystrmatch, hll, hstore, hypopg, icu_ext, intarray,
          ip4r, isn, jsonb_plperl, lo, ltree, old_snapshot, orafce, pg_freespacemap,
          pg_similarity, pg_stat_statements, pg_trgm, pg_visibility, pgrowlocks, pgstattuple,
          plperl, plpython3u, pltcl, postgis, postgis_raster, postgis_tiger_geocoder,
          postgis_topology, prefix, rdkit, seg, spi, tablefunc, tcn, tds_fdw, timescaledb,
          tsm_system_rows, tsm_system_time, unaccent, uuid-ossp, vector]
      db:
        optional: true
        features: [tls]
      db-admin:
        optional: true
        features: [tls]
    requires:
      backend-database:
        features: [address_standardizer, address_standardizer_data_us, pgaudit, bloom,
          bool_plperl, btree_gin, btree_gist, citext, cube, debversion, dict_int,
          dict_xsyn, earthdistance, fuzzystrmatch, hll, hstore, hypopg, icu_ext, intarray,
          ip4r, isn, jsonb_plperl, lo, ltree, old_snapshot, orafce, pg_freespacemap,
          pg_similarity, pg_stat_statements, pg_trgm, pg_visibility, pgrowlocks, pgstattuple,
          plperl, plpython3u, pltcl, postgis, postgis_raster, postgis_tiger_geocoder,
          postgis_topology, prefix, rdkit, seg, spi, tablefunc, tcn, tds_fdw, timescaledb,
          tsm_system_rows, tsm_system_time, unaccent, uuid-ossp, vector]
      certificates:
        optional: true
    constraints:
      # At least one database endpoint must be integrated
      - len(endpoint[database]) + len(endpoint[db]) + len(endpoint[db-admin]) >= 1
      # If database endpoint uses tls mode, certificates is required
      - '"tls" in features(endpoint[database]) => bool(endpoint[certificates])'
      # If db endpoint uses tls mode, certificates is required
      - '"tls" in features(endpoint[db]) => bool(endpoint[certificates])'
      # If db-admin endpoint uses tls mode, certificates is required
      - '"tls" in features(endpoint[db-admin]) => bool(endpoint[certificates])'
      - '("address_standardizer" in features(endpoint[database])) == ("address_standardizer"
        in features(endpoint[backend-database]))'
      - '("address_standardizer_data_us" in features(endpoint[database])) == ("address_standardizer_data_us"
        in features(endpoint[backend-database]))'
      - '("pgaudit" in features(endpoint[database])) == ("pgaudit" in features(endpoint[backend-database]))'
      - '("bloom" in features(endpoint[database])) == ("bloom" in features(endpoint[backend-database]))'
      - '("bool_plperl" in features(endpoint[database])) == ("bool_plperl" in features(endpoint[backend-database]))'
      - '("btree_gin" in features(endpoint[database])) == ("btree_gin" in features(endpoint[backend-database]))'
      - '("btree_gist" in features(endpoint[database])) == ("btree_gist" in features(endpoint[backend-database]))'
      - '("citext" in features(endpoint[database])) == ("citext" in features(endpoint[backend-database]))'
      - '("cube" in features(endpoint[database])) == ("cube" in features(endpoint[backend-database]))'
      - '("debversion" in features(endpoint[database])) == ("debversion" in features(endpoint[backend-database]))'
      - '("dict_int" in features(endpoint[database])) == ("dict_int" in features(endpoint[backend-database]))'
      - '("dict_xsyn" in features(endpoint[database])) == ("dict_xsyn" in features(endpoint[backend-database]))'
      - '("earthdistance" in features(endpoint[database])) == ("earthdistance" in
        features(endpoint[backend-database]))'
      - '("fuzzystrmatch" in features(endpoint[database])) == ("fuzzystrmatch" in
        features(endpoint[backend-database]))'
      - '("hll" in features(endpoint[database])) == ("hll" in features(endpoint[backend-database]))'
      - '("hstore" in features(endpoint[database])) == ("hstore" in features(endpoint[backend-database]))'
      - '("hypopg" in features(endpoint[database])) == ("hypopg" in features(endpoint[backend-database]))'
      - '("icu_ext" in features(endpoint[database])) == ("icu_ext" in features(endpoint[backend-database]))'
      - '("intarray" in features(endpoint[database])) == ("intarray" in features(endpoint[backend-database]))'
      - '("ip4r" in features(endpoint[database])) == ("ip4r" in features(endpoint[backend-database]))'
      - '("isn" in features(endpoint[database])) == ("isn" in features(endpoint[backend-database]))'
      - '("jsonb_plperl" in features(endpoint[database])) == ("jsonb_plperl" in features(endpoint[backend-database]))'
      - '("lo" in features(endpoint[database])) == ("lo" in features(endpoint[backend-database]))'
      - '("ltree" in features(endpoint[database])) == ("ltree" in features(endpoint[backend-database]))'
      - '("old_snapshot" in features(endpoint[database])) == ("old_snapshot" in features(endpoint[backend-database]))'
      - '("orafce" in features(endpoint[database])) == ("orafce" in features(endpoint[backend-database]))'
      - '("pg_freespacemap" in features(endpoint[database])) == ("pg_freespacemap"
        in features(endpoint[backend-database]))'
      - '("pg_similarity" in features(endpoint[database])) == ("pg_similarity" in
        features(endpoint[backend-database]))'
      - '("pg_stat_statements" in features(endpoint[database])) == ("pg_stat_statements"
        in features(endpoint[backend-database]))'
      - '("pg_trgm" in features(endpoint[database])) == ("pg_trgm" in features(endpoint[backend-database]))'
      - '("pg_visibility" in features(endpoint[database])) == ("pg_visibility" in
        features(endpoint[backend-database]))'
      - '("pgrowlocks" in features(endpoint[database])) == ("pgrowlocks" in features(endpoint[backend-database]))'
      - '("pgstattuple" in features(endpoint[database])) == ("pgstattuple" in features(endpoint[backend-database]))'
      - '("plperl" in features(endpoint[database])) == ("plperl" in features(endpoint[backend-database]))'
      - '("plpython3u" in features(endpoint[database])) == ("plpython3u" in features(endpoint[backend-database]))'
      - '("pltcl" in features(endpoint[database])) == ("pltcl" in features(endpoint[backend-database]))'
      - '("postgis" in features(endpoint[database])) == ("postgis" in features(endpoint[backend-database]))'
      - '("postgis_raster" in features(endpoint[database])) == ("postgis_raster" in
        features(endpoint[backend-database]))'
      - '("postgis_tiger_geocoder" in features(endpoint[database])) == ("postgis_tiger_geocoder"
        in features(endpoint[backend-database]))'
      - '("postgis_topology" in features(endpoint[database])) == ("postgis_topology"
        in features(endpoint[backend-database]))'
      - '("prefix" in features(endpoint[database])) == ("prefix" in features(endpoint[backend-database]))'
      - '("rdkit" in features(endpoint[database])) == ("rdkit" in features(endpoint[backend-database]))'
      - '("seg" in features(endpoint[database])) == ("seg" in features(endpoint[backend-database]))'
      - '("spi" in features(endpoint[database])) == ("spi" in features(endpoint[backend-database]))'
      - '("tablefunc" in features(endpoint[database])) == ("tablefunc" in features(endpoint[backend-database]))'
      - '("tcn" in features(endpoint[database])) == ("tcn" in features(endpoint[backend-database]))'
      - '("tds_fdw" in features(endpoint[database])) == ("tds_fdw" in features(endpoint[backend-database]))'
      - '("timescaledb" in features(endpoint[database])) == ("timescaledb" in features(endpoint[backend-database]))'
      - '("tsm_system_rows" in features(endpoint[database])) == ("tsm_system_rows"
        in features(endpoint[backend-database]))'
      - '("tsm_system_time" in features(endpoint[database])) == ("tsm_system_time"
        in features(endpoint[backend-database]))'
      - '("unaccent" in features(endpoint[database])) == ("unaccent" in features(endpoint[backend-database]))'
      - '("uuid-ossp" in features(endpoint[database])) == ("uuid-ossp" in features(endpoint[backend-database]))'
      - '("vector" in features(endpoint[database])) == ("vector" in features(endpoint[backend-database]))'
      # Backend database must have the same risk
      - 'risks(charms(endpoint[backend-database])) == risks({self})'
