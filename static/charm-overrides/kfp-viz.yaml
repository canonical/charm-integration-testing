---
default_channel: 2.5/stable  # Use the stable KFP release line required by the KFP API deployment.
# KFP Visualization Server - renders pipeline graphs and metrics
overrides:
  - provides:
      kfp-viz:
        features: [kfp-viz]
    constraints:
      - '"kfp-viz" in features(endpoint[kfp-viz])'
