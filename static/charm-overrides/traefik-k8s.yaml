---
# Traefik optional flags have been added: https://github.com/canonical/traefik-k8s-operator/pull/474
# But there has been no release
# And appears in limbo due to being handed off to IS
overrides:
  - requires:
      certificates:
        optional: true
      experimental-forward-auth:
        optional: true
      logging:
        optional: true
      charm-tracing:
        optional: true
      workload-tracing:
        optional: true
      receive-ca-cert:
        optional: true
      upstream-ingress:
        optional: true
    provides:
      # sdi-legacy is declared here (but never forced active) so the solver's
      # feature-coherence check can compare it against requirers. traefik-k8s
      # speaks the modern charms.traefik_k8s.v2.ingress protocol only, so it
      # never activates sdi-legacy; requirers that force it active (legacy
      # serialized_data_interface charms, e.g. dex-auth) are naturally rejected
      # instead of deadlocking at deploy time.
      # See: https://github.com/canonical/charm-integration-testing/issues/976
      ingress:
        optional: true
        features: [tls, sdi-legacy]
      ingress-per-unit:
        optional: true
        features: [tls]
      metrics-endpoint:
        optional: true
      traefik-route:
        optional: true
        features: [tls]
      grafana-dashboard:
        optional: true
    proxies:
      - interface: certificates
        requires: certificates
        provides: ingress
    constraints:
      # certificates is required if any downstream endpoint negotiates tls
      - '"tls" in features(endpoint[traefik-route] | endpoint[ingress] | endpoint[ingress-per-unit])
        => bool(endpoint[certificates])'
      # traefik-k8s speaks the modern charms.traefik_k8s.v2.ingress protocol
      # only; explicitly deny sdi-legacy so the solver can't satisfy a legacy
      # SDI requirer's "sdi-legacy" feature pin by activating it on traefik's
      # side too. See: https://github.com/canonical/charm-integration-testing/issues/976
      - 'not ("sdi-legacy" in features(endpoint[ingress]))'
