---
# Traefik optional flags have been added: https://github.com/canonical/traefik-k8s-operator/pull/474
# But there has been no release
# And appears in limbo due to being handed off to IS
overrides:
  - requires:
      certificates:
        optional: true
      experimental-forward-auth:
        optional: true
      logging:
        optional: true
      charm-tracing:
        optional: true
      workload-tracing:
        optional: true
      receive-ca-cert:
        optional: true
      upstream-ingress:
        optional: true
        # IngressPerAppRequirer (v2.ingress) only ever negotiates with another
        # traefik-k8s's ingress provider (traefik-k8s-operator#501 - chaining use case).
        features: [traefik-chain]
    provides:
      ingress:
        optional: true
        features: [tls, traefik-chain]
      ingress-per-unit:
        optional: true
        features: [tls]
      metrics-endpoint:
        optional: true
      traefik-route:
        optional: true
        features: [tls]
      grafana-dashboard:
        optional: true
    proxies:
      - interface: certificates
        requires: certificates
        provides: ingress
    constraints:
      # certificates is required if any downstream endpoint negotiates tls
      - '"tls" in features(endpoint[traefik-route] | endpoint[ingress] | endpoint[ingress-per-unit])
        => bool(endpoint[certificates])'
      # upstream-ingress (v2 ingress) only chains to another traefik-k8s instance;
      # see charm-integration-testing#954 for the istio-pilot (SDI) incompatibility.
      - 'bool(endpoint[upstream-ingress]) => "traefik-chain" in features(endpoint[upstream-ingress])'
