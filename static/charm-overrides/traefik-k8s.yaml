---
# Traefik optional flags have been added: https://github.com/canonical/traefik-k8s-operator/pull/474
# But there has been no release
# And appears in limbo due to being handed off to IS
#
# Track 1.0 (rev 164) predates the optional-flags PR above and the charm-tracing/
# workload-tracing/upstream-ingress/experimental-forward-auth endpoints entirely; its
# metadata already reports certificates/logging/receive-ca-cert/tracing as required, so
# it is deliberately excluded from the block below rather than declared here.
overrides:
  - criteria:
      - none_of:
          - track: '1.0'
    requires:
      certificates:
        optional: true
      experimental-forward-auth:
        optional: true
      logging:
        optional: true
      charm-tracing:
        optional: true
      workload-tracing:
        optional: true
      receive-ca-cert:
        optional: true
      upstream-ingress:
        optional: true
        # IngressPerAppRequirer (v2.ingress) never publishes _supported_versions, so it
        # cannot negotiate with a legacy serialized_data_interface (SDI) provider such as
        # istio-pilot's ingress endpoint (traefik-k8s-operator#501,
        # charm-integration-testing#954/#955 review). sdi-legacy is declared here (not
        # forced) purely so coherence binds this endpoint's copy of the feature to any
        # provider that itself unconditionally declares it (see istio-pilot.yaml); every
        # other provider that doesn't know about sdi-legacy is unaffected - this is a
        # deny-list on the one known-incompatible protocol, not an allow-list of
        # traefik-specific providers.
        features: [sdi-legacy]
    provides:
      ingress:
        optional: true
        features: [tls]
      ingress-per-unit:
        optional: true
        features: [tls]
      metrics-endpoint:
        optional: true
      traefik-route:
        optional: true
        features: [tls]
      grafana-dashboard:
        optional: true
    proxies:
      - interface: certificates
        requires: certificates
        provides: ingress
    constraints:
      # certificates is required if any downstream endpoint negotiates tls
      - '"tls" in features(endpoint[traefik-route] | endpoint[ingress] | endpoint[ingress-per-unit])
        => bool(endpoint[certificates])'
      # upstream-ingress (v2 ingress) is wire-incompatible with legacy SDI providers
      # (e.g. istio-pilot); see charm-integration-testing#954. This rejects only
      # providers that integrate over sdi-legacy (currently just istio-pilot), not
      # non-SDI providers.
      - 'bool(endpoint[upstream-ingress]) => not ("sdi-legacy" in features(endpoint[upstream-ingress]))'
