---
# latest/* non-edge risks (stable/beta/candidate) are the old Apache Bigtop charm (no
# certificates endpoint); exclude them from TLS overrides below
overrides:
  # latest non-edge channels lack cos-agent
  - criteria:
      - track: 'latest'
        none_of:
          - risk: 'edge'
  # default (everything else, currently track 3 and latest/edge): cos-agent, and TLS
  # support on the zookeeper relation tied to whether this charm itself has certificates.
  # See: https://github.com/canonical/charm-integration-testing/issues/309
  - provides:
      cos-agent:
        optional: true
      zookeeper:
        features: [tls]
    constraints:
      - 'bool(endpoint[certificates]) == ("tls" in features(endpoint[zookeeper]))'
