---
# Remove after: https://github.com/canonical/zookeeper-k8s-operator/pull/136
overrides:
  # latest/stable (ubuntu/20.04) provides only ['zookeeper'] and latest/beta
  # provides only ['client'] - no common provides across all latest risk levels.
  # Declare nothing for latest so no UnparsableCharmException is raised.
  - criteria:
      - track: 'latest'
  - provides:
      zookeeper:
        optional: true
        features: [tls]
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    proxies:
      - interface: certificates
        provides: zookeeper
        requires: certificates
    constraints:
      # TLS support in zookeeper-k8s is gated behind the presence of certificates endpoint, so these two features should be co-present or co-absent.
      - 'bool(endpoint[certificates]) == ("tls" in features(endpoint[zookeeper]))'
