---
# nova-compute: Source: https://github.com/openstack/charm-nova-compute
#
# cloud-compute (provides): REQUIRED - nova-cloud-controller must connect.
# amqp, image-service (requires): REQUIRED (see REQUIRED_INTERFACES in
#   hooks/nova_compute_utils.py).
# All other requires/provides: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  # Old tracks (queens through xena): nova-vgpu endpoint does not exist in charm metadata.
  - assumes: &unsupported
      - unsupported-openstack
    criteria:
      - any_of:
          - track: queens
          - track: rocky
          - track: stein
          - track: train
          - track: ussuri
          - track: victoria
          - track: wallaby
          - track: xena
    provides:
      nrpe-external-master:
        optional: true
    requires:
      ceph:
        optional: true
      lxd:
        optional: true
      nova-ceilometer:
        optional: true
      neutron-plugin:
        optional: true
      ephemeral-backend:
        optional: true
      ceph-access:
        optional: true
      cloud-credentials:
        optional: true
      secrets-storage:
        optional: true
      ironic-api:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[cloud-compute])) == tracks({self})'
      - 'risks(charms(endpoint[cloud-compute])) == risks({self})'
      - 'tracks(charms(endpoint[image-service])) == tracks({self})'
      - 'risks(charms(endpoint[image-service])) == risks({self})'
  # Default (yoga and later): nova-vgpu endpoint is present in charm metadata.
  - assumes: *unsupported
    provides:
      nrpe-external-master:
        optional: true
    requires:
      ceph:
        optional: true
      lxd:
        optional: true
      nova-ceilometer:
        optional: true
      nova-vgpu:
        optional: true
      neutron-plugin:
        optional: true
      ephemeral-backend:
        optional: true
      ceph-access:
        optional: true
      cloud-credentials:
        optional: true
      secrets-storage:
        optional: true
      ironic-api:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[cloud-compute])) == tracks({self})'
      - 'risks(charms(endpoint[cloud-compute])) == risks({self})'
      - 'tracks(charms(endpoint[image-service])) == tracks({self})'
      - 'risks(charms(endpoint[image-service])) == risks({self})'
