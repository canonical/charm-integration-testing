---
# manila-ganesha: listed on Charmhub, but not currently covered by Charm QA (SQT-1081).
overrides:
  # ussuri-yoga: nrpe-external-master not yet available
  - assumes: &unsupported
      - unsupported-openstack
    criteria:
      - any_of:
          - track: 'ussuri'
          - track: 'victoria'
          - track: 'wallaby'
          - track: 'xena'
          - track: 'yoga'
  # default (zed, 2023.1+, latest, and future tracks): nrpe-external-master
  - assumes: *unsupported
    provides:
      nrpe-external-master:
        optional: true
