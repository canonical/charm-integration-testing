---
# listed: false -- Excluded from automated bundle building (SQT-1081) to prevent
# pipeline congestion; not currently covered by Charm QA.
listed: false
overrides:
  # ussuri-yoga: nrpe-external-master not yet available
  - criteria:
      - any_of:
          - track: 'ussuri'
          - track: 'victoria'
          - track: 'wallaby'
          - track: 'xena'
          - track: 'yoga'
    assumes:
      - openstack-unsupported
  # default (zed, 2023.1+, latest, and future tracks): nrpe-external-master
  - provides:
      nrpe-external-master:
        optional: true
    assumes:
      - openstack-unsupported
