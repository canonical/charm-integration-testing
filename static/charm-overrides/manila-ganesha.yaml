---
# listed: false -- OpenStack charms require a dedicated OpenStack substrate
#   to deploy and test. They are excluded from automated bundle building to
#   prevent pipeline congestion.
listed: false
overrides:
  # ussuri-yoga: nrpe-external-master not yet available
  - criteria:
      - any_of:
          - track: 'ussuri'
          - track: 'victoria'
          - track: 'wallaby'
          - track: 'xena'
          - track: 'yoga'
  # default (zed, 2023.1+, latest, and future tracks): nrpe-external-master
  - provides:
      nrpe-external-master:
        optional: true
