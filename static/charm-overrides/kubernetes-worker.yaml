---
# Override for kubernetes-worker
# Source: https://github.com/charmed-kubernetes/charm-kubernetes-worker
#
# Upstream PR: https://github.com/charmed-kubernetes/charm-kubernetes-worker/pull/215
# (applies to 1.29+ ops charm only)
#
# Evidence gathered from src/charm.py and src/cloud_integration.py
# (main branch, 2025).
#
# Four *generations* of endpoint sets exist, but they no longer align cleanly
# with track boundaries: tracks 1.29+ still publish revisions of the legacy
# reactive charm on the 16.04/18.04 bases (verified via Charmhub `refresh`),
# alongside the rewritten ops charm on 20.04+. Generation is therefore matched
# by (a) track for the tracks that only ever had one generation (1.23-1.28),
# and (b) ubuntu_version for the legacy generations that persist on old bases
# under newer tracks. Blocks are evaluated in order and the first match wins,
# so the ubuntu_version-scoped legacy blocks are listed before the 1.29/1.30+
# blocks to take priority on 16.04/18.04 regardless of track.
#   1.23:            legacy reactive charm
#   1.24-1.28:       legacy reactive charm, adds scrape (Prometheus) in provides
#   any track, 16.04: legacy reactive charm (same generation as 1.23)
#   any track, 18.04: legacy reactive charm, adds scrape (same generation as 1.24-1.28)
#   1.29:            ops-based rewrite; azure/gcp absent, tokens added, cos-agent added
#   1.30+:           same ops charm; azure and gcp restored as optional
#
# Truly required in all tracks (DO NOT mark optional):
#   certificates  - ReconcilerError("CA Certificate not ready") raised in
#                   _request_certificates(), _write_certificates(), and
#                   _create_kubeconfigs() (src/charm.py)
#   kube-control  - _check_kubecontrol_integration(event) called from
#                   _configure_kubelet(), _configure_kubeproxy(), and
#                   _create_kubeconfigs(); each raises ReconcilerError with
#                   WaitingStatus if not ready
#
# Truly required provides in all tracks (DO NOT mark optional):
#   container-runtime (scope: container):
#                   ReconcilerError("container-runtime not established")
#                   if not self.container_runtime.relations
#   cni           (scope: container):
#                   ReconcilerError("CNI relation not established") unless
#                   config ignore-missing-cni=true (defaults to required)
overrides:

  # -- 1.23 track (legacy reactive charm) ------------------------------------
  # Endpoint set includes kube-api-endpoint and the full set of cloud
  # endpoints (aws/azure/gcp/openstack/vsphere/nfs).  No tokens or cos-agent.
  - criteria:
      - track: '1.23'
    requires:
      aws:
        optional: true
        # cloud_integration.py: `if not (cloud := self.cloud): return None`
        # + `if not cloud.relation: return` - entirely skipped with no relation
      azure:
        optional: true
        # same cloud_integration.py pattern as aws
      gcp:
        optional: true
        # same cloud_integration.py pattern as aws
      kube-api-endpoint:
        optional: true
        # Superseded by kube-control in 1.29+; in 1.23-1.28 used to discover
        # the API server address, but not blocking - charm continues without it
      nfs:
        optional: true
        # NFS storage integration; purely additive
      openstack:
        optional: true
        # same cloud_integration.py pattern as aws
      vsphere:
        optional: true
        # same cloud_integration.py pattern as aws
    provides:
      ingress-proxy:
        optional: true
        # Only configured when config option `ingress=true`
      nrpe-external-master:
        optional: true
        # Legacy NRPE monitoring; only activated when relation is present
    constraints:
      # Container-runtime subordinate must be on the same track as this charm.
      - 'tracks(charms(endpoint[container-runtime])) <= tracks({self})'
      # CNI plugin subordinate must be on the same track.
      - 'tracks(charms(endpoint[cni])) <= tracks({self})'

  # -- 1.24-1.28 tracks (legacy reactive charm) ------------------------------
  # Same endpoint set as 1.23 but with `scrape` (Prometheus) added to provides.
  # Uses any_of because criteria entries are AND-ed; OR logic requires any_of.
  - criteria:
      - any_of:
          - track: '1.24'
          - track: '1.25'
          - track: '1.26'
          - track: '1.27'
          - track: '1.28'
    requires:
      aws:
        optional: true
      azure:
        optional: true
      gcp:
        optional: true
      kube-api-endpoint:
        optional: true
      nfs:
        optional: true
      openstack:
        optional: true
      vsphere:
        optional: true
    provides:
      ingress-proxy:
        optional: true
      nrpe-external-master:
        optional: true
      scrape:
        optional: true
        # Prometheus scrape endpoint; only active when related
    constraints:
      # Container-runtime subordinate must be on the same track as this charm.
      - 'tracks(charms(endpoint[container-runtime])) <= tracks({self})'
      # CNI plugin subordinate must be on the same track.
      - 'tracks(charms(endpoint[cni])) <= tracks({self})'

  # -- Legacy reactive charm still served on 16.04, regardless of track ------
  # Charmhub confirms tracks 1.29+ still publish a 16.04 base whose revision
  # is the pre-rewrite reactive charm (same metadata shape as the 1.23 track),
  # not the ops-based rewrite. Matched by ubuntu_version (no track filter) so
  # it takes priority over the 1.29/1.30+ blocks below for any track whenever
  # the resolved base is 16.04.
  # Evidence: `refresh` against kubernetes-worker channel 1.31/stable and
  # 1.32/stable with base 16.04/amd64 both resolve revision 10 (the same
  # revision served for the 1.23 track), which lacks cos-agent/tokens and has
  # kube-api-endpoint instead.
  - criteria:
      - ubuntu_version: '16.04'
    requires:
      aws:
        optional: true
      azure:
        optional: true
      gcp:
        optional: true
      kube-api-endpoint:
        optional: true
      nfs:
        optional: true
      openstack:
        optional: true
      vsphere:
        optional: true
    provides:
      ingress-proxy:
        optional: true
      nrpe-external-master:
        optional: true
    constraints:
      - 'tracks(charms(endpoint[container-runtime])) <= tracks({self})'
      - 'tracks(charms(endpoint[cni])) <= tracks({self})'

  # -- Legacy reactive charm (with scrape) still served on 18.04 -------------
  # Same rationale as the 16.04 block above, but 18.04 revisions under tracks
  # 1.29+ resolve to the "1.24-1.28 generation" (adds `scrape`), not the 16.04
  # generation and not the ops rewrite.
  # Evidence: `refresh` against kubernetes-worker channel 1.31/stable and
  # 1.32/stable with base 18.04/amd64 both resolve revision 77, whose
  # provides/requires exactly match the 1.24-1.28 block above.
  - criteria:
      - ubuntu_version: '18.04'
    requires:
      aws:
        optional: true
      azure:
        optional: true
      gcp:
        optional: true
      kube-api-endpoint:
        optional: true
      nfs:
        optional: true
      openstack:
        optional: true
      vsphere:
        optional: true
    provides:
      ingress-proxy:
        optional: true
      nrpe-external-master:
        optional: true
      scrape:
        optional: true
    constraints:
      - 'tracks(charms(endpoint[container-runtime])) <= tracks({self})'
      - 'tracks(charms(endpoint[cni])) <= tracks({self})'

  # -- 1.29 track (ops rewrite; azure/gcp absent in this generation) ---------
  # Major rewrite dropped the old reactive cloud endpoints and kube-api-endpoint.
  # azure and gcp are not present in this track's charmcraft.yaml metadata.
  # Only reached for bases other than 16.04/18.04 (see blocks above), which
  # is where this track actually serves the rewritten ops charm.
  - criteria:
      - track: '1.29'
    requires:
      aws:
        optional: true
    provides:
      cos-agent:
        optional: true
        # COSAgentProvider registered but never asserted in the reconcile loop
      ingress-proxy:
        optional: true
    constraints:
      # Container-runtime subordinate must be on the same track as this charm.
      - 'tracks(charms(endpoint[container-runtime])) <= tracks({self})'
      # CNI plugin subordinate must be on the same track.
      - 'tracks(charms(endpoint[cni])) <= tracks({self})'

  # -- 1.30+ tracks (ops charm; azure and gcp restored as optional) ----------
  # Only reached for bases other than 16.04/18.04 (see blocks above), which
  # is where these tracks actually serve the rewritten ops charm.
  - requires:
      aws:
        optional: true
      azure:
        optional: true
      gcp:
        optional: true
    provides:
      cos-agent:
        optional: true
      ingress-proxy:
        optional: true
    constraints:
      # Container-runtime subordinate must be on the same track as this charm.
      - 'tracks(charms(endpoint[container-runtime])) <= tracks({self})'
      # CNI plugin subordinate must be on the same track.
      - 'tracks(charms(endpoint[cni])) <= tracks({self})'
