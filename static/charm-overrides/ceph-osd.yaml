---
# ceph-osd: Source: https://github.com/canonical/ceph-charms/tree/main/ceph-osd
#
# mon (requires): REQUIRED - connects to ceph-mon:osd for bootstrap/auth.
# secrets-storage (requires): optional - only when osd-encrypt=True + vault.
# nrpe-external-master (provides): optional - monitoring only.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - requires:
      secrets-storage:
        optional: true
    provides:
      nrpe-external-master:
        optional: true
    assumes: [unsupported-openstack]
