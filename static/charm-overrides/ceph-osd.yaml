---
# Override for ceph-osd
# Source: https://github.com/canonical/ceph-charms/tree/main/ceph-osd
# Upstream PR: https://github.com/canonical/ceph-charms/pull/185
#
# Endpoint set is identical across all stable tracks; no criteria blocks needed.
#
# mon (requires): REQUIRED - connects to ceph-mon:osd for bootstrap keys and
#   cluster auth. The charm cannot join the cluster without this relation.
#
# secrets-storage (requires): optional - only used when osd-encrypt=True and
#   osd-encrypt-keymanager=vault. Gated entirely behind use_vaultlocker();
#   off by default.
#
# nrpe-external-master (provides): optional - NRPE monitoring only;
#   activates on relation events, no blocking when absent.
# listed: false -- OpenStack charms require a dedicated OpenStack substrate
#   to deploy and test. They are excluded from automated bundle building to
#   prevent pipeline congestion.
listed: false
overrides:
  - requires:
      secrets-storage:
        optional: true
    provides:
      nrpe-external-master:
        optional: true
