---
# When client-cas or oauth is integrated, certificates is also required.
# When zookeeper is integrated (pre-track-4 and latest/* non-stable), certificates is also required.
# Track 4 is KRaft mode - the zookeeper endpoint no longer exists.
# See: https://github.com/canonical/charm-integration-testing/issues/408
#
# latest/stable's zookeeper endpoint must be pinned to a same-track (legacy)
# zookeeper-k8s partner, or an unpinned CMR neighbor defaults to the
# incompatible track-3 zookeeper-k8s and blocks waiting for certificates.
# See: https://github.com/canonical/charm-integration-testing/issues/760
overrides:
  - criteria:
      - track: '4'
    requires:
      certificates:
        optional: true
      client-cas:
        optional: true
    configs:
      roles: ['broker,controller', 'broker']
    constraints:
      - 'bool(endpoint[client-cas]) or bool(endpoint[oauth]) => bool(endpoint[certificates])'
      - 'bool(endpoint[peer-cluster]) => config[roles] == "broker"'
      - 'not bool(endpoint[peer-cluster]) => config[roles] == "broker,controller"'
      # A broker only knows how to reach a KRaft controller of the same track;
      # a track-3 (ZooKeeper) peer-cluster-orchestrator has no 'controller' role
      # and cannot serve as one, leaving the broker blocked with "application
      # needs to be related with a KRaft controller".
      # See: https://github.com/canonical/charm-integration-testing/issues/751
      - 'bool(endpoint[peer-cluster]) => tracks(charms(endpoint[peer-cluster])) ==
        tracks({self})'

  # latest/stable is on ubuntu/20.04 (EOL April 2025). It uses the old 'kafka'
  # interface name (renamed to 'kafka-client' in track 3). No public Charmhub
  # charm still requires the old 'kafka' interface, so mark it optional.
  - criteria:
      - track: 'latest'
        risk: 'stable'
    provides:
      kafka:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      zookeeper:
        optional: false
    constraints:
      # zookeeper-k8s track 3 is a different implementation (rock-based, modern
      # security model) than the legacy zookeeper-k8s 'latest' track this legacy
      # kafka-k8s pairs with. Without this, the solver defaults an unpinned
      # zookeeper-k8s neighbor to its published default channel (3/stable),
      # producing an incompatible deployment where kafka-k8s never gets the
      # certificates relation it would need with a track-3 partner and blocks.
      # Same failure category as the peer-cluster track mismatch above.
      # See: https://github.com/canonical/charm-integration-testing/issues/760
      - 'tracks(charms(endpoint[zookeeper])) == tracks({self})'

  # latest/* (except stable): has kafka-client interface (like track 3) but fewer endpoints.
  # ubuntu/22.04, simpler endpoint set than track 3.
  - criteria:
      - track: 'latest'
        none_of:
          - risk: stable
    provides:
      kafka-client:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      certificates:
        optional: true
      zookeeper:
        features: [tls]
    constraints:
      # When zookeeper is serving kafka (zookeeper endpoint is integrated), TLS
      # must be enabled on both kafka and zookeeper for secure operation.
      # See: https://github.com/canonical/charm-integration-testing/issues/309
      - "bool(endpoint[zookeeper]) => bool(endpoint[certificates])"
      - 'bool(endpoint[certificates]) == ("tls" in features(endpoint[zookeeper]))'

  # Pre-track-4: zookeeper endpoint exists and also requires certificates when integrated
  # provides endpoints are not yet optional upstream in published track 3 revisions
  - criteria:
      - track: '3'
    provides:
      kafka-client:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      peer-cluster-orchestrator:
        optional: true
    requires:
      certificates:
        optional: true
      zookeeper:
        features: [tls]
      oauth:
        features: [tls]
    constraints:
      # When zookeeper is serving kafka (zookeeper endpoint is integrated), TLS must
      # be enabled on both kafka and zookeeper for secure operation.
      # See: https://github.com/canonical/charm-integration-testing/issues/309
      - "bool(endpoint[zookeeper]) => bool(endpoint[certificates])"
      - 'bool(endpoint[certificates]) == ("tls" in features(endpoint[zookeeper]))'
      # peer-cluster-orchestrator's role semantics differ between tracks (e.g. only
      # track-4 orchestrators can run KRaft controller mode), so a broker must only
      # relate to an orchestrator of its own track.
      # See: https://github.com/canonical/charm-integration-testing/issues/751
      - 'bool(endpoint[peer-cluster]) => tracks(charms(endpoint[peer-cluster])) ==
        tracks({self})'
