---
# Source: https://github.com/canonical/kafka-operator
# Track 4 uses KRaft; older tracks retain ZooKeeper and legacy endpoints.
overrides:
  - criteria:
      - track: '4'
    requires:
      client-cas:
        optional: true  # TLSHandler handles absent CA transfer; only used for optional client mTLS.
      oauth:
        features: [tls]
    configs:
      roles: ['broker,controller', 'broker', 'controller']
    constraints:
      # TLSHandler._on_mtls_client_certificates_available defers without client TLS.
      - 'bool(endpoint[client-cas]) => bool(endpoint[certificates])'
      # ClusterState.ready_to_start and _controller_status enforce these split-role dependencies.
      - 'bool(endpoint[peer-cluster]) => config[roles] == "controller"'
      - 'bool(endpoint[peer-cluster-orchestrator]) => config[roles] == "broker"'
      - 'not bool(endpoint[peer-cluster]) and not bool(endpoint[peer-cluster-orchestrator])
        => config[roles] == "broker,controller"'
      # Check coverage as well as compatibility: external offers have no known track.
      - 'bool(endpoint[peer-cluster]) => tracks(charms(endpoint[peer-cluster])) >=
        tracks({self}) and tracks(charms(endpoint[peer-cluster])) <= tracks({self})'
      - 'bool(endpoint[peer-cluster-orchestrator]) => tracks(charms(endpoint[peer-cluster-orchestrator]))
        >= tracks({self}) and tracks(charms(endpoint[peer-cluster-orchestrator]))
        <= tracks({self})'

  # latest/stable is on ubuntu/20.04 (EOL April 2025). It uses the old 'kafka'
  # interface name (renamed to 'kafka-client' in track 3). No public Charmhub
  # charm still requires the old 'kafka' interface, so mark it optional.
  - criteria:
      - track: 'latest'
        risk: 'stable'
    provides:
      kafka:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      zookeeper:
        optional: false

  # The Ubuntu 20.04 edge revision predates observability endpoints.
  - criteria:
      - all_of:
          - track: 'latest'
          - ubuntu_version: '20.04'
          - none_of:
              - risk: stable
    provides:
      kafka-client:
        optional: true  # KafkaCharm._on_start requires ZooKeeper, not related clients.
    requires:
      certificates:
        optional: true  # KafkaCharm._on_config_changed permits matching non-TLS ZooKeeper.
      zookeeper:
        features: [tls]
    constraints:
      - 'bool(endpoint[zookeeper]) => bool(endpoint[certificates])'
      - 'bool(endpoint[certificates]) == ("tls" in features(endpoint[zookeeper]))'

  # Newer latest/* revisions add observability endpoints on Ubuntu 22.04.
  - criteria:
      - track: 'latest'
        none_of:
          - risk: stable
    provides:
      kafka-client:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      certificates:
        optional: true
      zookeeper:
        features: [tls]
    constraints:
      # When zookeeper is serving kafka (zookeeper endpoint is integrated), TLS
      # must be enabled on both kafka and zookeeper for secure operation.
      # See: https://github.com/canonical/charm-integration-testing/issues/309
      - "bool(endpoint[zookeeper]) => bool(endpoint[certificates])"
      - 'bool(endpoint[certificates]) == ("tls" in features(endpoint[zookeeper]))'

  # Pre-track-4: zookeeper endpoint exists and also requires certificates when integrated
  # provides endpoints are not yet optional upstream in published track 3 revisions
  - criteria:
      - track: '3'
    provides:
      kafka-client:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      peer-cluster-orchestrator:
        optional: true
    requires:
      certificates:
        optional: true
      zookeeper:
        features: [tls]
      oauth:
        features: [tls]
    constraints:
      # When zookeeper is serving kafka (zookeeper endpoint is integrated), TLS must
      # be enabled on both kafka and zookeeper for secure operation.
      # See: https://github.com/canonical/charm-integration-testing/issues/309
      - "bool(endpoint[zookeeper]) => bool(endpoint[certificates])"
      - 'bool(endpoint[certificates]) == ("tls" in features(endpoint[zookeeper]))'
      # peer-cluster-orchestrator's role semantics differ between tracks (e.g. only
      # track-4 orchestrators can run KRaft controller mode), so a broker must only
      # relate to an orchestrator of its own track.
      # See: https://github.com/canonical/charm-integration-testing/issues/751
      - 'bool(endpoint[peer-cluster]) => tracks(charms(endpoint[peer-cluster])) ==
        tracks({self})'
