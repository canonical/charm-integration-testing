---
# Source: https://github.com/canonical/superset-k8s-operator
overrides:
  - criteria:
      - track: latest
      - risk: edge
    provides:
      grafana-dashboard:
        optional: true  # observability hook; charm reaches active without it
      metrics-endpoint:
        optional: true  # observability hook; charm reaches active without it
  - requires:
      nginx-route:
        optional: true
    provides:
      grafana-dashboard:
        optional: true
      metrics-endpoint:
        optional: true
    configs:
      superset-secret-key: ["thisISaSECRET_1234"]
    constraints:
      - 'set(config[superset-secret-key])'
