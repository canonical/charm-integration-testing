---
# Source: https://github.com/canonical/superset-k8s-operator
overrides:
  - criteria:
      - any_of:
          - track: '5'
          - track: '6'
          - all_of:
              - track: latest
              - risk: stable
    requires:
      nginx-route:
        optional: true
    provides:
      grafana-dashboard:
        optional: true
      metrics-endpoint:
        optional: true
    configs:
      superset-secret-key: ["thisISaSECRET_1234"]
    constraints:
      - 'set(config[superset-secret-key])'
