---
# Source: https://github.com/canonical/superset-k8s-operator
overrides:
  # Track 6 uses `ingress`; only tracks 5 and latest/stable have `nginx-route`.
  - criteria:
      - any_of:
          - track: '5'
          - all_of:
              - track: latest
              - risk: stable
    requires:
      nginx-route:
        optional: true
    provides:
      grafana-dashboard:
        optional: true
      metrics-endpoint:
        optional: true
    configs:
      superset-secret-key: ["thisISaSECRET_1234"]
    constraints:
      - 'set(config[superset-secret-key])'
