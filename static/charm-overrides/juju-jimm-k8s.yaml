---
# Track 1 predates receive-ca-cert, oauth, ingress-ssh, internal-ingress, logging
# (requires), and postgres-secret-storage, public-key, private-key (configs).
# Track 2 adds openfga (requires), postgres-secret-storage, public-key, private-key (configs).
# Track 3 adds receive-ca-cert, oauth, ingress-ssh, internal-ingress, logging (requires),
# drops candid-*/nagios configs, and adds cors/session/ssh configs (all have defaults;
# uuid/public-key/private-key/dns-name/postgres-secret-storage are still required).
# Fallback block (no criteria) covers track 3 and any future tracks automatically.
overrides:
  # track 1: no openfga, oauth, receive-ca-cert, ingress-ssh, internal-ingress, logging;
  # vault is present in track 1
  - criteria:
      - track: '1'
    requires:
      ingress:
        optional: true
      nginx-route:
        optional: true
      vault:
        optional: true
    provides:
      dashboard:
        optional: true
      grafana-dashboard:
        optional: true
      metrics-endpoint:
        optional: true
    configs:
      uuid: ['aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa']
      dns-name: ['jimm-test.local']
  # track 2: has openfga but not oauth, receive-ca-cert, ingress-ssh, internal-ingress, logging
  - criteria:
      - track: '2'
    requires:
      openfga: {}
      ingress:
        optional: true
      nginx-route:
        optional: true
      vault:
        optional: true
    provides:
      dashboard:
        optional: true
      grafana-dashboard:
        optional: true
      metrics-endpoint:
        optional: true
    configs:
      uuid: ['aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa']
      public-key: ['pE8oX25fmNPzg7i195spacUxTPLpioiSv/BG9FLgtDY=']
      private-key: ['SdAKRHy3LW7vkmXFhOPTM43kwhgcot0mZrHX8rkHDlM=']
      dns-name: ['jimm-test.local']
      postgres-secret-storage: [true, null]
    constraints:
      # postgres-secret-storage is required when vault is not used for secret storage
      - 'not bool(endpoint[vault]) => set(config[postgres-secret-storage])'
  # track 3+ (default): full endpoint set including oauth, openfga, receive-ca-cert
  - requires:
      receive-ca-cert:
        optional: false
      oauth:
        optional: false
        features: [tls]
      openfga:
        optional: false
      ingress:
        optional: true
      ingress-ssh:
        optional: true
      internal-ingress:
        optional: true
      nginx-route:
        optional: true
      logging:
        optional: true
      vault:
        optional: true
    provides:
      dashboard:
        optional: true
      grafana-dashboard:
        optional: true
      metrics-endpoint:
        optional: true
    configs:
      uuid: ['aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa']
      public-key: ['pE8oX25fmNPzg7i195spacUxTPLpioiSv/BG9FLgtDY=']
      private-key: ['SdAKRHy3LW7vkmXFhOPTM43kwhgcot0mZrHX8rkHDlM=']
      dns-name: ['jimm-test.local']
      postgres-secret-storage: [true, null]
    constraints:
      # If the oauth integration uses tls, the cert chain must be rooted in receive-ca-cert
      - '"tls" in features(endpoint[oauth]) => reachable(endpoint[receive-ca-cert])
        >= charms(endpoint[oauth])'
      # postgres-secret-storage is required when vault is not used for secret storage
      - 'not bool(endpoint[vault]) => set(config[postgres-secret-storage])'
