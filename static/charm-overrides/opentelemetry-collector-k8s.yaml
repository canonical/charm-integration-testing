---
# Source: https://github.com/canonical/opentelemetry-collector-k8s-operator
# Endpoint generations differ in CMR mesh and OTLP support; preserve telemetry pipeline pairing.
overrides:
  # track 1: no CMR mesh; metrics-endpoint and receive-loki-logs as incoming; send-otlp absent
  - criteria:
      - track: "1"
    requires:
      grafana-dashboards-consumer:
        optional: true  # charm.py::_get_missing_mandatory_relations only gates connected dashboards.
    provides:
      grafana-dashboards-provider:
        optional: true  # charm.py::_get_missing_mandatory_relations allows no dashboard forwarding.
    constraints:
      - 'bool(endpoint[metrics-endpoint]) => bool(endpoint[cloud-config]) or bool(endpoint[send-remote-write])'
      - 'bool(endpoint[receive-loki-logs]) => bool(endpoint[cloud-config]) or bool(endpoint[send-loki-logs])'
      - 'bool(endpoint[grafana-dashboards-consumer]) => bool(endpoint[grafana-dashboards-provider])
        or bool(endpoint[cloud-config])'

  # track 2: CMR mesh present; receive-traces/receive-profiles added; send-otlp still absent
  - criteria:
      - track: "2"
    requires:
      grafana-dashboards-consumer:
        optional: true  # charm.py::_get_missing_mandatory_relations only gates connected dashboards.
      require-cmr-mesh:
        optional: true  # charm.py::_get_missing_mandatory_relations does not require mesh.
      service-mesh:
        optional: true  # ServiceMeshConsumer.enabled is false without a mesh relation.
    provides:
      grafana-dashboards-provider:
        optional: true  # charm.py::_get_missing_mandatory_relations allows no dashboard forwarding.
      provide-cmr-mesh:
        optional: true  # ServiceMeshConsumer adds companion metadata for cross-model telemetry.
    constraints:
      - 'bool(endpoint[metrics-endpoint]) => bool(endpoint[cloud-config]) or bool(endpoint[send-remote-write])'
      - 'bool(endpoint[receive-loki-logs]) => bool(endpoint[cloud-config]) or bool(endpoint[send-loki-logs])'
      - 'bool(endpoint[receive-traces]) => bool(endpoint[cloud-config]) or bool(endpoint[send-traces])'
      - 'bool(endpoint[grafana-dashboards-consumer]) => bool(endpoint[grafana-dashboards-provider])
        or bool(endpoint[cloud-config])'
      - 'charms(cross_model(endpoint[receive-loki-logs] | endpoint[receive-traces]
        | endpoint[receive-profiles])) == charms(cross_model(endpoint[provide-cmr-mesh]))'
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'

  # 0.130/dev add OTLP pipelines; risk-only default channels use Ubuntu 26.04.
  - criteria:
      - any_of:
          - track: '0.130'
          - track: dev
          - track: latest
            ubuntu_version: '26.04'
    requires:
      grafana-dashboards-consumer:
        optional: true  # charm.py::_get_missing_mandatory_relations only gates connected dashboards.
      require-cmr-mesh:
        optional: true  # charm.py::_get_missing_mandatory_relations does not require mesh.
      service-mesh:
        optional: true  # ServiceMeshConsumer.enabled is false without a mesh relation.
    provides:
      grafana-dashboards-provider:
        optional: true  # charm.py::_get_missing_mandatory_relations allows no dashboard forwarding.
      provide-cmr-mesh:
        optional: true  # ServiceMeshConsumer adds companion metadata for cross-model telemetry.
    constraints:
      - 'bool(endpoint[metrics-endpoint]) => bool(endpoint[cloud-config]) or bool(endpoint[send-remote-write])
        or bool(endpoint[send-otlp])'
      - 'bool(endpoint[receive-loki-logs]) => bool(endpoint[cloud-config]) or bool(endpoint[send-loki-logs])
        or bool(endpoint[send-otlp])'
      - 'bool(endpoint[receive-traces]) => bool(endpoint[cloud-config]) or bool(endpoint[send-traces])
        or bool(endpoint[send-otlp])'
      - 'bool(endpoint[grafana-dashboards-consumer]) => bool(endpoint[grafana-dashboards-provider])
        or bool(endpoint[cloud-config])'
      - 'bool(endpoint[receive-otlp]) => bool(endpoint[cloud-config]) or bool(endpoint[send-otlp])
        or bool(endpoint[send-traces]) or bool(endpoint[send-loki-logs]) or bool(endpoint[send-remote-write])'
      - 'charms(cross_model(endpoint[receive-loki-logs] | endpoint[receive-traces]
        | endpoint[receive-profiles])) == charms(cross_model(endpoint[provide-cmr-mesh]))'
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
