---
# Source: https://github.com/canonical/identity-platform-login-ui-operator
#
# Criteria blocks required because old/legacy tracks predate several endpoints:
#   - public-route added Oct 6 2025 (commit 52bd694); absent in tracks istio, 0.4, 0.3, 0.2, 0.1, 0.999
#   - kratos-info absent in tracks 0.2, 0.1, 0.999; receive-ca-cert absent in tracks 0.2, 0.1, 0.999
#   - kratos-endpoint-info is the OLD name for kratos-info in tracks 0.2, 0.1, 0.999
#
# ui-endpoint-info (provides): cyclic: true because hydra and kratos both require
#   ui-endpoint-info from login-ui while login-ui requires hydra-endpoint-info and
#   kratos-info from them. This mutual dependency is intentional - the three charms
#   form the identity platform stack. Also optional: true for old tracks predating
#   upstream PR 282 (merged Jul 1 2025).
#
# kratos-info / hydra-endpoint-info (requires): optional: true in source (charm
#   reaches active without them), but a deployment with neither provides no useful
#   login/consent/registration flows. Constraint enforces that at least one of the
#   two identity backend endpoints is connected.
#
# logging, tracing, receive-ca-cert, metrics-endpoint, grafana-dashboard: optional.
overrides:
  # Tracks 0.1 (rev 78 on /edge), 0.999 (rev 47 on /edge), 0.2 (rev 90 on /edge):
  # old revisions predating kratos-info (renamed from kratos-endpoint-info), receive-ca-cert,
  # and public-route.
  - criteria:
      - any_of:
          - track: '0.1'
          - track: '0.999'
          - track: '0.2'
    provides:
      ui-endpoint-info:
        cyclic: true
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      # old name for kratos-info
      kratos-endpoint-info:
        optional: true
      hydra-endpoint-info:
        optional: true
      logging:
        optional: true
      tracing:
        optional: true
    constraints:
      - 'bool(endpoint[kratos-endpoint-info]) or bool(endpoint[hydra-endpoint-info])'

  # Tracks istio (rev 150 on /edge), 0.3 (rev 190 on /edge), 0.4 (rev 193 on /edge):
  # no public-route backported. All other requires endpoints present.
  - criteria:
      - any_of:
          - track: istio
          - track: '0.3'
          - track: '0.4'
    provides:
      ui-endpoint-info:
        cyclic: true
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      kratos-info:
        optional: true
      hydra-endpoint-info:
        optional: true
      logging:
        optional: true
      tracing:
        optional: true
      receive-ca-cert:
        optional: true
    constraints:
      - 'bool(endpoint[kratos-info]) or bool(endpoint[hydra-endpoint-info])'

  # Fallback: latest, 0.5+, and any future tracks.
  - provides:
      ui-endpoint-info:
        cyclic: true
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      kratos-info:
        optional: true
      hydra-endpoint-info:
        optional: true
      logging:
        optional: true
      tracing:
        optional: true
      receive-ca-cert:
        optional: true
      public-route:
        optional: true
    constraints:
      - 'bool(endpoint[kratos-info]) or bool(endpoint[hydra-endpoint-info])'
