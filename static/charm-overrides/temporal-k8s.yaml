---
# For some reason temporal k8s isn't listed as a provider of `temporal-host-info`
# https://github.com/canonical/temporal-k8s-operator/issues/139
listed: true
# Remove after: https://github.com/canonical/temporal-k8s-operator/pull/117
overrides:
  # Stale 1.31/edge 24.04 build (r75) blocks on ingress without frontend-certificates;
  # later revisions allow ingress without TLS.
  # Remove after: https://github.com/canonical/temporal-k8s-operator/issues/230
  - criteria:
      - track: '1.31'
        risk: edge
        ubuntu_version: '24.04'
    requires: &requires
      frontend-certificates:
        optional: true
        limit: 1
      nginx-route:
        optional: true
        limit: 1
      openfga:
        optional: true
        limit: 1
      s3-parameters:
        optional: true
        limit: 1
      # https://github.com/canonical/temporal-k8s-operator/issues/120
      admin:
        optional: false
        features: [admin]
      ui:
        optional: true
        features: [ui]
    provides: &provides
      metrics-endpoint:
        interface: prometheus_scrape
        optional: true
      grafana-dashboard:
        interface: grafana_dashboard
        optional: true
    configs: &configs
      num-history-shards: [1, 2, 4]
    constraints:
      # ingress requires frontend-certificates (charm.py::_validate_ingress)
      - bool(endpoint[ingress]) => bool(endpoint[frontend-certificates])
      # num-history-shards must be one of the specified values
      - &num_history_shards config[num-history-shards] in {1, 2, 4, 8, 16, 32, 64,
        128, 256, 512, 1024}
      # admin endpoint must negotiate exactly the admin feature
      - &admin_feature bool(endpoint[admin]) => features(endpoint[admin]) == {"admin"}
      # ui endpoint must negotiate exactly the ui feature
      - &ui_feature bool(endpoint[ui]) => features(endpoint[ui]) == {"ui"}
  # 1.31/edge 26.04 adds temporal-external-host-info.
  - criteria:
      - track: '1.31'
        risk: edge
        ubuntu_version: '26.04'
    requires: *requires
    provides: *provides
    configs: *configs
    constraints:
      # temporal-external-host-info requires ingress (charm.py::_external_host_info_status)
      - bool(endpoint[temporal-external-host-info]) => bool(endpoint[ingress])
      - *num_history_shards
      - *admin_feature
      - *ui_feature
  # Published tracks share the versioned endpoint generation.
  - requires: *requires
    provides: *provides
    configs: *configs
    constraints:
      - *num_history_shards
      - *admin_feature
      - *ui_feature
