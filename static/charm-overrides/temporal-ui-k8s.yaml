---
overrides:
  - provides:
      # https://github.com/canonical/temporal-k8s-operator/issues/120
      ui:
        limit: 1
        optional: false
        features: [ui]
    requires:
      nginx-route:
        optional: true
      temporal-host-info:
        cyclic: true
    constraints:
      # ui endpoint must use ui feature
      - 'bool(endpoint[ui]) => features(endpoint[ui]) == {"ui"}'
      # temporal-host-info must be provided by a charm that also provides an ui endpoint
      - 'charms(endpoint[temporal-host-info]) == charms(endpoint[ui])'
