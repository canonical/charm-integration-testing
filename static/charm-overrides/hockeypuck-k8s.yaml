---
# Source: https://github.com/canonical/hockeypuck-k8s-operator
#
# charmcraft's go-framework extension (extensions/app.py::_AppBase) omits optional:true here;
# PyPI pkg paas-charm's paas_charm/charm.py::Charm.is_ready() never gates on any of them.
overrides:
  # metrics-port is absent from charm config on 2.2/edge Ubuntu 26.04.
  - criteria:
      - ubuntu_version: '24.04'
    configs:
      metrics-port: [9626]  # workaround for https://github.com/canonical/hockeypuck-k8s-operator/issues/229 which will not be worked on
    requires:
      ingress:
        optional: true  # paas_charm/charm.py Charm._base_url: falls back to plain K8s service URL when unset
      logging:
        optional: true  # paas_charm/charm.py Charm._missing_required_integrations(): omitted
    provides:
      grafana-dashboard:
        optional: true  # COS hook; paas_charm/charm.py never gates on it, charm has no dashboard logic of its own
      metrics-endpoint:
        optional: true  # COS hook; paas_charm/charm.py never gates on it, charm has no metrics logic of its own
  - requires:
      ingress:
        optional: true  # paas_charm/charm.py Charm._base_url: falls back to plain K8s service URL when unset
      logging:
        optional: true  # paas_charm/charm.py Charm._missing_required_integrations(): omitted
    provides:
      grafana-dashboard:
        optional: true  # COS hook; paas_charm/charm.py never gates on it, charm has no dashboard logic of its own
      metrics-endpoint:
        optional: true  # COS hook; paas_charm/charm.py never gates on it, charm has no metrics logic of its own
