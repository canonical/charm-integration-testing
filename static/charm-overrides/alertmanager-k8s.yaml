---
# Source: https://github.com/canonical/alertmanager-k8s-operator
#
# Track 1 already has all optional: true flags set upstream, and does not define the service-mesh / require-cmr-mesh / provide-cmr-mesh endpoints.
# Tracks 2, dev and 0.31 define service-mesh, require-cmr-mesh (requires) and
# provide-cmr-mesh (provides) without optional: true.
#
# require-cmr-mesh (requires): optional - CMR mesh cross-model access, secondary to alertmanager's core alerting purpose
# service-mesh (requires): optional - Istio service mesh integration, secondary to core alerting
# provide-cmr-mesh (provides): optional - CMR mesh consumer hook, secondary to core alerting
#
# provide-cmr-mesh must track alerting/grafana-source/self-metrics-endpoint's cross-model status; see GH-980.
overrides:
  - criteria:
      - any_of:
          - track: '2'
          - track: dev
          - track: '0.31'
    requires:
      require-cmr-mesh:
        optional: true
      service-mesh:
        optional: true
    provides:
      provide-cmr-mesh:
        optional: true
    constraints:
      - 'charms(cross_model(endpoint[alerting] | endpoint[grafana-source] | endpoint[self-metrics-endpoint]))
        == charms(cross_model(endpoint[provide-cmr-mesh]))'
      # charms/bool/len equality together confirm the same real CMR; see GH-980 and CrossModelExpr's docstring.
      - 'bool(cross_model(endpoint[alerting] | endpoint[grafana-source] | endpoint[self-metrics-endpoint]))
        == bool(cross_model(endpoint[provide-cmr-mesh]))'
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
