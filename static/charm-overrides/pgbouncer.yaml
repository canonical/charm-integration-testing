---
# pgbouncer is a PostgreSQL connection pooler.
# Primary purpose: accepts database connections from app charms (db/db-admin/
# database provides) and proxies them to a backend PostgreSQL (backend-database
# requires).
#
# cos-agent (provides) - OPTIONAL: COS monitoring integration; charm still pools
#   connections without it.
# ha (requires) - OPTIONAL: hacluster HA integration; standalone mode works.
# certificates (requires) - OPTIONAL: TLS for client connections; non-TLS works.
# tracing (requires) - OPTIONAL: OpenTelemetry tracing; observability addon.
#
# backend-database (requires) - REQUIRED: pgbouncer's primary purpose is pooling
#   connections to a PostgreSQL backend. Not marked optional here.
#
# latest/* is an older track with different metadata (backend-db-admin,
# nrpe-external-master, pgbouncer-extra-config).
overrides:
  # latest/*: older track - different endpoint set; no backend-database
  - criteria:
      - track: 'latest'
    requires:
      ha:
        optional: true
    provides:
      nrpe-external-master:
        optional: true
  # track 1 and future tracks: backend-database required; cos-agent optional
  - provides:
      cos-agent:
        optional: true
      database:
        features: &extensions [address_standardizer, address_standardizer_data_us,
          pgaudit, bloom, bool_plperl, btree_gin, btree_gist, citext, cube, debversion,
          dict_int, dict_xsyn, earthdistance, fuzzystrmatch, hll, hstore, hypopg,
          icu_ext, intarray, ip4r, isn, jsonb_plperl, lo, ltree, old_snapshot, orafce,
          pg_freespacemap, pg_similarity, pg_stat_statements, pg_trgm, pg_visibility,
          pgrowlocks, pgstattuple, plperl, plpython3u, pltcl, postgis, postgis_raster,
          postgis_tiger_geocoder, postgis_topology, prefix, rdkit, seg, spi, tablefunc,
          tcn, tds_fdw, timescaledb, tsm_system_rows, tsm_system_time, unaccent, uuid-ossp,
          vector]
    requires:
      backend-database:
        features: *extensions
      ha:
        optional: true
      certificates:
        optional: true
      tracing:
        optional: true
    constraints:
      - '("address_standardizer" in features(endpoint[database])) == ("address_standardizer"
        in features(endpoint[backend-database]))'
      - '("address_standardizer_data_us" in features(endpoint[database])) == ("address_standardizer_data_us"
        in features(endpoint[backend-database]))'
      - '("pgaudit" in features(endpoint[database])) == ("pgaudit" in features(endpoint[backend-database]))'
      - '("bloom" in features(endpoint[database])) == ("bloom" in features(endpoint[backend-database]))'
      - '("bool_plperl" in features(endpoint[database])) == ("bool_plperl" in features(endpoint[backend-database]))'
      - '("btree_gin" in features(endpoint[database])) == ("btree_gin" in features(endpoint[backend-database]))'
      - '("btree_gist" in features(endpoint[database])) == ("btree_gist" in features(endpoint[backend-database]))'
      - '("citext" in features(endpoint[database])) == ("citext" in features(endpoint[backend-database]))'
      - '("cube" in features(endpoint[database])) == ("cube" in features(endpoint[backend-database]))'
      - '("debversion" in features(endpoint[database])) == ("debversion" in features(endpoint[backend-database]))'
      - '("dict_int" in features(endpoint[database])) == ("dict_int" in features(endpoint[backend-database]))'
      - '("dict_xsyn" in features(endpoint[database])) == ("dict_xsyn" in features(endpoint[backend-database]))'
      - '("earthdistance" in features(endpoint[database])) == ("earthdistance" in
        features(endpoint[backend-database]))'
      - '("fuzzystrmatch" in features(endpoint[database])) == ("fuzzystrmatch" in
        features(endpoint[backend-database]))'
      - '("hll" in features(endpoint[database])) == ("hll" in features(endpoint[backend-database]))'
      - '("hstore" in features(endpoint[database])) == ("hstore" in features(endpoint[backend-database]))'
      - '("hypopg" in features(endpoint[database])) == ("hypopg" in features(endpoint[backend-database]))'
      - '("icu_ext" in features(endpoint[database])) == ("icu_ext" in features(endpoint[backend-database]))'
      - '("intarray" in features(endpoint[database])) == ("intarray" in features(endpoint[backend-database]))'
      - '("ip4r" in features(endpoint[database])) == ("ip4r" in features(endpoint[backend-database]))'
      - '("isn" in features(endpoint[database])) == ("isn" in features(endpoint[backend-database]))'
      - '("jsonb_plperl" in features(endpoint[database])) == ("jsonb_plperl" in features(endpoint[backend-database]))'
      - '("lo" in features(endpoint[database])) == ("lo" in features(endpoint[backend-database]))'
      - '("ltree" in features(endpoint[database])) == ("ltree" in features(endpoint[backend-database]))'
      - '("old_snapshot" in features(endpoint[database])) == ("old_snapshot" in features(endpoint[backend-database]))'
      - '("orafce" in features(endpoint[database])) == ("orafce" in features(endpoint[backend-database]))'
      - '("pg_freespacemap" in features(endpoint[database])) == ("pg_freespacemap"
        in features(endpoint[backend-database]))'
      - '("pg_similarity" in features(endpoint[database])) == ("pg_similarity" in
        features(endpoint[backend-database]))'
      - '("pg_stat_statements" in features(endpoint[database])) == ("pg_stat_statements"
