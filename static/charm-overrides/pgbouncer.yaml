---
# pgbouncer is a PostgreSQL connection pooler.
# Primary purpose: accepts database connections from app charms (db/db-admin/
# database provides) and proxies them to a backend PostgreSQL (backend-database
# requires).
#
# cos-agent (provides) - OPTIONAL: COS monitoring integration; charm still pools
#   connections without it.
# ha (requires) - OPTIONAL: hacluster HA integration; standalone mode works.
# certificates (requires) - OPTIONAL: TLS for client connections; non-TLS works.
# tracing (requires) - OPTIONAL: OpenTelemetry tracing; observability addon.
#
# backend-database (requires) - REQUIRED: pgbouncer's primary purpose is pooling
#   connections to a PostgreSQL backend. Not marked optional here.
#
# latest/* is an older track with different metadata (backend-db-admin,
# nrpe-external-master, pgbouncer-extra-config).
overrides:
  # latest/*: older track - different endpoint set; no backend-database
  - criteria:
      - track: 'latest'
    requires:
      ha:
        optional: true
    provides:
      nrpe-external-master:
        optional: true
  # track 1 and future tracks: backend-database required; cos-agent optional
  - provides:
      cos-agent:
        optional: true
      database:
        features: &extensions [plugin_address_standardizer, plugin_address_standardizer_data_us,
          plugin_pgaudit, plugin_bloom, plugin_bool_plperl, plugin_btree_gin, plugin_btree_gist,
          plugin_citext, plugin_cube, plugin_debversion, plugin_dict_int, plugin_dict_xsyn,
          plugin_earthdistance, plugin_fuzzystrmatch, plugin_hll, plugin_hstore, plugin_hypopg,
          plugin_icu_ext, plugin_intarray, plugin_ip4r, plugin_isn, plugin_jsonb_plperl,
          plugin_lo, plugin_ltree, plugin_old_snapshot, plugin_orafce, plugin_pg_freespacemap,
          plugin_pg_similarity, plugin_pg_stat_statements, plugin_pg_trgm, plugin_pg_visibility,
          plugin_pgrowlocks, plugin_pgstattuple, plugin_plperl, plugin_plpython3u,
          plugin_pltcl, plugin_postgis, plugin_postgis_raster, plugin_postgis_tiger_geocoder,
          plugin_postgis_topology, plugin_prefix, plugin_rdkit, plugin_seg, plugin_spi,
          plugin_tablefunc, plugin_tcn, plugin_tds_fdw, plugin_timescaledb, plugin_tsm_system_rows,
          plugin_tsm_system_time, plugin_unaccent, plugin_uuid-ossp, plugin_vector]
    requires:
      backend-database:
        features: *extensions
      ha:
        optional: true
      certificates:
        optional: true
      tracing:
        optional: true
    constraints:
      - '("plugin_address_standardizer" in features(endpoint[database])) == ("plugin_address_standardizer"
        in features(endpoint[backend-database]))'
      - '("plugin_address_standardizer_data_us" in features(endpoint[database])) ==
        ("plugin_address_standardizer_data_us" in features(endpoint[backend-database]))'
      - '("plugin_pgaudit" in features(endpoint[database])) == ("plugin_pgaudit" in
        features(endpoint[backend-database]))'
      - '("plugin_bloom" in features(endpoint[database])) == ("plugin_bloom" in features(endpoint[backend-database]))'
      - '("plugin_bool_plperl" in features(endpoint[database])) == ("plugin_bool_plperl"
        in features(endpoint[backend-database]))'
      - '("plugin_btree_gin" in features(endpoint[database])) == ("plugin_btree_gin"
        in features(endpoint[backend-database]))'
      - '("plugin_btree_gist" in features(endpoint[database])) == ("plugin_btree_gist"
        in features(endpoint[backend-database]))'
      - '("plugin_citext" in features(endpoint[database])) == ("plugin_citext" in
        features(endpoint[backend-database]))'
      - '("plugin_cube" in features(endpoint[database])) == ("plugin_cube" in features(endpoint[backend-database]))'
      - '("plugin_debversion" in features(endpoint[database])) == ("plugin_debversion"
        in features(endpoint[backend-database]))'
      - '("plugin_dict_int" in features(endpoint[database])) == ("plugin_dict_int"
