---
# Source: https://github.com/canonical/mysql-operators (machines/)
# 8.0 upstream has all provides optional=None; all marked optional here so the solver
# can choose the access interface. Legacy interfaces (db-router, mysql, shared-db)
# were removed in 8.4.
overrides:
  - criteria:
      - track: "8.0"
    provides:
      cos-agent:
        optional: true
      database:
        optional: true
        features: [mysql-server]
      db-router:
        optional: true
      mysql:
        optional: true
      replication-offer:
        optional: true
      shared-db:
        optional: true
    constraints:
      # database/mysql/db-router/shared-db are mutually exclusive; a replica (requires:
      # replication connected) serves no clients directly, so all must be 0 instead of 1.
      - 'bool(endpoint[replication]) => len(endpoint[database]) + len(endpoint[mysql])
        + len(endpoint[db-router]) + len(endpoint[shared-db]) == 0'
      - 'not bool(endpoint[replication]) => len(endpoint[database]) + len(endpoint[mysql])
        + len(endpoint[db-router]) + len(endpoint[shared-db]) == 1'
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'

    # Default block: covers 8.4 and any future tracks.
    # cos-agent and replication-offer are already optional upstream in 8.4.
  - provides:
      database:
        features: [mysql-server]
        optional: true
    constraints:
      # a replica (requires: replication connected) serves no clients directly
      - 'bool(endpoint[replication]) => len(endpoint[database]) == 0'
      - 'not bool(endpoint[replication]) => len(endpoint[database]) == 1'
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'
