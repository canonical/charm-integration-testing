---
# keystone: Source: https://github.com/openstack/charm-keystone
#
# identity-service (provides): REQUIRED - all OpenStack services connect here.
# shared-db (requires): REQUIRED (see REQUIRED_INTERFACES in hooks/keystone_utils.py).
# All other requires/provides: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - provides:
      nrpe-external-master:
        optional: true
      identity-admin:
        optional: true
      identity-notifications:
        optional: true
      identity-credentials:
        optional: true
    requires:
      ha:
        optional: true
      domain-backend:
        optional: true
      keystone-fid-service-provider:
        optional: true
      websso-trusted-dashboard:
        optional: true
      certificates:
        optional: true
      keystone-middleware:
        optional: true
    constraints:
      # Connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
    assumes:
      - unsupported-openstack
