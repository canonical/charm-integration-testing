---
# Kubeflow Pipelines UI - web interface for pipeline management
overrides:
  - provides:
      kfp-ui:
        features: [kfp-ui]
    requires:
      kfp-api:
        features: [kfp-api]
    constraints:
      - '"kfp-ui" in features(endpoint[kfp-ui])'
      - '"kfp-api" in features(endpoint[kfp-api])'
