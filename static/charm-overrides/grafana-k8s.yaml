---
# Source: https://github.com/canonical/grafana-k8s-operator
# Remove after: https://github.com/canonical/grafana-k8s-operator/pull/591
#
# Tracks 1/2 predate these endpoints; block applies to 12.4+ and future tracks.
#
# provide-cmr-mesh must be integrated cross-model with exactly the same charms as the
# mesh-managed provides endpoints (per the charm's ServiceMeshConsumer policies in src/charm.py:
# metrics-endpoint, profiling-endpoint) are cross-model with; see issue GH-980.
overrides:
  - criteria:
      - none_of:
          - track: '1'
          - track: '2'
    requires:
      service-mesh:
        optional: true  # no-ops without relation; ServiceMeshConsumer
      require-cmr-mesh:
        optional: true  # only used via service-mesh, see constraint below
    provides:
      provide-cmr-mesh:
        optional: true  # only meaningful once on a mesh
    constraints:
      - 'bool(endpoint[require-cmr-mesh]) => bool(endpoint[service-mesh])'
      - 'bool(endpoint[provide-cmr-mesh]) => bool(endpoint[service-mesh])'
      - 'charms(cross_model(endpoint[metrics-endpoint] | endpoint[profiling-endpoint]))
        == charms(cross_model(endpoint[provide-cmr-mesh]))'
      # cross_model_mesh only makes sense to describe a genuine CMR; without this, a purely
      # local provide-cmr-mesh relation would vacuously satisfy the equality above (both sides
      # empty). See GH-980.
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
