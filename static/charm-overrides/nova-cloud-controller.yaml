---
# nova-cloud-controller: Source: https://github.com/openstack/charm-nova-cloud-controller
#
# shared-db, amqp, identity-service, image-service, cloud-compute (requires): REQUIRED
#   (see REQUIRED_INTERFACES in hooks/nova_cc_utils.py).
# placement (requires): REQUIRED for Train+; not present in metadata on queens/rocky/stein.
# All other requires/provides: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  # queens, rocky, stein: placement endpoint not present in charm metadata.
  - assumes: &unsupported [unsupported-openstack]
    criteria:
      - any_of:
          - track: queens
          - track: rocky
          - track: stein
    provides:
      nrpe-external-master:
        optional: true
      cloud-controller:
        optional: true
      nova-cell-api:
        optional: true
    requires:
      cinder-volume-service:
        optional: true
      quantum-network-service:
        optional: true
      neutron-api:
        optional: true
      ha:
        optional: true
      nova-vmware:
        optional: true
      memcache:
        optional: true
      certificates:
        optional: true
      shared-db-cell:
        optional: true
      amqp-cell:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
      - 'tracks(charms(endpoint[image-service])) == tracks({self})'
      - 'risks(charms(endpoint[image-service])) == risks({self})'
      - 'tracks(charms(endpoint[cloud-compute])) == tracks({self})'
      - 'risks(charms(endpoint[cloud-compute])) == risks({self})'
  # train: placement endpoint present in metadata and required; dashboard not yet present.
  - assumes: *unsupported
    criteria:
      - track: train
    provides:
      nrpe-external-master:
        optional: true
      cloud-controller:
        optional: true
      nova-cell-api:
        optional: true
    requires:
      cinder-volume-service:
        optional: true
      quantum-network-service:
        optional: true
      neutron-api:
        optional: true
      ha:
        optional: true
      nova-vmware:
        optional: true
      memcache:
        optional: true
      certificates:
        optional: true
      shared-db-cell:
        optional: true
      amqp-cell:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
      - 'tracks(charms(endpoint[image-service])) == tracks({self})'
      - 'risks(charms(endpoint[image-service])) == risks({self})'
      - 'tracks(charms(endpoint[cloud-compute])) == tracks({self})'
      - 'risks(charms(endpoint[cloud-compute])) == risks({self})'
      - 'tracks(charms(endpoint[placement])) == tracks({self})'
      - 'risks(charms(endpoint[placement])) == risks({self})'
  # Default (ussuri and later): placement required; dashboard endpoint also present.
  - assumes: *unsupported
    provides:
      nrpe-external-master:
        optional: true
      cloud-controller:
        optional: true
      nova-cell-api:
        optional: true
    requires:
      cinder-volume-service:
        optional: true
      dashboard:
        optional: true
      quantum-network-service:
        optional: true
      neutron-api:
        optional: true
      ha:
        optional: true
      nova-vmware:
        optional: true
      memcache:
        optional: true
      certificates:
        optional: true
      shared-db-cell:
        optional: true
      amqp-cell:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
      - 'tracks(charms(endpoint[image-service])) == tracks({self})'
      - 'risks(charms(endpoint[image-service])) == risks({self})'
      - 'tracks(charms(endpoint[cloud-compute])) == tracks({self})'
      - 'risks(charms(endpoint[cloud-compute])) == risks({self})'
      - 'tracks(charms(endpoint[placement])) == tracks({self})'
      - 'risks(charms(endpoint[placement])) == risks({self})'
