---
# Source: https://github.com/canonical/blackbox-exporter-k8s-operator
#
# require-cmr-mesh, service-mesh (requires) and provide-cmr-mesh (provides) are already
# optional: true upstream. They are only present on the dev track (not tracks 0.28, 1 or 2);
# tracks predating dev do not yet have the service_mesh integration.
#
# provide-cmr-mesh must be integrated cross-model with exactly the same charms as the
# mesh-managed provides endpoint (per the charm's ServiceMeshConsumer policy in src/charm.py:
# self-metrics-endpoint) is cross-model with; see issue GH-980.
overrides:
  - criteria:
      - track: dev
    constraints:
      - 'charms(cross_model(endpoint[self-metrics-endpoint])) == charms(cross_model(endpoint[provide-cmr-mesh]))'
      # Closes the gap where both sides are external (see CrossModelExpr's docstring
      # in constraints_dsl.py); not len()-equality since managed endpoints can coalesce.
      - 'bool(cross_model(endpoint[self-metrics-endpoint])) == bool(cross_model(endpoint[provide-cmr-mesh]))'
      # Rejects a purely local provide-cmr-mesh (both sides vacuously empty). See GH-980.
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
