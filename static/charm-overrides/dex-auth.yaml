---
# Remove after: https://github.com/canonical/charm-integration-testing/issues/282
#
# Three endpoint generations across dex-auth tracks:
#   2.31, 2.36: no dex-oidc-config or logging endpoints
#   2.39: adds dex-oidc-config (provides) and logging (requires)
#   2.41, latest: additionally adds require-cmr-mesh, service-mesh (requires) and
#     provide-cmr-mesh (provides), without optional: true upstream.
overrides:
  # 2.31, 2.36: no dex-oidc-config endpoint to mark cyclic
  - criteria:
      - any_of:
          - track: "2.31"
          - track: "2.36"
    provides:
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      # dex-auth's `ingress` requires endpoint is driven by legacy
      # serialized_data_interface (SDI), not the modern
      # charms.traefik_k8s.v2.ingress library. Tag it sdi-legacy so the solver
      # doesn't pair it with a modern `ingress` provider like traefik-k8s,
      # which would deadlock at deploy time.
      # See: https://github.com/canonical/charm-integration-testing/issues/976
      ingress:
        features: [sdi-legacy]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'

  # 2.39: dex-oidc-config endpoint present, no cmr-mesh endpoints yet
  - criteria:
      - track: "2.39"
    provides:
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      # dex-auth and oidc-gatekeeper mutually require each other (dex-auth provides
      # dex-oidc-config which oidc-gatekeeper requires, and oidc-gatekeeper provides
      # oidc-client which dex-auth requires). Mark as cyclic.
      dex-oidc-config:
        cyclic: true
    requires:
      # dex-auth's `ingress` requires endpoint is driven by legacy
      # serialized_data_interface (SDI), not the modern
      # charms.traefik_k8s.v2.ingress library. Tag it sdi-legacy so the solver
      # doesn't pair it with a modern `ingress` provider like traefik-k8s,
      # which would deadlock at deploy time.
      # See: https://github.com/canonical/charm-integration-testing/issues/976
      ingress:
        features: [sdi-legacy]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'

  # 2.41, latest: adds require-cmr-mesh/service-mesh (requires) and
  # provide-cmr-mesh (provides). provide-cmr-mesh must be integrated cross-model with
  # exactly the same charms as the mesh-managed dex-oidc-config/metrics-endpoint
  # endpoints (per the charm's ServiceMeshConsumer policies in src/charm.py) are
  # cross-model with; see issue GH-980.
  - criteria:
      - any_of:
          - track: "2.41"
          - track: "latest"
    provides:
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      # dex-auth and oidc-gatekeeper mutually require each other (dex-auth provides
      # dex-oidc-config which oidc-gatekeeper requires, and oidc-gatekeeper provides
      # oidc-client which dex-auth requires). Mark as cyclic.
      dex-oidc-config:
        cyclic: true
      provide-cmr-mesh:
        optional: true
    requires:
      # dex-auth's `ingress` requires endpoint is driven by legacy
      # serialized_data_interface (SDI), not the modern
      # charms.traefik_k8s.v2.ingress library. Tag it sdi-legacy so the solver
      # doesn't pair it with a modern `ingress` provider like traefik-k8s,
      # which would deadlock at deploy time.
      # See: https://github.com/canonical/charm-integration-testing/issues/976
      ingress:
        features: [sdi-legacy]
      require-cmr-mesh:
        optional: true
      service-mesh:
        optional: true
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
      - 'charms(cross_model(endpoint[dex-oidc-config] | endpoint[metrics-endpoint]))
        == charms(cross_model(endpoint[provide-cmr-mesh]))'
      # cross_model_mesh only makes sense to describe a genuine CMR; without this, a purely
      # local provide-cmr-mesh relation would vacuously satisfy the equality above (both sides
      # empty). See GH-980.
      - 'len(endpoint[provide-cmr-mesh]) == len(cross_model(endpoint[provide-cmr-mesh]))'
