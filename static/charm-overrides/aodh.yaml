---
# aodh: OpenStack Alarming service.
# Source: https://opendev.org/openstack/charm-aodh
#
# mongodb (requires): legacy MongoDB storage backend. aodh supports either
#   MySQL (shared-db) or MongoDB as its database. MongoDB was deprecated as
#   a storage backend in favour of MySQL. The old reactive mongodb charm that
#   provided the mongodb interface no longer exists on Charmhub default
#   channels (see https://github.com/canonical/charm-integration-testing/issues/634).
#   aodh reaches active with just shared-db; mongodb is genuinely optional.
#
# ha (requires): hacluster for HA deployments. aodh runs single-unit without it.
#
# nrpe-external-master (provides): NRPE monitoring hook. Observability only.
# listed: false -- Excluded from automated bundle building (SQT-1081) to prevent
# pipeline congestion; not currently covered by Charm QA.
listed: false
overrides:
  - requires:
      ha:
        optional: true
      mongodb:
        optional: true
        # Legacy MongoDB backend; deprecated in favour of MySQL (shared-db).
        # No provider available on Charmhub default channels (see issue 634).
    provides:
      nrpe-external-master:
        optional: true
    assumes:
      - openstack-unsupported
    assumes:
      - openstack-unsupported
