---
# aodh: OpenStack Alarming service. Source: https://opendev.org/openstack/charm-aodh
#
# mongodb (requires): optional - legacy backend, deprecated in favour of MySQL
#   (shared-db); no provider exists on Charmhub (issue 634).
# ha (requires): optional - runs single-unit without hacluster.
# nrpe-external-master (provides): optional - monitoring only.
#
# assumes: [unsupported-openstack] -- charm is listed on Charmhub but not currently covered by
#   Charm QA (SQT-1081); this blocks it from being built directly.
overrides:
  - requires:
      ha:
        optional: true
      mongodb:
        optional: true
    provides:
      nrpe-external-master:
        optional: true
    assumes:
      - unsupported-openstack
