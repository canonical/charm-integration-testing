---
# https://github.com/canonical/istio-operators/issues/672
# metrics-endpoint was added to provides in track 1.22; tracks 1.16-1.21 have empty provides.
# The fallback block (no criteria) covers 1.22+, latest, and any future tracks automatically.
platforms: [kubernetes]
overrides:
  - criteria:
      - any_of:
          - track: '1.16'
          - track: '1.17'
          - track: '1.18'
          - track: '1.19'
          - track: '1.20'
          - track: '1.21'
    requires:
      istio-pilot:
        features: [istio-pilot]
    configs:
      kind: [ingress, egress]
    constraints:
      - 'set(config[kind])'
      - '"istio-pilot" in features(endpoint[istio-pilot])'
  - provides:
      metrics-endpoint:
        optional: true
    requires:
      istio-pilot:
        features: [istio-pilot]
    configs:
      kind: [ingress, egress]
    constraints:
      - 'set(config[kind])'
      - '"istio-pilot" in features(endpoint[istio-pilot])'
