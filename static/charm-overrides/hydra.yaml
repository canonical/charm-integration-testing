---
overrides:
    # Remove after: https://github.com/canonical/hydra-operator/pull/358
    # Older tracks use public-ingress (legacy traefik API)
  - criteria:
      - any_of:
          - track: istio
          - track: '0.3'
          - track: '0.2'
          - track: '0.1'
    provides:
      hydra-endpoint-info:
        optional: true
      oauth:
        optional: true
        features: [tls]
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      public-ingress:
        optional: false
        features: [tls]
      internal-ingress:
        optional: true
        features: [tls]
      admin-ingress:
        optional: true
        features: [tls]
      tracing:
        optional: true
      logging:
        optional: true
    configs:
      dev: [true, null]
    proxies:
      - interface: certificates
        provides: public-ingress
        requires: oauth
    constraints:
      # public-ingress and oauth must agree on tls
      - '("tls" in features(endpoint[public-ingress])) == ("tls" in features(endpoint[oauth]))'
      # if not in dev mode, ingress must use tls
      - not config[dev] => "tls" in features(endpoint[public-ingress])
    # Newer tracks use public-route (new traefik API)
  - provides:
      hydra-endpoint-info:
        optional: true
      oauth:
        optional: true
        features: [tls]
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      public-route:
        optional: false
        features: [tls]
      internal-route:
        optional: true
        features: [tls]
      tracing:
        optional: true
      logging:
        optional: true
    configs:
      dev: [true, null]
    proxies:
      - interface: certificates
        requires: public-route
        provides: oauth
    constraints:
      # public-route and oauth must agree on tls
      - '("tls" in features(endpoint[public-route])) == ("tls" in features(endpoint[oauth]))'
      # if not in dev mode, public-route must use tls
      - not config[dev] => "tls" in features(endpoint[public-route])
