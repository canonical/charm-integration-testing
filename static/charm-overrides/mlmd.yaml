---
# Source: https://github.com/canonical/mlmd-operator
#
# 1.0/1.14 still expose mysql; ckf-1.10 adds velero-backup-config; newer tracks only keep grpc (+ optional logging).
#
# grpc (provides): REQUIRED - primary purpose of the charm.
# mysql (requires): optional - revision 66 src/charm.py falls back to a local sqlite config when no mysql relation is present (lines 71-80).
# logging (requires): optional - modern tracks only instantiate LogForwarder.
# velero-backup-config (provides): not declared here - only present on ckf-1.10's 24.04 base (rev 425), not
#   its 20.04 base (rev 316); overrides can't discriminate by base, so it's left to fall to the no-criteria block.
overrides:
  - criteria:
      - any_of:
          - track: '1.0'
          - track: '1.14'
    provides:
      grpc:
        features: [mlmd-grpc]
    requires:
      mysql:
        optional: true
    constraints:
      - '"mlmd-grpc" in features(endpoint[grpc])'
  - criteria:
      - track: 'ckf-1.10'
    provides:
      grpc:
        features: [mlmd-grpc]
    constraints:
      - '"mlmd-grpc" in features(endpoint[grpc])'
  - provides:
      grpc:
        features: [mlmd-grpc]
    constraints:
      - '"mlmd-grpc" in features(endpoint[grpc])'
