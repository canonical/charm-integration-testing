---
# Remove after: https://github.com/canonical/mysql-k8s-operator/pull/626
overrides:
  - criteria:
      - track: "8.0"
    provides:
      database:
        optional: true
        features: [mysql-server]
      mysql:
        optional: true
      mysql-root:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      replication-offer:
        optional: true
    constraints:
      # database/mysql/mysql-root are mutually exclusive; a replica (requires:
      # replication connected) serves no clients directly, so all must be 0 instead of 1.
      - 'bool(endpoint[replication]) => len(endpoint[database]) + len(endpoint[mysql])
        + len(endpoint[mysql-root]) == 0'
      - 'not bool(endpoint[replication]) => len(endpoint[database]) + len(endpoint[mysql])
        + len(endpoint[mysql-root]) == 1'
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'

  # Track 8.4 has correct endpoint optionality upstream except for the replication case below.
  - provides:
      database:
        features: [mysql-server]
        optional: true
    constraints:
      # a replica (requires: replication connected) serves no clients directly
      - 'bool(endpoint[replication]) => len(endpoint[database]) == 0'
      - 'not bool(endpoint[replication]) => len(endpoint[database]) == 1'
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'
