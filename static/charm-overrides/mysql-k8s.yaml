---
# Remove after: https://github.com/canonical/mysql-k8s-operator/pull/626
overrides:
  - criteria:
      - track: "8.0"
    provides:
      database:
        optional: true
      mysql:
        optional: true
      mysql-root:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      replication-offer:
        optional: true
    constraints:
      # database, mysql, and mysql-root are mutually exclusive (at most one can be used)
      - len(endpoint[database]) + len(endpoint[mysql]) + len(endpoint[mysql-root])
        <= 1
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'

  # Track 8.4 has correct endpoint optionality, but we still need to enforce the replication constraint
  - constraints:
      # replication must be same track/risk
      - 'bool(endpoint[replication]) => risks(charms(endpoint[replication])) == risks({self})
        and tracks(charms(endpoint[replication])) == tracks({self})'
