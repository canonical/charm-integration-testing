---
# Kubeflow Central Dashboard - main UI entry point
overrides:
    # Track 1.7: provides is empty in charm metadata; do not declare grafana-dashboard
    # or metrics-endpoint to avoid UnparsableCharmException.
  - criteria:
      - track: '1.7'
    requires:
      ingress:
        # legacy serialized_data_interface (SDI), not modern v2 ingress; see
        # https://github.com/canonical/charm-integration-testing/issues/976
        features: [sdi-legacy]
      kubeflow-profiles:
        features: [kubeflow-profiles]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
      - '"kubeflow-profiles" in features(endpoint[kubeflow-profiles])'
    # Tracks 1.8 and 1.9 have grafana-dashboard in provides but not metrics-endpoint.
  - criteria:
      - any_of:
          - track: '1.8'
          - track: '1.9'
    provides:
      grafana-dashboard:
        optional: true
    requires:
      ingress:
        # legacy serialized_data_interface (SDI), not modern v2 ingress; see
        # https://github.com/canonical/charm-integration-testing/issues/976
        features: [sdi-legacy]
      kubeflow-profiles:
        features: [kubeflow-profiles]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
      - '"kubeflow-profiles" in features(endpoint[kubeflow-profiles])'
    # Track 1.10 and later have both grafana-dashboard and metrics-endpoint in provides.
  - provides:
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      ingress:
        # legacy serialized_data_interface (SDI), not modern v2 ingress; see
        # https://github.com/canonical/charm-integration-testing/issues/976
        features: [sdi-legacy]
      kubeflow-profiles:
        features: [kubeflow-profiles]
    constraints:
      - 'bool(endpoint[ingress]) => features(endpoint[ingress]) == {"sdi-legacy"}'
      - '"kubeflow-profiles" in features(endpoint[kubeflow-profiles])'
