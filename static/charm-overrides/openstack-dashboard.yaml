---
# openstack-dashboard: Source: https://github.com/openstack/charm-openstack-dashboard
#
# identity-service (requires): REQUIRED (only entry in REQUIRED_INTERFACES,
#   hooks/horizon_utils.py). All other requires/provides: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  # queens-train: dashboard endpoint not yet present in `provides` metadata
  - assumes: &unsupported [unsupported-openstack]
    criteria:
      - any_of:
          - track: 'queens'
          - track: 'rocky'
          - track: 'stein'
          - track: 'train'
    provides:
      nrpe-external-master:
        optional: true
      website:
        optional: true
      dashboard-plugin:
        optional: true
      websso-trusted-dashboard:
        optional: true
    requires:
      ha:
        optional: true
      certificates:
        optional: true
      websso-fid-service-provider:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
  # ussuri-xena: dashboard endpoint present; application-dashboard not yet available
  - assumes: *unsupported
    criteria:
      - any_of:
          - track: 'ussuri'
          - track: 'victoria'
          - track: 'wallaby'
          - track: 'xena'
    provides:
      nrpe-external-master:
        optional: true
      website:
        optional: true
      dashboard-plugin:
        optional: true
      websso-trusted-dashboard:
        optional: true
      dashboard:
        optional: true
    requires:
      ha:
        optional: true
      certificates:
        optional: true
      websso-fid-service-provider:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
  # default (yoga, zed, 2023.1+, latest, and future tracks)
  - assumes: *unsupported
    provides:
      nrpe-external-master:
        optional: true
      website:
        optional: true
      dashboard-plugin:
        optional: true
      websso-trusted-dashboard:
        optional: true
      dashboard:
        optional: true
    requires:
      application-dashboard:
        optional: true
      ha:
        optional: true
      certificates:
        optional: true
      websso-fid-service-provider:
        optional: true
    constraints:
      # All connected OpenStack service charms must be on the same release track.
      - 'tracks(charms(endpoint[identity-service])) == tracks({self})'
      - 'risks(charms(endpoint[identity-service])) == risks({self})'
