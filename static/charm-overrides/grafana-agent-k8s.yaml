---
# Grafana Agent K8s acts as an observability aggregator.
# Logic sourced from https://github.com/canonical/grafana-agent-k8s-operator/blob/6705b4483c0498ab6913e79d340388ca165e5524/src/charm.py#L42
#
# Rules:
# 1. At least one incoming integration must be present (metrics-endpoint, logging-provider,
#    tracing-provider, or grafana-dashboards-consumer).
# 2. For each incoming integration present, a corresponding outgoing integration must also be present
#    (or grafana-cloud-config as a universal fallback):
#    - metrics-endpoint        => send-remote-write OR grafana-cloud-config
#    - logging-provider        => logging-consumer OR grafana-cloud-config
#    - tracing-provider        => tracing OR grafana-cloud-config
#    - grafana-dashboards-consumer => grafana-dashboards-provider OR grafana-cloud-config
overrides:
  - provides:
      grafana-dashboards-provider:
        optional: true
      logging-provider:
        optional: true
      tracing-provider:
        optional: true
    requires:
      send-remote-write:
        optional: true
      tracing:
        optional: true
      logging-consumer:
        optional: true
      grafana-cloud-config:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboards-consumer:
        optional: true
    constraints:
      # At least one incoming integration must be present
      - 'bool(endpoint[metrics-endpoint]) or bool(endpoint[logging-provider]) or bool(endpoint[tracing-provider])
        or bool(endpoint[grafana-dashboards-consumer])'
      # If metrics-endpoint is used, need send-remote-write OR grafana-cloud-config
      - 'bool(endpoint[metrics-endpoint]) => bool(endpoint[send-remote-write]) or
        bool(endpoint[grafana-cloud-config])'
      # If logging-provider is used, need logging-consumer OR grafana-cloud-config
      - 'bool(endpoint[logging-provider]) => bool(endpoint[logging-consumer]) or bool(endpoint[grafana-cloud-config])'
      # If tracing-provider is used, need tracing OR grafana-cloud-config
      - 'bool(endpoint[tracing-provider]) => bool(endpoint[tracing]) or bool(endpoint[grafana-cloud-config])'
      # If grafana-dashboards-consumer is used, need grafana-dashboards-provider OR grafana-cloud-config
      - 'bool(endpoint[grafana-dashboards-consumer]) => bool(endpoint[grafana-dashboards-provider])
        or bool(endpoint[grafana-cloud-config])'
