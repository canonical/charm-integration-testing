---
# Source: https://github.com/canonical/catalogue-k8s-operator
#
# No endpoints have optional: true set upstream in any track.
# Tracks 2 and dev additionally add service-mesh, require-cmr-mesh (requires)
# and provide-cmr-mesh (provides).
#
# ingress (requires): optional - charm falls back to internal FQDN when absent (charm.py: _ingress.url or _internal_url)
# certificates (requires): optional - TLS gated by _tls_available, charm reaches active without it
# tracing (requires): optional - observability hook, not primary purpose
# catalogue-item (requires): optional - self-registration in a parent catalogue, secondary purpose
# service-mesh (requires): optional - Istio service mesh integration, secondary
# require-cmr-mesh (requires): optional - CMR mesh cross-model access, secondary
# catalogue (provides): optional - charm reaches ActiveStatus without consumers (_configure always ends with ActiveStatus)
# provide-cmr-mesh (provides): optional - CMR mesh consumer hook, secondary
overrides:
  - criteria:
      - any_of:
          - track: '2'
          - track: dev
    requires:
      catalogue-item:
        optional: true
      certificates:
        optional: true
      ingress:
        optional: true
      require-cmr-mesh:
        optional: true
      service-mesh:
        optional: true
      tracing:
        optional: true
    provides:
      catalogue:
        optional: true
      provide-cmr-mesh:
        optional: true
  - requires:
      catalogue-item:
        optional: true
      certificates:
        optional: true
      ingress:
        optional: true
      tracing:
        optional: true
    provides:
      catalogue:
        optional: true
