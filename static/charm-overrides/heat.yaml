---
# heat: Source: https://github.com/openstack/charm-heat
#
# amqp, identity-service, shared-db, certificates: required for basic operation.
# ha, heat-plugin-subordinate (requires), nrpe-external-master (provides): optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - requires:
      ha:
        optional: true
      heat-plugin-subordinate:
        optional: true
    provides:
      nrpe-external-master:
        optional: true
    assumes: [unsupported-openstack]
