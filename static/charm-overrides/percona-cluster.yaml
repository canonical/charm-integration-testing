---
# percona-cluster: Source: https://github.com/openstack/charm-percona-cluster
#
# slave, master (requires/provides): optional - MySQL replication, not needed standalone.
# ha, nrpe-external-master: optional.
#
# assumes: [unsupported-openstack] -- listed on Charmhub, but not currently covered by Charm QA
#   (SQT-1081); this blocks the charm from being built directly.
overrides:
  - provides:
      master:
        optional: true
      nrpe-external-master:
        optional: true
    requires:
      ha:
        optional: true
      slave:
        optional: true
    assumes: [unsupported-openstack]
