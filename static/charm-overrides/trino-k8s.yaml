---
# trino-coordinator and trino-worker are mutually exclusive roles
overrides:
  - provides:
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
      trino-coordinator:
        optional: true
    requires:
      trino-worker:
        optional: true
    configs:
      charm-function: [all, worker, coordinator]
    constraints:
      # A Trino instance cannot be both coordinator and worker
      - 'not (bool(endpoint[trino-coordinator]) and bool(endpoint[trino-worker]))'
      # charm.py::_validate_relations -> trino_coordinator.py/trino_worker.py::_validate()
      - 'bool(endpoint[trino-coordinator]) => config[charm-function] == "coordinator"'
      - 'bool(endpoint[trino-worker]) => config[charm-function] == "worker"'
      - 'not bool(endpoint[trino-coordinator]) and not bool(endpoint[trino-worker])
        => config[charm-function] == "all"'
