---
# Remove after: https://github.com/canonical/mysql-router-k8s-operator/pull/448
priority: 2.0
overrides:
  - provides:
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      backend-database:
        features: [mysql-server]
    constraints:
      # backend-database only works against a real MySQL server: the requires side
      # always asks for extra_user_roles="charmed_router", and any mysql_client
      # provider that isn't a server (another router) rejects extra-user-roles and
      # blocks. See https://github.com/canonical/charm-integration-testing/issues/937
      - '"mysql-server" in features(endpoint[backend-database])'
      # Backend database must have the same track/risk
      - 'tracks(charms(endpoint[backend-database])) == tracks({self})'
      - 'risks(charms(endpoint[backend-database])) == risks({self})'
