---
overrides:
  - provides:
      admin:
        limit: 1
        optional: false
        features: [admin]
    requires:
      temporal-host-info:
        cyclic: true
    constraints:
      # admin endpoint must use admin feature
      - bool(endpoint[admin]) => features(endpoint[admin]) == {"admin"}
      # temporal-host-info must be provided by a charm that also provides an admin endpoint
      - 'charms(endpoint[temporal-host-info]) == charms(endpoint[admin])'
