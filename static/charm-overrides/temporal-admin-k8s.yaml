---
overrides:
  # 1.23+ tracks: temporal-k8s requires admin from temporal-admin-k8s;
  # temporal-host-info exists in metadata but has no provider, so mark optional.
  - provides:
      admin:
        limit: 1
        optional: false
        features: [admin]
    requires:
      temporal-host-info:
        optional: true
    constraints:
      - bool(endpoint[admin]) => features(endpoint[admin]) == {"admin"}
