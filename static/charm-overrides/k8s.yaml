---
# k8s charm has cloud-provider and etcd requires that cannot be satisfied
# in isolated machine endpoint smoke tests.
overrides:
  - requires:
      aws:
        optional: true
      azure:
        optional: true
      etcd:
        optional: true
      external-cloud-provider:
        optional: true
      external-load-balancer:
        optional: true
      gcp:
        optional: true
    provides:
      cos-agent:
        optional: true
