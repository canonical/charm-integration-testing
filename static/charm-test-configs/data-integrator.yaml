---
# data-integrator requires at least one of: topic-name, index-name, database-name,
# keyspace-name, or prefix-name to be set, otherwise it blocks with:
# "Please specify either topic, index, database name, keyspace name, or prefix"
#
# mysql, postgresql, mongodb, mongos, zookeeper, kyuubi all use database-name
# (they are handled via DatabaseRequires in literals.DATABASES).
configs:
  - criteria:
      any_of:
        - endpoint_integrated: mysql
        - endpoint_integrated: postgresql
        - endpoint_integrated: mongodb
        - endpoint_integrated: zookeeper
        - endpoint_integrated: kyuubi
        - endpoint_integrated: mongos
    config:
      database-name: mydb
  - criteria:
      endpoint_integrated: kafka
    config:
      topic-name: my-topic
  - criteria:
      endpoint_integrated: opensearch
    config:
      index-name: my-index
  - criteria:
      endpoint_integrated: etcd
    config:
      prefix-name: myprefix
  - criteria:
      endpoint_integrated: cassandra
    config:
      keyspace-name: mykeyspace
