---
# Concierge configuration used by `mise run setup-k8s`.
# Juju is managed by Mise and controllers are bootstrapped by the test suite.
juju:
  disable: true
providers:
  k8s:
    enable: true
    channel: 1.32-classic/stable
    bootstrap: false
    features:
      local-storage: {}
      network: {}
      load-balancer:
        l2-mode: 'true'
        cidrs: 10.43.45.0/28
