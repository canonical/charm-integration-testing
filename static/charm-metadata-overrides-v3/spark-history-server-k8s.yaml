---
overrides:
  - criteria:
      track: '3'
      risk: 'edge'
    requires:
      s3-credentials:
        optional: true
      azure-storage-credentials:
        optional: true
      ingress:
        optional: true
    constraints: |-
      ; At least one storage backend is required (s3 or azure)
      (assert (or s3-credentials azure-storage-credentials))
      ; If an auth method is integrated, ingress is required
      (assert (=> (or auth-proxy oauth2-proxy) ingress))
  - requires:
      s3-credentials:
        optional: true
      azure-storage-credentials:
        optional: true
      ingress:
        optional: true
    constraints: |-
      ; At least one storage backend is required (s3 or azure)
      (assert (or s3-credentials azure-storage-credentials))
      ; If auth-proxy is integrated, ingress is required
      (assert (=> auth-proxy ingress))
