---
# Kubeflow Pipelines API server - core backend for pipeline management
overrides:
  - provides:
      # Remove after: https://github.com/canonical/charm-integration-testing/issues/282
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    constraints: |
      ; kfp-api must have kfp-api mode
      (assert (=> kfp-api (= kfp-api_mode "kfp-api")))
      ; kfp-viz must have kfp-viz mode
      (assert (=> kfp-viz (= kfp-viz_mode "kfp-viz")))

