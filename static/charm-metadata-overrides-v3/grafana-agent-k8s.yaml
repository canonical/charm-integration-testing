---
# Grafana Agent K8s acts as an observability aggregator with the following constraints:
#
# 1. At least ONE incoming observability integration must be present (otherwise the charm is blocked):
#    - metrics-endpoint (scrapes metrics from applications)
#    - logging-provider (receives logs from applications)
#    - tracing-provider (receives traces from applications)
#    - grafana-dashboards-consumer (receives dashboards from applications)
#
# 2. For EACH incoming integration that is present, a corresponding outgoing integration must also be present:
#    - metrics-endpoint requires: send-remote-write OR grafana-cloud-config
#    - logging-provider requires: logging-consumer OR grafana-cloud-config
#    - tracing-provider requires: tracing OR grafana-cloud-config
#    - grafana-dashboards-consumer requires: grafana-dashboards-provider OR grafana-cloud-config
#
# 3. grafana-cloud-config acts as a universal outgoing integration that satisfies any incoming integration's requirement
#
# Logic sourced from https://github.com/canonical/grafana-agent-k8s-operator/blob/6705b4483c0498ab6913e79d340388ca165e5524/src/charm.py#L42
overrides:
  - provides:
      grafana-dashboards-provider:
        optional: true
      logging-provider:
        optional: true
      tracing-provider:
        optional: true
    requires:
      send-remote-write:
        optional: true
      tracing:
        optional: true
      logging-consumer:
        optional: true
      grafana-cloud-config:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboards-consumer:
        optional: true
    constraints: |-
      ; At least one incoming integration must be present
      (assert (or metrics-endpoint logging-provider tracing-provider grafana-dashboards-consumer))
      ; If metrics-endpoint is used, need send-remote-write OR grafana-cloud-config
      (assert (=> metrics-endpoint (or send-remote-write grafana-cloud-config)))
      ; If logging-provider is used, need logging-consumer OR grafana-cloud-config
      (assert (=> logging-provider (or logging-consumer grafana-cloud-config)))
      ; If tracing-provider is used, need tracing OR grafana-cloud-config
      (assert (=> tracing-provider (or tracing grafana-cloud-config)))
      ; If grafana-dashboards-consumer is used, need grafana-dashboards-provider OR grafana-cloud-config
      (assert (=> grafana-dashboards-consumer (or grafana-dashboards-provider grafana-cloud-config)))
