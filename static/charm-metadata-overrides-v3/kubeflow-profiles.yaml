---
# Kubeflow Profiles - manages user namespaces and access control
overrides:
  - provides:
      # Remove after: https://github.com/canonical/charm-integration-testing/issues/282
      metrics-endpoint:
        optional: true
    constraints: |
      ; kubeflow-profiles endpoint must use kubeflow-profiles mode
      (assert (=> kubeflow-profiles (= kubeflow-profiles_mode "kubeflow-profiles")))
