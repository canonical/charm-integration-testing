---
# Remove after: https://github.com/canonical/postgresql-k8s-operator/pull/1018
provides:
  replication-offer:
    optional: true
  metrics-endpoint:
    optional: true
  grafana-dashboard:
    optional: true
  database:
    limit_if:
      - criteria:
          - any_of:
              - endpoint_integrated: db
              - endpoint_integrated: db-admin
        limit: 0
    limit: 1
    optional: true
    modes:
      - [""]
      - [tls]
  db:
    limit_if:
      - criteria:
          - any_of:
              - endpoint_integrated: database
              - endpoint_integrated: db-admin
        limit: 0
    limit: 1
    optional: true
    modes: [[tls], [""]]
  db-admin:
    limit_if:
      - criteria:
          - any_of:
              - endpoint_integrated: database
              - endpoint_integrated: db
        limit: 0
    limit: 1
    optional: true
    modes: [[tls], [""]]
requires:
  certificates:
    optional_if:
      - none_of:
          - any_of:
              - all_of:
                  - endpoint_integrated: database
                  - endpoint_feature: [database, tls]
              - all_of:
                  - endpoint_integrated: db
                  - endpoint_feature: [db, tls]
              - all_of:
                  - endpoint_integrated: db-admin
                  - endpoint_feature: [db-admin, tls]
