---
# Remove after: https://github.com/canonical/zookeeper-k8s-operator/pull/136
provides:
  zookeeper:
    optional: true
  metrics-endpoint:
    optional: true
  grafana-dashboard:
    optional: true
requires:
  # When zookeeper is serving kafka (zookeeper endpoint is integrated), TLS must
  # be enabled on both kafka and zookeeper for secure operation.
  # See: https://github.com/canonical/charm-integration-testing/issues/408
  certificates:
    optional_if:
      - none_of:
          - endpoint_integrated: zookeeper
