
# Remove after: https://github.com/canonical/hydra-operator/pull/358
overrides:
  - provides:
      hydra-endpoint-info:
        optional: true
      oauth:
        optional: true
      metrics-endpoint:
        optional: true
      grafana-dashboard:
        optional: true
    requires:
      public-route:
        optional: false
      internal-route:
        optional: true
      public-ingress:
        optional: false
      internal-ingress:
        optional: true
      admin-ingress:
        optional: true
    bridges:
      - interface: certificate_transfer
        requires: public-route
        provides: oauth
