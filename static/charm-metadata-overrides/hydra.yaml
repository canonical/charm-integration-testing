---
# Remove after: https://github.com/canonical/hydra-operator/pull/358
provides:
  hydra-endpoint-info:
    optional: true
  oauth:
    optional: true
  metrics-endpoint:
    optional: true
  grafana-dashboard:
    optional: true
requires:
  pg-database:
    interface: postgresql_client
    optional: false
  ui-endpoint-info:
    interface: login_ui_endpoints
    optional: false
  public-route:
    features: [tls]
    optional: false
  internal-route:
    features: [tls]
    optional: true
  public-ingress:
    features: [tls]
    optional: false
  internal-ingress:
    features: [tls]
    optional: true
  admin-ingress:
    features: [tls]
    optional: true
