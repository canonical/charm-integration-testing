    features: [tls]
    optional: false
  internal-route:
    features: [tls]
    optional: true

  public-ingress:
    features: [tls]
    optional: false
  internal-ingress:
    features: [tls]
    optional: true
  admin-ingress:
    features: [tls]
    optional: true
