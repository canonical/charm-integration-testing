# pgbouncer needs at least one of these to exit blocked state
# (db and db-admin are legacy endpoints)
# https://github.com/canonical/pgbouncer-operator/pull/548
provides:
  database:
    optional_if:
      - any_of:
          - endpoint_integrated: db
          - endpoint_integrated: db-admin
  db:
    optional_if:
      - any_of:
          - endpoint_integrated: database
          - endpoint_integrated: db-admin
  db-admin:
    optional_if:
      - any_of:
          - endpoint_integrated: database
          - endpoint_integrated: db