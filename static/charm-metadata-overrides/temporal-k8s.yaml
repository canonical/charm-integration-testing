---
# Remove after: https://github.com/canonical/temporal-k8s-operator/pull/117
overrides:
  - requires:
      frontend-certificates:
        optional: true
        limit: 1
      nginx-route:
        optional: true
        limit: 1
      openfga:
        optional: true
        limit: 1
      s3-parameters:
        optional: true
        limit: 1
      # https://github.com/canonical/temporal-k8s-operator/issues/120
      admin:
        optional: false
      ui:
        optional: true
    provides:
      metrics-endpoint:
        interface: prometheus_scrape
        optional: true
      grafana-dashboard:
        interface: grafana_dashboard
        optional: true
