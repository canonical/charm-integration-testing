[task_config]
includes = ["scripts", "mise-tasks"]
excludes = ["scripts/*.py"]

[settings]
lockfile = true
locked = true
auto_install = false
task.run_auto_install = false

[bootstrap.packages]
"snap:juju" = { channel = "3/stable" }
"snap:kubectl" = { channel = "1.32/stable", classic = true }
"snap:openstackclients" = { channel = "latest/stable" }
"snap:lxd" = { channel = "latest/stable" }
"snap:k8s" = { channel = "1.32-classic/stable", classic = true }

[tools]
python = "3.12.12"
# Installs isolated Python tools; Poetry owns project dependencies.
uv = "0.13.6"
# Temporary until canonical/juju-k8s-crashdump#21 lands.
"pypi:pipx" = { version = "1.18.8", depends = ["python", "uv"] }
"pypi:poetry" = { version = "2.3.0", depends = ["python", "uv"] }
"aqua:jqlang/jq" = "1.8.2"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:trufflesecurity/trufflehog" = "3.56.0"
"aqua:cli/cli" = "2.103.3"
"aqua:helm/helm" = "3.21.4"
node = "24.22.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:mpalmer/action-validator" = "0.6.0"

[tools."npm:markdownlint-cli2"]
version = "0.24.0"
depends = ["node"]

[tools."pypi:zizmor"]
version = "1.5.1"
depends = ["python", "uv"]

[tools."pypi:ruff"]
version = "0.5.7"
depends = ["python", "uv"]

[tools."pypi:bandit"]
version = "1.9.4"
extras = "toml"
depends = ["python", "uv"]

[tools."pypi:yamlfix"]
version = "1.19.1"
depends = ["python", "uv"]

[tools."pypi:git+https://github.com/juju/juju-crashdump.git"]
version = "bde242ccfdd91cb2372f26d41d62d7b230660c08"
with = ["ssh-agent-setup==2.0.1"]
python = "3.12.12"
depends = ["python", "uv"]

[tools."pypi:git+https://github.com/canonical/juju-k8s-crashdump.git"]
version = "22ef04caaeeb94ad6ed49f8392b6bada65184569"
uvx = false
python = "3.12.12"
depends = ["python", "pypi:pipx"]
