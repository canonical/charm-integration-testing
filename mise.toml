[task_config]
includes = ["scripts", "mise-tasks"]
excludes = ["scripts/*.py"]

[settings]
lockfile = true
locked = true
task.run_auto_install = false

[bootstrap.packages]
"snap:juju" = { channel = "3/stable" }
"snap:kubectl" = { channel = "1.32/stable", classic = true }
"snap:openstackclients" = { channel = "latest/stable" }
"snap:lxd" = { channel = "latest/stable" }

[tools]
python = "3.12.12"
# Required by mise's Python-tool installer and dependency locks, not project dependency management.
uv = "0.13.6"
pipx = "1.18.8"
"pipx:poetry" = "2.3.0"
"aqua:jqlang/jq" = { version = "1.8.2", lazy = true, lazy_bins = ["jq"] }
"aqua:mikefarah/yq" = { version = "4.54.1", lazy = true, lazy_bins = ["yq"] }
"aqua:trufflesecurity/trufflehog" = { version = "3.56.0", lazy = true, lazy_bins = ["trufflehog"] }
node = { version = "24.22.0", lazy = true, lazy_bins = ["node", "npm", "npx"] }
"aqua:cli/cli" = { version = "2.103.3", lazy = true, lazy_bins = ["gh"] }
"aqua:gitleaks/gitleaks" = { version = "8.30.1", lazy = true, lazy_bins = ["gitleaks"] }
"aqua:mpalmer/action-validator" = { version = "0.6.0", lazy = true, lazy_bins = ["action-validator"] }
"aqua:helm/helm" = { version = "3.21.4", lazy = true, lazy_bins = ["helm"] }

[tools."npm:markdownlint-cli2"]
version = "0.24.0"
lazy = true
lazy_bins = ["markdownlint-cli2"]
depends = ["node"]

[tools."pipx:zizmor"]
version = "1.5.1"
lazy = true
lazy_bins = ["zizmor"]
depends = ["python", "uv", "pipx"]

[tools."pipx:ruff"]
version = "0.5.7"
lazy = true
lazy_bins = ["ruff"]
depends = ["python", "uv", "pipx"]

[tools."pipx:bandit"]
version = "1.9.4"
extras = "toml"
lazy = true
lazy_bins = ["bandit"]
depends = ["python", "uv", "pipx"]

[tools."pipx:yamlfix"]
version = "1.19.1"
lazy = true
lazy_bins = ["yamlfix"]
depends = ["python", "uv", "pipx"]

[tools."pypi:git+https://github.com/juju/juju-crashdump.git"]
version = "bde242ccfdd91cb2372f26d41d62d7b230660c08"
with = ["ssh-agent-setup==2.0.1"]
python = "3.12.12"
lazy = true
lazy_bins = ["juju-crashdump", "ssh-agent-setup"]
depends = ["python", "uv"]

[tools."pypi:git+https://github.com/canonical/juju-k8s-crashdump.git"]
version = "22ef04caaeeb94ad6ed49f8392b6bada65184569"
uvx = false
python = "3.12.12"
lazy = true
lazy_bins = ["juju-k8s-crashdump"]
depends = ["python", "uv"]
