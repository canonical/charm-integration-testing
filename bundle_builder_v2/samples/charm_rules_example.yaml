---
# Example per-charm rule file (YAML)
# Scope: only this charm's endpoints and provider requirements.
# No direct references to other specific charms; only interfaces, capabilities, and selectors.
version: 1
charm: juju-jimm-k8s
endpoints:
  # Override/extend metadata if needed
  database:
    role: requires
    interface: postgresql_client
    capacity: 1  # how many connections this endpoint can accept (for provides) or needs (for requires)
    required: true
    provider_selector:
      interface: postgresql_client
      channel_regex: ^14/  # prefer matching tracks/series
      tags: [sql, relational]
  oauth:
    role: requires
    interface: oauth
    required: true
  oauth-tls:
    role: requires
    interface: oauth
    required: false  # becomes required via rules below
    provider_selector:
      interface: oauth
      requires_tls: true
  vault:
    role: requires
    interface: vault-kv
    required: false
rules:
  mutually_exclusive:
    - endpoints: [oauth, oauth-tls]
      min: 1  # at least one must be used
      max: 1  # at most one (so exactly one)
  conditional_requirements:
    - if:
        endpoint: oauth-tls  # if oauth-tls is used
      then:
        require:
          - endpoint: database  # require database too (could be implicit already)
          - endpoint: oauth-tls  # stays required once chosen
        forbid: []
  same_application:
    - endpoints: [database, oauth]  # both must connect to the same provider app (e.g., same hydra+pg bundle)
  provider_constraints:
    - endpoint: oauth
      require_provider_tags: [oidc-provider]
      forbid_provider_tags: [legacy-oauth1]
    - endpoint: database
      require_provider_channel_regex: ^14/
  capacity_overrides:
    - endpoint: database
      max_clients: 1  # if this charm provided the endpoint; included for completeness
  bridges:
    - resource: certificates
      via_endpoint: oauth-tls  # if oauth-tls is connected to a provider that sources certs, transitively satisfy certs
  priorities:
    # Optional: bias solver choices
    endpoint_preference:
      oauth: 5  # lower is better; prefer plain oauth over oauth-tls
      oauth-tls: 10
    provider_preference:
      oauth:
        tag=oidc-provider: 1
        tag=legacy-oauth1: 100
