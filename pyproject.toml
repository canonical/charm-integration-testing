[project]
name = "charm-integration-testing-meta"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.10"


[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
charm-integration-testing = { path = "./charm_integration_testing", develop = true }
bundle-builder = { path = "./bundle_builder", develop = true }
charmhub-mapper = { path = "./charmhub_mapper", develop = true }


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.5"
bandit = "^1.7.9"
pytest-cov = "^6.2.1"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
timeout = 600

log_cli = true
log_cli_level = "INFO"
log_format = "%(levelname)s %(message)s"

junit_logging = "log"
junit_log_passing_tests = true
junit_duration_report = "total"

[tool.bandit.assert_used]
skips = ['charm_integration_testing/test_suite/*']
