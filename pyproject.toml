[project]
name = "charm-integration-testing-meta"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["bundle_builder_x", "charm_integration_testing", "validators/*"]

[tool.uv.sources]
"bundle-builder-x" = { workspace = true }
"charm-integration-testing" = { workspace = true }
"validators-alertmanager-dispatch" = { workspace = true }
"validators-azure-storage" = { workspace = true }
"validators-base" = { workspace = true }
"validators-cassandra-client" = { workspace = true }
"validators-catalogue" = { workspace = true }
"validators-certificate-transfer" = { workspace = true }
"validators-config-server" = { workspace = true }
"validators-cross-model-mesh" = { workspace = true }
"validators-cve-catalog" = { workspace = true }
"validators-engine" = { workspace = true }
"validators-etcd-client" = { workspace = true }
"validators-external-provider" = { workspace = true }
"validators-grafana-dashboard" = { workspace = true }
"validators-grafana-datasource" = { workspace = true }
"validators-http-interface" = { workspace = true }
"validators-ingress" = { workspace = true }
"validators-ingress-auth" = { workspace = true }
"validators-ingress-per-unit" = { workspace = true }
"validators-istio-ingress-route" = { workspace = true }
"validators-kafka-client" = { workspace = true }
"validators-kyuubi-client" = { workspace = true }
"validators-livepatch-pro-airgapped-server" = { workspace = true }
"validators-loki-push-api" = { workspace = true }
"validators-mongodb-client" = { workspace = true }
"validators-mysql" = { workspace = true }
"validators-mysql-client" = { workspace = true }
"validators-object-storage" = { workspace = true }
"validators-opensearch-client" = { workspace = true }
"validators-parca-scrape" = { workspace = true }
"validators-parca-store" = { workspace = true }
"validators-pgsql" = { workspace = true }
"validators-postgresql-client" = { workspace = true }
"validators-prometheus-remote-write" = { workspace = true }
"validators-prometheus-scrape" = { workspace = true }
"validators-runner" = { workspace = true }
"validators-s3" = { workspace = true }
"validators-saml" = { workspace = true }
"validators-smtp" = { workspace = true }
"validators-temporal-host-info" = { workspace = true }
"validators-test-utils" = { workspace = true }
"validators-tracing" = { workspace = true }
"validators-trino-catalog" = { workspace = true }
"validators-trino-client" = { workspace = true }
"validators-update-status-check" = { workspace = true }
"validators-validate-action" = { workspace = true }
"validators-zookeeper" = { workspace = true }

[dependency-groups]
dev = [
    "bandit[toml]==1.9.4",
    "mypy>=1.19.0,<2.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "ruff==0.5.7",
    "yamlfix==1.19.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
timeout = 14400

log_cli = true
log_cli_level = "INFO"
log_format = "%(levelname)s %(message)s"

addopts = "--tb=short"

junit_family = "legacy"
junit_logging = "log"
junit_log_passing_tests = true
junit_duration_report = "total"

[tool.bandit.assert_used]
skips = ['charm_integration_testing/test_suite/*']

[tool.yamlfix]
sequence_style = "keep_style"
preserve_quotes = true

[tool.mypy]
python_version = "3.10"
plugins = ['pydantic.mypy']
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
disable_error_code = ["untyped-decorator", "method-assign", "call-arg"]

[[tool.mypy.overrides]]
# cassandra-driver ships no inline type hints (no py.typed marker) and no third-party stub
# package exists on PyPI, unlike e.g. psycopg2 (types-psycopg2) or PyMySQL (types-PyMySQL).
module = "cassandra.*"
ignore_missing_imports = true
