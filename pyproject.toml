[project]
name = "charm-integration-testing-meta"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.10,<4.0"


[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
charm-integration-testing = { path = "./charm_integration_testing", develop = true }
bundle-builder = { path = "./bundle_builder", develop = true }
validators-base = { path = "./validators/base", develop = true }
validators-postgresql-client = { path = "./validators/postgresql_client", develop = true }
validators-runner = { path = "./validators/runner", develop = true }


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.5"
bandit = "^1.7.9"
pytest-cov = "^6.2.1"
mypy = "^1.19.0"
types-pyyaml = "^6.0.12.20250915"
types-requests = "^2.32.4.20250913"
yamlfix = ">=1.8.0,<2.0.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
timeout = 1800

log_cli = true
log_cli_level = "INFO"
log_format = "%(levelname)s %(message)s"

junit_family = "legacy"
junit_logging = "log"
junit_log_passing_tests = true
junit_duration_report = "total"

[tool.bandit.assert_used]
skips = ['charm_integration_testing/test_suite/*']

[tool.mypy]
python_version = "3.10"
plugins = ['pydantic.mypy']
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
disable_error_code = ["untyped-decorator", "method-assign", "call-arg"]
