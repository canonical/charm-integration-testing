---
# cloud-config
# charm-integration-testing development sandbox base image.
#
# Provisions base packages, the /project mount point, and an nginx caching
# reverse proxy for the Charmhub/Snapcraft APIs (see write_files below).
# Substrate setup (k8s or lxd) is done separately inside the VM via:
#   development-sandbox/bin/setup-k8s.sh
#   development-sandbox/bin/setup-lxd.sh
#
# Launch via:
#   scripts/sandbox.sh up
package_update: true
packages:
  - python3-pip
  - python3-venv
  - nginx
write_files:
  - path: /etc/nginx/sites-available/api-cache
    owner: root:root
    permissions: "0644"
    content: |
      # Define the cache parameters
      proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=4h use_temp_path=off;
      server {
          listen 8080;
          server_name localhost;

          # Enable the cache
          proxy_cache api_cache;

          # CRITICAL: Allow caching for POST requests (used heavily by refresh endpoints)
          proxy_cache_methods GET HEAD POST;

          # CRITICAL: Include the request body in the cache key so different refresh
          # requests don't get served the same cached response.
          proxy_cache_key "$scheme$proxy_host$request_uri|$request_body";

          # Cache successful 200 OK responses for 4 hours
          proxy_cache_valid 200 4h;

          # Add a header so you can debug if the cache was a HIT or MISS
          add_header X-Proxy-Cache $upstream_cache_status;

          # -----------------------------------
          # Route 1: Charmhub API
          # -----------------------------------
          location /charmhub/ {
              # Strip the /charmhub/ prefix before forwarding to the real API
              rewrite ^/charmhub/(.*) /$1 break;
              proxy_pass https://api.charmhub.io;
              proxy_set_header Host api.charmhub.io;
              proxy_ssl_server_name on;

              # Ensure the content type is passed correctly for POST requests
              proxy_set_header Content-Type application/json;
          }

          # -----------------------------------
          # Route 2: Snapcraft API
          # -----------------------------------
          location /snapcraft/ {
              # Strip the /snapcraft/ prefix before forwarding to the real API
              rewrite ^/snapcraft/(.*) /$1 break;
              proxy_pass https://api.snapcraft.io;
              proxy_set_header Host api.snapcraft.io;
              proxy_ssl_server_name on;

              # Ensure the content type is passed correctly for POST requests
              proxy_set_header Content-Type application/json;
          }
      }
runcmd:
  - mkdir -p /project
  - chown ubuntu:ubuntu /project
  - mkdir -p /var/cache/nginx/api_cache
  - ln -sf /etc/nginx/sites-available/api-cache /etc/nginx/sites-enabled/api-cache
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl enable --now nginx
  - systemctl reload nginx
final_message: |-
  Sandbox base image ready.
  Run 'scripts/sandbox.sh up' on the host to finish provisioning.
  nginx API cache listening on http://localhost:8080
  (proxies /charmhub/ -> api.charmhub.io, /snapcraft/ -> api.snapcraft.io)
