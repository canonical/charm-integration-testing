---
name: Clean up K8s environments
run-name: Cleaning up ${{ inputs.environment }} K8s environment
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: true
permissions:
  contents: read  # only needed for private repos
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to clean.
        type: choice
        default: staging
        options: [staging, production]
      age_threshold:
        description: Age threshold in minutes (resources older than this will be deleted)
        type: number
        default: 240
  workflow_call:
    inputs:
      environment:
        description: Environment to clean.
        type: string
        required: true
      age_threshold:
        description: Age threshold in minutes (resources older than this will be deleted)
        type: number
        default: 240
    secrets:
      PROD_SQA_KUBECONFIG:
        required: true
      STG_SQA_KUBECONFIG:
        required: true
jobs:
  cleanup-k8s:
    name: Clean up any leftover K8s artifacts from old Charm QA environments
    runs-on: [self-hosted, charm_qa]
    env:
      AGE_THRESHOLD: ${{ inputs.age_threshold }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install kubectl
        uses: ./.github/actions/install-with-retry
        with:
          command: sudo snap install kubectl --classic
      - name: Setup kube config
        shell: bash
        env:
          environment: ${{ inputs.environment }}
          production_kubeconfig: ${{ secrets.PROD_SQA_KUBECONFIG }}
          staging_kubeconfig: ${{ secrets.STG_SQA_KUBECONFIG }}
        run: |
          case "$environment" in
            "production") echo "$production_kubeconfig" > "kubeconfig" ;;
            "staging") echo "$staging_kubeconfig" > "kubeconfig" ;;
            *) echo "Unknown environment '$environment'"; exit 1 ;;
          esac
          echo "KUBECONFIG=$(realpath kubeconfig)" >> $GITHUB_ENV
      - name: Remove orphaned rawfile PV directories from nodes
        shell: bash
        run: |
          set -euo pipefail

          # On Juju 4 with K8s, destroy-controller --destroy-storage can leave workload PVCs
          # undeleted. Because the PVC remains Bound, the PV never transitions to Released, the
          # rawfile CSI external-provisioner never calls DeleteVolume, and the on-disk directory
          # under /var/snap/k8s/common/rawfile-storage is never removed. This step iterates over
          # every node and deletes any on-disk rawfile directory that has no corresponding PV
          # still known to k8s.
          # Related: https://github.com/juju/juju/issues/22309
          STORAGE_PATH="/var/snap/k8s/common/rawfile-storage"

          # Collect names of all PVs still known to k8s after the deletions above.
          # Any on-disk directory not in this list is an orphan and should be removed.
          if ! KNOWN_PVS_RAW=$(kubectl get pv \
            --output jsonpath='{range .items[*]}{.metadata.name}{" "}{end}'); then
            echo "Failed to retrieve PersistentVolumes; aborting orphan cleanup"
            exit 1
          fi
          KNOWN_PVS=$(xargs <<< "$KNOWN_PVS_RAW")
          echo "Known PVs: ${KNOWN_PVS:-none}"
          NODES=$(kubectl get nodes \
            --output jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          if [[ -z "$NODES" ]]; then
            echo "No nodes found, skipping orphan cleanup"
            exit 0
          fi
          while IFS= read -r node; do
            echo "==> Checking node: $node"

            # kubectl debug creates the pod and returns immediately without streaming output.
            # Capture the pod name from its output, then wait for completion and print logs.
            pod_name=$(kubectl debug "node/$node" \
              --image=ubuntu:24.04 \
              --profile=sysadmin \
              -- bash -c "
                storage=\"/host${STORAGE_PATH}\"
                known_pvs='${KNOWN_PVS}'
                [[ -d \"\$storage\" ]] || { echo '  (no rawfile-storage directory)'; exit 0; }
                for dir in \$(ls \"\$storage\" 2>/dev/null); do
                  found=false
                  for pv in \$known_pvs; do
                    [[ \"\$dir\" == \"\$pv\" ]] && found=true && break
                  done
                  if \$found; then
                    echo \"  OK: \$dir\"
                  else
                    size=\$(stat --format='%s' \"\$storage/\$dir/disk.img\" 2>/dev/null || echo 0)
                    human=\$(numfmt --to=iec \"\$size\" 2>/dev/null || echo \"\${size}B\")
                    echo \"  DELETING orphan: \$dir (apparent: \$human)\"
                    rm -rf \"\$storage/\$dir\"
                  fi
                done
              " 2>&1 | grep -oE 'node-debugger-[^ .]+' | head -1)
            if [[ -z "$pod_name" ]]; then
              echo "  Warning: could not determine debug pod name for $node"
              continue
            fi

            # Wait up to 5 minutes for the pod to finish, then print its logs
            kubectl wait "pod/$pod_name" \
              --for=jsonpath='{.status.phase}'=Succeeded \
              --timeout=5m 2>/dev/null \
              || kubectl wait "pod/$pod_name" \
                   --for=jsonpath='{.status.phase}'=Failed \
                   --timeout=10s 2>/dev/null \
              || true
            kubectl logs "pod/$pod_name" || echo "  Warning: could not retrieve logs for $pod_name"
            kubectl delete "pod/$pod_name" --ignore-not-found=true --timeout=2m
          done <<< "$NODES"
      - name: Find all model and controller namespaces older than an hour
        shell: bash
        run: |
          kubectl get namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.metadata.name | test("^(controller|model)-[0-9]+-[0-9]+$|^controller-pytest-tmp-controller-[a-z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all webhook configurations older than an hour
        shell: bash
        run: |
          kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all juju-credential service accounts older than an hour
        shell: bash
        run: |
          kubectl get serviceaccounts --all-namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.metadata.name | test("^juju-credentials?-[a-zA-Z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .metadata.namespace + ":" + .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all juju-credential secrets older than an hour
        shell: bash
        run: |
          kubectl get secrets --all-namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.type == "kubernetes.io/service-account-token") |
            select(.metadata.name | test("^juju-credentials?-[a-zA-Z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .metadata.namespace + ":" + .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find Released rawfile PersistentVolumes
        shell: bash
        run: |
          # Released rawfile PVs should be cleaned up by the CSI driver automatically, but
          # will get stuck if the node they were provisioned on no longer exists. Add them to
          # the delete list
          kubectl get pv --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.status.phase == "Released") |
            select(.spec.storageClassName == "csi-rawfile-default") |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Remove all resources
        shell: bash
        run: |-
          # Group resources by namespace
          declare -A namespaced_resources
          cluster_resources=()
          while IFS= read -r line; do 
            if [[ "$line" == *:* ]]; then
              namespace="${line%%:*}"
              resource="${line#*:}"
              namespaced_resources["$namespace"]+="$resource "
            else
              cluster_resources+=("$line")
            fi
          done < resources_to_remove.txt

          # Delete cluster-scoped resources
          if [ ${#cluster_resources[@]} -gt 0 ]; then
            kubectl delete "${cluster_resources[@]}" --timeout=25m &
          fi

          # Delete namespaced resources (one command per namespace)
          for namespace in "${!namespaced_resources[@]}"; do
            kubectl delete ${namespaced_resources[$namespace]} --namespace="$namespace" --timeout=25m &
          done
          wait
