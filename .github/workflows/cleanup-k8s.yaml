name: Clean up K8s environments
run-name: "Cleaning up ${{ inputs.environment }} K8s environment"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: true

permissions:
  contents: read # only needed for private repos

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to clean."
        type: choice
        default: staging
        options:
          - staging
          - production
  workflow_call:
    inputs:
      environment:
        description: "Environment to clean."
        type: string
        required: true
    secrets:
      PROD_SQA_KUBECONFIG:
        required: true
      STG_SQA_KUBECONFIG:
        required: true
jobs:
  cleanup-k8s:
    name: Clean up any leftover K8s artifacts from old Charm QA environments
    runs-on:
      - self-hosted
      - charm_qa
    steps:
      - name: Install kubectl
        shell: bash
        run: |
          for ((attempt = 1; ; attempt++)); do
            if sudo snap install kubectl --classic; then
              break
            elif [ "$attempt" -lt 3 ]; then
              echo "Failed, retrying..."
              sleep 5
            else
              exit 1
            fi
          done

      - name: Setup kube config
        shell: bash
        env:
          environment: ${{ inputs.environment }}
          production_kubeconfig: ${{ secrets.PROD_SQA_KUBECONFIG }}
          staging_kubeconfig: ${{ secrets.STG_SQA_KUBECONFIG }}
        run: |
          case "$environment" in
            "production") echo "$production_kubeconfig" > "kubeconfig" ;;
            "staging") echo "$staging_kubeconfig" > "kubeconfig" ;;
            *) echo "Unknown environment '$environment'"; exit 1 ;;
          esac
          echo "KUBECONFIG=$(realpath kubeconfig)" >> $GITHUB_ENV

      - name: Find all model and controller namespaces older than an hour
        shell: bash
        run: |
          kubectl get namespaces --output json | jq --raw-output '
            .items[] |
            select(.metadata.name | test("^(controller|model)-[0-9]+-[0-9]+$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > 3600) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt

      - name: Find all webhook configurations older than an hour
        shell: bash
        run: |
          kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations --output json | jq --raw-output '
            .items[] |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > 3600) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt

      - name: Find all juju-credential service accounts older than an hour
        shell: bash
        run: |
          kubectl get serviceaccounts --namespace kube-system --output json | jq --raw-output '
            .items[] |
            select(.metadata.name | test("^juju-credential-")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > 3600) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt

      - name: Find all juju-credential secrets older than an hour
        shell: bash
        run: |
          kubectl get secrets --namespace kube-system --output json | jq --raw-output '
            .items[] |
            select(.type == "kubernetes.io/service-account-token") |
            select(.metadata.name | test("^juju-credential-")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > 3600) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt

      - name: Remove all resources
        shell: bash
        run: |
          cat resources_to_remove.txt | xargs --no-run-if-empty kubectl delete --timeout=25m --namespace=kube-system
