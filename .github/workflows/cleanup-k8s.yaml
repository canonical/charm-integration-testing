---
name: Clean up K8s environments
run-name: Cleaning up ${{ inputs.environment }} K8s environment
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: true
permissions:
  contents: read  # only needed for private repos
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to clean.
        type: choice
        default: staging
        options: [staging, production]
      age_threshold:
        description: Age threshold in minutes (resources older than this will be deleted)
        type: number
        default: 240
  workflow_call:
    inputs:
      environment:
        description: Environment to clean.
        type: string
        required: true
      age_threshold:
        description: Age threshold in minutes (resources older than this will be deleted)
        type: number
        default: 240
    secrets:
      PROD_SQA_KUBECONFIG:
        required: true
      STG_SQA_KUBECONFIG:
        required: true
jobs:
  cleanup-k8s:
    name: Clean up any leftover K8s artifacts from old Charm QA environments
    runs-on: [self-hosted, charm_qa]
    env:
      AGE_THRESHOLD: ${{ inputs.age_threshold }}
    steps:
      - name: Install kubectl
        shell: bash
        run: |
          for ((attempt = 1; ; attempt++)); do
            if sudo snap install kubectl --classic; then
              break
            elif [ "$attempt" -lt 3 ]; then
              echo "Failed, retrying..."
              sleep 5
            else
              exit 1
            fi
          done
      - name: Setup kube config
        shell: bash
        env:
          environment: ${{ inputs.environment }}
          production_kubeconfig: ${{ secrets.PROD_SQA_KUBECONFIG }}
          staging_kubeconfig: ${{ secrets.STG_SQA_KUBECONFIG }}
        run: |
          case "$environment" in
            "production") echo "$production_kubeconfig" > "kubeconfig" ;;
            "staging") echo "$staging_kubeconfig" > "kubeconfig" ;;
            *) echo "Unknown environment '$environment'"; exit 1 ;;
          esac
          echo "KUBECONFIG=$(realpath kubeconfig)" >> $GITHUB_ENV
      - name: Find all model and controller namespaces older than an hour
        shell: bash
        run: |
          kubectl get namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.metadata.name | test("^(controller|model)-[0-9]+-[0-9]+$|^controller-pytest-tmp-controller-[a-z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all webhook configurations older than an hour
        shell: bash
        run: |
          kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all juju-credential service accounts older than an hour
        shell: bash
        run: |
          kubectl get serviceaccounts --all-namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.metadata.name | test("^juju-credentials?-[a-zA-Z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .metadata.namespace + ":" + .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all juju-credential secrets older than an hour
        shell: bash
        run: |
          kubectl get secrets --all-namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.type == "kubernetes.io/service-account-token") |
            select(.metadata.name | test("^juju-credentials?-[a-zA-Z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .metadata.namespace + ":" + .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Remove all resources
        shell: bash
        run: |-
          # Group resources by namespace
          declare -A namespaced_resources
          cluster_resources=()
          while IFS= read -r line; do 
            if [[ "$line" == *:* ]]; then
              namespace="${line%%:*}"
              resource="${line#*:}"
              namespaced_resources["$namespace"]+="$resource "
            else
              cluster_resources+=("$line")
            fi
          done < resources_to_remove.txt

          # Delete cluster-scoped resources
          if [ ${#cluster_resources[@]} -gt 0 ]; then
            kubectl delete "${cluster_resources[@]}" --timeout=25m &
          fi

          # Delete namespaced resources (one command per namespace)
          for namespace in "${!namespaced_resources[@]}"; do
            kubectl delete ${namespaced_resources[$namespace]} --namespace="$namespace" --timeout=25m &
          done
          wait
