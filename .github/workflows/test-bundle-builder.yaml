name: Test Bundle Builder

on:
  pull_request:
permissions:
  contents: read # only needed for private repos

jobs:
  test-bundle-builder:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: grafana-agent-k8s
            target_endpoint: grafana-dashboards-provider
            neighbor: grafana-k8s
            neighbor_endpoint: grafana-dashboard
            substrate: kubernetes
            revision: default
            series: default

          - target: istio-gateway
            target_endpoint: istio-pilot
            neighbor: kfp-ui
            neighbor_endpoint: kfp-ui
            substrate: kubernetes
            revision: default
            series: default

          - target: istio-gateway
            target_endpoint: metrics-endpoint
            neighbor: prometheus-k8s
            neighbor_endpoint: metrics-endpoint
            substrate: kubernetes
            revision: default
            series: default

          - target: vault-k8s
            target_endpoint: vault-pki
            neighbor: grafana-k8s
            neighbor_endpoint: certificates
            substrate: kubernetes
            revision: 354
            series: 24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install poetry
        run: pipx install poetry==2.0.1

      - name: Install dependencies
        run: poetry install

      - name: Run bundle builder
        env:
          target: ${{ matrix.target }}
          target_endpoint: ${{ matrix.target_endpoint }}
          neighbor: ${{ matrix.neighbor }}
          neighbor_endpoint: ${{ matrix.neighbor_endpoint }}
          substrate: ${{ matrix.substrate }}
          revision: ${{ matrix.revision }}
          series: ${{ matrix.series }}
        run: |
          ./scripts/build-bundle.sh \
            --charms \
              "target::${target}::${revision}::${series}" \
              "neighbor::${neighbor}::default::default" \
            --integrations "target:${target_endpoint}::neighbor:${neighbor_endpoint}" \
            --substrate "${substrate}" \
            --output-file generated-bundle.yaml

          echo '### Generated Juju Bundle' >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat generated-bundle.yaml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
