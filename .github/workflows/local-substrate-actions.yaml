---
name: Local Substrate Actions
on:
  pull_request:
    paths:
      - actions/**
      - mise-tasks/setup*
      - mise.toml
      - mise.lock
      - .mise-version
      - static/environments.yaml
      - static/github-runners.yaml
      - static/substrates/*.yaml
      - .github/actions/get-environment-info/action.yaml
      - .github/actions/pick-runner/action.yaml
      - .github/actions/setup-environment/**
      - .github/workflows/local-substrate-actions.yaml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  environment-config:
    name: Validate GitHub-hosted environment configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pick runner
        id: pick
        uses: ./.github/actions/pick-runner
        with:
          target_environment: github-runner-k8s-1
          neighbor_environment: github-runner-lxd-1
      - name: Get Kubernetes environment info
        id: k8s
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: github-runner-k8s-1
      - name: Get LXD environment info
        id: lxd
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: github-runner-lxd-1
      - name: Validate environment outputs
        env:
          RUNNER_LABELS: ${{ steps.pick.outputs.runner-labels }}
          K8S_CLOUD_TYPE: ${{ steps.k8s.outputs.cloud-type }}
          K8S_PLATFORM: ${{ steps.k8s.outputs.platform }}
          K8S_ARCH: ${{ steps.k8s.outputs.arch }}
          K8S_CREDENTIALS_SECRET: ${{ steps.k8s.outputs.credentials-secret }}
          LXD_CLOUD_TYPE: ${{ steps.lxd.outputs.cloud-type }}
          LXD_PLATFORM: ${{ steps.lxd.outputs.platform }}
          LXD_ARCH: ${{ steps.lxd.outputs.arch }}
          LXD_CREDENTIALS_SECRET: ${{ steps.lxd.outputs.credentials-secret }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_LABELS" == '["ubuntu-24.04"]' ]]
          [[ "$K8S_CLOUD_TYPE" == local-k8s && "$K8S_PLATFORM" == kubernetes ]]
          [[ "$K8S_ARCH" == amd64 && -z "$K8S_CREDENTIALS_SECRET" ]]
          [[ "$LXD_CLOUD_TYPE" == local-lxd && "$LXD_PLATFORM" == machine ]]
          [[ "$LXD_ARCH" == amd64 && -z "$LXD_CREDENTIALS_SECRET" ]]
  local-substrates:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Juju
        id: juju
        uses: ./actions/install-juju
        with:
          channel: 3.6/stable
      - name: Check Juju version
        env:
          JUJU_VERSION: ${{ steps.juju.outputs.version }}
        run: |
          echo "Juju $JUJU_VERSION"
          [[ "$JUJU_VERSION" == 3.6.* ]]
      - name: Set up local Kubernetes
        id: k8s
        uses: ./.github/actions/setup-environment/setup-cloud
        with:
          cloud-name: local-k8s
          cloud-type: local-k8s
      # Deploy before setting up LXD, whose FORWARD reset would hide pod egress failures.
      - name: Deploy on Kubernetes
        env:
          CLOUD: ${{ steps.k8s.outputs.cloud-name }}
          KUBECONFIG_PATH: ${{ steps.k8s.outputs.kubeconfig_path }}
        run: |
          set -euo pipefail
          [[ "$CLOUD" == local-k8s && -f "$KUBECONFIG_PATH" ]]
          kubectl --kubeconfig "$KUBECONFIG_PATH" get crd stresschaos.chaos-mesh.org
          juju bootstrap "$CLOUD" k8s-ctrl
          juju add-model test -c k8s-ctrl
          juju set-model-constraints -m k8s-ctrl:test "arch=$(dpkg --print-architecture)"
          juju deploy -m k8s-ctrl:test self-signed-certificates
          juju wait-for application self-signed-certificates -m k8s-ctrl:test \
            --query='status=="active"' --timeout 20m
      - name: Set up local LXD
        id: lxd
        uses: ./.github/actions/setup-environment/setup-cloud
        with:
          cloud-name: local-lxd
          cloud-type: local-lxd
      - name: Deploy on LXD
        env:
          CLOUD: ${{ steps.lxd.outputs.cloud-name }}
        run: |
          set -euo pipefail
          [[ "$CLOUD" == localhost ]]
          juju bootstrap "$CLOUD" lxd-ctrl
          juju add-model test -c lxd-ctrl
          juju set-model-constraints -m lxd-ctrl:test "arch=$(dpkg --print-architecture)"
          juju deploy -m lxd-ctrl:test ubuntu
          juju wait-for application ubuntu -m lxd-ctrl:test \
            --query='status=="active"' --timeout 30m
      - name: Re-run Kubernetes setup
        uses: ./actions/setup-local-k8s
      - name: Check workloads after re-run
        run: |
          set -euo pipefail
          juju wait-for application self-signed-certificates -m k8s-ctrl:test \
            --query='status=="active"' --timeout 5m
          juju wait-for application ubuntu -m lxd-ctrl:test \
            --query='status=="active"' --timeout 5m
      - name: Show status on failure
        if: failure()
        run: |-
          juju status -m k8s-ctrl:test || true
          juju status -m lxd-ctrl:test || true
          sudo k8s status || true
