---
name: Workflow validation
permissions:
  contents: read
on:
  push:
    paths: [.github/workflows/*, .github/actions/**, .mise-version, mise*.toml, mise*.lock,
      mise-tasks/*]
jobs:
  workflow_validation:
    name: Workflow validation
    runs-on: ubuntu-latest
    env:
      MISE_ENV: development
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up project tools
        uses: ./.github/actions/setup-mise
      - name: Lint Actions
        run: |
          find .github/workflows -type f \( -iname \*.yaml -o -iname \*.yml \) \
            | xargs -I {} action-validator --verbose {}
          find .github/actions -type f \( -iname \*.yaml -o -iname \*.yml \) \
            | xargs -I {} action-validator --verbose {}
  workflow_vulnerability_scan:
    name: Workflow vulnerability scanning
    runs-on: ubuntu-latest
    env:
      MISE_ENV: development
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up project tools
        uses: ./.github/actions/setup-mise
      - name: Scan all workflows
        run: |-
          zizmor --pedantic .github
