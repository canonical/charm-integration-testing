---
name: Audit
permissions:
  contents: read  # only needed for private repos
on:
  workflow_dispatch:
jobs:
  audit:
    name: Audit
    runs-on: [self-hosted, solqa]
    environment:
      name: "${{ inputs.environment }}"
    timeout-minutes: 3000
    steps:
    - name: Start the workflow
      id: workflow-start
      shell: bash
      env:
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        # NOTE: This is copied from build-pipeline.yaml and should be kept in sync with its implementation.
        echo "workflow_start_timestamp=$(date +%s)" >> $GITHUB_OUTPUT
        echo "status=successful" >> $GITHUB_ENV

        # workaround until IS fixes network
        sudo ip l set ens3 mtu 1400

        runner_address=$(hostname -I | awk '{print $1}')
        echo "runner_address=${runner_address}" >> $GITHUB_OUTPUT

        retry_count=0
        max_retries=5
        timeout=1
        while [ ${retry_count} -lt ${max_retries} ] && ! ssh-import-id-lp oil-ci-bot; do
            echo "******************************************************"
            echo "Attempt $((retry_count + 1)) of $max_retries"
            retry_count=$((retry_count + 1))
            sleep $timeout
        done

        if [ ${retry_count} -eq ${max_retries} ]; then
            echo "Failed to import key for oil-ci-bot after ${max_retries} attempts"
            exit 1
        fi

        if [[ "${GITHUB_ACTOR}" != "Canonical-Certification-Bot" ]];
        then
          ssh-import-id-gh ${GITHUB_ACTOR} || true
        fi
        echo "Command to connect: ssh -t ubuntu@${runner_address} bash"
        sudo tee /etc/pip.conf <<EOF
        [global]
        proxy= http://squid.internal:3128
        EOF
    - name: "Audit"
      env:
        GIT_APP_CLIENT_ID: ${{ secrets.GIT_APP_CLIENT_ID }}
        GIT_APP_ID: ${{ secrets.GIT_APP_ID }}
        GIT_APP_PRIVATE_KEY: ${{ secrets.GIT_APP_PRIVATE_KEY }}
        PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
        PROD_PS7_LXD: ${{ secrets.PROD_PS7_LXD }}
        PROD_PS7_NOVARC: ${{ secrets.PROD_PS7_NOVARC }}
        PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
        PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
        PROD_TEST_OBSERVER_TOKEN: ${{ secrets.PROD_TEST_OBSERVER_TOKEN }}
        STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
        STG_SQA_NOVARC: ${{ secrets.STG_SQA_NOVARC }}
        STG_TEST_OBSERVER_TOKEN: ${{ secrets.STG_TEST_OBSERVER_TOKEN }}
        SWIFT_OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
        SWIFT_OS_AUTH_URL_PS7: ${{ secrets.SWIFT_OS_AUTH_URL_PS7 }}
        SWIFT_OS_PASSWORD: ${{ secrets.SWIFT_OS_PASSWORD }}
        SWIFT_OS_PASSWORD_PS7: ${{ secrets.SWIFT_OS_PASSWORD_PS7 }}
        SWIFT_OS_PROJECT_DOMAIN_NAME: ${{ secrets.SWIFT_OS_PROJECT_DOMAIN_NAME }}
        SWIFT_OS_PROJECT_DOMAIN_NAME_PS7: ${{ secrets.SWIFT_OS_PROJECT_DOMAIN_NAME_PS7 }}
        SWIFT_OS_PROJECT_NAME: ${{ secrets.SWIFT_OS_PROJECT_NAME }}
        SWIFT_OS_PROJECT_NAME_PS7: ${{ secrets.SWIFT_OS_PROJECT_NAME_PS7 }}
        SWIFT_OS_REGION_NAME: ${{ secrets.SWIFT_OS_REGION_NAME }}
        SWIFT_OS_REGION_NAME_PS7: ${{ secrets.SWIFT_OS_REGION_NAME_PS7 }}
        SWIFT_OS_USERNAME: ${{ secrets.SWIFT_OS_USERNAME }}
        SWIFT_OS_USERNAME_PS7: ${{ secrets.SWIFT_OS_USERNAME_PS7 }}
        SWIFT_OS_USER_DOMAIN_NAME: ${{ secrets.SWIFT_OS_USER_DOMAIN_NAME }}
        SWIFT_OS_USER_DOMAIN_NAME_PS7: ${{ secrets.SWIFT_OS_USER_DOMAIN_NAME_PS7 }}
        UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}        
      shell: bash
      run: |
        touch /home/ubuntu/.audit
        chmod 0600 /home/ubuntu/.audit
        python3 <<EOF
        import os
        import json
        with open("/home/ubuntu/.audit", "w") as outfile:
            outfile.write(json.dumps(dict(os.environ)))
        EOF
    - name: "Sleep for 24 hours"
      shell: bash
      run: sleep 86400

