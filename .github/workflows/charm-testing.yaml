name: Execute tests against two charms and their integrations
run-name: Testing ${{ github.event.inputs.charm_under_test }}-${{ github.event.inputs.charm_endpoint }} against ${{ github.event.inputs.neighbor }}-${{ github.event.inputs.neighbor_endpoint }} for the ${{ github.event.inputs.execution_id }} test.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture of the charms being tested."
        required: false
        type: choice
        options:
          - amd64
        default: amd64
      charm_under_test:
        description: "charmhub.io name of the primary charm under test"
        required: true
      charm_endpoint:
        description: "Endpoint of the charm being tested."
        required: true
      execution_id:
        description: "Test Observer execution ID to post results from this test to."
        required: true
      juju_channel:
        description: "Juju channel to use while testing."
        required: false
        default: "3/stable"
      neighbor:
        description: "charmhub.io name of the charm to test the primary charm against."
        required: true
      neighbor_endpoint:
        description: "Endpoint for the neighbor charm being tested."
        required: true
      revision:
        description: "Revision number of the charm under test."
        required: true
      series:
        description: "Series to run the charm tests under."
        required: false
        type: choice
        options:
          - 20.04
          - 22.04
          - 24.04
        default: 24.04
      substrate:
        description: "Substrate to run the tests on."
        required: false
        type: choice
        options:
          - kubernetes
        default: kubernetes
jobs:
  execute-charm-test:
    name: Execute integration tests against the charms
    runs-on:
      - self-hosted
      - charm_qa
    steps:
    # - name: Report Test Execution Start To Test Observer
    - name: Clone Repo
      uses: actions/checkout@v4
    - name: Get Bundle
      id: testing-bundle
      shell: bash
      run: |
        charm_pairs=("${{ github.event.inputs.charm_under_test }}_${{ github.event.inputs.charm_endpoint }} ${{ github.event.inputs.neighbor }}_${{ github.event.inputs.neighbor_endpoint }}")
        sorted_pairs=($(echo "$charm_pairs" | tr ' ' '\n' | sort | tr '\n' ' '))
        echo "bundle at ./static/bundles/${sorted_pairs[0]}_${sorted_pairs[1]}.yaml"
        echo "bundle=./static/bundles/${sorted_pairs[0]}_${sorted_pairs[1]}.yaml" >> $GITHUB_OUTPUT
    - name: Setup Kubeconfig
      shell: bash
      run: |
        mkdir -p .kube
        echo '${{ secrets.STG_SQA_KUBECONFIG }}' > .kube/config
    - name: Install Juju
      shell: bash
      run: |
        sudo snap install juju --channel ${{ github.event.inputs.juju_channel }}
        sudo snap install juju-wait --classic
    - name: Install Repository
      shell: bash
      run: |
        sudo apt-get update --quiet
        sudo apt-get install pipx --quiet --assume-yes
        sudo tee /etc/pip.conf <<EOF
        [global]
        proxy= http://squid.internal:3128
        EOF
        pipx install poetry==1.6
        poetry install
    - name: Add K8s
      shell: bash
      run: |
        KUBECONFIG=.kube/config juju add-k8s ps6 --client
    - name: Bootstrap Controller
      id: controller
      shell: bash
      run: |
        date=$(date +"%y-%m-%d-%H-%M-%S")
        # juju will prefix the namespace with "controller"
        juju bootstrap ps6 --bootstrap-constraints root-disk=5G $date
        echo "date=$date" >> $GITHUB_OUTPUT
    - name: Create Model
      shell: bash
      run: |
        juju add-model model-${{ steps.controller.outputs.date }}
    - name: Deploy Bundle
      shell: bash
      run: |
        juju deploy --trust ${{ steps.testing-bundle.outputs.bundle }}
        juju-wait --max_wait 1200 --verbose
        juju status
    - name: Execute Tests
      shell: bash
      run: |
        ./scripts/run-test-suite.sh --model model-${{ steps.controller.outputs.date }} \
        --requirer ${{ github.event.inputs.charm_under_test }}_${{ github.event.inputs.charm_endpoint }} \
        --provider ${{ github.event.inputs.neighbor }}_${{ github.event.inputs.neighbor_endpoint }} \
        --junit-xml
    # - name: Collect Logs
    # - name: Upload Logs
    # - name: Report Test Execution End To Test Observer
    - name: Teardown Model
      if: ${{ always() }}
      shell: bash
      run: |
        timeout 1800 juju destroy-model model-${{ steps.controller.outputs.date }} --destroy-storage --no-prompt
    - name: Teardown Controller
      if: ${{ always() }}
      shell: bash
      run: |
        timeout 1800 juju kill-controller ${{ steps.controller.outputs.date }} --no-prompt
