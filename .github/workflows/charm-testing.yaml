name: Execute tests against two charms and their integrations
run-name: "Testing ${{ inputs.charm_under_test }}:${{ inputs.charm_endpoint }} against ${{ inputs.neighbor }}:${{ inputs.neighbor_endpoint }}. (environment: ${{ inputs.environment }}${{ inputs.execution_id != '' && ', test execution: ' || '' }}${{ inputs.execution_id }}, substrate: ${{ inputs.substrate }})"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}-${{ inputs.execution_id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # only needed for private repos

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run in."
        type: choice
        default: testing
        options:
          - testing
          - staging
          - production
      # TODO SQT-452: GitHub workflow_dispatch is limited to 10 inputs
      # But maybe by the time we need this that will have changed!
      # https://github.com/orgs/community/discussions/8774
      # If not, maybe pass in JSON and use fromJSON()
      # arch:
      #   description: "Architecture of the charms being tested."
      #   required: false
      #   type: choice
      #   options:
      #     - amd64
      #   default: amd64
      charm_under_test:
        description: "charmhub.io name of the primary charm under test"
        required: true
      charm_endpoint:
        description: "Endpoint of the charm being tested."
        required: true
      execution_id:
        description: "Test Observer execution ID to post results from this test to."
        required: false
      juju_channel:
        description: "Juju channel to use while testing."
        required: false
        default: "3/stable"
      neighbor:
        description: "charmhub.io name of the charm to test the primary charm against."
        required: true
      neighbor_endpoint:
        description: "Endpoint for the neighbor charm being tested."
        required: true
      revision:
        description: "Revision number of the charm under test."
        required: true
      series:
        description: "Series to run the charm tests under."
        required: false
        type: choice
        options:
          - "20.04"
          - "22.04"
          - "24.04"
        default: "24.04"
      substrate:
        description: "Substrate to run the tests on"
        required: false
        type: choice
        options:
          - kubernetes
          - openstack
        default: kubernetes
      debug_sleep_after:
        description: The stage of the workflow to sleep after. Enables SSH access.
        required: false
        type: choice
        options:
          - none
          - setup
          - deployment
          - integration
          - log_collection
        default: none
      debug_extra_ssh_imports:
        # The IDs take the form of lp:<value> for Launchpad and gh:<value> for GitHub.
        # The GitHub Actor's key is always included.
        description: A comma-separated list of IDs to use with ssh-import-id in debug mode.
        required: false
        default: ""

env:
  DEBUG_SLEEP_SECONDS: 7200 # 2 hours

jobs:
  execute-charm-test:
    name: Execute integration tests against the charms
    runs-on:
      - self-hosted
      - charm_qa
    env:
      test_observer_api: ${{ inputs.environment == 'production' && vars.PROD_TEST_OBSERVER_API || (inputs.environment == 'staging' && vars.STG_TEST_OBSERVER_API || '') }}
      test_observer_token: ${{ inputs.environment == 'production' && secrets.PROD_TEST_OBSERVER_TOKEN || (inputs.environment == 'staging' && secrets.STG_TEST_OBSERVER_TOKEN || '') }}
      MINIO_CLIENT_FILE: ${{ github.workspace }}/static/mc
      UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Enable Debug Session
        if: ${{ inputs.debug_sleep_after != 'none' }}
        shell: bash
        env:
          SSH_IDS: ${{ inputs.debug_extra_ssh_imports }}
        run: |
          # Always include the GitHub Actor
          mkdir --parents ~/.ssh/
          ssh-import-id "gh:${GITHUB_ACTOR}"

          SSH_IDS=$(echo "${SSH_IDS}" | tr ',' ' ')
          ssh-import-id ${SSH_IDS} || true

          echo "Debug mode enabled. SSH connection details:"
          echo "ssh $(whoami)@$(hostname -I | cut -d ' ' -f 1)"

      - name: Create swap file
        shell: bash
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Generate Juju Model and Controller Name
        id: juju_resources
        shell: bash
        env:
          run_id: ${{ github.run_id }}
        run: |
          name="${run_id}-$(date +'%y%m%d%H%M%S')"
          echo "model=model-$name" >> $GITHUB_OUTPUT
          echo "controller=$name" >> $GITHUB_OUTPUT

      - name: Log job information
        shell: bash
        env:
          environment: ${{ inputs.environment }}
          charm_under_test: ${{ inputs.charm_under_test }}
          charm_endpoint: ${{ inputs.charm_endpoint }}
          execution_id: ${{ inputs.execution_id }}
          juju_channel: ${{ inputs.juju_channel }}
          neighbor: ${{ inputs.neighbor }}
          neighbor_endpoint: ${{ inputs.neighbor_endpoint }}
          revision: ${{ inputs.revision }}
          series: ${{ inputs.series }}
          substrate: ${{ inputs.substrate }}
          model: ${{ steps.juju_resources.outputs.model }}
          controller: ${{ steps.juju_resources.outputs.controller }}
        run: |
          echo "### Job inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`environment\` | \`${environment}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`charm_under_test\` | \`${charm_under_test}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`charm_endpoint\` | \`${charm_endpoint}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`execution_id\` | \`${execution_id}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`juju_channel\` | \`${juju_channel}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor\` | \`${neighbor}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor_endpoint\` | \`${neighbor_endpoint}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`revision\` | \`${revision}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`series\` | \`${series}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`substrate\` | \`${substrate}\` |" >> $GITHUB_STEP_SUMMARY

          echo "### Job variables" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Juju model | \`${model}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Juju controller | \`${controller}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Report Test Execution Start To Test Observer
        if: ${{ !cancelled() && env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/patch-test-execution
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          status: "IN_PROGRESS"
          ci_link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Post 'job_start' event
        if: ${{ !cancelled() && env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "job_start"
          detail: "Charm integration test job started."

      - name: Install Juju
        shell: bash
        env:
          juju_channel: ${{ inputs.juju_channel }}
        run: |
          for ((attempt = 1; ; attempt++)); do
            if sudo snap install juju --channel "${juju_channel}"; then
              break
            elif [ "$attempt" -lt 3 ]; then
              echo "Failed, retrying..."
              sleep 5
            else
              exit 1
            fi
          done
          # Ensure the juju home directory exists
          mkdir -p $HOME/.local/share/juju

      - name: Setup K8s Cloud
        if: ${{ inputs.substrate == 'kubernetes'}}
        id: setup_k8s
        uses: ./.github/actions/setup-environment/setup-k8s
        env:
          k8sprod: ${{ secrets.PROD_SQA_KUBECONFIG }}
          k8sstg: ${{ secrets.STG_SQA_KUBECONFIG }}
        with:
          environment: ${{ inputs.environment }}
          controller: ${{ steps.juju_resources.outputs.controller }}
          model: ${{ steps.juju_resources.outputs.model }}

      - name: Post 'setup_k8s_failed' event
        if: ${{ failure() && env.test_observer_api != '' && inputs.execution_id != '' && steps.setup_k8s.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "setup_k8s_failed"
          detail: "Setup of Kubernetes cloud failed."

      - name: Setup O7k Cloud
        if: ${{ inputs.substrate == 'openstack'}}
        id: setup_o7k
        uses: ./.github/actions/setup-environment/setup-openstack
        env:
          o7kprod: ${{ secrets.PROD_SQA_NOVARC }}
          o7kstg: ${{ secrets.STG_SQA_NOVARC }}
        with:
          environment: ${{ inputs.environment }}
          controller: ${{ steps.juju_resources.outputs.controller }}
          model: ${{ steps.juju_resources.outputs.model }}

      - name: Post 'setup_o7k_failed' event
        if: ${{ failure() && env.test_observer_api != '' && inputs.execution_id != '' && steps.setup_o7k.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "setup_o7k_failed"
          detail: "Setup of OpenStack cloud failed."

      - name: Debug Setup
        if: ${{ !cancelled() && inputs.debug_sleep_after == 'setup' }}
        shell: bash
        run: |
          echo "Sleeping to debug setup"
          sleep ${DEBUG_SLEEP_SECONDS}

      - name: Install Repository
        shell: bash
        run: |
          sudo apt-get update --quiet
          sudo apt-get install pipx --quiet --assume-yes
          sudo tee /etc/pip.conf <<EOF
          [global]
          proxy= http://squid.internal:3128
          EOF
          pipx install poetry==2.0
          HTTPS_PROXY="http://squid.internal:3128" poetry install

      - name: Generate dynamic bundles
        id: build_bundle
        shell: bash
        env:
          charm_under_test: ${{ inputs.charm_under_test }}
          revision: ${{ inputs.revision }}
          series: ${{ inputs.series }}
          neighbor: ${{ inputs.neighbor }}
          charm_endpoint: ${{ inputs.charm_endpoint }}
          neighbor_endpoint: ${{ inputs.neighbor_endpoint }}
          substrate: ${{ inputs.substrate }}
        run: |
          # Run the bundle builder
          set +e
          ./scripts/build-bundle.sh \
            --charms \
              "target::${charm_under_test}::${revision}::${series}" \
              "neighbor::${neighbor}::default::default" \
            --integrations "target:${charm_endpoint}::neighbor:${neighbor_endpoint}" \
            --substrate "${substrate}" \
            --output-file generated-bundle.yaml \
            --output-mermaid generated-bundle.mmd
          rc=$?
          set -e

          # Handle the result
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 2 ]; then
              echo "Bundle generation failed due to invalid input" >&2
              echo "invalid_input=true" >> $GITHUB_OUTPUT
            else
              echo "Bundle generation failed (exit code $rc)" >&2
            fi
            exit "$rc"
          fi

          # Note the generated bundles
          echo "bundle=$(realpath generated-bundle.yaml)" >> $GITHUB_OUTPUT

          echo '### Generated Bundle Mermaid Diagram' >> $GITHUB_STEP_SUMMARY
          echo '```mermaid' >> $GITHUB_STEP_SUMMARY
          cat generated-bundle.mmd >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo '### Generated Juju Bundle' >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat generated-bundle.yaml >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post 'bundle_generated' event
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "bundle_generated"
          detail: "Bundle generated."

      - name: Post 'bundle_generation_failed' event
        if: ${{ failure() && env.test_observer_api != '' && inputs.execution_id != '' && steps.build_bundle.conclusion == 'failure' && steps.build_bundle.outputs.invalid_input != 'true' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "bundle_generation_failed"
          detail: "Bundle generation failed."

      - name: Post 'bundle_generation_invalid_input' event
        if: ${{ failure() && env.test_observer_api != '' && inputs.execution_id != '' && steps.build_bundle.conclusion == 'failure' && steps.build_bundle.outputs.invalid_input == 'true' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "bundle_generation_invalid_input"
          detail: "Bundle generation failed due to invalid input."

      - name: Post 'test_deploy_start' event
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "test_deploy_start"
          detail: "Test deployment started."

      - name: Deploy Bundles
        id: test_deploy
        continue-on-error: true
        shell: bash
        env:
          model: ${{ steps.juju_resources.outputs.model }}
          bundle: ${{ steps.build_bundle.outputs.bundle }}
        run: |
          echo "junit_xml=$(realpath junit-deploy.xml)" >> $GITHUB_OUTPUT
          ./scripts/test-deploy.sh \
            --model "${model}" \
            --bundles "${bundle}" \
            --junit-xml=junit-deploy.xml

      - name: Post 'test_deploy_end' event
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "test_deploy_end"
          detail: "Test deployment finished."

      - name: Debug Deployment Tests
        if: ${{ !cancelled() && inputs.debug_sleep_after == 'deployment' }}
        shell: bash
        run: |
          echo "Sleeping to debug deployment tests"
          sleep ${DEBUG_SLEEP_SECONDS}

      - name: Post 'test_integration_start' event
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "test_integration_start"
          detail: "Test integration started."

      - name: Execute Tests
        id: test_integration
        continue-on-error: true
        shell: bash
        env:
          model: ${{ steps.juju_resources.outputs.model }}
          charm_endpoint: ${{ inputs.charm_endpoint }}
          neighbor_endpoint: ${{ inputs.neighbor_endpoint }}
        run: |
          echo "junit_xml=$(realpath junit-integration.xml)" >> $GITHUB_OUTPUT
          ./scripts/test-integration.sh \
            --model "${model}" \
            --target-application "target" \
            --target-endpoint "${charm_endpoint}" \
            --neighbor-application "neighbor" \
            --neighbor-endpoint "${neighbor_endpoint}" \
            --junit-xml=junit-integration.xml

      - name: Post 'test_integration_end' event
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "test_integration_end"
          detail: "Test integration ended."

      - name: Debug Integration Tests
        if: ${{ !cancelled() && inputs.debug_sleep_after == 'integration' }}
        shell: bash
        run: |
          echo "Sleeping to debug integration tests"
          sleep ${DEBUG_SLEEP_SECONDS}

      - name: Post 'test_teardown_start' event
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "test_teardown_start"
          detail: "Test teardown phase started."

      - name: Teardown charm under test
        id: test_teardown
        continue-on-error: true
        shell: bash
        env:
          model: ${{ steps.juju_resources.outputs.model }}
        run: |
          echo "junit_xml=$(realpath junit-teardown.xml)" >> $GITHUB_OUTPUT
          ./scripts/test-teardown.sh \
            --model "${model}" \
            --applications "target" \
            --junit-xml=junit-teardown.xml

      - name: Post 'test_teardown_end' event
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "test_teardown_end"
          detail: "Test teardown phase finished."

      - name: Merge JUnit output
        id: junit_results
        shell: bash
        env:
          junit_xml_deploy: ${{ steps.test_deploy.outputs.junit_xml }}
          junit_xml_integration: ${{ steps.test_integration.outputs.junit_xml }}
          junit_xml_teardown: ${{ steps.test_teardown.outputs.junit_xml }}
        run: |
          ./scripts/merge-junit.sh \
            "${junit_xml_deploy}" \
            "${junit_xml_integration}" \
            "${junit_xml_teardown}" \
            junit.xml
          echo "junit_xml=$(realpath junit.xml)" >> $GITHUB_OUTPUT
          cat junit.xml

      - name: Post execution metadata to Test Observer
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-execution-metadata
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          junit_xml: ${{ steps.junit_results.outputs.junit_xml }}

      - name: Post results to Test Observer
        if: ${{ env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-results
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          junit_xml: ${{ steps.junit_results.outputs.junit_xml }}

      - name: Call Juju K8s Crashdump
        id: juju_k8s_crashdump
        if: ${{ !cancelled() && inputs.substrate == 'kubernetes'}}
        uses: canonical/juju-k8s-crashdump/actions/juju-k8s-crashdump@5e961799a4fa95030acc32465257ac86c2939c3f
        with:
          kubeconf: ${{ steps.setup_k8s.outputs.kubeconfig_path }}
          controller: ${{ steps.juju_resources.outputs.controller }}
          proxy: http://squid.internal:3128

      - name: Call Juju Crashdump
        id: juju_crashdump
        env:
          controller: ${{ steps.juju_resources.outputs.controller }}
          model: ${{ steps.juju_resources.outputs.model }}
        if: ${{ always() && inputs.substrate == 'openstack'}}
        shell: bash
        run: |
          MODEL_CRASHDUMP=model-logs.tar.gz
          CONTROLLER_CRASHDUMP=controller-logs.tar.gz
          sudo snap install juju-crashdump --classic
          juju-crashdump --model ${controller}:${model} --timeout 300 --small -f 100000000 --compression gz --unit-dump-location ${MODEL_CRASHDUMP} --as-root || True
          juju-crashdump --model ${controller}:controller --timeout 300 --small -f 100000000 --compression gz --unit-dump-location ${CONTROLLER_CRASHDUMP} --as-root || True
          echo "OS_MODEL_CRASHDUMP=$(realpath ${MODEL_CRASHDUMP})" >> $GITHUB_OUTPUT
          echo "OS_CONTROLLER_CRASHDUMP=$(realpath ${CONTROLLER_CRASHDUMP})" >> $GITHUB_OUTPUT

      - name: Collect logs
        id: collect_logs
        if: ${{ !cancelled() }}
        shell: bash
        env:
          crashdump: ${{ steps.juju_k8s_crashdump.outputs.crashdump_path }}
          junit_xml: ${{ steps.junit_results.outputs.junit_xml }}
          generated_bundle: ${{ steps.build_bundle.outputs.bundle }}
          openstack_model_crashdump: ${{ steps.juju_crashdump.outputs.OS_MODEL_CRASHDUMP }}
          openstack_controller_crashdump: ${{ steps.juju_crashdump.outputs.OS_CONTROLLER_CRASHDUMP }}
        run: |
          mkdir -p "logs"
          [ -f "${crashdump}" ] && cp "${crashdump}" "logs/juju-logs.tar.gz"
          [ -f "${junit_xml}" ] && cp "${junit_xml}" "logs/junit.xml"
          [ -f "${generated_bundle}" ] && cp "${generated_bundle}" "logs/generated-bundle.yaml"
          [ -f "${openstack_model_crashdump}" ] && cp "${openstack_model_crashdump}" "logs/model-logs.tar.gz"
          [ -f "${openstack_controller_crashdump}" ] && cp "${openstack_controller_crashdump}" "logs/controller-logs.tar.gz"
          echo "directory_path=$(realpath "logs")" >> $GITHUB_OUTPUT

      - name: Post Logs To Swift
        id: post_logs_to_swift
        if: ${{ !cancelled() && inputs.execution_id != '' }}
        uses: canonical/sqa-cloud-deployment-pipeline/.github/actions/upload-to-swift@173b1936e2c96e317b0f1167509b068b2020e233
        with:
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          log_path: ${{ steps.collect_logs.outputs.directory_path }}
          swift_bucket: charm-qa
          SWIFT_OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
          SWIFT_OS_USERNAME: ${{ secrets.SWIFT_OS_USERNAME }}
          SWIFT_OS_PASSWORD: ${{ secrets.SWIFT_OS_PASSWORD }}
          SWIFT_OS_PROJECT_NAME: ${{ secrets.SWIFT_OS_PROJECT_NAME }}
          SWIFT_OS_REGION_NAME: ${{ secrets.SWIFT_OS_REGION_NAME }}
          SWIFT_OS_USER_DOMAIN_NAME: ${{ secrets.SWIFT_OS_USER_DOMAIN_NAME }}
          SWIFT_OS_PROJECT_DOMAIN_NAME: ${{ secrets.SWIFT_OS_PROJECT_DOMAIN_NAME }}

      - name: Post 'log_collection_finished' event
        if: ${{ !cancelled() && steps.post_logs_to_swift.outcome == 'success' && env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "log_collection_finished"
          detail: "Log collection has completed."

      - name: Debug Post Log Collection
        if: ${{ !cancelled() && inputs.debug_sleep_after == 'log_collection' }}
        shell: bash
        run: |
          echo "Sleeping to debug post log collection"
          sleep ${DEBUG_SLEEP_SECONDS}

      - name: Post links to Test Observer
        if: ${{ !cancelled() && steps.post_logs_to_swift.outcome == 'success' && env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-links
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}

      - name: Post 'job_end' event
        if: ${{ !cancelled() && env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.environment }}/${{ inputs.execution_id }}
          event_name: "job_end"
          detail: "Charm integration test job completed."

      - name: Calculate Job Status
        id: calculate_job_status
        env:
          JUNIT_FILE: ${{ steps.junit_results.outputs.junit_xml }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eu
          sudo snap install yq

          # Validate JUNIT_FILE existence
          if [[ -f "$JUNIT_FILE" ]]; then
              # Parse test status from JUNIT
              tests=$(yq -p xml -oy '.testsuites.+@tests' "$JUNIT_FILE")
              skipped=$(yq -p xml -oy '.testsuites.+@skipped' "$JUNIT_FILE")
              failures=$(yq -p xml -oy '.testsuites.+@failures' "$JUNIT_FILE")
              errors=$(yq -p xml -oy '.testsuites.+@errors' "$JUNIT_FILE")
          else
              echo "Warning: JUNIT_FILE '$JUNIT_FILE' does not exist. Failing job."
              exit 1
          fi

          TEST_STATUS="PASSED"

          # If all tests are skipped, then fail right away.
          if [[ "$tests" -gt 0 && "$tests" -eq "$skipped" ]]; then
              echo "Error: All $tests tests were skipped"
              TEST_STATUS="FAILED"

          # If there is at least one error in the JUNIT, then fail right away
          elif [[ "$failures" -gt 0 || "$errors" -gt 0 ]]; then
              echo "Error: JUNIT has test failures."
              TEST_STATUS="FAILED"
          fi

          echo "Summary: #tests: $tests | Failed: $failures | Errors: $errors | Skipped: $skipped"
          echo "test_status=$TEST_STATUS" >> $GITHUB_OUTPUT

      - name: Mark Test Execution completed on Test Observer with the correct status
        if: ${{ always() && env.test_observer_api != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/patch-test-execution
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}
          status: ${{ steps.calculate_job_status.outputs.test_status != '' && steps.calculate_job_status.outputs.test_status || 'ENDED_PREMATURELY' }}

      - name: Trigger rerun on Test Observer if failure
        if: ${{ failure() && env.test_observer_api != '' && inputs.execution_id != '' && !(steps.build_bundle.conclusion == 'failure' && steps.build_bundle.outputs.invalid_input == 'true') }}
        uses: ./.github/actions/test-observer/trigger-rerun
        with:
          test_observer_api: ${{ env.test_observer_api }}
          test_observer_token: ${{ env.test_observer_token }}
          test_execution_id: ${{ inputs.execution_id }}

      - name: Teardown Controller
        if: ${{ always() }}
        shell: bash
        env:
          controller: ${{ steps.juju_resources.outputs.controller }}
        run: timeout 15m juju kill-controller "${controller}" --no-prompt --timeout 2m
