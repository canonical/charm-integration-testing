---
name: Execute tests against two charms and their integrations
run-name: "Testing ${{ inputs.charm_under_test }}:${{ inputs.charm_endpoint }} against\
  \ ${{ inputs.neighbor }}:${{ inputs.neighbor_endpoint }} (environment: ${{ inputs.target_environment }}${{\
  \ inputs.neighbor_environment != '' && '|' || '' }}${{ inputs.neighbor_environment\
  \ }}${{ inputs.execution_id != '' && ', test execution: ' || '' }}${{ inputs.execution_id\
  \ }})"
concurrency:
  group: ${{ github.workflow }}-${{ inputs.test_observer_environment }}-${{ inputs.execution_id
    || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read  # only needed for private repos
on:
  workflow_dispatch:
    inputs:
      test_observer_environment:
        description: Test Observer environment to report results to.
        required: false
        type: choice
        options: [none, staging, production]
        default: none
      target_environment:
        description: Named GitHub Actions environment to run on (e.g. ps6-sqa-prod_charm_qa_kubernetes-1).
          Replaces the implicit runner label.
        required: true
        type: string
      neighbor_environment:
        description: Named GitHub Actions environment for the cross-model neighbor.
          Empty if not cross-model.
        required: false
        type: string
        default: ''
      charm_under_test:
        description: charmhub.io name of the primary charm under test
        required: true
      charm_endpoint:
        description: Endpoint of the charm being tested.
        required: true
      execution_id:
        description: Test Observer execution ID to post results from this test to.
        required: false
      juju_channel:
        description: Juju channel to use while testing.
        required: false
        default: 3/stable
      neighbor:
        description: charmhub.io name of the charm to test the primary charm against.
        required: true
      neighbor_endpoint:
        description: Endpoint for the neighbor charm being tested.
        required: true
      revision:
        description: Revision number of the charm under test.
        required: false
        default: default
      downgrade_revision:
        description: Revision number to downgrade to during testing, if applicable.
        required: false
        default: default
      channel:
        description: Channel of the charm under test.
        required: false
        default: default
      series:
        description: Series to run the charm tests under.
        required: false
        type: choice
        options: [default, "20.04", "22.04", "24.04"]
        default: default
      debug_sleep_after:
        description: The stage of the workflow to sleep after. Enables SSH access
          or tmate session.
        required: false
        type: choice
        options: [none, setup, log_collection]
        default: none
      debug_extra_ssh_imports:
        # The IDs take the form of lp:<value> for Launchpad and gh:<value> for GitHub.
        # The GitHub Actor's key is always included.
        description: A comma-separated list of IDs to use with ssh-import-id in debug
          mode.
        required: false
        default: ''
      debug_sleep_seconds:
        description: How long (in seconds) to sleep when debug_sleep_after is set
          and the runner uses SSH debug mode.
        required: false
        type: number
        default: 1800
      log_level:
        description: Log level to use for the tests.
        required: false
        type: choice
        options: [DEBUG, INFO, WARNING, ERROR]
        default: INFO
jobs:
  determine-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner-labels }}
      debug-mode: ${{ steps.pick.outputs.debug-mode }}
      pip-proxy: ${{ steps.pick.outputs.pip-proxy }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pick runner
        id: pick
        uses: ./.github/actions/pick-runner
        with:
          target_environment: ${{ inputs.target_environment }}
          neighbor_environment: ${{ inputs.neighbor_environment }}
  execute-charm-test:
    name: Execute integration tests against the charms
    needs: determine-runner
    runs-on: ${{ fromJSON(needs.determine-runner.outputs.runner) }}
    env:
      TEST_OBSERVER_API: ${{ inputs.test_observer_environment == 'production' && vars.PROD_TEST_OBSERVER_API || (inputs.test_observer_environment == 'staging' && vars.STG_TEST_OBSERVER_API || '') }}
      TEST_OBSERVER_TOKEN: ${{ inputs.test_observer_environment == 'production' && secrets.PROD_TEST_OBSERVER_TOKEN || (inputs.test_observer_environment == 'staging' && secrets.STG_TEST_OBSERVER_TOKEN || '') }}
      MINIO_CLIENT_FILE: ${{ github.workspace }}/static/mc
      UV_FILE: ${{ github.workspace }}/static/uv
      UBUNTU_PRO_TOKEN: ${{ secrets.UBUNTU_PRO_TOKEN }}
      VALIDATORS_PATH: ${{ github.workspace }}/validators
      BUNDLE_OUTPUT: ./generated-bundle.yaml
      BUNDLE_MERMAID_OUTPUT: ./generated-bundle.mmd
    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enable Debug Session
        if: ${{ inputs.debug_sleep_after != 'none' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'ssh' }}
        shell: bash
        env:
          SSH_IDS: ${{ inputs.debug_extra_ssh_imports }}
        run: |
          mkdir --parents ~/.ssh/
          ssh-import-id "gh:${GITHUB_ACTOR}"
          SSH_IDS=$(echo "${SSH_IDS}" | tr ',' ' ')
          ssh-import-id ${SSH_IDS} || true
          echo "Debug mode enabled. SSH connection details:"
          echo "ssh $(whoami)@$(hostname -I | cut -d ' ' -f 1)"
      - name: Create swap file
        shell: bash
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
      - name: Generate Juju Model and Controller Name
        id: juju_resources
        shell: bash
        env:
          run_id: ${{ github.run_id }}
        run: |
          name="${run_id}-$(date +'%y%m%d%H%M%S')"
          echo "model=model-$name" >> $GITHUB_OUTPUT
          echo "controller=$name" >> $GITHUB_OUTPUT
      - name: Get target environment info
        id: target_env_info
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: ${{ inputs.target_environment }}
      - name: Get neighbor environment info
        id: neighbor_env_info
        if: ${{ inputs.neighbor_environment != '' }}
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: ${{ inputs.neighbor_environment }}
      - name: Log job information
        shell: bash
        env:
          target_environment: ${{ inputs.target_environment }}
          neighbor_environment: ${{ inputs.neighbor_environment }}
          test_observer_environment: ${{ inputs.test_observer_environment }}
          charm_under_test: ${{ inputs.charm_under_test }}
          charm_endpoint: ${{ inputs.charm_endpoint }}
          execution_id: ${{ inputs.execution_id }}
          juju_channel: ${{ inputs.juju_channel }}
          neighbor: ${{ inputs.neighbor }}
          neighbor_endpoint: ${{ inputs.neighbor_endpoint }}
          revision: ${{ inputs.revision }}
          downgrade_revision: ${{ inputs.downgrade_revision }}
          channel: ${{ inputs.channel }}
          series: ${{ inputs.series }}
          model: ${{ steps.juju_resources.outputs.model }}
          controller: ${{ steps.juju_resources.outputs.controller }}
        run: |
          echo "### Job inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`target_environment\` | \`${target_environment}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor_environment\` | \`${neighbor_environment}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`test_observer_environment\` | \`${test_observer_environment}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`charm_under_test\` | \`${charm_under_test}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`charm_endpoint\` | \`${charm_endpoint}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`execution_id\` | \`${execution_id}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`juju_channel\` | \`${juju_channel}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor\` | \`${neighbor}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor_endpoint\` | \`${neighbor_endpoint}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`revision\` | \`${revision}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`downgrade_revision\` | \`${downgrade_revision}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`channel\` | \`${channel}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`series\` | \`${series}\` |" >> $GITHUB_STEP_SUMMARY
          echo "### Job variables" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Juju model | \`${model}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Juju controller | \`${controller}\` |" >> $GITHUB_STEP_SUMMARY
      - name: Report Test Execution Start To Test Observer
        if: ${{ !cancelled() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/patch-test-execution
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          status: IN_PROGRESS
          ci_link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{github.run_id}}
      - name: Post 'job_start' event
        if: ${{ !cancelled() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: job_start
          detail: Charm integration test job started.
      - name: Install Juju
        uses: ./.github/actions/install-with-retry
        with:
          command: sudo snap install juju --channel "${{ inputs.juju_channel }}"
      - name: Ensure Juju home directory exists
        shell: bash
        run: mkdir -p $HOME/.local/share/juju
      - name: Resolve target credentials
        id: target_creds
        shell: bash
        env:
          KUBECONFIG_SECRET_NAME: ${{ steps.target_env_info.outputs.kubeconfig-secret }}
          NOVARC_SECRET_NAME: ${{ steps.target_env_info.outputs.novarc-secret }}
          PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
          STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
          PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
          PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
        run: |
          [[ -n "${KUBECONFIG_SECRET_NAME}" ]] && echo "kubeconfig=${!KUBECONFIG_SECRET_NAME}" >> "$GITHUB_OUTPUT"
          [[ -n "${NOVARC_SECRET_NAME}" ]] && echo "novarc=${!NOVARC_SECRET_NAME}" >> "$GITHUB_OUTPUT"
      - name: Resolve neighbor credentials
        id: neighbor_creds
        if: ${{ inputs.neighbor_environment != '' }}
        shell: bash
        env:
          KUBECONFIG_SECRET_NAME: ${{ steps.neighbor_env_info.outputs.kubeconfig-secret }}
          NOVARC_SECRET_NAME: ${{ steps.neighbor_env_info.outputs.novarc-secret }}
          PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
          STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
          PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
          PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
        run: |
          [[ -n "${KUBECONFIG_SECRET_NAME}" ]] && echo "kubeconfig=${!KUBECONFIG_SECRET_NAME}" >> "$GITHUB_OUTPUT"
          [[ -n "${NOVARC_SECRET_NAME}" ]] && echo "novarc=${!NOVARC_SECRET_NAME}" >> "$GITHUB_OUTPUT"
      - name: Setup Target K8s Cloud
        if: ${{ steps.target_env_info.outputs.cloud-type == 'k8s' }}
        id: setup_target_k8s
        uses: ./.github/actions/setup-environment/setup-k8s
        with:
          kubeconfig: ${{ steps.target_creds.outputs.kubeconfig }}
      - name: Post 'setup_k8s_failed' event
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' && steps.setup_target_k8s.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: setup_k8s_failed
          detail: Setup of Kubernetes cloud failed.
      - name: Setup Target O7k Cloud
        if: ${{ steps.target_env_info.outputs.cloud-type == 'o7k' }}
        id: setup_target_o7k
        uses: ./.github/actions/setup-environment/setup-openstack
        with:
          novarc: ${{ steps.target_creds.outputs.novarc }}
          controller: ${{ steps.juju_resources.outputs.controller }}
          model: ${{ steps.juju_resources.outputs.model }}
      - name: Post 'setup_o7k_failed' event
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' && steps.setup_target_o7k.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: setup_o7k_failed
          detail: Setup of OpenStack cloud failed.
      - name: Setup Neighbor K8s Cloud
        if: ${{ inputs.neighbor_environment != '' && steps.neighbor_env_info.outputs.cloud-type == 'k8s' }}
        id: setup_neighbor_k8s
        uses: ./.github/actions/setup-environment/setup-k8s
        with:
          kubeconfig: ${{ steps.neighbor_creds.outputs.kubeconfig }}
      - name: Post 'setup_neighbor_k8s_failed' event
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' && steps.setup_neighbor_k8s.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: setup_neighbor_k8s_failed
          detail: Setup of neighbor Kubernetes cloud failed.
      - name: Setup Neighbor O7k Cloud
        if: ${{ inputs.neighbor_environment != '' && steps.neighbor_env_info.outputs.cloud-type == 'o7k' }}
        id: setup_neighbor_o7k
        uses: ./.github/actions/setup-environment/setup-openstack
        with:
          novarc: ${{ steps.neighbor_creds.outputs.novarc }}
          controller: ${{ steps.juju_resources.outputs.controller }}
          model: ${{ steps.juju_resources.outputs.model }}
      - name: Post 'setup_neighbor_o7k_failed' event
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' && steps.setup_neighbor_o7k.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: setup_neighbor_o7k_failed
          detail: Setup of neighbor OpenStack cloud failed.
      - name: Debug Setup
        if: ${{ inputs.debug_sleep_after == 'setup' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'ssh' }}
        shell: bash
        env:
          DEBUG_SLEEP_SECONDS: ${{ inputs.debug_sleep_seconds }}
        run: sleep ${DEBUG_SLEEP_SECONDS}
      - name: Debug Setup
        if: ${{ inputs.debug_sleep_after == 'setup' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'tmate' }}
        uses: canonical/action-tmate@main  # zizmor: ignore[unpinned-uses] no releases in the repo
      - name: Install Repository
        shell: bash
        env:
          PIP_PROXY: ${{ needs.determine-runner.outputs.pip-proxy }}
        run: |
          sudo apt-get update --quiet
          sudo apt-get install pipx --quiet --assume-yes
          if [[ -n "${PIP_PROXY}" ]]; then
            sudo tee /etc/pip.conf <<EOF
          [global]
          proxy= ${PIP_PROXY}
          EOF
            HTTPS_PROXY="${PIP_PROXY}" pipx install poetry==2.3
            HTTPS_PROXY="${PIP_PROXY}" poetry install
          else
            pipx install poetry==2.3
            poetry install
          fi
      - name: Install TruffleHog CLI
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin v3.56.0
      - name: Install juju-k8s-crashdump
        uses: ./.github/actions/install-with-retry
        with:
          command: pipx install "git+https://github.com/canonical/juju-k8s-crashdump@22ef04caaeeb94ad6ed49f8392b6bada65184569"
      - name: Install juju-crashdump
        uses: ./.github/actions/install-with-retry
        with:
          command: sudo snap install juju-crashdump --classic
      - name: Install kubectl
        uses: ./.github/actions/install-with-retry
        with:
          command: sudo snap install kubectl --classic
      - name: Post 'test_start' event
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: test_start
          detail: Tests started.
      - name: Run charm CMR tests
        id: run_tests_cmr
        if: ${{ inputs.neighbor_environment != '' }}
        continue-on-error: true
        shell: bash
        env:
          KUBECONFIG: ${{ steps.setup_target_k8s.outputs.kubeconfig_path }}
          model: ${{ steps.juju_resources.outputs.model }}
          k8s_cloud: ${{ steps.setup_target_k8s.outputs.cloud-name }}
          o7k_cloud: ${{ steps.setup_neighbor_o7k.outputs.cloud-name }}
          controller: ${{ steps.juju_resources.outputs.controller }}
          charm_endpoint: ${{ inputs.charm_endpoint }}
          neighbor_endpoint: ${{ inputs.neighbor_endpoint }}
          charm_under_test: ${{ inputs.charm_under_test }}
          revision: ${{ inputs.revision }}
          downgrade_revision: ${{ inputs.downgrade_revision }}
          channel: ${{ inputs.channel }}
          series: ${{ inputs.series }}
          neighbor: ${{ inputs.neighbor }}
          platform: ${{ steps.target_env_info.outputs.platform }}
          log_level: ${{ inputs.log_level }}
          bootstrap_config: ${{ steps.target_env_info.outputs.bootstrap-config }}
          bootstrap_constraints: ${{ steps.target_env_info.outputs.bootstrap-constraints }}
          model_config: ${{ steps.target_env_info.outputs.model-config }}
        run: |
          mkdir -p $HOME/openstack/images
          echo "junit_xml=$(realpath junit.xml)" >> $GITHUB_OUTPUT

          # set the REMOTE_OFFER url in the template bundle yaml
          REMOTE_OFFER="o7k-${controller}:o7k-${model}.neighbor-offer"
          sed -i "s|REMOTE_OFFER|${REMOTE_OFFER}|g" "./static/bundles/cmr-demo-1/indico.yaml"
          ./scripts/run-tests.sh \
            --target-charm "${charm_under_test}" \
            --target-channel "${channel}" \
            --target-revision "${revision}" \
            --target-downgrade-revision "${downgrade_revision}" \
            --target-series "${series}" \
            --neighbor-charm "${neighbor}" \
            --model "k8s-${model}" \
            \
            --juju-cloud "${k8s_cloud}" \
            --bundle "./static/bundles/cmr-demo-1/postgresql.yaml:${o7k_cloud}:o7k-${controller}:o7k-${model}" \
            --bundle "./static/bundles/cmr-demo-1/indico.yaml:${k8s_cloud}:k8s-${controller}:k8s-${model}" \
            --juju-controller "k8s-${controller}" \
            \
            --current-state "no_controller" \
            -k 'not test_build_bundle and not test_remove_and_restore_integration' \
            \
            --mermaid-output "${BUNDLE_MERMAID_OUTPUT}" \
            --target-application "target" \
            --target-endpoint "${charm_endpoint}" \
            --neighbor-application "neighbor" \
            --neighbor-endpoint "${neighbor_endpoint}" \
            --platform "${platform}" \
            --charm-metadata-overrides "./static/charm-metadata-overrides/" \
            --charm-platform-overrides "./static/charm-platform-overrides/" \
            --charm-listing-overrides "./static/charm-listing-overrides.yaml" \
            --charm-test-configs "./static/charm-test-configs/" \
            --charm-priorities-config "./static/charm-priorities.yaml" \
            --charm-default-versions "./static/charm-default-versions.yaml" \
            --juju-model-config "${model_config}" \
            --juju-controller-bootstrap-constraints "${bootstrap_constraints}" \
            --juju-controller-bootstrap-config "${bootstrap_config}" \
            --juju-controller-bootstrap-metadata-source "$HOME/openstack/images" \
            --log-cli-level "${log_level}" \
            --log-level "${log_level}" \
            --log-dir "./test-logs" \
            --junit-xml=junit.xml
      - name: Run charm tests
        id: run_tests
        if: ${{ inputs.neighbor_environment == '' }}
        continue-on-error: true
        shell: bash
        env:
          KUBECONFIG: ${{ steps.setup_target_k8s.outputs.kubeconfig_path }}
          model: ${{ steps.juju_resources.outputs.model }}
          cloud: ${{ steps.setup_target_k8s.outputs.cloud-name || steps.setup_target_o7k.outputs.cloud-name }}
          controller: ${{ steps.juju_resources.outputs.controller }}
          charm_endpoint: ${{ inputs.charm_endpoint }}
          neighbor_endpoint: ${{ inputs.neighbor_endpoint }}
          charm_under_test: ${{ inputs.charm_under_test }}
          revision: ${{ inputs.revision }}
          downgrade_revision: ${{ inputs.downgrade_revision }}
          channel: ${{ inputs.channel }}
          series: ${{ inputs.series }}
          neighbor: ${{ inputs.neighbor }}
          platform: ${{ steps.target_env_info.outputs.platform }}
          log_level: ${{ inputs.log_level }}
          bootstrap_config: ${{ steps.target_env_info.outputs.bootstrap-config }}
          bootstrap_constraints: ${{ steps.target_env_info.outputs.bootstrap-constraints }}
          model_config: ${{ steps.target_env_info.outputs.model-config }}
        run: |
          mkdir -p $HOME/openstack/images
          echo "junit_xml=$(realpath junit.xml)" >> $GITHUB_OUTPUT
          ./scripts/run-tests.sh \
            --target-charm "${charm_under_test}" \
            --target-channel "${channel}" \
            --target-revision "${revision}" \
            --target-downgrade-revision "${downgrade_revision}" \
            --target-series "${series}" \
            --neighbor-charm "${neighbor}" \
            --model "${model}" \
            --juju-cloud "${cloud}" \
            --juju-controller "${controller}" \
            --bundle "${BUNDLE_OUTPUT}" \
            --mermaid-output "${BUNDLE_MERMAID_OUTPUT}" \
            --current-state "no_bundle" \
            --target-application "target" \
            --target-endpoint "${charm_endpoint}" \
            --neighbor-application "neighbor" \
            --neighbor-endpoint "${neighbor_endpoint}" \
            --platform "${platform}" \
            --charm-metadata-overrides "./static/charm-metadata-overrides/" \
            --charm-platform-overrides "./static/charm-platform-overrides/" \
            --charm-listing-overrides "./static/charm-listing-overrides.yaml" \
            --charm-test-configs "./static/charm-test-configs/" \
            --charm-priorities-config "./static/charm-priorities.yaml" \
            --charm-default-versions "./static/charm-default-versions.yaml" \
            --juju-model-config "${model_config}" \
            --juju-controller-bootstrap-constraints "${bootstrap_constraints}" \
            --juju-controller-bootstrap-config "${bootstrap_config}" \
            --juju-controller-bootstrap-metadata-source "$HOME/openstack/images" \
            --log-cli-level "${log_level}" \
            --log-level "${log_level}" \
            --log-dir "./test-logs" \
            --junit-xml=junit.xml
      - name: Post 'test_end' event
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: test_end
          detail: Tests finished.
      - name: Post bundles to github
        shell: bash
        continue-on-error: true
        run: |
          # Note the generated bundles
          echo '### Generated Bundle Mermaid Diagram' >> $GITHUB_STEP_SUMMARY
          echo '```mermaid' >> $GITHUB_STEP_SUMMARY
          cat ${BUNDLE_MERMAID_OUTPUT} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### Generated Juju Bundle' >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat ${BUNDLE_OUTPUT} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Post execution metadata to Test Observer
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-execution-metadata
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          junit_xml: ${{ inputs.neighbor_environment != '' && steps.run_tests_cmr.outputs.junit_xml || steps.run_tests.outputs.junit_xml }}
      - name: Post results to Test Observer
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-results
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          junit_xml: ${{ inputs.neighbor_environment != '' && steps.run_tests_cmr.outputs.junit_xml || steps.run_tests.outputs.junit_xml }}
      - name: Collect logs
        id: collect_logs
        if: ${{ !cancelled() }}
        shell: bash
        env:
          junit_xml: ${{ inputs.neighbor_environment != '' && steps.run_tests_cmr.outputs.junit_xml || steps.run_tests.outputs.junit_xml }}
          generated_bundle: ./generated-bundle.yaml
        run: |
          mkdir -p "logs"
          [ -d "./test-logs" ] && cp -r ./test-logs/. "logs/"
          [ -f "${junit_xml}" ] && cp "${junit_xml}" "logs/junit.xml"
          [ -f "${generated_bundle}" ] && cp "${generated_bundle}" "logs/generated-bundle.yaml"
          echo "directory_path=$(realpath "logs")" >> $GITHUB_OUTPUT
      - name: Post Logs To Swift
        id: post_logs_to_swift
        if: ${{ !cancelled() && inputs.execution_id != '' }}
        uses: canonical/sqa-cloud-deployment-pipeline/.github/actions/upload-to-swift@173b1936e2c96e317b0f1167509b068b2020e233
        with:
          job_uuid: ${{ inputs.test_observer_environment }}/${{ inputs.execution_id
            }}
          log_path: ${{ steps.collect_logs.outputs.directory_path }}
          swift_bucket: charm-qa
          SWIFT_OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
          SWIFT_OS_USERNAME: ${{ secrets.SWIFT_OS_USERNAME }}
          SWIFT_OS_PASSWORD: ${{ secrets.SWIFT_OS_PASSWORD }}
          SWIFT_OS_PROJECT_NAME: ${{ secrets.SWIFT_OS_PROJECT_NAME }}
          SWIFT_OS_REGION_NAME: ${{ secrets.SWIFT_OS_REGION_NAME }}
          SWIFT_OS_USER_DOMAIN_NAME: ${{ secrets.SWIFT_OS_USER_DOMAIN_NAME }}
          SWIFT_OS_PROJECT_DOMAIN_NAME: ${{ secrets.SWIFT_OS_PROJECT_DOMAIN_NAME }}
      - name: Post 'log_collection_finished' event
        if: ${{ !cancelled() && steps.post_logs_to_swift.outcome == 'success' && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: log_collection_finished
          detail: Log collection has completed.
      - name: Debug Post Log Collection
        if: ${{ inputs.debug_sleep_after == 'log_collection' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'ssh' }}
        shell: bash
        env:
          DEBUG_SLEEP_SECONDS: ${{ inputs.debug_sleep_seconds }}
        run: sleep ${DEBUG_SLEEP_SECONDS}
      - name: Debug Post Log Collection
        if: ${{ inputs.debug_sleep_after == 'log_collection' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'tmate' }}
        uses: canonical/action-tmate@main  # zizmor: ignore[unpinned-uses] no releases in the repo
      - name: Post links to Test Observer
        if: ${{ !cancelled() && steps.post_logs_to_swift.outcome == 'success' && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-links
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.test_observer_environment }}/${{ inputs.execution_id }}
      - name: Post 'job_end' event
        if: ${{ !cancelled() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: job_end
          detail: Charm integration test job completed.
      - name: Mark Test Execution completed on Test Observer with the correct status
        if: ${{ always() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/patch-test-execution
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          status: COMPLETED
      - name: Trigger rerun on Test Observer if failure
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/trigger-rerun
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
