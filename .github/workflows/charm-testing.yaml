name: Execute tests against two charms and their integrations
run-name: "Testing ${{ inputs.charm_under_test }}:${{ inputs.charm_endpoint }} against ${{ inputs.neighbor }}:${{ inputs.neighbor_endpoint }}. (environment: ${{ inputs.environment }}${{ inputs.execution_id != '' && ', test execution: ' || '' }}${{ inputs.execution_id }})"

concurrency:
  group: ${{ inputs.environment == 'production' && 'production-k8s' || 'staging-k8s' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run in."
        type: choice
        default: testing
        options:
          - testing
          - staging
          - production
      arch:
        description: "Architecture of the charms being tested."
        required: false
        type: choice
        options:
          - amd64
        default: amd64
      charm_under_test:
        description: "charmhub.io name of the primary charm under test"
        required: true
      charm_endpoint:
        description: "Endpoint of the charm being tested."
        required: true
      execution_id:
        description: "Test Observer execution ID to post results from this test to."
        required: false
      juju_channel:
        description: "Juju channel to use while testing."
        required: false
        default: "3/stable"
      neighbor:
        description: "charmhub.io name of the charm to test the primary charm against."
        required: true
      neighbor_endpoint:
        description: "Endpoint for the neighbor charm being tested."
        required: true
      revision:
        description: "Revision number of the charm under test."
        required: true
      series:
        description: "Series to run the charm tests under."
        required: false
        type: choice
        options:
          - "20.04"
          - "22.04"
          - "24.04"
        default: 24.04
      # TODO SQT-452: GitHub workflow_dispatch is limited to 10 inputs
      # But maybe by the time we need this that will have changed!
      # https://github.com/orgs/community/discussions/8774
      # If not, maybe pass in JSON and use fromJSON()
      # substrate:
      #   description: "Substrate to run the tests on."
      #   required: false
      #   type: choice
      #   options:
      #     - kubernetes
      #   default: kubernetes
jobs:
  execute-charm-test:
    name: Execute integration tests against the charms
    runs-on:
      - self-hosted
      - charm_qa
    env:
      test_observer_api: ${{ github.event.inputs.environment == 'production' && vars.PROD_TEST_OBSERVER_API || (github.event.inputs.environment == 'staging' && vars.STG_TEST_OBSERVER_API || '') }}
    steps:
    - name: Clone Repo
      uses: actions/checkout@v4
    - name: Report Test Execution Start To Test Observer
      if: ${{ always() && env.test_observer_api != '' && github.event.inputs.execution_id != '' }}
      uses: ./.github/actions/patch-test-execution
      with:
        test_observer_api: ${{ env.test_observer_api }}
        test_execution_id: ${{ github.event.inputs.execution_id }}
        status: "IN_PROGRESS"
    - name: Setup Kubeconfig
      id: kubeconfig
      shell: bash
      run: |
        mkdir -p $HOME/.kube
        if [ "${{ github.event.inputs.environment }}" = "production" ]; then
          echo '${{ secrets.PROD_SQA_KUBECONFIG }}' > $HOME/.kube/config
        else        
          echo '${{ secrets.STG_SQA_KUBECONFIG }}' > $HOME/.kube/config
        fi
        echo "full_path=$HOME/.kube/config" >> $GITHUB_OUTPUT
    - name: Install Juju
      shell: bash
      run: |
        sudo snap install juju --channel ${{ github.event.inputs.juju_channel }}
        sudo snap install juju-wait --classic
    - name: Install Repository
      shell: bash
      run: |
        sudo apt-get update --quiet
        sudo apt-get install pipx --quiet --assume-yes
        sudo tee /etc/pip.conf <<EOF
        [global]
        proxy= http://squid.internal:3128
        EOF
        pipx install poetry==2.0
        HTTPS_PROXY="http://squid.internal:3128" poetry install
    - name: Generate dynamic bundles
      id: build_bundle
      shell: bash
      run: |
        ./scripts/build-bundle.sh \
          --charms \
            "target::${{ inputs.charm_under_test }}::${{ inputs.revision }}::${{ inputs.series }}" \
            "neighbor::${{ inputs.neighbor }}::default::default" \
          --integrations "target:${{ inputs.charm_endpoint }}::neighbor:${{ inputs.neighbor_endpoint }}" \
          --substrate "kubernetes" \
          --arch ${{ inputs.arch }} \
          --log-level DEBUG \
          --output-file generated-bundle.yaml
        echo '### Generated Juju Bundle' >> $GITHUB_STEP_SUMMARY
        echo '```yaml' >> $GITHUB_STEP_SUMMARY
        cat generated-bundle.yaml >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "bundle=$(pwd)/generated-bundle.yaml" >> $GITHUB_OUTPUT
    - name: Add K8s
      shell: bash
      run: |
        KUBECONFIG="${{ steps.kubeconfig.outputs.full_path }}" juju add-k8s ps6 --client
    - name: Generate Juju Model and Controller Name
      id: juju_resources
      shell: bash
      run: |
        date=$(date +"%y-%m-%d-%H-%M-%S")
        echo "model=model-$date" >> $GITHUB_OUTPUT
        echo "controller=$date" >> $GITHUB_OUTPUT
    - name: Bootstrap Controller
      shell: bash
      run: |
        # juju will prefix the namespace with "controller"
        juju bootstrap ps6 --bootstrap-constraints root-disk=5G ${{ steps.juju_resources.outputs.controller }}
    - name: Create Model
      shell: bash
      run: |
        juju add-model ${{ steps.juju_resources.outputs.model }} \
          --config "logging-config=DEBUG" \
          --config="update-status-hook-interval=30s"
    - name: Deploy Bundles
      continue-on-error: true
      shell: bash
      run: |
        ./scripts/test-deploy.sh \
          --model ${{ steps.juju_resources.outputs.model }} \
          --bundles ${{ steps.build_bundle.outputs.bundle }} \
          --junit-xml=junit-deploy.xml
    - name: Execute Tests
      continue-on-error: true
      shell: bash
      run: |
        ./scripts/test-integration.sh \
          --model ${{ steps.juju_resources.outputs.model }} \
          --target-application target \
          --target-endpoint ${{ github.event.inputs.charm_endpoint }} \
          --neighbor-application neighbor \
          --neighbor-endpoint ${{ github.event.inputs.neighbor_endpoint }} \
          --junit-xml=junit-integration.xml
    - name: Teardown charm under test
      continue-on-error: true
      shell: bash
      run: |
        ./scripts/test-teardown.sh \
          --model ${{ steps.juju_resources.outputs.model }} \
          --applications target \
          --junit-xml=junit-teardown.xml
    - name: Merge JUnit output
      shell: bash
      run: |
        ./scripts/merge-junit.sh junit-*.xml junit.xml
        cat junit.xml
    - name: Post results to Test Observer
      if: ${{ env.test_observer_api != '' && github.event.inputs.execution_id != '' }}
      uses: ./.github/actions/post-results
      with:
        test_observer_api: ${{ env.test_observer_api }}
        test_execution_id: ${{ github.event.inputs.execution_id }}
        junit_xml: ./junit.xml
    - name: Setup Logs directory
      id: logs_directory
      if: ${{ always() }}
      shell: bash
      run: |
        mkdir -p $HOME/logs
        echo "full_path=$HOME/logs" >> $GITHUB_OUTPUT
    - name: Collect Logs
      if: ${{ always() }}
      uses: canonical/juju-k8s-crashdump/actions/juju-k8s-crashdump@main
      with:
        kubeconf: ${{ steps.kubeconfig.outputs.full_path }}
        controller: ${{ steps.juju_resources.outputs.controller }}
        output_path: ${{ steps.logs_directory.outputs.full_path }}/juju-logs.tar.gz
        proxy: http://squid.internal:3128
    - name: Add JUnit to logs
      shell: bash
      run: cp ./junit.xml ${{ steps.logs_directory.outputs.full_path }}/
    - name: Dump the Juju Database
      if: ${{ always() && github.event.inputs.execution_id != '' }}
      shell: bash
      run: |
        JUJU_DEV_FEATURE_FLAGS=developer-mode juju dump-db \
          -m ${{ steps.juju_resources.outputs.model }} \
          -o ${{ steps.logs_directory.outputs.full_path }}/juju-db-dump.yaml
    - name: Add generated bundle to logs
      shell: bash
      run: cp ${{ steps.build_bundle.outputs.bundle }} ${{ steps.logs_directory.outputs.full_path }}/generated-bundle.yaml
          -o ${{ steps.logs_directory.outputs.full_path }}/juju-db-dump.yaml
    - name: Post Logs To Swift
      if: ${{ always() && github.event.inputs.execution_id != '' }}
      uses: canonical/sqa-cloud-deployment-pipeline/.github/actions/upload-to-swift@main
      with:
        job_uuid: ${{ github.event.inputs.environment }}/${{ github.event.inputs.execution_id }}
        log_path: ${{ steps.logs_directory.outputs.full_path }}
        swift_bucket: charm-qa
        SWIFT_OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
        SWIFT_OS_USERNAME: ${{ secrets.SWIFT_OS_USERNAME }}
        SWIFT_OS_PASSWORD: ${{ secrets.SWIFT_OS_PASSWORD }}
        SWIFT_OS_PROJECT_NAME: ${{ secrets.SWIFT_OS_PROJECT_NAME }}
        SWIFT_OS_REGION_NAME: ${{ secrets.SWIFT_OS_REGION_NAME }}
        SWIFT_OS_USER_DOMAIN_NAME: ${{ secrets.SWIFT_OS_USER_DOMAIN_NAME }}
        SWIFT_OS_PROJECT_DOMAIN_NAME: ${{ secrets.SWIFT_OS_PROJECT_DOMAIN_NAME }}
    - name: Mark Test Execution completed on Test Observer
      if: ${{ always() && env.test_observer_api != '' && github.event.inputs.execution_id != '' }}
      uses: ./.github/actions/patch-test-execution
      with:
        test_observer_api: ${{ env.test_observer_api }}
        test_execution_id: ${{ github.event.inputs.execution_id }}
        status: "COMPLETED"
    - name: Teardown Controller
      if: ${{ always() }}
      shell: bash
      run: |
        timeout 15m juju kill-controller ${{ steps.juju_resources.outputs.controller }} --no-prompt --timeout 0s
