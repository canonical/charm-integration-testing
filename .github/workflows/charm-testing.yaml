---
name: Execute tests against two charms and their integrations
run-name: "Testing ${{ inputs.charm_under_test }}:${{ inputs.charm_endpoint }} against\
  \ ${{ inputs.neighbor }}:${{ inputs.neighbor_endpoint }} (environments: ${{ inputs.target_environment }}${{\
  \ inputs.neighbor_environment != '' && '|' || '' }}${{ inputs.neighbor_environment\
  \ }}${{ inputs.execution_id != '' && ', test execution: ' || '' }}${{ inputs.execution_id\
  \ }})"
concurrency:
  group: ${{ github.workflow }}-${{ inputs.test_observer_environment }}-${{ inputs.execution_id
    || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read  # only needed for private repos
on:
  workflow_dispatch:
    inputs:
      test_observer_environment:
        description: Test Observer environment to report results to.
        required: false
        type: choice
        options: [none, staging, production]
        default: none
      target_environment:
        description: Named GitHub Actions environment to run on (e.g. ps6-sqa-prod_charm_qa_kubernetes-1).
          Replaces the implicit runner label.
        required: true
        type: string
      neighbor_environment:
        description: Named GitHub Actions environment for the cross-model neighbor.
          Empty if not cross-model.
        required: false
        type: string
        default: ''
      same_controller:
        description: When neighbor_environment is set, place the neighbor model on
          the target controller instead of bootstrapping a new one for it. Requires
          neighbor_environment; ignored (and rejected) otherwise.
        required: false
        type: boolean
        default: false
      charm_under_test:
        description: charmhub.io name of the primary charm under test
        required: true
      charm_endpoint:
        description: Endpoint of the charm being tested.
        required: true
      execution_id:
        description: Test Observer execution ID to post results from this test to.
        required: false
      juju_channel:
        description: Optional Juju client channel; empty uses the saved selection
          or catalogue default.
        required: false
      neighbor:
        description: charmhub.io name of the charm to test the primary charm against.
        required: true
      neighbor_endpoint:
        description: Endpoint for the neighbor charm being tested.
        required: true
      revision:
        description: Revision number of the charm under test.
        required: false
        default: default
      downgrade_revision:
        description: Revision number to downgrade to during testing, if applicable.
        required: false
        default: default
      channel:
        description: Channel of the charm under test.
        required: false
        default: default
      series:
        description: Ubuntu series to run the charm tests under (e.g. 20.04, 22.04).
        required: false
        default: default
      debug_sleep_after:
        description: The stage of the workflow to sleep after. Enables SSH access
          or tmate session.
        required: false
        type: choice
        options: [none, setup, log_collection]
        default: none
      debug_extra_ssh_imports:
        # The IDs take the form of lp:<value> for Launchpad and gh:<value> for GitHub.
        # The GitHub Actor's key is always included.
        description: A comma-separated list of IDs to use with ssh-import-id in debug
          mode.
        required: false
        default: ''
      debug_sleep_seconds:
        description: How long (in seconds) to sleep when debug_sleep_after is set
          and the runner uses SSH debug mode.
        required: false
        type: number
        default: 1800
      log_level:
        description: Log level to use for the tests.
        required: false
        type: choice
        options: [DEBUG, INFO, WARNING, ERROR]
        default: INFO
jobs:
  determine-runner:
    name: Determine GitHub Actions runner to use for the environment
    runs-on: ubuntu-latest
    env:
      TEST_OBSERVER_API: ${{ inputs.test_observer_environment == 'production' && vars.PROD_TEST_OBSERVER_API || (inputs.test_observer_environment == 'staging' && vars.STG_TEST_OBSERVER_API || '') }}
      TEST_OBSERVER_TOKEN: ${{ inputs.test_observer_environment == 'production' && secrets.PROD_TEST_OBSERVER_TOKEN || (inputs.test_observer_environment == 'staging' && secrets.STG_TEST_OBSERVER_TOKEN || '') }}
    outputs:
      runner: ${{ steps.pick.outputs.runner-labels }}
      debug-mode: ${{ steps.pick.outputs.debug-mode }}
      pip-proxy: ${{ steps.pick.outputs.pip-proxy }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pick runner
        id: pick
        uses: ./.github/actions/pick-runner
        with:
          target_environment: ${{ inputs.target_environment }}
          neighbor_environment: ${{ inputs.neighbor_environment }}
      - name: Trigger rerun on Test Observer if failure
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/trigger-rerun
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
  execute-charm-test:
    name: Execute integration tests against the charms
    needs: determine-runner
    runs-on: ${{ fromJSON(needs.determine-runner.outputs.runner) }}
    env:
      TEST_OBSERVER_API: ${{ inputs.test_observer_environment == 'production' && vars.PROD_TEST_OBSERVER_API || (inputs.test_observer_environment == 'staging' && vars.STG_TEST_OBSERVER_API || '') }}
      TEST_OBSERVER_TOKEN: ${{ inputs.test_observer_environment == 'production' && secrets.PROD_TEST_OBSERVER_TOKEN || (inputs.test_observer_environment == 'staging' && secrets.STG_TEST_OBSERVER_TOKEN || '') }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up project tools
        uses: ./.github/actions/setup-mise
        with:
          groups: integration
          juju-channel: ${{ inputs.juju_channel }}
        env:
          HTTPS_PROXY: ${{ needs.determine-runner.outputs.pip-proxy }}
      - name: Enable Debug Session
        if: ${{ inputs.debug_sleep_after != 'none' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'ssh' }}
        shell: bash
        env:
          SSH_IDS: ${{ inputs.debug_extra_ssh_imports }}
        run: |
          mkdir --parents ~/.ssh/
          ssh-import-id "gh:${GITHUB_ACTOR}"
          SSH_IDS=$(echo "${SSH_IDS}" | tr ',' ' ')
          ssh-import-id ${SSH_IDS} || true
          echo "Debug mode enabled. SSH connection details:"
          echo "ssh $(whoami)@$(hostname -I | cut -d ' ' -f 1)"
      - name: Create swap file
        shell: bash
        run: |
          swapfile="/swapfile-charm-testing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo fallocate -l 8G "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          sudo swapon --show
      - name: Get target environment info
        id: target_env_info
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: ${{ inputs.target_environment }}
      - name: Get neighbor environment info
        id: neighbor_env_info
        if: ${{ inputs.neighbor_environment != '' }}
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: ${{ inputs.neighbor_environment }}
      - name: Log job inputs
        shell: bash
        env:
          target_environment: ${{ inputs.target_environment }}
          neighbor_environment: ${{ inputs.neighbor_environment }}
          test_observer_environment: ${{ inputs.test_observer_environment }}
          charm_under_test: ${{ inputs.charm_under_test }}
          charm_endpoint: ${{ inputs.charm_endpoint }}
          execution_id: ${{ inputs.execution_id }}
          juju_channel: ${{ inputs.juju_channel }}
          neighbor: ${{ inputs.neighbor }}
          neighbor_endpoint: ${{ inputs.neighbor_endpoint }}
          revision: ${{ inputs.revision }}
          downgrade_revision: ${{ inputs.downgrade_revision }}
          channel: ${{ inputs.channel }}
          series: ${{ inputs.series }}
          same_controller: ${{ inputs.same_controller }}
          debug_sleep_after: ${{ inputs.debug_sleep_after }}
          debug_extra_ssh_imports: ${{ inputs.debug_extra_ssh_imports }}
          debug_sleep_seconds: ${{ inputs.debug_sleep_seconds }}
          log_level: ${{ inputs.log_level }}
        run: |
          echo "### Job inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`target_environment\` | \`${target_environment}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor_environment\` | \`${neighbor_environment}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`test_observer_environment\` | \`${test_observer_environment}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`charm_under_test\` | \`${charm_under_test}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`charm_endpoint\` | \`${charm_endpoint}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`execution_id\` | \`${execution_id}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`juju_channel\` | \`${juju_channel}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor\` | \`${neighbor}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`neighbor_endpoint\` | \`${neighbor_endpoint}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`revision\` | \`${revision}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`downgrade_revision\` | \`${downgrade_revision}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`channel\` | \`${channel}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`series\` | \`${series}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`same_controller\` | \`${same_controller}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`debug_sleep_after\` | \`${debug_sleep_after}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`debug_extra_ssh_imports\` | \`${debug_extra_ssh_imports}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`debug_sleep_seconds\` | \`${debug_sleep_seconds}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`log_level\` | \`${log_level}\` |" >> $GITHUB_STEP_SUMMARY
      - name: Validate CMR inputs
        if: ${{ inputs.same_controller }}
        env:
          NEIGHBOR_ENVIRONMENT: ${{ inputs.neighbor_environment }}
        shell: bash
        run: |
          if [[ -z "${NEIGHBOR_ENVIRONMENT}" ]]; then
            echo "same_controller requires neighbor_environment." >&2
            exit 1
          fi
      - name: Report Test Execution Start To Test Observer
        if: ${{ !cancelled() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/patch-test-execution
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          status: IN_PROGRESS
          ci_link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{github.run_id}}
      - name: Post 'job_start' event
        if: ${{ !cancelled() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: job_start
          detail: Charm integration test job started.
      - name: Ensure Juju home directory exists
        shell: bash
        run: mkdir -p $HOME/.local/share/juju
      - name: Resolve Juju target cloud credentials
        id: target_creds
        shell: bash
        env:
          CREDENTIALS_SECRET_NAME: ${{ steps.target_env_info.outputs.credentials-secret }}
          PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
          STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
          PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
          PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
          PROD_PS7_NOVARC: ${{ secrets.PROD_PS7_NOVARC }}
          PROD_PS7_LXD: ${{ secrets.PROD_PS7_LXD }}
        run: |
          if [[ -n "${CREDENTIALS_SECRET_NAME}" ]]; then
            echo "cloud-credentials<<EOF" >> "$GITHUB_OUTPUT"
            echo "${!CREDENTIALS_SECRET_NAME}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup target S3 config
        id: target_s3_config
        shell: bash
        env:
          S3_SECRET_NAME: ${{ steps.target_env_info.outputs.s3-secret-name }}
          S3_PS6_SQA_PROD_CHARM_QA_KUBERNETES: ${{ secrets.S3_PS6_SQA_PROD_CHARM_QA_KUBERNETES }}
          S3_PS6_SQA_STG_CHARM_QA_KUBERNETES: ${{ secrets.S3_PS6_SQA_STG_CHARM_QA_KUBERNETES }}
          S3_PS6_SQA_PROD_CHARM_QA_OPENSTACK: ${{ secrets.S3_PS6_SQA_PROD_CHARM_QA_OPENSTACK }}
          S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES: ${{ secrets.S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES }}
          S3_PS7_SQA_PROD_CHARM_QA_OPENSTACK: ${{ secrets.S3_PS7_SQA_PROD_CHARM_QA_OPENSTACK }}
          S3_PS7_SQA_PROD_CHARM_QA_LXD: ${{ secrets.S3_PS7_SQA_PROD_CHARM_QA_LXD }}
        run: |
          if [[ -z "${S3_SECRET_NAME}" ]]; then
            exit 0
          fi
          umask 077
          S3_CONFIG_PATH="$(mktemp "${RUNNER_TEMP}/s3-config-target.XXXXXX")"
          printf '%s' "${!S3_SECRET_NAME}" > "${S3_CONFIG_PATH}"
          echo "config-path=${S3_CONFIG_PATH}" >> "$GITHUB_OUTPUT"
      - name: Resolve Juju neighbor cloud credentials
        id: neighbor_creds
        if: ${{ inputs.neighbor_environment != '' }}
        shell: bash
        env:
          CREDENTIALS_SECRET_NAME: ${{ steps.neighbor_env_info.outputs.credentials-secret }}
          PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
          STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
          PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
          PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
          PROD_PS7_NOVARC: ${{ secrets.PROD_PS7_NOVARC }}
          PROD_PS7_LXD: ${{ secrets.PROD_PS7_LXD }}
        run: |
          if [[ -n "${CREDENTIALS_SECRET_NAME}" ]]; then
            echo "cloud-credentials<<EOF" >> "$GITHUB_OUTPUT"
            echo "${!CREDENTIALS_SECRET_NAME}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup neighbor S3 config
        id: neighbor_s3_config
        if: ${{ inputs.neighbor_environment != '' }}
        shell: bash
        env:
          S3_SECRET_NAME: ${{ steps.neighbor_env_info.outputs.s3-secret-name }}
          S3_PS6_SQA_PROD_CHARM_QA_KUBERNETES: ${{ secrets.S3_PS6_SQA_PROD_CHARM_QA_KUBERNETES }}
          S3_PS6_SQA_STG_CHARM_QA_KUBERNETES: ${{ secrets.S3_PS6_SQA_STG_CHARM_QA_KUBERNETES }}
          S3_PS6_SQA_PROD_CHARM_QA_OPENSTACK: ${{ secrets.S3_PS6_SQA_PROD_CHARM_QA_OPENSTACK }}
          S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES: ${{ secrets.S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES }}
          S3_PS7_SQA_PROD_CHARM_QA_OPENSTACK: ${{ secrets.S3_PS7_SQA_PROD_CHARM_QA_OPENSTACK }}
          S3_PS7_SQA_PROD_CHARM_QA_LXD: ${{ secrets.S3_PS7_SQA_PROD_CHARM_QA_LXD }}
        run: |
          if [[ -z "${S3_SECRET_NAME}" ]]; then
            exit 0
          fi
          umask 077
          S3_CONFIG_PATH="$(mktemp "${RUNNER_TEMP}/s3-config-neighbor.XXXXXX")"
          printf '%s' "${!S3_SECRET_NAME}" > "${S3_CONFIG_PATH}"
          echo "config-path=${S3_CONFIG_PATH}" >> "$GITHUB_OUTPUT"
      - name: Setup Target Cloud
        id: setup_target
        uses: ./.github/actions/setup-environment/setup-cloud
        with:
          cloud-name: target-cloud
          cloud-type: ${{ steps.target_env_info.outputs.cloud-type }}
          cloud-credentials: ${{ steps.target_creds.outputs.cloud-credentials }}
      - name: Post 'setup_target_failed' event
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' && steps.setup_target.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: setup_target_failed
          detail: Setup of target cloud failed.
      - name: Setup Neighbor Cloud
        id: setup_neighbor
        if: ${{ inputs.neighbor_environment != '' }}
        uses: ./.github/actions/setup-environment/setup-cloud
        with:
          cloud-name: neighbor-cloud
          cloud-type: ${{ steps.neighbor_env_info.outputs.cloud-type }}
          cloud-credentials: ${{ steps.neighbor_creds.outputs.cloud-credentials }}
      - name: Post 'setup_neighbor_failed' event
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' && steps.setup_neighbor.conclusion == 'failure' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: setup_neighbor_failed
          detail: Setup of neighbor cloud failed.
      - name: Debug Setup
        if: ${{ inputs.debug_sleep_after == 'setup' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'ssh' }}
        shell: bash
        env:
          DEBUG_SLEEP_SECONDS: ${{ inputs.debug_sleep_seconds }}
        run: sleep ${DEBUG_SLEEP_SECONDS}
      - name: Debug Setup
        if: ${{ inputs.debug_sleep_after == 'setup' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'tmate' }}
        uses: canonical/action-tmate@main  # zizmor: ignore[unpinned-uses] no releases in the repo
      - name: Post 'test_start' event
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: test_start
          detail: Tests started.
      - name: Run charm tests
        id: run_tests
        if: ${{ inputs.neighbor_environment != '' || !inputs.same_controller }}
        continue-on-error: true
        env:
          S3_CONFIG_target_cloud: ${{ steps.target_s3_config.outputs.config-path }}
          S3_CONFIG_neighbor_cloud: ${{ steps.neighbor_s3_config.outputs.config-path }}
        uses: ./actions/run-charm-tests
        with:
          install-dependencies: false
          output-dir: ${{ runner.temp }}/charm-integration-testing
          target-charm: ${{ inputs.charm_under_test }}
          target-endpoint: ${{ inputs.charm_endpoint }}
          target-cloud: ${{ steps.setup_target.outputs.cloud-name }}
          target-platform: ${{ steps.target_env_info.outputs.platform }}
          target-arch: ${{ steps.target_env_info.outputs.arch }}
          target-channel: ${{ inputs.channel }}
          target-revision: ${{ inputs.revision }}
          target-downgrade-revision: ${{ inputs.downgrade_revision }}
          target-series: ${{ inputs.series }}
          target-kubeconfig: ${{ steps.setup_target.outputs.kubeconfig_path }}
          target-cloud-definition: ${{ steps.setup_target.outputs.cloud-definition-path }}
          target-cloud-credentials: ${{ steps.setup_target.outputs.credentials-path }}
          target-controller-bootstrap-config: ${{ steps.target_env_info.outputs.bootstrap-config }}
          target-controller-bootstrap-constraints: ${{ steps.target_env_info.outputs.bootstrap-constraints }}
          target-controller-bootstrap-metadata-source: ${{ steps.setup_target.outputs.metadata-source }}
          target-model-config: ${{ steps.target_env_info.outputs.model-config }}
          target-remote-logging-endpoint: ${{ steps.target_env_info.outputs.remote-logging }}
          neighbor-charm: ${{ inputs.neighbor }}
          neighbor-endpoint: ${{ inputs.neighbor_endpoint }}
          neighbor-cloud: ${{ inputs.neighbor_environment != '' && ((inputs.same_controller
            && inputs.neighbor_environment == inputs.target_environment) && steps.setup_target.outputs.cloud-name
            || steps.setup_neighbor.outputs.cloud-name) || '' }}
          neighbor-platform: ${{ steps.neighbor_env_info.outputs.platform }}
          neighbor-arch: ${{ steps.neighbor_env_info.outputs.arch }}
          neighbor-kubeconfig: ${{ steps.setup_neighbor.outputs.kubeconfig_path }}
          neighbor-cloud-definition: ${{ steps.setup_neighbor.outputs.cloud-definition-path }}
          neighbor-cloud-credentials: ${{ steps.setup_neighbor.outputs.credentials-path }}
          neighbor-controller-bootstrap-config: ${{ steps.neighbor_env_info.outputs.bootstrap-config }}
          neighbor-controller-bootstrap-constraints: ${{ steps.neighbor_env_info.outputs.bootstrap-constraints }}
          neighbor-controller-bootstrap-metadata-source: ${{ steps.setup_neighbor.outputs.metadata-source }}
          neighbor-model-config: ${{ steps.neighbor_env_info.outputs.model-config }}
          neighbor-remote-logging-endpoint: ${{ steps.neighbor_env_info.outputs.remote-logging }}
          same-controller: ${{ inputs.same_controller }}
          log-level: ${{ inputs.log_level }}
          ubuntu-pro-token: ${{ secrets.UBUNTU_PRO_TOKEN }}
      - name: Post 'test_end' event
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: test_end
          detail: Tests finished.
      - name: Post bundles to github
        shell: bash
        continue-on-error: true
        env:
          MERMAID_PATH: ${{ steps.run_tests.outputs.mermaid-path }}
          TARGET_BUNDLE_PATH: ${{ steps.run_tests.outputs.target-bundle-path }}
          NEIGHBOR_BUNDLE_PATH: ${{ steps.run_tests.outputs.neighbor-bundle-path }}
        run: |
          # Note the generated bundles
          echo '### Generated Bundle Mermaid Diagram' >> $GITHUB_STEP_SUMMARY
          echo '```mermaid' >> $GITHUB_STEP_SUMMARY
          cat "${MERMAID_PATH}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### Generated Target Juju Bundle' >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          cat "${TARGET_BUNDLE_PATH}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [[ -n "${NEIGHBOR_BUNDLE_PATH}" && -f "${NEIGHBOR_BUNDLE_PATH}" ]]; then
            echo '### Generated Neighbor Juju Bundle' >> $GITHUB_STEP_SUMMARY
            echo '```yaml' >> $GITHUB_STEP_SUMMARY
            cat "${NEIGHBOR_BUNDLE_PATH}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Post execution metadata to Test Observer
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-execution-metadata
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          junit_xml: ${{ steps.run_tests.outputs.junit-path }}
      - name: Post results to Test Observer
        if: ${{ env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-results
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          junit_xml: ${{ steps.run_tests.outputs.junit-path }}
      - name: Collect logs
        id: collect_logs
        if: ${{ !cancelled() }}
        shell: bash
        env:
          junit_xml: ${{ steps.run_tests.outputs.junit-path }}
          log_dir: ${{ steps.run_tests.outputs.log-dir }}
          target_bundle: ${{ steps.run_tests.outputs.target-bundle-path }}
          neighbor_bundle: ${{ steps.run_tests.outputs.neighbor-bundle-path }}
        run: |
          mkdir -p "logs"
          [ -d "${log_dir}" ] && cp -r "${log_dir}/." "logs/"
          [ -f "${junit_xml}" ] && cp "${junit_xml}" "logs/junit.xml"
          [ -f "${target_bundle}" ] && cp "${target_bundle}" "logs/generated-target-bundle.yaml"
          [ -f "${neighbor_bundle}" ] && cp "${neighbor_bundle}" "logs/generated-neighbor-bundle.yaml"
          echo "directory_path=$(realpath "logs")" >> $GITHUB_OUTPUT
      - name: Post Logs To Swift
        id: post_logs_to_swift
        if: ${{ !cancelled() && inputs.execution_id != '' }}
        uses: ./.github/actions/swift/upload
        with:
          job_uuid: ${{ inputs.test_observer_environment }}/${{ inputs.execution_id
            }}
          log_path: ${{ steps.collect_logs.outputs.directory_path }}
          swift_bucket: charm-qa
          SWIFT_OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL_PS7 }}
          SWIFT_OS_USERNAME: ${{ secrets.SWIFT_OS_USERNAME_PS7 }}
          SWIFT_OS_PASSWORD: ${{ secrets.SWIFT_OS_PASSWORD_PS7 }}
          SWIFT_OS_PROJECT_NAME: ${{ secrets.SWIFT_OS_PROJECT_NAME_PS7 }}
          SWIFT_OS_REGION_NAME: ${{ secrets.SWIFT_OS_REGION_NAME_PS7 }}
          SWIFT_OS_USER_DOMAIN_NAME: ${{ secrets.SWIFT_OS_USER_DOMAIN_NAME_PS7 }}
          SWIFT_OS_PROJECT_DOMAIN_NAME: ${{ secrets.SWIFT_OS_PROJECT_DOMAIN_NAME_PS7 }}
      - name: Post 'log_collection_finished' event
        if: ${{ !cancelled() && steps.post_logs_to_swift.outcome == 'success' && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: log_collection_finished
          detail: Log collection has completed.
      - name: Debug Post Log Collection
        if: ${{ inputs.debug_sleep_after == 'log_collection' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'ssh' }}
        shell: bash
        env:
          DEBUG_SLEEP_SECONDS: ${{ inputs.debug_sleep_seconds }}
        run: sleep ${DEBUG_SLEEP_SECONDS}
      - name: Debug Post Log Collection
        if: ${{ inputs.debug_sleep_after == 'log_collection' && !cancelled() && needs.determine-runner.outputs.debug-mode == 'tmate' }}
        uses: canonical/action-tmate@main  # zizmor: ignore[unpinned-uses] no releases in the repo
      - name: Post links to Test Observer
        if: ${{ !cancelled() && steps.post_logs_to_swift.outcome == 'success' && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-links
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          job_uuid: ${{ inputs.test_observer_environment }}/${{ inputs.execution_id
            }}
      - name: Post 'job_end' event
        if: ${{ !cancelled() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/post-events
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          event_name: job_end
          detail: Charm integration test job completed.
      - name: Mark Test Execution completed on Test Observer with the correct status
        if: ${{ always() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/patch-test-execution
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
          status: COMPLETED
      - name: Trigger rerun on Test Observer if failure
        if: ${{ failure() && env.TEST_OBSERVER_API != '' && inputs.execution_id != '' }}
        uses: ./.github/actions/test-observer/trigger-rerun
        with:
          test_observer_api: ${{ env.TEST_OBSERVER_API }}
          test_observer_token: ${{ env.TEST_OBSERVER_TOKEN }}
          test_execution_id: ${{ inputs.execution_id }}
