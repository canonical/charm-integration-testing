---
name: Merge Main to Production
on:
  schedule:
    - cron: '0 */12 * * *'     # Runs every 12 hours
  workflow_dispatch:  # Allows manual triggering of the workflow
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-for-changes:
    runs-on: self-hosted
    outputs:
      changes_to_merge: ${{ steps.check.outputs.changes_to_merge }}
    permissions:
      contents: read  # needed for private repos
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Check for changes between main and production
        id: check
        run: |-
          # Checking if there are any changes between main and production branches
          git fetch origin main production
          if git diff --quiet origin/main origin/production
          then
            echo "No changes to merge from main to production"
            echo "changes_to_merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected between main and production"
            echo "changes_to_merge=true" >> "$GITHUB_OUTPUT"
          fi
  run-all-tests:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.changes_to_merge == 'true'
    uses: ./.github/workflows/charm-testing-integration-tests.yaml
    permissions:
      contents: read
      actions: write
    with:
      full_test_suite: true
    secrets: inherit
  merge-main-to-production:
    runs-on: self-hosted
    needs: run-all-tests
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Merge main into production
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main production
          git checkout -B production origin/production
          git merge --ff-only origin/main
          delay=1
          for attempt in 1 2 3 4 5; do
            if git push origin production; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts"
              exit 1
            fi
            echo "Push failed (attempt $attempt), retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            if [ "$delay" -gt 30 ]; then
              delay=30
            fi
          done
