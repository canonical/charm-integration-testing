---
name: Pull Request Checks
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for secrets
        run: gitleaks git --config .gitleaks.toml --redact -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Setup NPM
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18
      - name: Install markdownlint-cli2
        run: npm install markdownlint-cli2 --global
      - name: Run linter
        run: ./scripts/lint.sh
  charm-integration-testing-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Charm Integration Testing Unit Tests
        run: ./scripts/charm-integration-testing-unit-tests.sh
  charm-testing-integration-tests:
    uses: ./.github/workflows/charm-testing-integration-tests.yaml
    permissions:
      contents: read
      actions: write
    secrets:
      STG_TEST_OBSERVER_TOKEN: ${{ secrets.STG_TEST_OBSERVER_TOKEN }}
  validators-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Validators Unit Tests
        run: ./scripts/validators-unit-tests.sh
  bundle-builder-x-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Bundle Builder X Tests
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |-
          ./scripts/bundle-builder-x-tests.sh 'unit|integration|logic|overrides' \
            --overrides ./static/charm-overrides --overrides-modified-since "origin/${GITHUB_BASE_REF}"
