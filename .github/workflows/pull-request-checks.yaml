---
name: Pull Request Checks
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Setup NPM
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18
      - name: Install markdownlint-cli2
        run: npm install markdownlint-cli2 --global
      - name: Run linter
        run: ./scripts/lint.sh
  bundle-builder-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Bundle Builder Unit Tests
        run: ./scripts/bundle-builder-unit-tests.sh
  bundle-builder-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Bundle Builder Integration Tests
        run: ./scripts/bundle-builder-integration-tests.sh
  bundle-builder-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Bundle Builder Integration Tests
        run: ./scripts/bundle-builder-logic-tests.sh
  charm-integration-testing-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Charm Integration Testing Unit Tests
        run: ./scripts/charm-integration-testing-unit-tests.sh
  detect-affected-tests:
    runs-on: ubuntu-latest
    outputs:
      full_test_suite: ${{ steps.detect.outputs.full_test_suite }}
      additional_tests: ${{ steps.detect.outputs.additional_tests }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect affected integration tests
        id: detect
        shell: python
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          import os
          import re
          import subprocess
          # Base ref is the branch against which the PR is being merged
          base_ref = os.environ["BASE_REF"]

          # Get the list of changed files in the PR compared to the base ref
          result = subprocess.run(
              ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
              capture_output=True,
              text=True,
              check=True,
          )
          changed_files = result.stdout.splitlines()

          print("Changed files:\n" + "\n".join(changed_files))
          CRITICAL_PATTERNS = [
              "charm_integration_testing/test_suite/conftest.py",
              "charm_integration_testing/test_suite/scheduler/",
              "charm_integration_testing/juju/",
              "charm_integration_testing/extensions/",
              "charm_integration_testing/kubernetes_client/",
              "charm_integration_testing/utils/",
              "scripts/run-tests.sh",
          ]
          github_output = os.environ["GITHUB_OUTPUT"]
          for pattern in CRITICAL_PATTERNS:
              if any(f.startswith(pattern) for f in changed_files):
                  print(f"Critical path changed ({pattern}). Running full test suite.")
                  with open(github_output, "a") as fh:
                      fh.write("full_test_suite=true\n")
                      fh.write("additional_tests=\n")
                  raise SystemExit(0)
          test_pattern = re.compile(
              r"^charm_integration_testing/test_suite/(test_[^/]+)\.py$"
          )
          affected = [
              m.group(1)
              for f in changed_files
              if (m := test_pattern.match(f))
          ]
              
          print(f"Affected tests: {affected}")
          additional_tests = " or ".join(affected)
          with open(github_output, "a") as fh:
              fh.write("full_test_suite=false\n")
              fh.write(f"additional_tests={additional_tests}\n")
  charm-testing-integration-tests:
    needs: detect-affected-tests
    uses: ./.github/workflows/charm-testing-integration-tests.yaml
    permissions:
      contents: read
      actions: write
    with:
      full_test_suite: ${{ needs.detect-affected-tests.outputs.full_test_suite == 'true' }}
      additional_tests: ${{ needs.detect-affected-tests.outputs.additional_tests }}
  validators-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Validators Unit Tests
        run: ./scripts/validators-unit-tests.sh
  bundle-builder-x-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install
      - name: Run Bundle Builder X Tests
        run: ./scripts/bundle-builder-x-tests.sh 'unit|integration|logic'
