name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read # only needed for private repos

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install poetry
        run: pipx install poetry==2.0.1

      - name: Install dependencies
        run: poetry install
        
      - name: run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v9
        
      - name: Run linter
        run: ./scripts/lint.sh

  bundle-builder-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install poetry
        run: pipx install poetry==2.0.1

      - name: Install dependencies
        run: poetry install
        
      - name: run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v9
        
      - name: Run Bundle Builder Integration Tests
        run: ./scripts/bundle-builder-integration-tests.sh
