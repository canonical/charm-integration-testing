name: Pull Request Checks

on:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install poetry
        run: pipx install poetry==2.0.1

      - name: Install dependencies
        run: poetry install
        
      - name: run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@1d349044b9624661f5a0a7e13e0ca9801752022a
        
      - name: Run linter
        run: ./scripts/lint.sh

  bundle-builder-integration-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install poetry
        run: pipx install poetry==2.0.1

      - name: Install dependencies
        run: poetry install
        
      - name: run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@1d349044b9624661f5a0a7e13e0ca9801752022a
        
      - name: Run Bundle Builder Integration Tests
        run: ./scripts/bundle-builder-integration-tests.sh
