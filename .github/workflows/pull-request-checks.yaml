---
name: Pull Request Checks
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: development
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up mise
        uses: ./.github/actions/setup-mise
      - name: Scan git history for secrets
        env:
          GITLEAKS_LOG_OPTS: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha
            }}
        run: |
          mise run security:gitleaks -- git --config .gitleaks.toml --redact -v \
            --log-opts="$GITLEAKS_LOG_OPTS"
  lint:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: development
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up mise
        uses: ./.github/actions/setup-mise
      - name: Install dependencies
        run: mise run setup
      - name: Run linter
        run: mise run lint
  charm-integration-testing-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up mise
        uses: ./.github/actions/setup-mise
      - name: Install dependencies
        run: mise run setup
      - name: Run Charm Integration Testing Unit Tests
        run: mise run test:charm-integration-testing
  charm-testing-integration-tests:
    uses: ./.github/workflows/charm-testing-integration-tests.yaml
    permissions:
      contents: read
      actions: write
    secrets:
      STG_TEST_OBSERVER_TOKEN: ${{ secrets.STG_TEST_OBSERVER_TOKEN }}
  validators-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up mise
        uses: ./.github/actions/setup-mise
      - name: Install dependencies
        run: mise run setup
      - name: Run Validators Unit Tests
        run: mise run test:validators
  bundle-builder-x-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up mise
        uses: ./.github/actions/setup-mise
      - name: Install dependencies
        run: mise run setup
      - name: Run Bundle Builder X Tests
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |-
          mise run test:bundle-builder-x -- 'unit|integration|logic|overrides' \
            --overrides ./static/charm-overrides --overrides-modified-since "origin/${GITHUB_BASE_REF}"
