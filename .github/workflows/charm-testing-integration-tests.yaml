---
name: Run Integration Tests for Charm Testing
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      full_test_suite:
        description: 'Whether to run the full test suite or just a subset of tests.'
        required: false
        default: false
        type: boolean
      additional_tests:
        description: 'Extra pytest -k expression to run alongside the base suite (e.g. "test_upgrade_charm").'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      full_test_suite:
        description: 'Whether to run the full test suite or just a subset of tests.'
        required: false
        default: false
        type: boolean
      additional_tests:
        description: 'Extra pytest -k expression to run alongside the base suite.'
        required: false
        default: ''
        type: string

jobs:
  assert-pass:
    strategy:
      max-parallel: 1
      matrix:
        params:
          - target_charm: postgresql-k8s
            target_endpoint: certificates
            target_revision: 495
            target_track: 14
            target_risk: stable
            target_base: '22.04'
            neighbor_charm: self-signed-certificates
            neighbor_endpoint: certificates
            substrate: kubernetes
    uses: ./.github/workflows/charm-testing-integration-test-assert-pass.yaml
    permissions:
      contents: read
      actions: write
    with:
      target_charm: ${{ matrix.params.target_charm }}
      target_endpoint: ${{ matrix.params.target_endpoint }}
      target_revision: ${{ matrix.params.target_revision }}
      target_track: ${{ matrix.params.target_track }}
      target_risk: ${{ matrix.params.target_risk }}
      target_base: ${{ matrix.params.target_base }}
      neighbor_charm: ${{ matrix.params.neighbor_charm }}
      neighbor_endpoint: ${{ matrix.params.neighbor_endpoint }}
      substrate: ${{ matrix.params.substrate }}
      full_test_suite: ${{ inputs.full_test_suite }}
      additional_tests: ${{ inputs.additional_tests }}
    secrets:
      STG_TEST_OBSERVER_TOKEN: ${{ secrets.STG_TEST_OBSERVER_TOKEN }}
