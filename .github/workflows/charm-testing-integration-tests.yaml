---
name: Run Integration Tests for Charm Testing
permissions:
  contents: read
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      STG_TEST_OBSERVER_TOKEN:
        required: true
jobs:
  assert-pass:
    strategy:
      max-parallel: 1
      matrix:
        params:
          - target_environment: ps7-sqa-prod_charm_qa_lxd-1
            neighbor_environment: ps7-sqa-prod_charm_qa_kubernetes-1
            same_controller: true
            juju_channel: 3.6/stable
            target_charm: data-integrator
            target_endpoint: postgresql
            target_revision: 418
            target_track: latest
            target_risk: stable
            target_base: '24.04'
            neighbor_charm: pgbouncer-k8s
            neighbor_endpoint: database
    uses: ./.github/workflows/charm-testing-integration-test-assert-pass.yaml
    permissions:
      contents: read
      actions: write
    with:
      target_environment: ${{ matrix.params.target_environment }}
      neighbor_environment: ${{ matrix.params.neighbor_environment }}
      same_controller: ${{ matrix.params.same_controller }}
      juju_channel: ${{ matrix.params.juju_channel }}
      target_charm: ${{ matrix.params.target_charm }}
      target_endpoint: ${{ matrix.params.target_endpoint }}
      target_revision: ${{ matrix.params.target_revision }}
      target_track: ${{ matrix.params.target_track }}
      target_risk: ${{ matrix.params.target_risk }}
      target_base: ${{ matrix.params.target_base }}
      neighbor_charm: ${{ matrix.params.neighbor_charm }}
      neighbor_endpoint: ${{ matrix.params.neighbor_endpoint }}
    secrets:
      STG_TEST_OBSERVER_TOKEN: ${{ secrets.STG_TEST_OBSERVER_TOKEN }}
