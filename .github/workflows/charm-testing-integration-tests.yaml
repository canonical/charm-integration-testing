name: Run Integration Tests for Charm Testing

permissions:
  contents: read # only needed for private repos

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PROD_SQA_KUBECONFIG:
        required: true
      STG_SQA_KUBECONFIG:
        required: true
      SWIFT_OS_AUTH_URL:
        required: true
      SWIFT_OS_USERNAME:
        required: true
      SWIFT_OS_PASSWORD:
        required: true
      SWIFT_OS_PROJECT_NAME:
        required: true
      SWIFT_OS_REGION_NAME:
        required: true
      SWIFT_OS_USER_DOMAIN_NAME:
        required: true
      SWIFT_OS_PROJECT_DOMAIN_NAME:
        required: true

jobs:
  assert-pass:
    strategy:
      max-parallel: 1
      matrix:
        params:
          - target_charm: postgresql-k8s
            target_endpoint: certificates
            target_revision: 495
            target_base: "22.04"
            neighbor_charm: self-signed-certificates
            neighbor_endpoint: certificates
    uses: ./.github/workflows/charm-testing-integration-test-assert-pass.yaml
    with:
      target_charm: ${{ matrix.params.target_charm }}
      target_endpoint: ${{ matrix.params.target_endpoint }}
      target_revision: ${{ matrix.params.target_revision }}
      target_base: ${{ matrix.params.target_base }}
      neighbor_charm: ${{ matrix.params.neighbor_charm }}
      neighbor_endpoint: ${{ matrix.params.neighbor_endpoint }}
    secrets:
      PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
      STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
      SWIFT_OS_AUTH_URL: ${{ secrets.SWIFT_OS_AUTH_URL }}
      SWIFT_OS_USERNAME: ${{ secrets.SWIFT_OS_USERNAME }}
      SWIFT_OS_PASSWORD: ${{ secrets.SWIFT_OS_PASSWORD }}
      SWIFT_OS_PROJECT_NAME: ${{ secrets.SWIFT_OS_PROJECT_NAME }}
      SWIFT_OS_REGION_NAME: ${{ secrets.SWIFT_OS_REGION_NAME }}
      SWIFT_OS_USER_DOMAIN_NAME: ${{ secrets.SWIFT_OS_USER_DOMAIN_NAME }}
      SWIFT_OS_PROJECT_DOMAIN_NAME: ${{ secrets.SWIFT_OS_PROJECT_DOMAIN_NAME }}
