---
name: Clean up environments on a schedule
run-name: Cleaning up environments on a schedule
permissions:
  contents: read  # only needed for private repos
  actions: read
on:
  schedule:
    - cron: '*/30 * * * *'
jobs:
  wait-for-previous-sweep:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for earlier scheduled sweeps
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          while true; do
            active_sweeps=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow cleanup-environment-schedule.yaml \
              --event schedule \
              --branch "${GITHUB_REF_NAME}" \
              --json number,status \
              --limit 1000)
            earlier_sweeps=$(jq --argjson current "${GITHUB_RUN_NUMBER}" \
              '[.[] | select(.number < $current and .status != "completed")] | length' \
              <<< "${active_sweeps}")
            if [[ "${earlier_sweeps}" == "0" ]]; then
              break
            fi
            echo "Waiting for ${earlier_sweeps} earlier scheduled sweep(s) to complete."
            sleep 30
          done
  cleanup-ps6-stg-kubernetes-1:
    needs: wait-for-previous-sweep
    uses: ./.github/workflows/cleanup-environment.yaml
    with:
      environment: ps6-sqa-stg_charm_qa_kubernetes-1
      cleanup_substrate: true
    secrets:
      PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
      STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
      PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
      PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
      PROD_PS7_NOVARC: ${{ secrets.PROD_PS7_NOVARC }}
      S3_SWIFT_CONFIG: ${{ secrets.S3_SWIFT_CONFIG_PS6_SQA_STG_CHARM_QA_KUBERNETES_1 }}
  cleanup-ps6-stg-kubernetes-2:
    needs: [wait-for-previous-sweep, cleanup-ps6-stg-kubernetes-1]
    if: ${{ !cancelled() && needs.wait-for-previous-sweep.result == 'success' }}
    uses: ./.github/workflows/cleanup-environment.yaml
    with:
      environment: ps6-sqa-stg_charm_qa_kubernetes-2
    secrets:
      PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
      STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
      PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
      PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
      PROD_PS7_NOVARC: ${{ secrets.PROD_PS7_NOVARC }}
      S3_SWIFT_CONFIG: ${{ secrets.S3_SWIFT_CONFIG_PS6_SQA_STG_CHARM_QA_KUBERNETES_2 }}
  cleanup-ps6-prod-kubernetes-1:
