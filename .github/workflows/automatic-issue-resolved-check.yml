---
name: Run Integration from fixed branch
permissions:
  contents: read
on:
  issue_comment:
    types: [created]
jobs:
  check_issue_fixed:
    name: issue_checker
    runs-on: [self-hosted, charm_qa]
    if: ${{ github.event.issue.pull_request }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Get PR details and extract issue number
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        id: pr-details
        with:
          script: |
            const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
            });
            core.setOutput('sha', pr.data.head.sha);
            // Extract issue number from PR body by looking for issue URL
            const body = pr.data.body || '';
            const issueUrlPattern = /issues\/(\d+)/;
            const match = body.match(issueUrlPattern);
            let issueNumber = null;
            for (const pattern of issuePatterns) {
              const match = pattern.exec(body);
              if (match) {
                issueNumber = match[1];
                break;
              }
            }
            if (issueNumber) {
              core.setOutput('issue_number', issueNumber);
              core.setOutput('has_issue', 'true');
            } else {
              core.setOutput('has_issue', 'false');
              console.log('No issue number found in PR body. Skipping dispatch.');
            }

      - name: dispatch test to check if issue is fixed
        if: steps.pr-details.outputs.has_issue == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.pr-details.outputs.issue_number }}
          PR_REF: ${{ steps.pr-details.outputs.sha }}
          PROJECT: canonical/charm-integration-testing
          ENVIRONMENT: staging
        run: |-
          python3 ./scripts/dispatch_issue_fixed_check.py ${ISSUE_NUMBER} ${PR_REF} --project ${PROJECT} --environment ${ENVIRONMENT}
