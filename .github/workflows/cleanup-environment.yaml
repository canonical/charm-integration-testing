---
name: Clean up environment
run-name: List S3 buckets for ${{ inputs.environment }} (read-only)
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose S3 buckets should be listed.
        type: choice
        default: ps7-sqa-prod_charm_qa_kubernetes-1
        options:
          - ps7-sqa-prod_charm_qa_kubernetes-1
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      age_threshold:
        type: number
        default: 240
      dry_run:
        type: boolean
        default: true
    secrets:
      PROD_SQA_KUBECONFIG:
        required: false
      STG_SQA_KUBECONFIG:
        required: false
      PROD_SQA_NOVARC:
        required: false
      PROD_PS7_KUBECONFIG:
        required: false
      PROD_PS7_NOVARC:
        required: false
      PROD_PS7_LXD:
        required: false
      S3_PS6_SQA_STG_CHARM_QA_KUBERNETES:
        required: false
      S3_PS6_SQA_PROD_CHARM_QA_KUBERNETES:
        required: false
      S3_PS6_SQA_PROD_CHARM_QA_OPENSTACK:
        required: false
      S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES:
        required: false
      S3_PS7_SQA_PROD_CHARM_QA_OPENSTACK:
        required: false
      S3_PS7_SQA_PROD_CHARM_QA_LXD:
        required: false
jobs:
  list-buckets:
    name: List buckets without changing any cloud resources
    runs-on: [self-hosted-linux-amd64-noble-private-endpoint-small]
    steps:
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Get environment info
        id: env_info
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: ${{ inputs.environment }}
      - name: Install AWS CLI
        uses: ./.github/actions/install-with-retry
        with:
          command: sudo apt-get update --quiet && sudo apt-get install --quiet --assume-yes
            python3-venv jq && python3 -m venv "${{ runner.temp }}/s3-list" && "${{ runner.temp }}/s3-list/bin/pip"
            install 'awscli>=1.40,<2'
      - name: List buckets and check the completed test bucket
        shell: bash
        env:
          S3_STORAGE_SECRET_NAME: ${{ steps.env_info.outputs.s3-secret }}
          S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES: ${{ secrets.S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES }}
        run: |-
          set -euo pipefail
          if [[ "$S3_STORAGE_SECRET_NAME" != S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES ]]; then
            echo "::error::This temporary diagnostic only supports PS7 Kubernetes"
            exit 1
          fi
          declare -A config=()
          while IFS='=' read -r name value; do
            [[ "$name" == S3_* ]] && config["$name"]="$value"
          done <<< "$S3_PS7_SQA_PROD_CHARM_QA_KUBERNETES"
          export AWS_ACCESS_KEY_ID="${config[S3_CLEANUP_ACCESS_KEY]:-${config[S3_ACCESS_KEY]}}"
          export AWS_SECRET_ACCESS_KEY="${config[S3_CLEANUP_SECRET_KEY]:-${config[S3_SECRET_KEY]}}"
          export AWS_DEFAULT_REGION="${config[S3_REGION]:-us-east-1}"
          export AWS_EC2_METADATA_DISABLED=true
          "${RUNNER_TEMP}/s3-list/bin/aws" s3api list-buckets \
            --endpoint-url "${config[S3_ENDPOINT]}" --output json > "${RUNNER_TEMP}/s3-buckets.json"
          jq -e '.Buckets | type == "array"' "${RUNNER_TEMP}/s3-buckets.json" >/dev/null
          jq -r '.Buckets[] | [.Name, .CreationDate] | @tsv' "${RUNNER_TEMP}/s3-buckets.json"
          bucket=charmqa-s3-9eda5e77-1793895512-bcefce5abcda4609
          if jq -e --arg bucket "$bucket" '.Buckets[] | select(.Name == $bucket)' \
            "${RUNNER_TEMP}/s3-buckets.json"; then
            echo "::error::Test bucket still exists: $bucket"
            exit 1
          fi
          echo "Verified: test bucket is absent: $bucket"
