---
name: Clean up environment
run-name: Clean up ${{ inputs.environment }} environment
concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment }}
  cancel-in-progress: true
permissions:
  contents: read  # only needed for private repos
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to clean.
        type: choice
        default: ps6-sqa-stg_charm_qa_kubernetes-1
        options:
          - ps6-sqa-stg_charm_qa_kubernetes-1
          - ps6-sqa-prod_charm_qa_kubernetes-1
          - ps6-sqa-prod_charm_qa_openstack-1
          - ps7-sqa-prod_charm_qa_kubernetes-1
          - ps7-sqa-prod_charm_qa_openstack-1
      age_threshold:
        description: Age threshold in minutes (resources older than this will be deleted)
        type: number
        default: 240
  workflow_call:
    inputs:
      environment:
        description: Environment to clean.
        type: string
        required: true
      age_threshold:
        description: Age threshold in minutes (resources older than this will be deleted)
        type: number
        default: 240
    secrets:
      PROD_SQA_KUBECONFIG:
        required: true
      STG_SQA_KUBECONFIG:
        required: true
      PROD_SQA_NOVARC:
        required: true
      PROD_PS7_KUBECONFIG:
        required: true
      PROD_PS7_NOVARC:
        required: true
jobs:
  cleanup-environment:
    name: Clean up any leftover artifacts from old Charm QA environments
    runs-on: [self-hosted-linux-amd64-noble-private-endpoint-small]
    env:
      AGE_THRESHOLD: ${{ inputs.age_threshold }}
    steps:

      ##################################################################################
      # _____ ______ _______ _    _ _____  
      #  / ____|  ____|__   __| |  | |  __ \ 
      # | (___ | |__     | |  | |  | | |__) |
      #  \___ \|  __|    | |  | |  | |  ___/ 
      #  ____) | |____   | |  | |__| | |     
      # |_____/|______|  |_|   \____/|_|     
      #                                      
      - name: Clone Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate age threshold
        id: age_threshold
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import os
          import sys
          try:
              threshold = float(os.environ["AGE_THRESHOLD"])
          except ValueError:
              threshold = math.nan
          if not math.isfinite(threshold) or threshold <= 0:
              print("::error::age_threshold must be a positive finite number")
              sys.exit(1)
          PY
      - name: Get environment info
        id: env_info
        uses: ./.github/actions/get-environment-info
        with:
          environment_name: ${{ inputs.environment }}
      - name: Resolve credentials
        id: creds
        shell: bash
        env:
          KUBECONFIG_SECRET_NAME: ${{ steps.env_info.outputs.kubeconfig-secret }}
          NOVARC_SECRET_NAME: ${{ steps.env_info.outputs.novarc-secret }}
          STG_SQA_KUBECONFIG: ${{ secrets.STG_SQA_KUBECONFIG }}
          PROD_SQA_KUBECONFIG: ${{ secrets.PROD_SQA_KUBECONFIG }}
          PROD_SQA_NOVARC: ${{ secrets.PROD_SQA_NOVARC }}
          PROD_PS7_KUBECONFIG: ${{ secrets.PROD_PS7_KUBECONFIG }}
          PROD_PS7_NOVARC: ${{ secrets.PROD_PS7_NOVARC }}
        run: |
          if [[ -n "${KUBECONFIG_SECRET_NAME}" ]]; then
            echo "kubernetes=true" >> $GITHUB_OUTPUT
            echo "${!KUBECONFIG_SECRET_NAME}" > "kubeconfig"
            echo "KUBECONFIG=$(realpath kubeconfig)" >> $GITHUB_ENV
          fi
          if [[ -n "${NOVARC_SECRET_NAME}" ]]; then
            echo "openstack=true" >> $GITHUB_OUTPUT
            # Extract environment variables from the RC file
            while IFS= read -r line; do
              # Only process lines that look like they set OpenStack variables
              # This beast of a regex matches an optional leading 'export' with whitespace,
              # followed by an OS_ variable name, an equals sign, and a value that may be
              # unquoted, single-quoted, or double-quoted.
              # Only one of the unquoted, single-quoted, or double-quoted groups will match
              if [[ "$line" =~ ^(export[[:space:]]+)?(OS_[A-Z_]+)=(\"([^\"]*)\"|\'([^\']*)\'|([^[:space:]]*))$ ]]; then
                  key="${BASH_REMATCH[2]}"
                  value="${BASH_REMATCH[4]}${BASH_REMATCH[5]}${BASH_REMATCH[6]}"
                  echo "::add-mask::$value"
                  echo "$key=$value" >> $GITHUB_ENV
                fi
            done <<< "${!NOVARC_SECRET_NAME}"
          fi
      - name: Check S3 cleanup credentials
        id: s3_credentials
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.env_info.outcome == 'success' && steps.env_info.outputs.s3-swift-secret != '' }}
        shell: bash
        env:
          SWIFT_SECRET_NAME: ${{ steps.env_info.outputs.s3-swift-secret }}
          SWIFT_CONFIG: ${{ secrets[steps.env_info.outputs.s3-swift-secret] }}  # zizmor: ignore[overprovisioned-secrets] Secret names come from trusted environment metadata.
        run: python3 scripts/load-swift-config.py "${SWIFT_SECRET_NAME}" --output-file
          "${RUNNER_TEMP}/cleanup-s3.conf"
      - name: Install S3 cleanup dependencies
        id: s3_dependencies
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.s3_credentials.outcome == 'success' && steps.s3_credentials.outputs.available == 'true' }}
        uses: ./.github/actions/install-with-retry
        with:
          command: python3 -m venv "${{ runner.temp }}/s3-cleanup" && "${{ runner.temp }}/s3-cleanup/bin/pip"
            install 'boto3>=1.40,<2' 'requests>=2.32.3,<2.35' 'pydantic>=2.11.3,<3'
      - name: Remove stale harness S3 buckets
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.s3_dependencies.outcome == 'success' }}
        shell: bash
        env:
          # Cleanup imports only the storage module, not the full suite and its dependencies.
          PYTHONPATH: ${{ github.workspace }}/charm_integration_testing
          S3_CONFIG_PATH: ${{ steps.s3_credentials.outputs.config_path }}
        run: |
          "${RUNNER_TEMP}/s3-cleanup/bin/python" scripts/cleanup-s3.py --config "${S3_CONFIG_PATH}" --age-minutes "${AGE_THRESHOLD}"

      ##################################################################################
      #  _  ___    _ ____  ______ _____  _   _ ______ _______ ______  _____ 
      # | |/ / |  | |  _ \|  ____|  __ \| \ | |  ____|__   __|  ____|/ ____|
      # | ' /| |  | | |_) | |__  | |__) |  \| | |__     | |  | |__  | (___  
      # |  < | |  | |  _ <|  __| |  _  /| . ` |  __|    | |  |  __|  \___ \ 
      # | . \| |__| | |_) | |____| | \ \| |\  | |____   | |  | |____ ____) |
      # |_|\_\\____/|____/|______|_|  \_\_| \_|______|  |_|  |______|_____/ 
      #
      - name: Install kubectl
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        uses: ./.github/actions/install-with-retry
        with:
          command: sudo snap install kubectl --classic
      - name: Remove orphaned rawfile PV directories from nodes
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # On Juju 4 with K8s, destroy-controller --destroy-storage can leave workload PVCs
          # undeleted. Because the PVC remains Bound, the PV never transitions to Released, the
          # rawfile CSI external-provisioner never calls DeleteVolume, and the on-disk directory
          # under /var/snap/k8s/common/rawfile-storage is never removed. This step iterates over
          # every node and deletes any on-disk rawfile directory that has no corresponding PV
          # still known to k8s.
          # Related: https://github.com/juju/juju/issues/22309
          STORAGE_PATH="/var/snap/k8s/common/rawfile-storage"

          # Collect names of all PVs still known to k8s after the deletions above.
          # Any on-disk directory not in this list is an orphan and should be removed.
          if ! KNOWN_PVS_RAW=$(kubectl get pv \
            --output jsonpath='{range .items[*]}{.metadata.name}{" "}{end}'); then
            echo "Failed to retrieve PersistentVolumes; aborting orphan cleanup"
            exit 1
          fi
          KNOWN_PVS=$(xargs <<< "$KNOWN_PVS_RAW")
          echo "Known PVs: ${KNOWN_PVS:-none}"
          NODES=$(kubectl get nodes \
            --output jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
          if [[ -z "$NODES" ]]; then
            echo "No nodes found, skipping orphan cleanup"
            exit 0
          fi
          while IFS= read -r node; do
            echo "==> Checking node: $node"
            debug_status=0
            debug_output=$(kubectl debug "node/$node" \
              --image=ubuntu:24.04 \
              --profile=sysadmin \
              -- bash -c "
                storage=\"/host${STORAGE_PATH}\"
                known_pvs='${KNOWN_PVS}'
                [[ -d \"\$storage\" ]] || { echo '  (no rawfile-storage directory)'; exit 0; }
                for dir in \$(ls \"\$storage\" 2>/dev/null); do
                  found=false
                  for pv in \$known_pvs; do
                    [[ \"\$dir\" == \"\$pv\" ]] && found=true && break
                  done
                  if \$found; then
                    echo \"  OK: \$dir\"
                  else
                    size=\$(stat --format='%s' \"\$storage/\$dir/disk.img\" 2>/dev/null || echo 0)
                    human=\$(numfmt --to=iec \"\$size\" 2>/dev/null || echo \"\${size}B\")
                    echo \"  DELETING orphan: \$dir (apparent: \$human)\"
                    rm -rf \"\$storage/\$dir\"
                  fi
                done
              " 2>&1) || debug_status=$?
            printf '%s\n' "$debug_output"
            if (( debug_status != 0 )); then
              echo "::error::kubectl debug failed for $node (exit status: $debug_status)"
              exit "$debug_status"
            fi
            if [[ "$debug_output" =~ (node-debugger-[a-z0-9.-]*[a-z0-9]) ]]; then
              pod_name="${BASH_REMATCH[1]}"
            else
              echo "::error::Could not determine the debug pod name for $node"
              exit 1
            fi

            # Wait up to 5 minutes for the pod to finish, then print its logs
            kubectl wait "pod/$pod_name" \
              --for=jsonpath='{.status.phase}'=Succeeded \
              --timeout=5m 2>/dev/null \
              || kubectl wait "pod/$pod_name" \
                   --for=jsonpath='{.status.phase}'=Failed \
                   --timeout=10s 2>/dev/null \
              || true
            kubectl logs "pod/$pod_name" || echo "  Warning: could not retrieve logs for $pod_name"
            kubectl delete "pod/$pod_name" --ignore-not-found=true --timeout=2m
          done <<< "$NODES"
      - name: Find all model and controller namespaces older than the age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        shell: bash
        run: |
          kubectl get namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.metadata.name | test("^(controller-)?charmqa-")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all webhook configurations older than the age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          namespaces=$(mktemp)
          trap 'rm -f "$namespaces"' EXIT
          kubectl get namespaces --output json | jq '[.items[].metadata.name]' > "$namespaces"

          # Helm ownership does not protect webhooks whose QA target namespaces are gone.
          kubectl get validatingwebhookconfigurations,mutatingwebhookconfigurations --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" --slurpfile namespaces "$namespaces" '
            def orphaned_qa_webhook:
              (.webhooks | length > 0) and
              all(.webhooks[];
                (.clientConfig.service.namespace // "") as $namespace |
                ($namespace | test("^(controller-)?charmqa-")) and
                (($namespaces[0] | index($namespace)) == null)
              );
            def helm_managed:
              .metadata.labels["app.kubernetes.io/managed-by"] == "Helm"
              or (
                (.metadata.annotations["meta.helm.sh/release-name"] // "") != ""
                and (.metadata.annotations["meta.helm.sh/release-namespace"] // "") != ""
              );
            .items[] |
            select((helm_managed | not) or orphaned_qa_webhook) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all juju-credential service accounts older than the age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        shell: bash
        run: |
          kubectl get serviceaccounts --all-namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.metadata.name | test("^juju-credentials?-[a-zA-Z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .metadata.namespace + ":" + .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find all juju-credential secrets older than the age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        shell: bash
        run: |
          kubectl get secrets --all-namespaces --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.type == "kubernetes.io/service-account-token") |
            select(.metadata.name | test("^juju-credentials?-[a-zA-Z0-9]{8}$")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .metadata.namespace + ":" + .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find released rawfile PersistentVolumes older than the age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        shell: bash
        run: |
          # Released rawfile PVs should be cleaned up by the CSI driver automatically, but
          # will get stuck if the node they were provisioned on no longer exists. Add them to
          # the delete list
          kubectl get pv --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.status.phase == "Released") |
            select(.spec.storageClassName == "csi-rawfile-default") |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Find old QA cluster RBAC
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        shell: bash
        run: |
          kubectl get clusterroles,clusterrolebindings --output json | jq --raw-output --argjson age "$AGE_THRESHOLD" '
            .items[] |
            select(.metadata.name | test("^(controller-)?charmqa-")) |
            select((now - (.metadata.creationTimestamp | fromdateiso8601)) > ($age * 60)) |
            .kind + "/" + .metadata.name
          ' >> resources_to_remove.txt
      - name: Remove all resources
        shell: bash
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.kubernetes == 'true' }}
        run: |-
          set -uo pipefail

          # Group resources by namespace
          declare -A namespaced_resources
          cluster_resources=()
          while IFS= read -r line; do 
            if [[ "$line" == *:* ]]; then
              namespace="${line%%:*}"
              resource="${line#*:}"
              namespaced_resources["$namespace"]+="$resource "
            else
              cluster_resources+=("$line")
            fi
          done < resources_to_remove.txt
          failed=0
          pids=()
          descriptions=()

          # Delete cluster-scoped resources
          if [ ${#cluster_resources[@]} -gt 0 ]; then
            kubectl delete "${cluster_resources[@]}" --ignore-not-found=true --timeout=25m &
            pids+=("$!")
            descriptions+=("cluster-scoped resources")
          fi

          # Delete namespaced resources (one command per namespace)
          for namespace in "${!namespaced_resources[@]}"; do
            read -r -a resources <<< "${namespaced_resources[$namespace]}"
            kubectl delete "${resources[@]}" --namespace="$namespace" --ignore-not-found=true --timeout=25m &
            pids+=("$!")
            descriptions+=("resources in namespace $namespace")
          done
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "Cleanup succeeded for ${descriptions[$i]}"
            else
              status=$?
              echo "Cleanup failed for ${descriptions[$i]} (exit status: $status)" >&2
              failed=1
            fi
          done
          exit "$failed"

      ##################################################################################
      #   ____  _____  ______ _   _  _____ _______       _____ _  __
      #  / __ \|  __ \|  ____| \ | |/ ____|__   __|/\   / ____| |/ /
      # | |  | | |__) | |__  |  \| | (___    | |  /  \ | |    | ' / 
      # | |  | |  ___/|  __| | . ` |\___ \   | | / /\ \| |    |  <  
      # | |__| | |    | |____| |\  |____) |  | |/ ____ \ |____| . \ 
      #  \____/|_|    |______|_| \_|_____/   |_/_/    \_\_____|_|\_\
      #
      - name: Install openstack client
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.openstack == 'true' }}
        uses: ./.github/actions/install-with-retry
        with:
          command: sudo snap install openstackclients
      - name: Find and delete servers older than age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.openstack == 'true' }}
        shell: bash
        run: |
          openstack server list --format json | jq --raw-output '.[].ID' | while read -r server_id; do
            created=$(openstack server show "$server_id" --format json | jq -r '.created')
            age_seconds=$(($(date +%s) - $(date -d "$created" +%s)))
            age_minutes=$((age_seconds / 60))
            if awk -v age_seconds="$age_seconds" -v threshold="$AGE_THRESHOLD" \
              'BEGIN { exit !(age_seconds / 60 > threshold) }'; then
              echo "Deleting server: $server_id (age: $age_minutes minutes)"
              openstack server delete "$server_id" || true
            fi
          done
      - name: Find and delete security groups older than age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.openstack == 'true' }}
        shell: bash
        run: |
          openstack security group list --format json | jq --raw-output '.[] | select(.Name != "default") | .ID' | while read -r sg_id; do
            created=$(openstack security group show "$sg_id" --format json | jq -r '.created_at')
            age_seconds=$(($(date +%s) - $(date -d "$created" +%s)))
            age_minutes=$((age_seconds / 60))
            if awk -v age_seconds="$age_seconds" -v threshold="$AGE_THRESHOLD" \
              'BEGIN { exit !(age_seconds / 60 > threshold) }'; then
              echo "Deleting security group: $sg_id (age: $age_minutes minutes)"
              openstack security group delete "$sg_id" || true
            fi
          done
      - name: Find and delete load balancers older than age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.openstack == 'true' }}
        shell: bash
        run: |
          openstack loadbalancer list --format json | jq --raw-output '.[].id' | while read -r lb_id; do
            created=$(openstack loadbalancer show "$lb_id" --format json | jq -r '.created_at')
            age_seconds=$(($(date +%s) - $(date -d "$created" +%s)))
            age_minutes=$((age_seconds / 60))
            if awk -v age_seconds="$age_seconds" -v threshold="$AGE_THRESHOLD" \
              'BEGIN { exit !(age_seconds / 60 > threshold) }'; then
              echo "Deleting load balancer: $lb_id (age: $age_minutes minutes)"
              # Delete pools first
              openstack loadbalancer pool list --loadbalancer "$lb_id" --format json | jq --raw-output '.[].id' | while read -r pool_id; do
                echo "  Deleting pool: $pool_id"
                openstack loadbalancer pool delete "$pool_id" || true
              done
              # Then delete the load balancer
              openstack loadbalancer delete "$lb_id" || true
            fi
          done
      - name: Find and delete volumes older than age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.openstack == 'true' }}
        shell: bash
        run: |
          openstack volume list --format json | jq --raw-output '.[].ID' | while read -r volume_id; do
            created=$(openstack volume show "$volume_id" --format json | jq -r '.created_at')
            age_seconds=$(($(date +%s) - $(date -d "$created" +%s)))
            age_minutes=$((age_seconds / 60))
            if awk -v age_seconds="$age_seconds" -v threshold="$AGE_THRESHOLD" \
              'BEGIN { exit !(age_seconds / 60 > threshold) }'; then
              echo "Deleting volume: $volume_id (age: $age_minutes minutes)"
              openstack volume delete "$volume_id" || true
            fi
          done
      - name: Find and delete floating IPs older than age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.openstack == 'true' }}
        shell: bash
        run: |-
          openstack floating ip list --format json | jq --raw-output '.[].ID' | while read -r fip_id; do
            created=$(openstack floating ip show "$fip_id" --format json | jq -r '.created_at')
            age_seconds=$(($(date +%s) - $(date -d "$created" +%s)))
            age_minutes=$((age_seconds / 60))
            if awk -v age_seconds="$age_seconds" -v threshold="$AGE_THRESHOLD" \
              'BEGIN { exit !(age_seconds / 60 > threshold) }'; then
              echo "Deleting floating IP: $fip_id (age: $age_minutes minutes)"
              openstack floating ip delete "$fip_id" || true
            fi
          done
      - name: Find and delete orphaned ports that are in the DOWN state and older
          than age threshold
        if: ${{ !cancelled() && steps.age_threshold.outcome == 'success' && steps.creds.outputs.openstack == 'true' }}
        shell: bash
        run: |-
          lb_output=$(openstack loadbalancer list -f value -c id) || {
            echo "Failed to read active load balancers; refusing to delete orphaned ports"
            exit 1
          }
          active_lbs=()
          if [[ -n $lb_output ]]; then
            mapfile -t active_lbs <<<"$lb_output"
          fi
          is_active_lb() {
            local id=$1
            for lb in "${active_lbs[@]}"; do
              [[ $lb == "$id" ]] && return 0
            done
            return 1
          }
          port_ids_output=$(openstack port list --format json | jq -r '.[] | select(.Status == "DOWN") | .ID') || {
            echo "Failed to list DOWN ports; refusing to continue orphaned port cleanup"
            exit 1
          }
          down_port_ids=()
          if [[ -n $port_ids_output ]]; then
            mapfile -t down_port_ids <<<"$port_ids_output"
          fi
          for port_id in "${down_port_ids[@]}"; do
            port_data=$(openstack port show "$port_id" --format json) || {
              echo "Failed to read port $port_id; refusing to continue orphaned port cleanup"
              exit 1
            }
            device_owner=$(jq -r '.device_owner' <<<"$port_data")
            device_id=$(jq -r '.device_id' <<<"$port_data")
            created=$(jq -r '.created_at' <<<"$port_data")
            created_ts=$(date -d "$created" +%s) || {
              echo "Failed to parse port $port_id created_at timestamp; refusing to continue orphaned port cleanup"
              exit 1
            }
            age_seconds=$(($(date +%s) - created_ts))
            age_minutes=$((age_seconds / 60))
            [[ $device_owner != "Octavia" ]] && continue
            awk -v age_seconds="$age_seconds" -v threshold="$AGE_THRESHOLD" \
              'BEGIN { exit !(age_seconds / 60 > threshold) }' || continue
            lb_id=${device_id#lb-}
            if is_active_lb "$lb_id"; then
              echo "Skipping port $port_id — still used by load balancer $lb_id"
            else
              echo "Deleting orphaned port: $port_id (age: $age_minutes minutes, lb $lb_id not found)"
              openstack port delete "$port_id" || true
            fi
          done
