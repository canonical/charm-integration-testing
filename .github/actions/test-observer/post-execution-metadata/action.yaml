---
name: Post results
description: Post results to Test Observer
inputs:
  test_observer_api:
    description: URL for the Test Observer API
    required: true
  test_observer_token:
    description: Bearer token to send as Authorization header
    required: true
  test_execution_id:
    description: ID for the Test Execution
    required: true
  junit_xml:
    description: Test results JUnit XML file
    required: true
runs:
  using: composite
  steps:
    - name: Install yq
      shell: bash
      run: |
        for ((attempt = 1; ; attempt++)); do
          if sudo snap install yq; then
            break
          elif [ "$attempt" -lt 3 ]; then
            echo "Failed, retrying..."
            sleep 5
          else
            exit 1
          fi
        done
    - name: Convert JUnit XML to Test Observer JSON
      id: request-body
      shell: bash
      env:
        junit_xml: ${{ inputs.junit_xml }}
      run: |
        # XML to JSON conversion is not 1-to-1
        # So sometimes things are wrapped in lists, sometimes they're not
        # Explicitly wrap these things in list
        cat "${junit_xml}" | yq -p=xml -o=json '
          .testsuites.testsuite |= [] + . |
          .testsuites.testsuite[].testcase |= [] + . |
          .testsuites.testsuite[].testcase[].properties.property |= [] + .
        ' | jq --compact-output '
          {
            "execution_metadata": (
              [
                .testsuites.testsuite[].testcase[].properties.property[] |
                {("charm_qa:" + ."+@name"): (."+@value" | fromjson)}
              ] | add
            )
          }
        ' > body.json
        echo "file=$(realpath body.json)" >> "$GITHUB_OUTPUT"
    - name: Send request to Test Observer
      uses: ./.github/actions/test-observer/call-api
      id: call-api
      with:
        test_observer_api: ${{ inputs.test_observer_api }}/v1/test-executions/${{
          inputs.test_execution_id }}
        test_observer_token: ${{ inputs.test_observer_token }}
        method_type: PATCH
        request_body: '@${{ steps.request-body.outputs.file }}'
