name: Trigger a rerun on Test Observer
description: Posts a rerun request for the Test Execution ID on Test Observer

inputs:
  test_observer_api:
    description: "URL for the Test Observer API"
    required: True
  test_observer_token:
    description: "Bearer token to send as Authorization header"
    required: True
  test_execution_id:
    description: "ID for the Test Execution to trigger a rerun for"
    required: True

runs:
  using: "composite"
  steps:
    - name: Get Test Observer JSON
      id: request-body
      shell: bash
      env:
        test_execution_id: ${{ inputs.test_execution_id }}
      run: |
        jq --null-input --compact-output --arg test_execution_id "${test_execution_id}" '
          {
            "test_execution_ids": [$test_execution_id] 
          }
        ' > body.json
        echo "file=$(realpath body.json)" >> "$GITHUB_OUTPUT"

    - name: Send request to Test Observer
      uses: ./.github/actions/test-observer/call-api
      id: call-api
      with:
        test_observer_api: "${{ inputs.test_observer_api }}/v1/test-executions/reruns"
        test_observer_token: "${{ inputs.test_observer_token }}"
        method_type: "POST"
        request_body: "@${{ steps.request-body.outputs.file }}"
