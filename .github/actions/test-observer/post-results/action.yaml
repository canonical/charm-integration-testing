name: Post results
description: Post results to Test Observer

inputs:
  test_observer_api:
    description: "URL for the Test Observer API"
    required: True

  test_execution_id:
    description: "ID for the Test Execution"
    required: True

  junit_xml:
    description: "Test results JUnit XML file"
    required: True

runs:
  using: "composite"
  steps:
    - name: Install yq
      shell: bash
      run: sudo snap install yq

    - id: get-json-body
      name: Convert JUnit XML to Test Observer JSON
      shell: bash
      env:
        junit_xml: ${{ inputs.junit_xml }}
      run: |
        cat "${junit_xml}" | yq -p=xml -o=json '
          .testsuites.testsuite |= [] + . | # Ensure testsuite is list
          .testsuites.testsuite[].testcase |= [] + . | # Ensure testcase is list
          .testsuites.testsuite[].testcase[].system-out |= [] + . # Ensure system-out is list
        ' | jq --compact-output '
          [
            .testsuites.testsuite[] | {testsuite: .} + (.testcase[]) |
            {
              "name": ."+@name",
              "status": (
                if .error or .failure then "FAILED"
                elif .skipped then "SKIPPED"
                else "PASSED"
                end
              ),
              "template_id": (
                if ."+@classname" then ."+@classname"
                else ""
                end
              ),
              "category": (
                if .testsuite."+@name" then .testsuite."+@name"
                else ""
                end
              ),
              "comment": (
                if .error then .error."+@message"
                elif .failure then .failure."+@message"
                elif .skipped then .skipped."+@message"
                else ""
                end
              ),
              "io_log": (
                if ."system-out" then (."system-out" | join("\n"))
                else ""
                end
              )
            }
          ]
        ' > body.json
        cat body.json

    - name: Post results to Test Observer
      shell: bash
      env:
        test_observer_api: ${{ inputs.test_observer_api }}
        test_execution_id: ${{ inputs.test_execution_id}}
      run: |
        curl --fail-with-body \
          --retry 10 \
          -X POST "${test_observer_api}/v1/test-executions/${test_execution_id}/test-results" \
          -H "Content-Type: application/json" \
          -d @body.json
