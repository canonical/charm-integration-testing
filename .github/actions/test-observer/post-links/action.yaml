name: Post relevant links
description: Post relevant links to Test Observer

inputs:
  test_observer_api:
    description: "URL for the Test Observer API"
    required: true
  test_observer_token:
    description: "Bearer token to send as Authorization header"
    required: True
  test_execution_id:
    description: "Test Execution ID"
    required: true
  job_uuid:
    description: "Job UUID"
    required: true

runs:
  using: "composite"
  steps:
    - name: Get Test Observer JSON
      id: request-body
      shell: bash
      env:
        job_uuid: ${{ inputs.job_uuid }}
      run: |
        jq --null-input --compact-output \
          --arg job_uuid "${job_uuid}" \
        '
          {
            "label": "Logs",
            "url": "https://charm.logs.test-observer.canonical.com/\($job_uuid)/index.html"
          }
        ' > body.json
        echo "file=$(realpath body.json)" >> "$GITHUB_OUTPUT"

    - name: Send request to Test Observer
      uses: ./.github/actions/test-observer/call-api
      id: call-api
      with:
        test_observer_api: "${{ inputs.test_observer_api }}/v1/test-executions/${{ inputs.test_execution_id }}/links"
        test_observer_token: "${{ inputs.test_observer_token }}"
        method_type: "POST"
        request_body: "@${{ steps.request-body.outputs.file }}"

    - name: Debug Sleep
      if: ${{ env.DEBUG_ENABLED == 'true' && github.action == env.DEBUG_SLEEP_AFTER_STEP_ID }}
      shell: bash
      run: |
        echo "Sleeping to assist with debugging."
        sleep ${DEBUG_SLEEP_SECONDS}
