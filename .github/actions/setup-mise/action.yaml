---
name: Set up mise
description: Install the repository's mise-locked toolchain
inputs:
  install_args:
    description: Optional tool selectors passed to mise install
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"
    - name: Install mise tools
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      with:
        version: ${{ steps.version.outputs.version }}
        install_args: ${{ inputs.install_args }}
        cache: false
