---
name: Set up mise
description: Install the repository's tools, project dependencies and system packages
inputs:
  install-project:
    description: Install project Python dependencies after the tools
    default: "true"
  bootstrap:
    description: Apply all declared system packages
    default: "true"
  juju-channel:
    description: Override the Juju client channel for this setup only; empty uses
      the saved selection or repository default
    default: ""
runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"
    - name: Install mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      with:
        version: ${{ steps.version.outputs.version }}
        install: false
        cache: false
    - name: Set up environment
      shell: bash
      env:
        SETUP_INSTALL_PROJECT: ${{ inputs.install-project }}
        SETUP_BOOTSTRAP: ${{ inputs.bootstrap }}
        JUJU_CHANNEL: ${{ inputs.juju-channel }}
      run: mise run setup
