---
name: Set up mise
description: Install the repository's tools, project dependencies and system packages
inputs:
  environment:
    description: Additive mise environment; use development for linters and development
      tools
    default: ""
  install-project:
    description: Install project Python dependencies after the tools
    default: "true"
  bootstrap:
    description: Opt in to installing the declared system packages
    default: "false"
  juju-channel:
    description: Override the Juju client channel for this setup only; empty uses
      the saved selection or repository default
    default: ""
runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"
    - name: Install mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      with:
        version: ${{ steps.version.outputs.version }}
        install: false
        cache: false
    - name: Set up environment
      shell: bash
      env:
        MISE_ENV: ${{ inputs.environment }}
        SETUP_INSTALL_PROJECT: ${{ inputs.install-project }}
        SETUP_BOOTSTRAP: ${{ inputs.bootstrap }}
        JUJU_CHANNEL: ${{ inputs.juju-channel }}
      run: |-
        case "$MISE_ENV" in
          "") echo 'MISE_ENV=' >> "$GITHUB_ENV" ;;
          development) echo 'MISE_ENV=development' >> "$GITHUB_ENV" ;;
          *) echo "Unsupported mise environment: $MISE_ENV" >&2; exit 1 ;;
        esac
        mise run setup
