---
name: Set up mise
description: Install the repository's mise-locked toolchain
inputs:
  install_args:
    description: Optional tool selectors passed to mise install
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"
    - name: Install mise tools
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      with:
        version: ${{ steps.version.outputs.version }}
        install_args: uv
        cache: false
    - name: Install pipx
      shell: bash
      run: mise install --locked pipx
    - name: Install requested tools
      if: inputs.install_args != ''
      shell: bash
      env:
        MISE_INSTALL_ARGS: ${{ inputs.install_args }}
      run: |-
        read -r -a tools <<< "$MISE_INSTALL_ARGS"
        mise install --locked uv pipx "${tools[@]}"
