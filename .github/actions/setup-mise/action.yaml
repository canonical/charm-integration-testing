---
name: Set up mise
description: Install named repository tool selections and optional project dependencies
inputs:
  tools:
    description: Space-separated tool selections (python, development, workflow, integration,
      local-k8s, local-lxd)
    default: python
  install-project:
    description: Install project Python dependencies after the tools
    default: "true"
  juju-channel:
    description: Override the Juju client channel for this setup only; empty uses
      the saved selection or repository default
    default: ""
runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"
    - name: Install mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      with:
        version: ${{ steps.version.outputs.version }}
        install: false
        cache: false
    - name: Set up environment
      shell: bash
      env:
        SETUP_TOOLS: ${{ inputs.tools }}
        SETUP_INSTALL_PROJECT: ${{ inputs.install-project }}
        JUJU_CHANNEL: ${{ inputs.juju-channel }}
      run: mise run setup
