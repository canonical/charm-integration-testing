---
name: Set up mise
description: Install the repository's mise-locked toolchain
runs:
  using: composite
  steps:
    - name: Read pinned mise version
      id: version
      shell: bash
      run: echo "version=$(cat .mise-version)" >> "$GITHUB_OUTPUT"
    - name: Install mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      with:
        version: ${{ steps.version.outputs.version }}
        install: false
        cache: false
    - name: Install configured tools
      shell: bash
      run: mise run install-tools
