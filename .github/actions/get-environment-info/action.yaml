---
name: Get Environment Info
description: Look up the platform, arch, setup-mode and Juju config for a named GitHub
  Actions environment.
inputs:
  environment_name:
    description: The named GitHub Actions environment (e.g. ps6-sqa-prod_charm_qa_kubernetes-1).
    required: true
outputs:
  platform:
    description: Platform string for run-tests.sh (kubernetes or machine).
    value: ${{ steps.lookup.outputs.platform }}
  arch:
    description: Architecture string (e.g. amd64).
    value: ${{ steps.lookup.outputs.arch }}
  setup-mode:
    description: Cloud setup mode (remote).
    value: ${{ steps.lookup.outputs.setup-mode }}
  cloud-name:
    description: Juju cloud name shared by every environment on the same cloud.
    value: ${{ steps.lookup.outputs.cloud-name }}
  remote-service:
    description: Remote cloud service selected by the credential field.
    value: ${{ steps.lookup.outputs.remote-service }}
  kubeconfig-secret:
    description: Name of the GitHub secret holding the Kubernetes kubeconfig.
    value: ${{ steps.lookup.outputs.kubeconfig-secret }}
  novarc-secret:
    description: Name of the GitHub secret holding the OpenStack novarc.
    value: ${{ steps.lookup.outputs.novarc-secret }}
  lxd-secret:
    description: Name of the GitHub secret holding remote LXD credentials.
    value: ${{ steps.lookup.outputs.lxd-secret }}
  s3-secret-name:
    description: Optional name of the GitHub Actions secret holding the shared S3
      storage configuration for this environment.
    value: ${{ steps.lookup.outputs.s3-secret-name }}
  bootstrap-config:
    description: Path to a temporary file containing the Juju bootstrap config as
      JSON.
    value: ${{ steps.lookup.outputs.bootstrap-config }}
  bootstrap-constraints:
    description: Path to a temporary file containing the Juju bootstrap constraints
      as JSON.
    value: ${{ steps.lookup.outputs.bootstrap-constraints }}
  model-config:
    description: Path to a temporary file containing the Juju model config as JSON.
    value: ${{ steps.lookup.outputs.model-config }}
  remote-logging:
    description: Optional Loki base URL for controller-model remote logging.
    value: ${{ steps.lookup.outputs.remote-logging }}
runs:
  using: composite
  steps:
    - name: Look up environment topology
      id: lookup
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        WORKSPACE: ${{ github.workspace }}
      run: |-
        environment=$(mise run get-environment-info)
        config_dir=$(mktemp -d "${RUNNER_TEMP}/environment-info.XXXXXX")
        for key in bootstrap-config bootstrap-constraints model-config; do
          jq -c --arg key "${key}" '.[$key] // {}' <<< "${environment}" > "${config_dir}/${key}.json"
          echo "${key}=${config_dir}/${key}.json" >> "${GITHUB_OUTPUT}"
        done
        jq -r '
          "platform=\(.platform)",
          "arch=\(.arch)",
          "setup-mode=\(.["setup-mode"])",
          "cloud-name=\(.cloud)",
          "remote-service=\(.["remote-service"])",
          "kubeconfig-secret=\(.["kubeconfig-secret"] // "")",
          "novarc-secret=\(.["novarc-secret"] // "")",
          "lxd-secret=\(.["lxd-secret"] // "")",
          "s3-secret-name=\(.["s3-secret-name"] // "")",
          "remote-logging=\(.["remote-logging"] // "")"
        ' <<< "${environment}" >> "${GITHUB_OUTPUT}"
