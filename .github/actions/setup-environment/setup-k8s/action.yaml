---
name: Setup Kubernetes
description: Setup A kubernetes environment for charm qa
inputs:
  kubeconfig:
    description: Kubeconfig content for the Kubernetes cluster.
    required: true
  kubeconfig_path:
    description: Path to write the kubeconfig file to.
    required: false
    default: ''
  cloud-name:
    description: Name to register the Juju cloud under.
    required: true
outputs:
  cloud-name:
    description: Name of the cloud created and bootstrapped to
    value: ${{ inputs.cloud-name }}
  kubeconfig_path:
    description: Path to kubeconfig file
    value: ${{ steps.paths.outputs.kubeconfig_path }}
runs:
  using: composite
  steps:
    - name: Choose kubeconfig path
      id: paths
      env:
        REQUESTED_PATH: ${{ inputs.kubeconfig_path }}
      shell: bash
      run: |
        if [[ -n "${REQUESTED_PATH}" ]]; then
          echo "kubeconfig_path=${REQUESTED_PATH}" >> "$GITHUB_OUTPUT"
        else
          mkdir -p "$HOME/.kube"
          echo "kubeconfig_path=$(mktemp "$HOME/.kube/juju-kubeconfig.XXXXXX")" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup Kubeconfig
      env:
        KUBECONFIG_CONTENT: ${{ inputs.kubeconfig }}
        KUBECONFIG_PATH: ${{ steps.paths.outputs.kubeconfig_path }}
      shell: bash
      run: |-
        echo "${KUBECONFIG_CONTENT}" > "${KUBECONFIG_PATH}"
