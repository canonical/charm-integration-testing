---
name: Setup Kubernetes
description: Setup A kubernetes environment for charm qa
inputs:
  kubeconfig:
    description: Kubeconfig content for the Kubernetes cluster.
    required: true
  kubeconfig_path:
    description: Path to write the kubeconfig file to.
    required: false
    default: /home/ubuntu/.kube/config
  cloud-name:
    description: Name to register the Juju cloud under.
    required: true
outputs:
  cloud-name:
    description: Name of the cloud created and bootstrapped to
    value: ${{ inputs.cloud-name }}
  kubeconfig_path:
    description: Path to kubeconfig file
    value: ${{ inputs.kubeconfig_path }}
runs:
  using: composite
  steps:
    - name: Setup Kubeconfig
      env:
        KUBECONFIG_CONTENT: ${{ inputs.kubeconfig }}
        kubeconfig_path: ${{ inputs.kubeconfig_path }}
      shell: bash
      run: |
        mkdir -p $HOME/.kube
        echo "${KUBECONFIG_CONTENT}" > "${kubeconfig_path}"
    - name: Add K8s
      env:
        CLOUD: ${{ inputs.cloud-name }}
        kubeconfig_path: ${{ inputs.kubeconfig_path }}
      shell: bash
      run: |-
        for ((attempt = 1; ; attempt++)); do
          if KUBECONFIG="${kubeconfig_path}" juju add-k8s $CLOUD --client; then
            break
          elif [ "$attempt" -lt 3 ]; then
            echo "Failed, retrying..."
            sleep 5
          else
            exit 1
          fi
        done
