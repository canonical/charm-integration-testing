---
name: Setup Kubernetes
description: Setup A kubernetes environment for charm qa
inputs:
  environment:
    description: Environment to setup the k8s for
    required: true
  kubeconfig_path:
    description: Path to kubeconfig file
    required: false
    default: /home/ubuntu/.kube/config
outputs:
  cloud-name:
    description: Name of the cloud created and bootstrapped to
    value: ${{ steps.cloud.outputs.cloud }}
  kubeconfig_path:
    description: Path to kubeconfig file
    value: ${{ inputs.kubeconfig_path }}
runs:
  using: composite
  steps:
    - name: Setup Kubeconfig
      env:
        environment: ${{ inputs.environment }}
        kubeconfig_path: ${{ inputs.kubeconfig_path }}
      shell: bash
      run: |
        mkdir -p $HOME/.kube
        if [ "${environment}" = "production" ]; then
          echo "${k8sprod}" > ${kubeconfig_path}
        else
          echo "${k8sstg}" > ${kubeconfig_path}
        fi
    - name: Add K8s
      env:
        environment: ${{ inputs.environment }}
        kubeconfig_path: ${{ inputs.kubeconfig_path }}
      shell: bash
      id: cloud
      run: |-
        export CLOUD="k8s-${environment}"
        for ((attempt = 1; ; attempt++)); do
          if KUBECONFIG="${kubeconfig_path}" juju add-k8s $CLOUD --client; then
            break
          elif [ "$attempt" -lt 3 ]; then
            echo "Failed, retrying..."
            sleep 5
          else
            exit 1
          fi
        done
        echo "cloud=$CLOUD" >> $GITHUB_OUTPUT
