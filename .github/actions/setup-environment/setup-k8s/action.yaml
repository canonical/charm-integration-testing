name: Setup Kuberentes
description: Setup A kubernetes environment for charm qa

inputs:
  environment:
    description: "Environment to setup the k8s for"
    required: True
  controller:
    description: "Name of the controller to create"
    required: True
  model:
    description: "Name of the model to create"
    required: True

outputs:
  cloud-name:
    value:  ${{ steps.cloud.outputs.cloud }}

runs:
  using: "composite"
  steps:
  - name: Setup Kubeconfig
    shell: bash
    run: |
      mkdir -p $HOME/.kube
      if [ "${{ inputs.environment }}" = "production" ]; then
        echo "${k8s-prod}" > $HOME/.kube/config
      else        
        echo "${k8s-stg}" > $HOME/.kube/config
      fi
      echo $HOME/.kube/config
  - name: Add K8s
    shell: bash
    id: cloud
    run: |
      export CLOUD="k8s-${{ inputs.environment }}"
      KUBECONFIG="$HOME/.kube/config" juju add-k8s $CLOUD --client
      echo "cloud=$CLOUD" >> $GITHUB_OUTPUT

  - name: Set Constraints
    shell: bash
    id: constraints
    run: echo "constraints=root-disk=5G" >> $GITHUB_OUTPUT

  - name: Bootstrap Controller
    shell: bash
    run: |
      # juju will prefix the namespace with "controller"
      juju bootstrap {{ steps.cloud-setup.outputs.cloud-name }} --bootstrap-constraints root-disk=5G {{ inputs.controller }}

  - name: Create Model
    shell: bash
    run: |
      juju add-model ${{ inputs.model }} \
        --config "logging-config=DEBUG" \
        --config="update-status-hook-interval=30s"
