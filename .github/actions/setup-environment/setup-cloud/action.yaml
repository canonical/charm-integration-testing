---
name: Setup Cloud
description: >
  Set up a Juju cloud (K8s, OpenStack, or LXD), delegating to the appropriate
  setup action based on cloud type.
inputs:
  cloud-name:
    description: Name to register the Juju cloud under.
    required: true
  cloud-type:
    description: Cloud type - either 'k8s', 'o7k', or 'lxd'.
    required: true
  cloud-credentials:
    description: >
      Cloud credentials content. The expected format depends on cloud-type:
      kubeconfig YAML for k8s, novarc env file for o7k, credentials YAML for lxd.
    required: false
    default: ''
outputs:
  cloud-name:
    description: Name of the Juju cloud registered on this runner.
    value: ${{ inputs.cloud-name }}
  kubeconfig_path:
    description: Path to the kubeconfig file written to disk (k8s only; empty string
      for o7k/lxd).
    value: ${{ steps.setup-k8s.outputs.kubeconfig_path }}
runs:
  using: composite
  steps:
    - name: Setup K8s Cloud
      id: setup-k8s
      if: ${{ inputs.cloud-type == 'k8s' }}
      uses: ./.github/actions/setup-environment/setup-k8s
      with:
        kubeconfig: ${{ inputs.cloud-credentials }}
        cloud-name: ${{ inputs.cloud-name }}
    - name: Setup OpenStack Cloud
      id: setup-o7k
      if: ${{ inputs.cloud-type == 'o7k' }}
      uses: ./.github/actions/setup-environment/setup-openstack
      with:
        novarc: ${{ inputs.cloud-credentials }}
        cloud-name: ${{ inputs.cloud-name }}
    - name: Setup LXD Cloud
      id: setup-lxd
      if: ${{ inputs.cloud-type == 'lxd' }}
      uses: ./.github/actions/setup-environment/setup-lxd
      with:
        lxd-creds: ${{ inputs.cloud-credentials }}
        cloud-name: ${{ inputs.cloud-name }}
