---
name: Setup Cloud
description: >
  Set up a Juju cloud (K8s, OpenStack, remote LXD, or a local runner substrate).
inputs:
  cloud-name:
    description: Name to register the Juju cloud under.
    required: true
  cloud-type:
    description: Cloud type - 'k8s', 'o7k', 'lxd', 'local-k8s', or 'local-lxd'.
    required: true
  cloud-credentials:
    description: >
      Cloud credentials content. The expected format depends on cloud-type:
      kubeconfig YAML for k8s, novarc env file for o7k, credentials YAML for lxd.
    required: false
    default: ''
outputs:
  cloud-name:
    description: Name of the Juju cloud registered on this runner.
    value: ${{ steps.setup-local-lxd.outputs.cloud-name || steps.setup-local-k8s.outputs.cloud-name || inputs.cloud-name }}
  kubeconfig_path:
    description: Path to the kubeconfig file written to disk (k8s only; empty string
      for o7k/lxd).
    value: ${{ steps.setup-local-k8s.outputs.kubeconfig-path || steps.setup-k8s.outputs.kubeconfig_path }}
  cloud-definition-path:
    description: Path to the cloud definition YAML file written to disk (o7k/lxd;
      empty string for k8s).
    value: ${{ steps.setup-o7k.outputs.cloud-definition-path || steps.setup-lxd.outputs.cloud-definition-path }}
  credentials-path:
    description: Path to the credentials YAML file written to disk (o7k/lxd; empty
      string for k8s).
    value: ${{ steps.setup-o7k.outputs.credentials-path || steps.setup-lxd.outputs.credentials-path }}
  metadata-source:
    description: Path to image metadata (o7k only; empty string for k8s).
    value: ${{ steps.setup-o7k.outputs.metadata-source }}
runs:
  using: composite
  steps:
    - name: Create cloud workspace
      id: workspace
      shell: bash
      run: |
        workspace="$(mktemp -d "${RUNNER_TEMP}/juju-cloud.XXXXXX")"
        echo "path=${workspace}" >> "$GITHUB_OUTPUT"
    - name: Setup K8s Cloud
      id: setup-k8s
      if: ${{ inputs.cloud-type == 'k8s' }}
      uses: ./.github/actions/setup-environment/setup-k8s
      with:
        kubeconfig: ${{ inputs.cloud-credentials }}
        cloud-name: ${{ inputs.cloud-name }}
        workspace: ${{ steps.workspace.outputs.path }}
    - name: Setup OpenStack Cloud
      id: setup-o7k
      if: ${{ inputs.cloud-type == 'o7k' }}
      uses: ./.github/actions/setup-environment/setup-openstack
      with:
        novarc: ${{ inputs.cloud-credentials }}
        cloud-name: ${{ inputs.cloud-name }}
        workspace: ${{ steps.workspace.outputs.path }}
    - name: Setup LXD Cloud
      id: setup-lxd
      if: ${{ inputs.cloud-type == 'lxd' }}
      uses: ./.github/actions/setup-environment/setup-lxd
      with:
        lxd-creds: ${{ inputs.cloud-credentials }}
        cloud-name: ${{ inputs.cloud-name }}
        workspace: ${{ steps.workspace.outputs.path }}
    - name: Setup local Kubernetes
      id: setup-local-k8s
      if: ${{ inputs.cloud-type == 'local-k8s' }}
      shell: bash
      env:
        CLOUD_NAME: ${{ inputs.cloud-name }}
        CLOUD_WORKSPACE: ${{ steps.workspace.outputs.path }}
      run: |
        mise run setup -- --group local-k8s
        mise run setup-k8s -- --cloud-name "$CLOUD_NAME" \
          --kubeconfig "$CLOUD_WORKSPACE/kubeconfig" --output "$GITHUB_OUTPUT"
    - name: Setup local LXD
      id: setup-local-lxd
      if: ${{ inputs.cloud-type == 'local-lxd' }}
      shell: bash
      run: |-
        mise run setup -- --group local-lxd
        mise run setup-lxd -- --output "$GITHUB_OUTPUT"
