---
name: Setup Cloud
description: >
  Prepare the Juju cloud declared for an environment in static/environments.yaml
  and export its configuration to later steps as <VAR>_<cloud> variables.
  Environments that declare the same cloud share one setup within a job.
  Supply remote cloud and S3 credentials as SETUP_CLOUD_SECRET_<secret name>
  environment variables.
inputs:
  environment:
    description: Environment name in static/environments.yaml.
    required: true
  features:
    description: JSON list of services to set up. Supported values are s3-api.
    required: false
    default: '[]'
outputs:
  cloud-name:
    description: Name of the Juju cloud, as declared in static/environments.yaml.
    value: ${{ steps.result.outputs.cloud-name }}
  cloud-type:
    description: Cloud setup type for the selected slot.
    value: ${{ steps.info.outputs.cloud-type }}
  platform:
    description: Platform for the selected slot (kubernetes or machine).
    value: ${{ steps.info.outputs.platform }}
  arch:
    description: Architecture for the selected slot.
    value: ${{ steps.info.outputs.arch }}
  bootstrap-config:
    description: Path to the slot's Juju bootstrap config JSON.
    value: ${{ steps.info.outputs.bootstrap-config }}
  bootstrap-constraints:
    description: Path to the slot's Juju bootstrap constraints JSON.
    value: ${{ steps.info.outputs.bootstrap-constraints }}
  model-config:
    description: Path to the slot's Juju model config JSON.
    value: ${{ steps.info.outputs.model-config }}
  remote-logging:
    description: Optional Loki base URL for the selected slot.
    value: ${{ steps.info.outputs.remote-logging }}
  kubeconfig_path:
    description: Path to the kubeconfig (Kubernetes clouds only).
    value: ${{ steps.result.outputs.kubeconfig_path }}
  cloud-definition-path:
    description: Path to the Juju cloud definition (non-Kubernetes clouds only).
    value: ${{ steps.result.outputs.cloud-definition-path }}
  credentials-path:
    description: Path to the Juju credentials (non-Kubernetes clouds only).
    value: ${{ steps.result.outputs.credentials-path }}
  metadata-source:
    description: Path to image metadata (OpenStack only).
    value: ${{ steps.result.outputs.metadata-source }}
  s3-config-path:
    description: Path to the S3 configuration, when s3-api is requested and available.
    value: ${{ steps.result.outputs.s3-config-path }}
runs:
  using: composite
  steps:
    - name: Look up environment
      id: info
      uses: ./.github/actions/get-environment-info
      with:
        environment_name: ${{ inputs.environment }}
    - name: Check for an existing setup
      id: existing
      shell: bash
      env:
        CLOUD_NAME: ${{ steps.info.outputs.cloud-name }}
      run: |
        record="${RUNNER_TEMP}/juju-clouds/${CLOUD_NAME}.outputs"
        echo "record=${record}" >> "$GITHUB_OUTPUT"
        if [[ -f "${record}" ]]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Create cloud workspace
      id: workspace
      if: ${{ steps.existing.outputs.found != 'true' }}
      shell: bash
      run: |
        workspace="$(mktemp -d "${RUNNER_TEMP}/juju-cloud.XXXXXX")"
        echo "path=${workspace}" >> "$GITHUB_OUTPUT"
    - name: Setup Remote Cloud
      id: setup-remote
      if: ${{ steps.existing.outputs.found != 'true' && steps.info.outputs.cloud-type == 'remote' }}
      uses: ./.github/actions/setup-environment/setup-remote
      with:
        kubeconfig-secret: ${{ steps.info.outputs.kubeconfig-secret }}
        novarc-secret: ${{ steps.info.outputs.novarc-secret }}
        lxd-secret: ${{ steps.info.outputs.lxd-secret }}
        cloud-name: ${{ steps.info.outputs.cloud-name }}
        workspace: ${{ steps.workspace.outputs.path }}
    - name: Write S3 configuration
      id: s3
      if: ${{ contains(fromJSON(inputs.features), 's3-api') }}
      shell: bash
      env:
        S3_CONFIG: ${{ env[format('SETUP_CLOUD_SECRET_{0}', steps.info.outputs.s3-secret-name)] }}
        CLOUD_NAME: ${{ steps.info.outputs.cloud-name }}
      run: |
        if [[ -z "${S3_CONFIG}" ]]; then
          echo "::error::Missing requested S3 configuration for '${CLOUD_NAME}'."
          exit 1
        fi
        umask 077
        mkdir -p "${RUNNER_TEMP}/juju-clouds"
        path="${RUNNER_TEMP}/juju-clouds/${CLOUD_NAME}.s3.conf"
        if [[ -f "${path}" ]]; then
          if ! printf '%s' "${S3_CONFIG}" | cmp -s - "${path}"; then
            echo "::error::Conflicting S3 configuration for shared cloud '${CLOUD_NAME}'."
            exit 1
          fi
        else
          printf '%s' "${S3_CONFIG}" > "${path}"
        fi
        echo "s3-config-path=${path}" >> "$GITHUB_OUTPUT"
    - name: Export cloud configuration
      id: result
      shell: bash
      env:
        FOUND: ${{ steps.existing.outputs.found }}
        RECORD: ${{ steps.existing.outputs.record }}
        CLOUD_NAME: ${{ steps.info.outputs.cloud-name }}
        KUBECONFIG_PATH: ${{ steps.setup-remote.outputs.kubeconfig_path }}
        CLOUD_DEFINITION_PATH: ${{ steps.setup-remote.outputs.cloud-definition-path }}
        CLOUD_CREDENTIALS_PATH: ${{ steps.setup-remote.outputs.credentials-path }}
        METADATA_SOURCE: ${{ steps.setup-remote.outputs.metadata-source }}
        S3_CONFIG_PATH: ${{ steps.s3.outputs.s3-config-path }}
      run: |-  # zizmor: ignore[github-env] values are runner-created paths and cloud names from static/environments.yaml
        if [[ "${FOUND}" != "true" ]]; then
          mkdir -p "$(dirname "${RECORD}")"
          {
            echo "cloud-name=${CLOUD_NAME}"
            echo "kubeconfig_path=${KUBECONFIG_PATH}"
            echo "cloud-definition-path=${CLOUD_DEFINITION_PATH}"
            echo "credentials-path=${CLOUD_CREDENTIALS_PATH}"
            echo "metadata-source=${METADATA_SOURCE}"
          } > "${RECORD}"
          suffix="${CLOUD_NAME//-/_}"
          export_path() {
            if [[ -n "$2" ]]; then echo "$1_${suffix}=$2" >> "$GITHUB_ENV"; fi
          }
          export_path KUBECONFIG "${KUBECONFIG_PATH}"
          export_path CLOUD_DEFINITION "${CLOUD_DEFINITION_PATH}"
          export_path CLOUD_CREDENTIALS "${CLOUD_CREDENTIALS_PATH}"
        fi
        cat "${RECORD}" >> "$GITHUB_OUTPUT"
        echo "s3-config-path=${S3_CONFIG_PATH}" >> "$GITHUB_OUTPUT"
        if [[ -n "${S3_CONFIG_PATH}" ]]; then
          suffix="${CLOUD_NAME//-/_}"
          echo "S3_CONFIG_${suffix}=${S3_CONFIG_PATH}" >> "$GITHUB_ENV"
        fi
