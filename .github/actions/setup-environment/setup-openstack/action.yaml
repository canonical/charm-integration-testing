---
name: Setup Openstack
description: Setup an Openstack environment for charm qa
inputs:
  novarc:
    description: Novarc content for the OpenStack cloud.
    required: true
  cloud-name:
    description: Name to register the Juju cloud under.
    required: true
  workspace:
    description: Per-cloud temporary workspace.
    required: true
outputs:
  cloud-name:
    description: Name of the cloud created and bootstrapped to
    value: ${{ inputs.cloud-name }}
  cloud-definition-path:
    description: Path to the cloud definition YAML file written to disk.
    value: ${{ steps.paths.outputs.cloud-definition-path }}
  credentials-path:
    description: Path to the credentials YAML file written to disk.
    value: ${{ steps.paths.outputs.credentials-path }}
  metadata-source:
    description: Path to generated image metadata.
    value: ${{ steps.metadata.outputs.path }}
runs:
  using: composite
  steps:
    - name: Report file paths
      id: paths
      shell: bash
      run: |
        echo "cloud-definition-path=$(mktemp "${{ inputs.workspace }}/juju-cloud.XXXXXX.yaml")" >> "$GITHUB_OUTPUT"
        echo "credentials-path=$(mktemp "${{ inputs.workspace }}/juju-credentials.XXXXXX.yaml")" >> "$GITHUB_OUTPUT"
    - name: Setup Novarc
      id: novarc
      env:
        NOVARC_CONTENT: ${{ inputs.novarc }}
      shell: bash
      run: |
        novarc_path="$(mktemp "${{ inputs.workspace }}/novarc.XXXXXX")"
        echo "${NOVARC_CONTENT}" > "${novarc_path}"
        echo "path=${novarc_path}" >> "$GITHUB_OUTPUT"
    - name: Setup Image Metadata
      id: metadata
      env:
        NOVARC_PATH: ${{ steps.novarc.outputs.path }}
      shell: bash
      run: |
        sudo snap install openstack
        source "${NOVARC_PATH}"
        metadata_path="${{ inputs.workspace }}/images"
        mkdir -p "${metadata_path}"
        echo "path=${metadata_path}" >> "$GITHUB_OUTPUT"
        openstack image list -f json | jq -r '.[] | select((.Name | test("focal|jammy|noble") and test("amd64") ) and .Status == "active") | .ID' | while read -r id; do
          juju metadata generate-image -a amd64 -i ${id} -r ${OS_REGION_NAME} -u ${OS_AUTH_URL} -d "${metadata_path}"
        done
    - name: Create Openstack cloud files
      env:
        CLOUD: ${{ inputs.cloud-name }}
        CLOUD_DEFINITION_PATH: ${{ steps.paths.outputs.cloud-definition-path }}
        CREDENTIALS_PATH: ${{ steps.paths.outputs.credentials-path }}
        NOVARC_PATH: ${{ steps.novarc.outputs.path }}
      shell: bash
      run: |-
        source "${NOVARC_PATH}"
        cat > "${CLOUD_DEFINITION_PATH}" << EOF
        clouds:
          ${CLOUD}:
            type: openstack
            auth-types: [access-key, userpass]
            regions:
              ${OS_REGION_NAME}:
                endpoint: ${OS_AUTH_URL}
        EOF
        cat > "${CREDENTIALS_PATH}" << EOF
        credentials:
          ${CLOUD}:
            default-region: ${OS_REGION_NAME}
            ${OS_PROJECT_NAME}:
              auth-type: userpass
              domain-name: ''
              password: ${OS_PASSWORD}
              project-domain-name: ${OS_PROJECT_DOMAIN_NAME}
              tenant-name: ${OS_PROJECT_NAME}
              user-domain-name: ${OS_USER_DOMAIN_NAME}
              username: ${OS_USERNAME}
        EOF
