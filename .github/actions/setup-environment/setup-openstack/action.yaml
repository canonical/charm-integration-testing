name: Setup Openstack
description: Setup an Openstack environment for charm qa

inputs:
  environment:
    description: "Environment to setup the o7k for"
    required: True
  controller:
    description: "Name of the controller to create"
    required: True
  model:
    description: "Name of the model to create"
    required: True

outputs:
  cloud-name:
    description: "Name of the cloud created and bootstrapped to"
    value:  ${{ steps.cloud.outputs.cloud }}

runs:
  using: "composite"
  steps:
  - name: Setup Novarc
    env: 
      environment: ${{ inputs.environment }}
    shell: bash
    run: |
      mkdir -p $HOME/openstack
      if [ "${environment}" = "production" ]; then
        echo "${o7kprod}" > $HME/openstack/novarc
      else        
        echo "${o7kstg}" > $HOME/openstack/novarc
      fi
  - name: Setup Image Metadata
    shell: bash
    run: |
      sudo snap install openstack
      source $HOME/openstack/novarc
      openstack image list -f json | jq -r '.[] | select((.Name | test("focal|jammy|noble")) and .Status == "active") | .ID' | while read -r id; do
        juju metadata generate-image -a amd64 -i ${id} -r ${OS_REGION_NAME} -u ${OS_AUTH_URL} -d /home/ubuntu/openstack
      done
  - name: Add Openstack
    shell: bash
    id: cloud
    run: |
      source $HOME/openstack/novarc
      CLOUD="ps5-machine"
      echo "clouds:
  ${CLOUD}:
    type: openstack
    auth-types: [access-key, userpass]
    regions:
      ${OS_REGION_NAME}:
        endpoint: ${OS_AUTH_URL}" >> $HOME/openstack/openstack-cloud.yaml
      echo "credentials:
  ${CLOUD}:
    default-region: ${OS_REGION_NAME}
    ${OS_PROJECT_NAME}:
      auth-type: userpass
      domain-name: ''
      password: ${OS_PASSWORD}
      project-domain-name: ${OS_PROJECT_DOMAIN_NAME}
      tenant-name: ${OS_PROJECT_NAME}
      user-domain-name: ${OS_USER_DOMAIN_NAME}
      username: ${OS_USERNAME}" >> $HOME/openstack/openstack-credentials.yaml
      juju add-cloud $CLOUD $HOME/openstack/openstack-cloud.yaml --client
      juju add-credential $CLOUD -f $home/openstack/openstack-credentials.yaml --client
      echo "cloud=${CLOUD}" >> $GITHUB_OUTPUT

  - name: Set extra-options
    shell: bash
    id: extra-options
    run: echo "extra-options=--metadata-source $HOME/openstack/images" >> $GITHUB_OUTPUT

  - name: Bootstrap Controller
    env:
      controller: ${{ inputs.controller }}
    shell: bash
    run: |
      # juju will prefix the namespace with "controller"
      juju bootstrap {{ steps.cloud-setup.outputs.cloud-name }} {{ steps.extra-options.outputs.extra-options }} ${controller}

  - name: Create Model
    env:
      model: ${{ inputs.model }}
    shell: bash
    run: |
      juju add-model ${model} \
        --config "logging-config=DEBUG" \
        --config="update-status-hook-interval=30s"
