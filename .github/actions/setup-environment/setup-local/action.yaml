---
name: Setup Local
description: Provision local clouds and requested services on a disposable runner.
inputs:
  features:
    description: JSON list of requested services.
    required: false
    default: '[]'
outputs:
  kubeconfig_path:
    description: Path to the Kubernetes kubeconfig.
    value: ${{ steps.provision.outputs.kubeconfig-path }}
  s3-config-path:
    description: Path to the S3 configuration, if requested.
    value: ${{ steps.provision.outputs.s3-config-path }}
runs:
  using: composite
  steps:
    - name: Provision local services
      id: provision
      shell: bash
      env:
        S3_FLAG: ${{ contains(fromJSON(inputs.features), 's3-api') && '--s3' || '' }}
      run: mise run setup-local-services -- --state "${RUNNER_TEMP}/local-cloud-services"
        ${S3_FLAG} --output "${GITHUB_OUTPUT}"
