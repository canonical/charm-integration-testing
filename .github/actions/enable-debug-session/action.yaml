name: Create SSH Session
description: >
  Create an SSH session on the runner using tmate. 
  Based on canonical/action-tmate.

inputs:
  ssh_identifiers:
    description: >
      A comma-separated list of IDs to use with ssh-import-id. 
      The IDs take the form of lp:<value> for Launchpad and gh:<value> for GitHub. 
      The GitHub Actor's key is always included. 
      Only used if `ssh_enable` is true. 
    required: false
    default: ""

runs:
  using: composite
  # Each step begins with `# Step: <step_name>` for clarity in the GitHub output,
  # which displays Run: # Step: <step_name>
  steps:
    - name: Import SSH Keys
      shell: bash
      env:
        IDS: ${{ inputs.debug_ssh_identifiers }}
      run: |
        # Step: Import SSH Keys

        # Always include the GitHub Actor
        mkdir --parents ~/.ssh/
        ssh-import-id "gh:${GITHUB_ACTOR}"

        IDS=$(echo "${IDS}" | tr ',' ' ')
        ssh-import-id ${IDS} || true

        echo "User: $(whoami)"
        echo "IP: $(hostname -I | cut -d ' ' -f 1)"

    - name: Install Dependencies
      shell: bash
      run: |
        # Step: Install Dependencies

        if ! command -v tmate &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y tmate
        fi

        if ! command -v yq &> /dev/null; then
          sudo snap install yq
        fi

    - name: Test Insert
      shell: bash
      run: |
        # Step: Test Insert

        # GITHUB_WORKFLOW is the `name` of the workflow
        # This assumes that only one workflow will have the given name
        WORKFLOW_FILE=$(grep --recursive --files-with-matches "${GITHUB_WORKFLOW}" ${GITHUB_WORKSPACE})
        yq '(.jobs[].steps[] | select(.id == "start-tmate").run) \
          |= . + "\nsleep 3600\n"' ${WORKFLOW_FILE}

    - name: Start tmate Session
      id: start-tmate
      shell: bash
      run: |
